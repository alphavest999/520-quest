<!DOCTYPE html><html><body style="text-align:center;padding:30px;font-family:sans-serif">
<h1>Final Fix for 520quest.com</h1>
<p>Sets correct key on 520quest.com domain</p>
<button id="b" style="font-size:26px;padding:20px;background:green;color:white;border-radius:10px">FIX 520QUEST.COM NOW</button>
<p id="msg"></p>
<script>
const k=[50,77,121,81,108,78,57,66,74,55,113,87,48,97,47,86,113,65,98,98,53,89,114,77,87,85,66,114,81,82,84,107,104,80,117,47,68,119,118,75,83,69,99,61].map(c=>String.fromCharCode(c)).join('');
document.getElementById('b').onclick=()=>{
 localStorage.setItem('quest520.ck',k);
 localStorage.setItem('quest520.ck_backup',k);
 localStorage.setItem('quest520.ck_valid',k);
 document.getElementById('msg').innerHTML='<b style=color:green>Key set on '+location.hostname+'!</b><br>Going to app...';
 setTimeout(()=>location.href='/play/?fixed='+Date.now(),1200);
};
</script></body></html>
