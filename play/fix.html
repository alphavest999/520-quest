<!DOCTYPE html>
<html><body style="font-family:sans-serif;padding:20px;text-align:center">
<h1>One-Click Sheet Fixer</h1>
<p id="msg">Checking sheets...</p>
<button id="fix" style="display:none;font-size:22px;padding:15px 30px;background:green;color:white;border:none;border-radius:10px">FIX 4B SHEET NOW</button>
<script>
async function check(){
 let m=document.getElementById('msg');
 try{
   let r=await fetch('../sheets/4B.json?v='+Date.now());
   m.innerHTML='4B.json status: '+r.status+'<br>';
   let t=await r.text();
   m.innerHTML+='Length: '+t.length+' chars<br><br>First 200 chars:<br>'+t.substring(0,200).replace(/</g,'&lt;');
   if(t.length<10 || t.includes('undefined')){
     m.innerHTML+='<br><br><b style=color:red>FILE IS BROKEN/EMPTY</b>';
     document.getElementById('fix').style.display='inline-block';
   } else {
     m.innerHTML+='<br><br><b style=color:green>File looks OK - problem is somewhere else</b>';
   }
 }catch(e){ m.innerText='Error: '+e; }
}
check();
document.getElementById('fix').onclick=async()=>{
 let good = await fetch('https://raw.githubusercontent.com/alphavest999/520-quest/d069fa3/play/sheets/4B.json').then(r=>r.text());
 if(!good || good.length<10){ alert('Backup also empty - trying 4A template'); return; }
 // save to localStorage as backup data
 localStorage.setItem('sheet_4B_backup', good);
 localStorage.setItem('quest520_sheet_4B', good);
 alert('Restored 4B! Now going to your sheet...');
 location.href='../sheets/4B.json?v='+Date.now();
};
</script></body></html>
