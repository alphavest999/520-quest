<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fear circuits: LeDoux&#x27;s low road and high road</text><rect x="20" y="150" width="110" height="50" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="75.0" y="167.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">stimulus</text><text x="75.0" y="182.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(snake)</text><rect x="170" y="150" width="110" height="50" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="225.0" y="175.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">thalamus</text><rect x="330" y="60" width="140" height="50" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="400.0" y="78.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">sensory cortex</text><text x="400.0" y="91.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(detailed analysis)</text><rect x="340" y="220" width="120" height="50" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="400.0" y="245.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">AMYGDALA</text><rect x="520" y="220" width="140" height="50" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="590.0" y="238.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">hypothalamus →</text><text x="590.0" y="251.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">autonomic + HPA</text><rect x="520" y="60" width="140" height="50" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="590.0" y="78.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">prefrontal cortex</text><text x="590.0" y="91.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(reappraisal)</text><path d="M130,175 L170,175" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M280,165 L330,90" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="285.0" y="119.5" font-size="10" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">high road (slow, accurate)</text><path d="M280,185 L340,240" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="280.0" y="230.5" font-size="10" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">low road (fast, crude)</text><path d="M400,110 L400,220" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M460,245 L520,245" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M570,110 L450,220" fill="none" stroke="#7a4cd9" stroke-width="1.8" marker-end="url(#ah)"/><text x="550.0" y="165.0" font-size="10" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">down-regulates</text><text x="340.0" y="315.0" font-size="10.8" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Amygdala lesion: no conditioned fear (Klüver-Bucy tameness). Hippocampus lesion: fear response kept,</text><text x="340.0" y="335.0" font-size="10.8" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">but no conscious memory of the pairing. Hypothalamus alone can drive rage (sham rage).</text></svg>
