<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Autonomic nervous system</text><text x="340.0" y="48.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Sympathetic: fight-or-flight</text><rect x="30" y="60" width="120" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="90.0" y="82.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CNS</text><path d="M150,82 L270,82" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="210.0" y="72.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ACh (nicotinic)</text><rect x="270" y="60" width="110" height="44" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="325.0" y="82.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ganglion</text><path d="M380,82 L500,82" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="440.0" y="72.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">NE (norepinephrine)</text><rect x="500" y="60" width="150" height="44" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="575.0" y="82.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">target organ</text><text x="340.0" y="126.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">↑ heart rate, dilate pupils and bronchi, ↓ digestion</text><text x="340.0" y="158.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Parasympathetic: rest-and-digest</text><rect x="30" y="170" width="120" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="90.0" y="192.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CNS</text><path d="M150,192 L270,192" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="210.0" y="182.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ACh (nicotinic)</text><rect x="270" y="170" width="110" height="44" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="325.0" y="192.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ganglion</text><path d="M380,192 L500,192" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><text x="440.0" y="182.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ACh</text><rect x="500" y="170" width="150" height="44" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="575.0" y="192.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">target organ</text><text x="340.0" y="236.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">↓ heart rate, constrict pupils, ↑ digestion</text><text x="340.0" y="285.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Preganglionic neurons release ACh in BOTH divisions; the adrenal medulla adds epinephrine to the sympathetic response.</text></svg>
