<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Stress depends on appraisal and coping</text><rect x="20" y="60" width="120" height="50" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="80.0" y="85.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">stressor</text><rect x="180" y="50" width="160" height="70" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="260.0" y="77.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">primary appraisal:</text><text x="260.0" y="92.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">is it a threat?</text><rect x="380" y="50" width="160" height="70" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="460.0" y="77.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">secondary appraisal:</text><text x="460.0" y="92.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">can I cope?</text><path d="M140,85 L180,85" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M340,85 L380,85" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="150" y="170" width="200" height="70" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="250.0" y="191.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">problem-focused coping:</text><text x="250.0" y="205.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">change the situation</text><text x="250.0" y="218.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(study, plan, act)</text><rect x="380" y="170" width="220" height="70" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="490.0" y="191.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">emotion-focused coping:</text><text x="490.0" y="205.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">change the feeling</text><text x="490.0" y="218.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(meditate, reappraise)</text><path d="M460,120 L250,170" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M460,120 L490,170" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="275.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Control and predictability shrink stress (yoked-rat and ulcer studies).</text><text x="340.0" y="300.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Reappraising arousal as helpful turns a threat response into a challenge response.</text></svg>
