ant-baseline="middle">arousal + emotion</text><text x="534.0" y="171.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">at the same time</text><path d="M442,165 L464,165" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="395.0" y="208.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">arousal and feeling are simultaneous, independent</text><text x="70.0" y="258.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Schachter-Singer</text><rect x="140" y="234" width="112" height="46" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="196.0" y="257.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">stimulus</text><rect x="274" y="234" width="112" height="46" rx="10" fill="#fbe7e5" stroke="#8a93a3" stroke-width="1.5"/><text x="330.0" y="257.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">arousal</text><path d="M252,257 L274,257" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="408" y="234" width="112" height="46" rx="10" fill="#efe8fc" stroke="#8a93a3" stroke-width="1.5"/><text x="464.0" y="250.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cognitive label</text><text x="464.0" y="263.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(context)</text><path d="M386,257 L408,257" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="542" y="234" width="112" height="46" rx="10" fill="#e6eefc" stroke="#8a93a3" stroke-width="1.5"/><text x="598.0" y="257.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">emotion</text><path d="M520,257 L542,257" fill="none" stroke="#1f2430" stroke-width="1.