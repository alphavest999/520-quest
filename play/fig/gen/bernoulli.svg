<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 236" role="img" aria-label="Continuity and Bernoulli: a narrow section has faster flow and lower pressure"><rect width="500" height="236" fill="#fff"/><g font-family="Inter,system-ui,sans-serif" font-size="11" fill="#0f172a">
<path d="M30 70 H150 C185 70 195 95 230 95 H270 C305 95 315 70 350 70 H470 V130 H350 C315 130 305 105 270 105 H230 C195 105 185 130 150 130 H30 Z" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
<text x="90" y="62" text-anchor="middle" font-weight="700" fill="#1e3a8a">wide: 60 px</text>
<text x="250" y="84" text-anchor="middle" font-weight="700" fill="#1e3a8a">narrow: 30 px</text>
<path d="M45 100 H125" stroke="#ec4899" stroke-width="2.5" marker-end="url(#a)"/><path d="M232 100 H268" stroke="#ec4899" stroke-width="3.5" marker-end="url(#a)"/><path d="M365 100 H445" stroke="#ec4899" stroke-width="2.5" marker-end="url(#a)"/>
<text x="90" y="146" text-anchor="middle">P₁ high · v₁ slow · A₁ big</text>
<text x="250" y="152" text-anchor="middle">P₂ low · v₂ fast · A₂ small</text>
<text x="410" y="146" text-anchor="middle">P₃ high · v₃ slow</text>
<rect x="165" y="176" width="170" height="26" rx="13" fill="#fdf2f8" stroke="#ec4899"/><text x="250" y="193" text-anchor="middle" font-weight="700" fill="#be185d">A₁v₁ = A₂v₂ (continuity)</text>
<text x="250" y="224" text-anchor="middle" fill="#475569">Narrow → fast → low pressure (Bernoulli, horizontal tube)</text></g>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker></defs></svg>