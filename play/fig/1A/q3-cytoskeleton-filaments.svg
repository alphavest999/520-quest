<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The three cytoskeletal filaments and their subunits</text><rect x="117" y="42" width="185" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="209.5" y="65.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Microfilaments</text><rect x="307" y="42" width="185" height="46" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="399.5" y="65.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Microtubules</text><rect x="497" y="42" width="185" height="46" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="589.5" y="56.2" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Intermediate</text><text x="589.5" y="73.8" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">filaments</text><rect x="12" y="94" width="100" height="50" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="62.0" y="119.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Subunit</text><rect x="117" y="94" width="185" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="209.5" y="119.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">G-actin → F-actin</text><rect x="307" y="94" width="185" height="50" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="399.5" y="119.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">α/β-tubulin dimers</text><rect x="497" y="94" width="185" height="50" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="589.5" y="111.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">keratins, vimentin,</text><text x="589.5" y="126.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">lamins, neurofilaments</text><rect x="12" y="149" width="100" height="36" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="62.0" y="167.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Diameter</text><rect x="117" y="149" width="185" height="36" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="209.5" y="167.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">≈ 7 nm (thinnest)</text><rect x="307" y="149" width="185" height="36" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="399.5" y="167.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">≈ 25 nm, hollow</text><rect x="497" y="149" width="185" height="36" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="589.5" y="167.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">≈ 10 nm</text><rect x="12" y="190" width="100" height="36" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="62.0" y="208.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Nucleotide</text><rect x="117" y="190" width="185" height="36" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="209.5" y="208.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ATP</text><rect x="307" y="190" width="185" height="36" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="399.5" y="208.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">GTP</text><rect x="497" y="190" width="185" height="36" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="589.5" y="208.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">none</text><rect x="12" y="231" width="100" height="36" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="62.0" y="249.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Motors</text><rect x="117" y="231" width="185" height="36" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="209.5" y="249.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">myosins</text><rect x="307" y="231" width="185" height="36" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="399.5" y="249.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">kinesins, dyneins</text><rect x="497" y="231" width="185" height="36" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="589.5" y="249.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">none</text><rect x="12" y="272" width="100" height="50" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="62.0" y="297.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Main jobs</text><rect x="117" y="272" width="185" height="50" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="209.5" y="289.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">muscle contraction,</text><text x="209.5" y="304.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cell crawling, cytokinesis</text><rect x="307" y="272" width="185" height="50" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="399.5" y="289.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">mitotic spindle, cilia,</text><text x="399.5" y="304.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">axonal transport</text><rect x="497" y="272" width="185" height="50" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="589.5" y="289.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">tensile strength,</text><text x="589.5" y="304.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">nuclear lamina</text><rect x="175.5" y="337" width="68.1" height="24" rx="12" fill="#1f9d63"/><text x="209.5" y="349.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ actin</text><rect x="358.0" y="337" width="83.0" height="24" rx="12" fill="#d6453d"/><text x="399.5" y="349.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ tubulin</text><rect x="548.0" y="337" width="83.0" height="24" rx="12" fill="#d6453d"/><text x="589.5" y="349.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ keratin</text><rect x="12" y="375" width="666" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="345.0" y="395.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">✗ Collagen is not cytoskeleton: it is secreted and forms fibrils in the extracellular matrix.</text></svg>
