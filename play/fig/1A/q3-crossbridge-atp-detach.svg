<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The cross-bridge cycle</text><rect x="25" y="45" width="250" height="150" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="150.0" y="61.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1. Rigor: bound, no nucleotide</text><circle cx="55" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="77" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="99" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="121" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="143" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="165" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="187" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="209" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="231" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><rect x="50" y="157" width="200" height="10" rx="5" fill="#7a4cd9"/><polyline points="150,157 104.0,111.0" fill="none" stroke="#7a4cd9" stroke-width="5"/><ellipse cx="104.0" cy="111.0" rx="13" ry="9" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><rect x="405" y="45" width="250" height="150" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="530.0" y="61.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2. ATP bound: head released</text><circle cx="435" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="457" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="479" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="501" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="523" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="545" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="567" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="589" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="611" cy="95" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><rect x="430" y="157" width="200" height="10" rx="5" fill="#7a4cd9"/><polyline points="530,157 502.0,129.0" fill="none" stroke="#7a4cd9" stroke-width="5"/><ellipse cx="502.0" cy="129.0" rx="13" ry="9" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><rect x="405" y="285" width="250" height="150" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="530.0" y="301.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3. ADP·Pi: head re-cocked</text><circle cx="435" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="457" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="479" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="501" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="523" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="545" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="567" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="589" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="611" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><rect x="430" y="397" width="200" height="10" rx="5" fill="#7a4cd9"/><polyline points="530,397 546.1658075373095,369.0" fill="none" stroke="#7a4cd9" stroke-width="5"/><ellipse cx="546.2" cy="369.0" rx="13" ry="9" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><rect x="25" y="285" width="250" height="150" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="150.0" y="301.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">4. ADP·Pi head binds actin</text><circle cx="55" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="77" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="99" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="121" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="143" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="165" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="187" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="209" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><circle cx="231" cy="335" r="9" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><rect x="50" y="397" width="200" height="10" rx="5" fill="#7a4cd9"/><polyline points="150,397 176.55811238272278,351.0" fill="none" stroke="#7a4cd9" stroke-width="5"/><ellipse cx="176.6" cy="351.0" rx="13" ry="9" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><path d="M280,115 L400,115" fill="none" stroke="#1f9d63" stroke-width="3" marker-end="url(#ah)"/><text x="340.0" y="85.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">ATP binds</text><text x="340.0" y="140.0" font-size="12.5" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">→ detach</text><path d="M530,200 L530,280" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="540.0" y="232.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">ATP → ADP + Pi</text><text x="540.0" y="250.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">(re-cock head)</text><path d="M400,360 L280,360" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="340.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">binds actin</text><text x="340.0" y="383.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(needs Ca²⁺)</text><path d="M150,280 L150,200" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="160.0" y="225.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Pi release →</text><text x="160.0" y="243.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">POWER STROKE</text><text x="160.0" y="261.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">then ADP leaves</text><rect x="25" y="450" width="630" height="28" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="340.0" y="464.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ca²⁺ on troponin moves tropomyosin off actin&#x27;s myosin-binding sites (a switch, not a head step).</text><rect x="29.3" y="488.5" width="201.4" height="23.0" rx="11.5" fill="#1f9d63"/><text x="130.0" y="500.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ ATP binding → detachment</text><rect x="244.3" y="488.5" width="201.4" height="23.0" rx="11.5" fill="#d6453d"/><text x="345.0" y="500.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ power stroke: Pi release</text><rect x="455.0" y="488.5" width="180.0" height="23.0" rx="11.5" fill="#d6453d"/><text x="545.0" y="500.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Ca²⁺ is set by the SR</text></svg>
