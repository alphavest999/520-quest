<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cholera toxin jams the Gαs switch ON</text><rect x="20" y="50" width="280" height="105" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="160.0" y="86.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1. Inactive</text><text x="160.0" y="102.5" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gα·GDP bound to Gβγ</text><text x="160.0" y="118.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">receptor empty</text><rect x="390" y="50" width="280" height="105" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="530.0" y="86.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2. Ligand binds receptor</text><text x="530.0" y="102.5" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">receptor acts as GEF:</text><text x="530.0" y="118.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">GDP leaves, GTP enters Gα</text><rect x="390" y="215" width="280" height="105" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="530.0" y="251.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3. Active</text><text x="530.0" y="267.5" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gα·GTP leaves Gβγ</text><text x="530.0" y="283.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">and regulates an effector</text><rect x="20" y="215" width="280" height="105" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="160.0" y="251.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">4. Off switch</text><text x="160.0" y="267.5" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gα&#x27;s own GTPase:</text><text x="160.0" y="283.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">GTP → GDP + Pi</text><path d="M300,102.5 L390,102.5" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="345.0" y="92.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ligand</text><path d="M530.0,155 L530.0,215" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M390,267.5 L300,267.5" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M160.0,215 L160.0,155" fill="none" stroke="#1f2430" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="345.0" y="268.0" font-size="34" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">✗</text><rect x="20" y="340" width="650" height="62" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="345.0" y="363.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Toxin ADP-ribosylates Gαs → no GTPase → Gαs·GTP stays on → adenylyl cyclase stays on</text><text x="345.0" y="378.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ cAMP stays high → PKA opens CFTR Cl⁻ channels → Cl⁻, Na⁺ and water pour into the gut lumen</text><rect x="41.4" y="423.5" width="137.2" height="23.0" rx="11.5" fill="#1f9d63"/><text x="110.0" y="435.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ cAMP stays high</text><rect x="189.3" y="423.5" width="151.5" height="23.0" rx="11.5" fill="#d6453d"/><text x="265.0" y="435.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Gαs stimulates AC</text><rect x="375.7" y="423.5" width="108.7" height="23.0" rx="11.5" fill="#d6453d"/><text x="430.0" y="435.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ PLC is Gq&#x27;s</text><rect x="504.3" y="423.5" width="151.5" height="23.0" rx="11.5" fill="#d6453d"/><text x="580.0" y="435.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ ligand binding OK</text></svg>
