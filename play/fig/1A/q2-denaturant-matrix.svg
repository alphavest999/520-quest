<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 438" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Denaturing agents: what they break and what survives</text><text x="20.0" y="56.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Agent</text><text x="178.0" y="56.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Main action</text><text x="560.0" y="50.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">S–S</text><text x="628.0" y="50.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Peptide</text><text x="594.0" y="66.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">survives?</text><rect x="12" y="76" width="656" height="32" rx="6" fill="#f1f3f6"/><text x="20.0" y="92.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Heat</text><text x="178.0" y="92.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">adds energy: breaks H-bonds, hydrophobic packing</text><circle cx="560" cy="92" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="560.0" y="92.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><circle cx="628" cy="92" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="628.0" y="92.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><text x="20.0" y="126.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Urea (6 to 8 M)</text><text x="178.0" y="126.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">H-bonds to backbone; solvates nonpolar groups</text><circle cx="560" cy="126" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="560.0" y="126.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><circle cx="628" cy="126" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="628.0" y="126.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><rect x="12" y="144" width="656" height="32" rx="6" fill="#f1f3f6"/><text x="20.0" y="160.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Ethanol</text><text x="178.0" y="160.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">less polar solvent: weakens hydrophobic effect</text><circle cx="560" cy="160" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="560.0" y="160.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><circle cx="628" cy="160" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="628.0" y="160.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><text x="20.0" y="194.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">SDS detergent</text><text x="178.0" y="194.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">coats nonpolar regions, adds negative charge</text><circle cx="560" cy="194" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="560.0" y="194.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><circle cx="628" cy="194" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="628.0" y="194.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><rect x="12" y="212" width="656" height="32" rx="6" fill="#f1f3f6"/><text x="20.0" y="228.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Strong acid or base</text><text x="178.0" y="228.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">changes ionization: breaks salt bridges</text><circle cx="560" cy="228" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="560.0" y="228.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><circle cx="628" cy="228" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="628.0" y="228.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><text x="20.0" y="262.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">High salt (1 M NaCl)</text><text x="178.0" y="262.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">screens charges: weakens salt bridges</text><circle cx="560" cy="262" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="560.0" y="262.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><circle cx="628" cy="262" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="628.0" y="262.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><rect x="12" y="280" width="656" height="32" rx="6" fill="#f1f3f6"/><text x="20.0" y="296.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Hg²⁺, Pb²⁺</text><text x="178.0" y="296.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">bind cysteine –SH tightly; distort the fold</text><circle cx="560" cy="296" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="560.0" y="296.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><circle cx="628" cy="296" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="628.0" y="296.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><text x="20.0" y="330.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">β-ME or DTT</text><text x="178.0" y="330.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">reduce S–S to two –SH (reducing agents)</text><circle cx="560" cy="330" r="11" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><text x="560.0" y="330.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗</text><circle cx="628" cy="330" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="628.0" y="330.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><rect x="12" y="348" width="656" height="32" rx="6" fill="#f1f3f6"/><text x="20.0" y="364.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Protease</text><text x="178.0" y="364.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">hydrolyzes peptide bonds: new primary structure</text><circle cx="560" cy="364" r="11" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="560.0" y="364.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><circle cx="628" cy="364" r="11" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><text x="628.0" y="364.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗</text><text x="340.0" y="406.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Noncovalent forces (H-bonds, hydrophobic effect, salt bridges) are lost whenever the protein unfolds.</text><text x="340.0" y="426.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Covalent bonds need a specific chemical reaction: reduction (S–S) or hydrolysis (peptide).</text></svg>
