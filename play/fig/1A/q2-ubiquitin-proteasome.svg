<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Misfolded cytosolic proteins: polyubiquitin → proteasome</text><rect x="15" y="55" width="110" height="60" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="70.0" y="70.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E1</text><text x="70.0" y="85.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">activates Ub</text><text x="70.0" y="100.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(uses ATP)</text><path d="M125,85 L160,85" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="160" y="55" width="100" height="60" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="210.0" y="77.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E2</text><text x="210.0" y="92.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">carries Ub</text><path d="M260,85 L295,85" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="295" y="55" width="150" height="60" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="370.0" y="70.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E3 ligase</text><text x="370.0" y="85.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">recognizes misfolded</text><text x="370.0" y="100.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">protein (+ chaperones)</text><path d="M445,85 L480,85" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M490,95 C500,60 540,120 560,80 S600,110 610,90" fill="none" stroke="#138f9a" stroke-width="3"/><circle cx="572" cy="74" r="9" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="589" cy="66" r="9" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="606" cy="58" r="9" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="623" cy="50" r="9" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="560.0" y="132.0" font-size="12" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">≥ 4 ubiquitins (Lys48 chain)</text><path d="M560,152 L480,200" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="300" y="190" width="170" height="70" rx="12" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><polyline points="315,192 315,258" fill="none" stroke="#c9b8f2" stroke-width="1"/><polyline points="340,192 340,258" fill="none" stroke="#c9b8f2" stroke-width="1"/><polyline points="365,192 365,258" fill="none" stroke="#c9b8f2" stroke-width="1"/><polyline points="390,192 390,258" fill="none" stroke="#c9b8f2" stroke-width="1"/><polyline points="415,192 415,258" fill="none" stroke="#c9b8f2" stroke-width="1"/><polyline points="440,192 440,258" fill="none" stroke="#c9b8f2" stroke-width="1"/><polyline points="465,192 465,258" fill="none" stroke="#c9b8f2" stroke-width="1"/><text x="385.0" y="225.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">26S proteasome</text><path d="M300,225 L225,225" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="150.0" y="215.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">short peptides</text><text x="150.0" y="233.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">+ Ub recycled</text><rect x="276.6" y="273" width="216.9" height="24" rx="12" fill="#1f9d63"/><text x="385.0" y="285.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ cytosolic quality control</text><rect x="15" y="310" width="650" height="98" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="330.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Other tags do different jobs</text><rect x="48.8" y="348" width="142.5" height="24" rx="12" fill="#d6453d"/><text x="120.0" y="360.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ phosphorylation</text><text x="220.0" y="360.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">switches activity on/off (regulation), not disposal</text><rect x="63.6" y="380" width="112.7" height="24" rx="12" fill="#d6453d"/><text x="120.0" y="392.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ mannose-6-P</text><text x="220.0" y="392.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">added in Golgi → lysosome; glycosylation happens in ER/Golgi</text></svg>
