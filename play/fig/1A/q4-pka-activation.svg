<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cAMP activates protein kinase A by releasing its catalytic subunits</text><rect x="40" y="80" width="80" height="56" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="80.0" y="108.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">R</text><rect x="130" y="80" width="80" height="56" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="170.0" y="108.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><rect x="40" y="150" width="80" height="56" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="80.0" y="178.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">R</text><rect x="130" y="150" width="80" height="56" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="170.0" y="178.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><text x="125.0" y="234.4" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">inactive R₂C₂ tetramer:</text><text x="125.0" y="250.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">pseudosubstrate segment of R</text><text x="125.0" y="265.6" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">blocks C&#x27;s active site</text><path d="M225,145 L325,145" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="275.0" y="131.0" font-size="14" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">+ 4 cAMP</text><rect x="345" y="80" width="80" height="56" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="385.0" y="108.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">R</text><circle cx="357" cy="90" r="9" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="413" cy="90" r="9" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><rect x="345" y="150" width="80" height="56" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="385.0" y="178.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">R</text><circle cx="357" cy="160" r="9" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="413" cy="160" r="9" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="385.0" y="242.2" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">R₂·(cAMP)₄</text><text x="385.0" y="257.8" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(2 cAMP per R)</text><text x="455.0" y="145.0" font-size="24" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+</text><rect x="485" y="80" width="90" height="56" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="530.0" y="99.2" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><text x="530.0" y="116.8" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">active</text><rect x="485" y="150" width="90" height="56" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="530.0" y="169.2" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><text x="530.0" y="186.8" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">active</text><text x="530.0" y="234.4" font-size="12.5" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">2 free catalytic subunits</text><text x="530.0" y="250.0" font-size="12.5" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">phosphorylate Ser/Thr</text><text x="530.0" y="265.6" font-size="12.5" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">on target proteins</text><text x="605.0" y="95.0" font-size="12" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">cAMP</text><circle cx="605" cy="115" r="9" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="340.0" y="305.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cAMP is an allosteric effector of R (noncovalent, reversible): when cAMP is degraded by</text><text x="340.0" y="327.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">phosphodiesterase, R rebinds C and the kinase switches off. cAMP donates no phosphate; ATP does.</text></svg>
