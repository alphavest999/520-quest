<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">How membrane receptors turn a signal into a response</text><rect x="10" y="150" width="670" height="44" fill="#fdf1db"/><polyline points="10,150 680,150" fill="none" stroke="#d98a00" stroke-width="2"/><polyline points="10,194 680,194" fill="none" stroke="#d98a00" stroke-width="2"/><text x="183.0" y="132.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">outside</text><text x="183.0" y="212.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">cytosol</text><text x="97.5" y="50.0" font-size="13.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Ligand-gated channel</text><text x="267.5" y="50.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Voltage-gated channel</text><text x="437.5" y="50.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">GPCR</text><text x="607.5" y="41.6" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Receptor</text><text x="607.5" y="58.4" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">tyrosine kinase</text><rect x="61.5" y="135" width="24" height="74" rx="8" fill="#e3f5ec" stroke="#1f9d63" stroke-width="2"/><rect x="109.5" y="135" width="24" height="74" rx="8" fill="#e3f5ec" stroke="#1f9d63" stroke-width="2"/><polygon points="63.5,118 79.5,118 71.5,104" fill="#d6453d"/><polygon points="115.5,118 131.5,118 123.5,104" fill="#d6453d"/><text x="97.5" y="88.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">ACh binds</text><path d="M97.5,120 L97.5,228" fill="none" stroke="#1f9d63" stroke-width="2.5" marker-end="url(#ah)"/><text x="97.5" y="245.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Na⁺/K⁺ flow</text><text x="97.5" y="290.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ligand opens the pore</text><text x="97.5" y="308.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">directly; ms-fast</text><text x="97.5" y="326.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">nicotinic AChR, GABA-A</text><rect x="239.5" y="135" width="24" height="74" rx="8" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><rect x="271.5" y="135" width="24" height="74" rx="8" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><text x="267.5" y="100.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">no ligand</text><text x="267.5" y="245.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">opens when Vm changes</text><text x="267.5" y="290.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">senses membrane</text><text x="267.5" y="308.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">potential</text><text x="267.5" y="326.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Na⁺ channel of axon</text><rect x="381.5" y="140" width="12" height="64" rx="5" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><rect x="397.5" y="140" width="12" height="64" rx="5" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><rect x="413.5" y="140" width="12" height="64" rx="5" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><rect x="429.5" y="140" width="12" height="64" rx="5" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><rect x="445.5" y="140" width="12" height="64" rx="5" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><rect x="461.5" y="140" width="12" height="64" rx="5" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><rect x="477.5" y="140" width="12" height="64" rx="5" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><polygon points="429.5,118 445.5,118 437.5,104" fill="#d6453d"/><text x="437.5" y="88.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">ligand</text><circle cx="467.5" cy="228" r="15" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="467.5" y="228.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gα</text><circle cx="497.5" cy="232" r="12" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="497.5" y="232.0" font-size="10" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">βγ</text><text x="437.5" y="290.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">7 transmembrane helices;</text><text x="437.5" y="308.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">activates a G protein</text><text x="437.5" y="326.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">muscarinic AChR</text><rect x="584.5" y="95" width="14" height="45" rx="6" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><polyline points="591.5,140 591.5,204" fill="none" stroke="#138f9a" stroke-width="5"/><rect x="582.5" y="204" width="18" height="36" rx="6" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="565.9" y="222.0" font-size="11" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">P</text><rect x="616.5" y="95" width="14" height="45" rx="6" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><polyline points="623.5,140 623.5,204" fill="none" stroke="#138f9a" stroke-width="5"/><rect x="614.5" y="204" width="18" height="36" rx="6" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="649.1" y="222.0" font-size="11" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">P</text><polygon points="600.5,88 614.5,88 607.5,76" fill="#d6453d"/><text x="607.5" y="290.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">dimerizes, phosphorylates</text><text x="607.5" y="308.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">its own tyrosines</text><text x="607.5" y="326.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">insulin, EGF receptors</text><rect x="30.0" y="358" width="135.0" height="24" rx="12" fill="#1f9d63"/><text x="97.5" y="370.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ nicotinic AChR</text><rect x="220.3" y="358.5" width="94.4" height="23.0" rx="11.5" fill="#d6453d"/><text x="267.5" y="370.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ needs ΔVm</text><rect x="368.9" y="358.5" width="137.2" height="23.0" rx="11.5" fill="#d6453d"/><text x="437.5" y="370.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ muscarinic type</text><rect x="567.4" y="358.5" width="80.2" height="23.0" rx="11.5" fill="#d6453d"/><text x="607.5" y="370.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ no pore</text><text x="345.0" y="408.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Only a ligand-gated channel is both the receptor and the pore.</text></svg>
