<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Quaternary structure needs two or more polypeptide chains</text><rect x="12" y="44" width="160" height="270" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="92.0" y="66.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Myoglobin</text><text x="92.0" y="86.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">1 chain + 1 heme</text><rect x="28.2" y="276" width="127.6" height="24" rx="12" fill="#d6453d"/><text x="92.0" y="288.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ no quaternary</text><rect x="178" y="44" width="160" height="270" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="258.0" y="66.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Hemoglobin</text><text x="258.0" y="86.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">4 chains: α₂β₂</text><rect x="205.4" y="276" width="105.3" height="24" rx="12" fill="#1f9d63"/><text x="258.0" y="288.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ quaternary</text><rect x="344" y="44" width="160" height="270" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="424.0" y="66.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ribonuclease A</text><text x="424.0" y="86.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">1 chain, 4 S–S inside</text><rect x="360.2" y="276" width="127.6" height="24" rx="12" fill="#d6453d"/><text x="424.0" y="288.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ no quaternary</text><rect x="510" y="44" width="160" height="270" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="590.0" y="66.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">30-residue peptide</text><text x="590.0" y="86.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">1 chain</text><rect x="526.2" y="276" width="127.6" height="24" rx="12" fill="#d6453d"/><text x="590.0" y="288.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ no quaternary</text><path d="M44,180 C32,120 82,110 102,130 S152,120 144,170 S112,235 87,215 S47,230 44,180 z" fill="#e0f3f4" stroke="#138f9a" stroke-width="2"/><rect x="80" y="160" width="24" height="16" fill="#d6453d" rx="2"/><text x="92.0" y="248.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">heme (red)</text><circle cx="228" cy="142" r="28" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="228.0" y="142.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">α₁</text><circle cx="288" cy="142" r="28" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="288.0" y="142.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">β₁</text><circle cx="228" cy="202" r="28" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="228.0" y="202.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">β₂</text><circle cx="288" cy="202" r="28" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="288.0" y="202.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">α₂</text><text x="258.0" y="248.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">noncovalent contacts</text><path d="M379,120 L464,120 Q482,135 464,150 L384,150 Q366,165 384,180 L464,180 Q482,195 464,210 L379,210" fill="none" stroke="#7a4cd9" stroke-width="3.5"/><polyline points="399,123 399,147" fill="none" stroke="#d98a00" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="399" cy="120" r="3.5" fill="#d98a00"/><circle cx="399" cy="150" r="3.5" fill="#d98a00"/><polyline points="454,153 454,177" fill="none" stroke="#d98a00" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="454" cy="150" r="3.5" fill="#d98a00"/><circle cx="454" cy="180" r="3.5" fill="#d98a00"/><polyline points="399,183 399,207" fill="none" stroke="#d98a00" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="399" cy="180" r="3.5" fill="#d98a00"/><circle cx="399" cy="210" r="3.5" fill="#d98a00"/><polyline points="429,183 429,207" fill="none" stroke="#d98a00" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="429" cy="180" r="3.5" fill="#d98a00"/><circle cx="429" cy="210" r="3.5" fill="#d98a00"/><text x="424.0" y="248.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">S–S within 1 chain</text><path d="M535,170 C560,140 580,200 600,170 S630,140 645,170" fill="none" stroke="#1f9d63" stroke-width="3.5"/><text x="590.0" y="248.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">a single chain</text></svg>
