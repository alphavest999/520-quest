<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Domain vs subunit</text><rect x="15" y="44" width="320" height="250" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="175.0" y="66.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ONE chain, two domains</text><path d="M50,160 C45,120 90,110 110,125 S150,150 140,180 S95,210 75,198 S53,185 50,160 z" fill="#e0f3f4" stroke="#138f9a" stroke-width="2.5"/><path d="M210,160 C205,120 250,110 270,125 S310,150 300,180 S255,210 235,198 S213,185 210,160 z" fill="#e0f3f4" stroke="#138f9a" stroke-width="2.5"/><path d="M140,165 C165,120 185,210 210,160" fill="none" stroke="#138f9a" stroke-width="3"/><text x="175.0" y="112.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">linker</text><text x="95.0" y="160.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">domain 1</text><text x="255.0" y="160.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">domain 2</text><text x="175.0" y="240.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">each folds on its own; often its own job</text><text x="175.0" y="258.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(e.g. a binding domain + a catalytic domain)</text><rect x="74.0" y="268" width="202.0" height="24" rx="12" fill="#1f9d63"/><text x="175.0" y="280.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ domain (tertiary level)</text><rect x="345" y="44" width="320" height="250" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="505.0" y="66.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">TWO chains</text><path d="M380,160 C375,120 420,110 440,125 S480,150 470,180 S425,210 405,198 S383,185 380,160 z" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2.5"/><path d="M540,160 C535,120 580,110 600,125 S640,150 630,180 S585,210 565,198 S543,185 540,160 z" fill="#fbe7e5" stroke="#d6453d" stroke-width="2.5"/><text x="425.0" y="160.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">chain A</text><text x="585.0" y="160.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">chain B</text><text x="505.0" y="240.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">separate polypeptides held together</text><text x="505.0" y="258.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">by noncovalent contacts</text><rect x="418.9" y="268" width="172.2" height="24" rx="12" fill="#5b6474"/><text x="505.0" y="280.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">subunits (quaternary)</text><rect x="15" y="306" width="650" height="64" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="340.0" y="326.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A domain is a FOLDED UNIT inside one chain. A primary sequence is just the order of residues;</text><text x="340.0" y="348.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">a β-turn is a 4-residue reversal of direction, far too small to fold or work on its own.</text></svg>
