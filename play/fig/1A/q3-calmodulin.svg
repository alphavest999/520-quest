<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Calmodulin turns a Ca²⁺ rise into enzyme activation</text><rect x="15" y="50" width="190" height="74" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="110.0" y="71.4" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Signal opens Ca²⁺</text><text x="110.0" y="87.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">channels: cytosolic Ca²⁺</text><text x="110.0" y="102.6" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">≈ 0.1 μM → ≈ 1 μM</text><rect x="250" y="50" width="190" height="74" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="345.0" y="66.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Calmodulin (apo)</text><ellipse cx="320" cy="100" rx="24" ry="14" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><ellipse cx="370" cy="100" rx="24" ry="14" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><polyline points="344,100 346,100" fill="none" stroke="#7a4cd9" stroke-width="3"/><rect x="485" y="50" width="190" height="74" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="580.0" y="66.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Ca²⁺₄-calmodulin</text><ellipse cx="555" cy="100" rx="24" ry="14" fill="#efe8fc" stroke="#1f9d63" stroke-width="2.5"/><ellipse cx="605" cy="100" rx="24" ry="14" fill="#efe8fc" stroke="#1f9d63" stroke-width="2.5"/><circle cx="543" cy="100" r="5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="567" cy="100" r="5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="593" cy="100" r="5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="617" cy="100" r="5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><path d="M205,87.0 L250,87.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M440,87.0 L485,87.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="580.0" y="138.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">4 Ca²⁺ fill the EF hands;</text><text x="580.0" y="154.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">shape change exposes</text><text x="580.0" y="170.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">hydrophobic grips</text><path d="M580,180 L580,200" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="330" y="200" width="345" height="110" rx="10" fill="#ffffff" stroke="#1f9d63" stroke-width="1.5"/><text x="502.0" y="220.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Binds and activates target proteins:</text><text x="502.0" y="245.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CaM kinase II (memory, signaling)</text><text x="502.0" y="265.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">myosin light-chain kinase (smooth muscle)</text><text x="502.0" y="285.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">calcineurin, phosphodiesterase, NO synthase</text><rect x="15" y="200" width="290" height="110" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="160.0" y="231.6" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Off: Ca²⁺ pumps (PMCA, SERCA)</text><text x="160.0" y="247.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">lower Ca²⁺; calmodulin</text><text x="160.0" y="262.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">releases Ca²⁺ and lets go</text><text x="160.0" y="278.4" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">of its targets</text><rect x="31.5" y="333.5" width="237.0" height="23.0" rx="11.5" fill="#1f9d63"/><text x="150.0" y="345.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ CaM is a Ca²⁺-sensing adaptor</text><rect x="334.2" y="333.5" width="101.6" height="23.0" rx="11.5" fill="#d6453d"/><text x="385.0" y="345.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ not a pump</text><rect x="462.1" y="333.5" width="115.8" height="23.0" rx="11.5" fill="#d6453d"/><text x="520.0" y="345.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ not a kinase</text><rect x="237.2" y="368.5" width="215.6" height="23.0" rx="11.5" fill="#d6453d"/><text x="345.0" y="380.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ no GTP: that is G proteins</text><text x="345.0" y="412.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Troponin C in skeletal muscle is a close relative of calmodulin.</text></svg>
