<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SDS-PAGE separates denatured chains by mass</text><rect x="60" y="70" width="240" height="290" rx="6" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><rect x="90" y="74" width="60" height="10" fill="#ffffff" stroke="#5b6474"/><text x="120.0" y="58.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ladder</text><rect x="180" y="74" width="60" height="10" fill="#ffffff" stroke="#5b6474"/><text x="210.0" y="58.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Sample</text><rect x="90" y="89.5" width="60" height="5" rx="2" fill="#5b6474"/><text x="54.0" y="92.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">250</text><rect x="90" y="126.0" width="60" height="5" rx="2" fill="#5b6474"/><text x="54.0" y="128.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">150</text><rect x="90" y="155.0" width="60" height="5" rx="2" fill="#5b6474"/><text x="54.0" y="157.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">100</text><rect x="90" y="175.5" width="60" height="5" rx="2" fill="#5b6474"/><text x="54.0" y="178.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">75</text><rect x="90" y="204.5" width="60" height="5" rx="2" fill="#5b6474"/><text x="54.0" y="207.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">50</text><rect x="90" y="226.0" width="60" height="5" rx="2" fill="#5b6474"/><text x="54.0" y="228.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">37</text><rect x="90" y="254.0" width="60" height="5" rx="2" fill="#5b6474"/><text x="54.0" y="256.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">25</text><rect x="90" y="290.5" width="60" height="5" rx="2" fill="#5b6474"/><text x="54.0" y="293.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">15</text><rect x="90" y="319.5" width="60" height="5" rx="2" fill="#5b6474"/><text x="54.0" y="322.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">10</text><rect x="180" y="140.9" width="60" height="7" rx="2" fill="#7a4cd9"/><text x="246.0" y="144.4" font-size="12" font-weight="600" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">120 kDa</text><rect x="180" y="190.5" width="60" height="7" rx="2" fill="#138f9a"/><text x="246.0" y="194.0" font-size="12" font-weight="600" fill="#138f9a" text-anchor="start" dominant-baseline="middle">60 kDa</text><rect x="180" y="240.0" width="60" height="7" rx="2" fill="#d98a00"/><text x="246.0" y="243.5" font-size="12" font-weight="600" fill="#d98a00" text-anchor="start" dominant-baseline="middle">30 kDa</text><text x="38.0" y="72.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">kDa</text><text x="180.0" y="372.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(−) wells at top</text><text x="180.0" y="390.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(+) anode at bottom</text><rect x="320" y="60" width="345" height="175" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="492.0" y="80.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Why mass is the only variable</text><text x="335.0" y="104.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">SDS + heat unfold every chain into a rod</text><text x="335.0" y="123.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">(shape differences removed)</text><text x="335.0" y="142.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">SDS binds ≈ 1.4 g per g protein: uniform</text><text x="335.0" y="161.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">negative charge per unit mass</text><text x="335.0" y="180.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">(own charge swamped)</text><text x="335.0" y="199.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">The gel is a sieve: small chains slip through</text><text x="335.0" y="218.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">the pores and travel farthest</text><rect x="424.5" y="242" width="135.0" height="24" rx="12" fill="#1f9d63"/><text x="492.0" y="254.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ molecular mass</text><rect x="341.6" y="278" width="216.9" height="24" rx="12" fill="#d6453d"/><text x="450.0" y="290.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ pI → isoelectric focusing</text><rect x="337.8" y="314" width="224.3" height="24" rx="12" fill="#d6453d"/><text x="450.0" y="326.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ native shape → native PAGE</text><rect x="337.8" y="350" width="224.3" height="24" rx="12" fill="#d6453d"/><text x="450.0" y="362.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ intrinsic charge → swamped</text><text x="450.0" y="396.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">migration distance ≈ a − b·log(mass)</text></svg>
