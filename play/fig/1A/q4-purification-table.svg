<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Purification table: specific activity = activity ÷ protein</text><text x="85.0" y="62.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Step</text><text x="220.0" y="62.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Total protein</text><text x="360.0" y="62.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Total activity</text><text x="545.0" y="62.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Specific activity</text><rect x="20" y="80" width="640" height="44" rx="8" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="85.0" y="102.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Start</text><text x="220.0" y="102.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">500 mg</text><text x="360.0" y="102.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1000 units</text><text x="545.0" y="102.0" font-size="14" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1000/500 = 2 units/mg</text><rect x="20" y="132" width="640" height="44" rx="8" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="85.0" y="154.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Final</text><text x="220.0" y="154.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">5 mg</text><text x="360.0" y="154.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">500 units</text><text x="545.0" y="154.0" font-size="14" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">500/5 = 100 units/mg</text><text x="85.0" y="205.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">change:</text><text x="220.0" y="205.0" font-size="14" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">÷ 100</text><text x="360.0" y="205.0" font-size="14" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">÷ 2 (yield 50%)</text><text x="545.0" y="205.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">× 50 (purification fold)</text><text x="340.0" y="245.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Most of the protein thrown away was contaminating protein, so the enzyme is a much</text><text x="340.0" y="267.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">larger share of what remains, even though half of the enzyme activity was lost.</text><rect x="112.8" y="302.5" width="124.5" height="25.0" rx="12.5" fill="#1f9d63"/><text x="175.0" y="315.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ ×50, 2 → 100</text><rect x="422.6" y="303" width="164.8" height="24" rx="12" fill="#d6453d"/><text x="505.0" y="315.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ ×100: protein only</text><rect x="92.6" y="340" width="164.8" height="24" rx="12" fill="#d6453d"/><text x="175.0" y="352.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ ÷2: total activity</text><rect x="456.1" y="340" width="97.8" height="24" rx="12" fill="#d6453d"/><text x="505.0" y="352.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ unchanged</text></svg>
