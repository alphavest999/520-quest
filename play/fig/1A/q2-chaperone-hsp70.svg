<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Chaperones protect folding chains; the sequence decides the fold</text><polyline points="30,108 52,132 74,108 96,132 118,108 140,132 162,108 184,132" fill="none" stroke="#138f9a" stroke-width="3"/><circle cx="52" cy="132" r="7" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="118" cy="108" r="7" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="184" cy="132" r="7" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="105.0" y="162.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">new or partly unfolded chain</text><text x="105.0" y="178.0" font-size="12" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">(hydrophobic patches exposed)</text><path d="M200,120 L275,120" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="237.5" y="110.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">chaperone binds</text><path d="M300,95 C300,70 380,70 380,95 L380,145 C380,170 300,170 300,145 Z" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><text x="340.0" y="58.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">Hsp70</text><polyline points="310,120 330,108 350,132 370,120" fill="none" stroke="#138f9a" stroke-width="3"/><circle cx="340" cy="120" r="7" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="340.0" y="186.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">noncovalent, temporary;</text><text x="340.0" y="202.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ATP cycles drive bind and release</text><path d="M392,110 L470,80" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="423.0" y="83.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">release</text><ellipse cx="560" cy="70" rx="58" ry="34" fill="#e0f3f4" stroke="#138f9a" stroke-width="3"/><circle cx="544" cy="70" r="7" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="560" cy="70" r="7" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="576" cy="70" r="7" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="560.0" y="124.0" font-size="12" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">native fold (core buried)</text><rect x="470.2" y="136" width="179.7" height="24" rx="12" fill="#1f9d63"/><text x="560.0" y="148.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ fold set by sequence</text><path d="M392,140 L470,220" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="470.0" y="196.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">no chaperone</text><polyline points="470,216 492,240 514,216 536,240 558,216 580,240" fill="none" stroke="#138f9a" stroke-width="3"/><circle cx="492" cy="240" r="7" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="558" cy="216" r="7" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="478,236 500,260 522,236 544,260 566,236 588,260" fill="none" stroke="#138f9a" stroke-width="3"/><circle cx="500" cy="260" r="7" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="566" cy="236" r="7" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="486,256 508,280 530,256 552,280 574,256 596,280" fill="none" stroke="#138f9a" stroke-width="3"/><circle cx="508" cy="280" r="7" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="574" cy="256" r="7" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="560.0" y="312.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">aggregate (patches stick together)</text><rect x="15" y="330" width="650" height="60" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><rect x="33.9" y="336" width="172.2" height="24" rx="12" fill="#d6453d"/><text x="120.0" y="348.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ no fold information</text><rect x="269.9" y="336" width="120.2" height="24" rx="12" fill="#d6453d"/><text x="330.0" y="348.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ not covalent</text><rect x="431.6" y="336" width="216.9" height="24" rx="12" fill="#d6453d"/><text x="540.0" y="348.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ do not make peptide bonds</text><text x="340.0" y="376.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Chaperones only prevent wrong contacts; the ribosome makes peptide bonds; the sequence encodes the fold.</text></svg>
