<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Extreme pH removes the charges that hold salt bridges</text><rect x="12" y="44" width="210" height="262" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="119.0" y="66.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">pH 2</text><text x="119.0" y="100.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Asp –CH₂–COOH</text><text x="119.0" y="120.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">1% charged (pKa 3.9)</text><text x="119.0" y="154.0" font-size="12" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">no attraction</text><text x="119.0" y="188.0" font-size="13" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Lys –(CH₂)₄–NH₃⁺</text><text x="119.0" y="208.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">100% charged (pKa 10.5)</text><text x="119.0" y="238.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">protein strongly + overall:</text><text x="119.0" y="253.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">like charges repel</text><rect x="44.0" y="274" width="149.9" height="24" rx="12" fill="#d6453d"/><text x="119.0" y="286.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ salt bridge lost</text><rect x="235" y="44" width="210" height="262" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="342.0" y="66.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">pH 7</text><text x="342.0" y="100.0" font-size="13" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Asp –CH₂–COO⁻</text><text x="342.0" y="120.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">100% charged (pKa 3.9)</text><polyline points="342,136 342,172" fill="none" stroke="#1f9d63" stroke-width="2.5" stroke-dasharray="6 4"/><text x="350.0" y="154.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">attraction</text><text x="342.0" y="188.0" font-size="13" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Lys –(CH₂)₄–NH₃⁺</text><text x="342.0" y="208.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">100% charged (pKa 10.5)</text><text x="342.0" y="238.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">salt bridge intact;</text><text x="342.0" y="253.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">fold stable</text><rect x="263.3" y="274" width="157.4" height="24" rx="12" fill="#1f9d63"/><text x="342.0" y="286.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ salt bridge holds</text><rect x="458" y="44" width="210" height="262" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="565.0" y="66.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">pH 12</text><text x="565.0" y="100.0" font-size="13" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Asp –CH₂–COO⁻</text><text x="565.0" y="120.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">100% charged (pKa 3.9)</text><text x="565.0" y="154.0" font-size="12" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">no attraction</text><text x="565.0" y="188.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lys –(CH₂)₄–NH₂</text><text x="565.0" y="208.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">3% charged (pKa 10.5)</text><text x="565.0" y="238.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">protein strongly − overall:</text><text x="565.0" y="253.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">like charges repel</text><rect x="490.0" y="274" width="149.9" height="24" rx="12" fill="#d6453d"/><text x="565.0" y="286.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ salt bridge lost</text><rect x="12" y="318" width="656" height="60" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="338.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">pH changes protonation (charge), not covalent structure: no S–S reduction, no peptide</text><text x="340.0" y="358.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cleavage on this time scale, and no L → D conversion. Side-chain H-bonds change too.</text></svg>
