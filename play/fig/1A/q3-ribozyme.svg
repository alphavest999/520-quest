<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The ribosome is a ribozyme</text><ellipse cx="190" cy="150" rx="150" ry="85" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><ellipse cx="190" cy="265" rx="120" ry="45" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><text x="190.0" y="92.0" font-size="12.5" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">large subunit</text><text x="190.0" y="285.0" font-size="12.5" font-weight="600" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">small subunit</text><circle cx="70" cy="175" r="12" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="110" cy="175" r="12" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="300" cy="130" r="12" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="190.0" y="116.0" font-size="11.5" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">orange = ribosomal proteins</text><circle cx="190" cy="175" r="30" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="190.0" y="170.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">PTC</text><text x="190.0" y="186.0" font-size="11" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">all rRNA</text><rect x="370" y="45" width="305" height="270" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="522.0" y="66.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Biological catalysts</text><rect x="385" y="80" width="275" height="70" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="522.5" y="106.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Protein enzymes</text><text x="522.5" y="123.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">the great majority</text><rect x="385" y="160" width="275" height="140" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="522.0" y="180.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Ribozymes (catalytic RNA)</text><text x="400.0" y="205.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• peptidyl transferase (23S/28S rRNA)</text><text x="400.0" y="227.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• RNase P (tRNA processing)</text><text x="400.0" y="249.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• self-splicing introns</text><text x="400.0" y="271.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• spliceosome snRNAs</text><rect x="15" y="325" width="660" height="40" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="345.0" y="345.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ribosomal proteins stabilize the rRNA fold and help assembly; no catalyst, RNA or protein, changes Keq.</text><rect x="26.4" y="383.5" width="187.1" height="23.0" rx="11.5" fill="#1f9d63"/><text x="120.0" y="395.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ some catalysts are RNA</text><rect x="226.4" y="383.5" width="137.2" height="23.0" rx="11.5" fill="#d6453d"/><text x="295.0" y="395.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ not all enzymes</text><rect x="388.5" y="383.5" width="123.0" height="23.0" rx="11.5" fill="#d6453d"/><text x="450.0" y="395.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ proteins help</text><rect x="533.5" y="383.5" width="123.0" height="23.0" rx="11.5" fill="#d6453d"/><text x="595.0" y="395.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Keq unchanged</text></svg>
