<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 455" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Why collagen needs glycine at every third position</text><rect x="22" y="50" width="48" height="34" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="46.0" y="67.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gly</text><rect x="74" y="50" width="48" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="98.0" y="67.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Pro</text><rect x="126" y="50" width="48" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="150.0" y="67.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Hyp</text><rect x="178" y="50" width="48" height="34" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="202.0" y="67.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gly</text><rect x="230" y="50" width="48" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="254.0" y="67.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Pro</text><rect x="282" y="50" width="48" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="306.0" y="67.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ala</text><rect x="334" y="50" width="48" height="34" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="358.0" y="67.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gly</text><rect x="386" y="50" width="48" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="410.0" y="67.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lys</text><rect x="438" y="50" width="48" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="462.0" y="67.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Hyp</text><rect x="490" y="50" width="48" height="34" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="514.0" y="67.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gly</text><text x="562.0" y="67.0" font-size="18" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">…</text><text x="300.0" y="102.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Repeat: Gly – X – Y   (X is often Pro, Y is often hydroxyproline, Hyp)</text><text x="175.0" y="132.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cross-section of the triple helix</text><circle cx="175" cy="250" r="18" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><circle cx="175.0" cy="188.0" r="40" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="175.0" cy="221.0" r="10" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="175.0" y="221.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">G</text><circle cx="194.6596490629358" cy="174.2341655275749" r="11" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="155.3403509370642" cy="174.2341655275749" r="11" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="121.30642496536481" cy="281.0" r="40" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="149.8852632902513" cy="264.5" r="10" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="149.9" y="264.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">G</text><circle cx="99.55503807648522" cy="270.8571617182232" r="11" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="119.21468713942102" cy="304.9086727542019" r="11" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="228.6935750346352" cy="281.0" r="40" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="200.1147367097487" cy="264.5" r="10" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="200.1" y="264.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">G</text><circle cx="230.78531286057898" cy="304.9086727542019" r="11" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="250.4449619235148" cy="270.8571617182232" r="11" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="175.0" y="345.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">3 chains wind around a central axis</text><text x="175.0" y="363.0" font-size="12.5" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">G = glycine faces the crowded axis</text><text x="175.0" y="381.0" font-size="12.5" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">orange = X and Y residues face outward</text><rect x="330" y="135" width="335" height="105" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="497.0" y="158.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">At the axis there is room only for H</text><text x="497.0" y="183.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glycine&#x27;s side chain is a single H atom.</text><text x="497.0" y="203.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Any larger side chain (even Ala&#x27;s CH₃) clashes</text><text x="497.0" y="223.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">with the other two chains and unwinds the helix.</text><rect x="381.1" y="256" width="231.8" height="24" rx="12" fill="#1f9d63"/><text x="497.0" y="268.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ only Gly fits in the center</text><rect x="370.0" y="288" width="254.1" height="24" rx="12" fill="#d6453d"/><text x="497.0" y="300.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Gly has no S, so no disulfides</text><rect x="381.1" y="320" width="231.8" height="24" rx="12" fill="#d6453d"/><text x="497.0" y="332.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Gly side chain is uncharged</text><rect x="340.2" y="352" width="313.6" height="24" rx="12" fill="#d6453d"/><text x="497.0" y="364.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Pro and Lys (not Gly) are hydroxylated</text><text x="497.0" y="400.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Gly–Pro–Hyp triplets: Gly packs the core,</text><text x="497.0" y="420.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">rigid Pro and Hyp rings stabilize the twist.</text></svg>
