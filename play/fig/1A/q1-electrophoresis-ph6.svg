.0" y="120.0" font-size="13" font-weight="600" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Gly (pI 6.0): net 0</text><rect x="98" y="148" width="44" height="14" rx="4" fill="#2f6fdb"/><text x="380.0" y="155.0" font-size="13" font-weight="600" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">Lys (pI 9.7): net +</text><path d="M345,85 L532,85" fill="none" stroke="#d6453d" stroke-width="1.5" marker-end="url(#ah)"/><path d="M335,155 L148,155" fill="none" stroke="#2f6fdb" stroke-width="1.5" marker-end="url(#ah)"/><rect x="91.3" y="223" width="157.4" height="24" rx="12" fill="#1f9d63"/><text x="170.0" y="235.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ Aspartate → anode</text><rect x="435.0" y="223" width="149.9" height="24" rx="12" fill="#d6453d"/><text x="510.0" y="235.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Lysine → cathode</text><rect x="69.0" y="263" width="202.0" height="24" rx="12" fill="#d6453d"/><text x="170.0" y="275.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Glycine stays at origin</text><rect x="360.6" y="263" width="298.7" height="24" rx="12" fill="#d6453d"/><text x="510.0" y="275.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ &#x27;all zwitterions&#x27;: only Gly is net 0</text><text x="340.0" y="312.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Rule: pH &gt; pI → negative → anode;  pH &lt; pI → positive → cathode</text></svg>
