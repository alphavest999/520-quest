<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 450" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">What bound antibodies do</text><rect x="15" y="42" width="214" height="320" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="122.0" y="62.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Neutralization</text><rect x="237" y="42" width="214" height="320" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="344.0" y="62.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Agglutination</text><rect x="459" y="42" width="214" height="320" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="566.0" y="62.0" font-size="15" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Opsonization</text><circle cx="122" cy="150" r="26" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="122.0" y="150.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">virus</text><g transform="translate(122.0,106.0) rotate(180) scale(1.0)"><line x1="0" y1="0" x2="0" y2="22" stroke="#2f6fdb" stroke-width="5"/><line x1="0" y1="0" x2="-11" y2="-15" stroke="#1f9d63" stroke-width="5"/><line x1="0" y1="0" x2="11" y2="-15" stroke="#1f9d63" stroke-width="5"/></g><g transform="translate(160.1051177665153,128.0) rotate(240) scale(1.0)"><line x1="0" y1="0" x2="0" y2="22" stroke="#2f6fdb" stroke-width="5"/><line x1="0" y1="0" x2="-11" y2="-15" stroke="#1f9d63" stroke-width="5"/><line x1="0" y1="0" x2="11" y2="-15" stroke="#1f9d63" stroke-width="5"/></g><g transform="translate(160.10511776651532,172.0) rotate(300) scale(1.0)"><line x1="0" y1="0" x2="0" y2="22" stroke="#2f6fdb" stroke-width="5"/><line x1="0" y1="0" x2="-11" y2="-15" stroke="#1f9d63" stroke-width="5"/><line x1="0" y1="0" x2="11" y2="-15" stroke="#1f9d63" stroke-width="5"/></g><g transform="translate(122.0,194.0) rotate(360) scale(1.0)"><line x1="0" y1="0" x2="0" y2="22" stroke="#2f6fdb" stroke-width="5"/><line x1="0" y1="0" x2="-11" y2="-15" stroke="#1f9d63" stroke-width="5"/><line x1="0" y1="0" x2="11" y2="-15" stroke="#1f9d63" stroke-width="5"/></g><g transform="translate(83.89488223348471,172.00000000000003) rotate(420) scale(1.0)"><line x1="0" y1="0" x2="0" y2="22" stroke="#2f6fdb" stroke-width="5"/><line x1="0" y1="0" x2="-11" y2="-15" stroke="#1f9d63" stroke-width="5"/><line x1="0" y1="0" x2="11" y2="-15" stroke="#1f9d63" stroke-width="5"/></g><g transform="translate(83.89488223348471,128.0) rotate(480) scale(1.0)"><line x1="0" y1="0" x2="0" y2="22" stroke="#2f6fdb" stroke-width="5"/><line x1="0" y1="0" x2="-11" y2="-15" stroke="#1f9d63" stroke-width="5"/><line x1="0" y1="0" x2="11" y2="-15" stroke="#1f9d63" stroke-width="5"/></g><rect x="27" y="285" width="190" height="20" fill="#e6eefc" stroke="#2f6fdb"/><text x="122.0" y="295.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">host cell membrane</text><text x="122.0" y="230.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">binding sites covered:</text><text x="122.0" y="248.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cannot attach to host cell</text><text x="122.0" y="330.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">blocks pathogen or toxin</text><circle cx="292" cy="120" r="20" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><circle cx="382" cy="130" r="20" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><circle cx="312" cy="210" r="20" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><circle cx="397" cy="215" r="20" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><polyline points="317.2,122.8 337.0,125.0 356.8,127.2" fill="none" stroke="#1f9d63" stroke-width="4"/><circle cx="337.0" cy="125.0" r="3" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><polyline points="297.6,145.2 302.0,165.0 306.4,184.8" fill="none" stroke="#1f9d63" stroke-width="4"/><circle cx="302.0" cy="165.0" r="3" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><polyline points="386.2,153.8 389.5,172.5 392.8,191.2" fill="none" stroke="#1f9d63" stroke-width="4"/><circle cx="389.5" cy="172.5" r="3" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><polyline points="335.8,211.4 354.5,212.5 373.2,213.6" fill="none" stroke="#1f9d63" stroke-width="4"/><circle cx="354.5" cy="212.5" r="3" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><polyline points="321.4,146.6 344.5,167.5 367.6,188.39999999999998" fill="none" stroke="#1f9d63" stroke-width="4"/><circle cx="344.5" cy="167.5" r="3" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="344.0" y="270.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">each IgG arm grabs a</text><text x="344.0" y="288.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">different cell: clumps</text><text x="344.0" y="330.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">cross-links antigens</text><circle cx="566" cy="140" r="28" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="566.0" y="140.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bacterium</text><g transform="translate(612.0,140.0) rotate(270) scale(1.0)"><line x1="0" y1="0" x2="0" y2="22" stroke="#2f6fdb" stroke-width="5"/><line x1="0" y1="0" x2="-11" y2="-15" stroke="#1f9d63" stroke-width="5"/><line x1="0" y1="0" x2="11" y2="-15" stroke="#1f9d63" stroke-width="5"/></g><g transform="translate(589.0,179.8371685740842) rotate(330) scale(1.0)"><line x1="0" y1="0" x2="0" y2="22" stroke="#2f6fdb" stroke-width="5"/><line x1="0" y1="0" x2="-11" y2="-15" stroke="#1f9d63" stroke-width="5"/><line x1="0" y1="0" x2="11" y2="-15" stroke="#1f9d63" stroke-width="5"/></g><g transform="translate(543.0,179.83716857408416) rotate(390) scale(1.0)"><line x1="0" y1="0" x2="0" y2="22" stroke="#2f6fdb" stroke-width="5"/><line x1="0" y1="0" x2="-11" y2="-15" stroke="#1f9d63" stroke-width="5"/><line x1="0" y1="0" x2="11" y2="-15" stroke="#1f9d63" stroke-width="5"/></g><g transform="translate(520.0,140.0) rotate(450) scale(1.0)"><line x1="0" y1="0" x2="0" y2="22" stroke="#2f6fdb" stroke-width="5"/><line x1="0" y1="0" x2="-11" y2="-15" stroke="#1f9d63" stroke-width="5"/><line x1="0" y1="0" x2="11" y2="-15" stroke="#1f9d63" stroke-width="5"/></g><path d="M 486 300 Q 491 225 536 215 L 536 245 Q 511 255 511 300 Z" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><path d="M 646 300 Q 641 225 596 215 L 596 245 Q 621 255 621 300 Z" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><text x="566.0" y="285.0" font-size="12" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">macrophage</text><text x="566.0" y="312.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fc receptors grip the</text><text x="566.0" y="330.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exposed Fc tails → engulf</text><text x="566.0" y="348.0" font-size="2" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><rect x="15" y="372" width="660" height="34" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="345.0" y="389.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Class switching is not an effector action: a B cell swaps its heavy-chain constant region (e.g. IgM → IgG).</text><rect x="7.9" y="416.5" width="244.2" height="23.0" rx="11.5" fill="#1f9d63"/><text x="130.0" y="428.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ opsonization = coat for eating</text><rect x="265.0" y="416.5" width="130.1" height="23.0" rx="11.5" fill="#d6453d"/><text x="330.0" y="428.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ neutralization</text><rect x="408.5" y="416.5" width="123.0" height="23.0" rx="11.5" fill="#d6453d"/><text x="470.0" y="428.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ agglutination</text><rect x="543.4" y="416.5" width="137.2" height="23.0" rx="11.5" fill="#d6453d"/><text x="612.0" y="428.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ class switching</text></svg>
