<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Heat shock response: more unfolding → more chaperones</text><rect x="20" y="55" width="150" height="60" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="95.0" y="85.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Temperature rises</text><rect x="215" y="55" width="200" height="60" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="315.0" y="77.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Proteins partly unfold:</text><text x="315.0" y="92.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">hydrophobic patches exposed</text><rect x="460" y="55" width="200" height="60" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="560.0" y="77.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Hsp70/Hsp90 bind them,</text><text x="560.0" y="92.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">releasing HSF1</text><path d="M170,85 L215,85" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M415,85 L460,85" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="460" y="160" width="200" height="64" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="560.0" y="184.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">HSF1 trimer enters nucleus,</text><text x="560.0" y="199.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">binds heat shock elements</text><path d="M560,115 L560,160" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="215" y="160" width="200" height="64" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="315.0" y="177.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Transcription of HSP genes</text><text x="315.0" y="192.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ more Hsp70, Hsp90,</text><text x="315.0" y="207.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">chaperonins</text><path d="M460,192 L415,192" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="160" width="150" height="64" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="95.0" y="177.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Chaperones refold</text><text x="95.0" y="192.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">or prevent</text><text x="95.0" y="207.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">aggregation</text><path d="M215,192 L170,192" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="95,224 95,262 560,262" fill="none" stroke="#5b6474" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M560,262 L560,226" fill="none" stroke="#5b6474" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="330.0" y="280.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">feedback: excess free Hsp70 binds HSF1 again → response switches off</text><rect x="34.9" y="126" width="120.2" height="24" rx="12" fill="#1f9d63"/><text x="95.0" y="138.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ the real job</text><rect x="15" y="300" width="650" height="90" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="320.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">What heat shock proteins do NOT do</text><rect x="81.1" y="338" width="97.8" height="24" rx="12" fill="#d6453d"/><text x="130.0" y="350.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ make heat</text><rect x="235.3" y="338" width="209.4" height="24" rx="12" fill="#d6453d"/><text x="340.0" y="350.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ form from other proteins</text><rect x="460.2" y="338" width="179.7" height="24" rx="12" fill="#d6453d"/><text x="550.0" y="350.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ repair or digest DNA</text><text x="340.0" y="378.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">They are chaperones encoded by their own genes; they act on proteins, not DNA.</text></svg>
