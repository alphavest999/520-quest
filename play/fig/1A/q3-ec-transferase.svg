<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Six enzyme classes, by what the reaction does</text><rect x="12" y="42" width="190" height="32" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="107.0" y="58.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Class</text><rect x="207" y="42" width="270" height="32" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="342.0" y="58.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Reaction type</text><rect x="482" y="42" width="196" height="32" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="580.0" y="58.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Examples</text><rect x="12" y="80" width="190" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="107.0" y="100.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">✗ 1  Oxidoreductases</text><rect x="207" y="80" width="270" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="342.0" y="100.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">move electrons (H⁻, H atoms, O)</text><rect x="482" y="80" width="196" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="580.0" y="100.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">dehydrogenases, oxidases</text><rect x="12" y="125" width="190" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="107.0" y="145.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">✓ 2  Transferases</text><rect x="207" y="125" width="270" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="342.0" y="145.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">move a group to another molecule</text><rect x="482" y="125" width="196" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="580.0" y="145.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">kinases, transaminases</text><rect x="12" y="170" width="190" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="107.0" y="190.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">✗ 3  Hydrolases</text><rect x="207" y="170" width="270" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="342.0" y="190.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">split a bond by adding water</text><rect x="482" y="170" width="196" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="580.0" y="190.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">proteases, lipases</text><rect x="12" y="215" width="190" height="50" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="107.0" y="240.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">4  Lyases</text><rect x="207" y="215" width="270" height="50" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="342.0" y="232.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">split or form bonds without hydrolysis,</text><text x="342.0" y="247.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">redox or ATP (often makes C=C)</text><rect x="482" y="215" width="196" height="50" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="580.0" y="240.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">aldolase, decarboxylases</text><rect x="12" y="270" width="190" height="40" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="107.0" y="290.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">5  Isomerases</text><rect x="207" y="270" width="270" height="40" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="342.0" y="290.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">rearrange atoms within a molecule</text><rect x="482" y="270" width="196" height="40" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="580.0" y="290.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">triose phosphate isomerase</text><rect x="12" y="315" width="190" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="107.0" y="335.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">✗ 6  Ligases</text><rect x="207" y="315" width="270" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="342.0" y="335.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">join two molecules using ATP</text><rect x="482" y="315" width="196" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="580.0" y="335.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DNA ligase, synthetases</text><text x="345.0" y="378.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Trap: kinases use ATP but are transferases; only ligases join two molecules with ATP.</text></svg>
