<text x="105.0" y="170.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Urea</text><text x="105.0" y="190.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">2 × N–H donors, 1 C=O acceptor</text><text x="105.0" y="206.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">small, uncharged, very soluble</text><rect x="215" y="48" width="450" height="76" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="440.0" y="66.0" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">1. Competes for hydrogen bonds</text><text x="440.0" y="88.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">backbone C=O ··· H–N(urea)   and   backbone N–H ··· O=C(urea)</text><text x="440.0" y="108.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">replace the protein&#x27;s own C=O ··· H–N bonds</text><rect x="215" y="134" width="450" height="76" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="440.0" y="152.0" font-size="13" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">2. Solvates nonpolar side chains</text><text x="440.0" y="174.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">urea packs around exposed nonpolar groups more easily than water,</text><text x="440.0" y="194.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">so burying them in a core gains less: the hydrophobic effect weakens</text><rect x="15" y="226" width="650" height="52" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="340.0" y="244.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Covalent bonds untouched: peptide bonds and disulfides survive.</text><text x="340.0" y="264.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Remove the urea (dialysis) and many proteins refold: the change is reversible.</text><text x="340.0" y="300.0" font-size="13" font-weight="700" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">What urea does NOT do</text><rect x="19.0" y="318" width="202.0" height="24" rx="12" fill="#d6453d"/><text x="120.0" y="330.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ hydrolyze peptide bonds</text><rect x="265.0" y="318" width="149.9" height="24" rx="12" fill="#d6453d"/><text x="340.0" y="330.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ reduce S–S bonds</text><rect x="456.4" y="318" width="187.1" height="24" rx="12" fill="#d6453d"/><text x="550.0" y="330.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ add groups covalently</text><text x="340.0" y="366.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Breaking S–S needs a reducing agent (β-mercaptoethanol, DTT); cutting the backbone needs</text><text x="340.0" y="384.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">hydrolysis (proteases or hot concentrated acid).</text></svg>
