<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 450" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Same triad, different S1 pockets</text><rect x="15" y="42" width="210" height="330" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="120.0" y="62.0" font-size="15" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Chymotrypsin</text><path d="M 35 150 L 100 150 L 100 270 Q 120 290 140 270 L 140 150 L 205 150 L 205 315 L 35 315 Z" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><polyline points="45,115 195,115" fill="none" stroke="#d98a00" stroke-width="5"/><text x="65.0" y="100.0" font-size="11.5" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">substrate</text><polyline points="120,115 120,205" fill="none" stroke="#d98a00" stroke-width="4"/><polygon points="120,205 134,213 134,229 120,237 106,229 106,213" fill="none" stroke="#d98a00" stroke-width="3"/><text x="165.0" y="225.0" font-size="12" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">Phe</text><text x="120.0" y="330.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">deep, hydrophobic</text><text x="120.0" y="350.0" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">after Phe, Tyr, Trp</text><rect x="240" y="42" width="210" height="330" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="345.0" y="62.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Trypsin</text><path d="M 260 150 L 325 150 L 325 270 Q 345 290 365 270 L 365 150 L 430 150 L 430 315 L 260 315 Z" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><text x="345.0" y="300.0" font-size="12" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Asp189 −</text><polyline points="270,115 420,115" fill="none" stroke="#d98a00" stroke-width="5"/><text x="290.0" y="100.0" font-size="11.5" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">substrate</text><polyline points="345,115 345,250" fill="none" stroke="#d98a00" stroke-width="4"/><text x="345.0" y="262.0" font-size="12" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">NH₃⁺</text><text x="390.0" y="200.0" font-size="12" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">Lys</text><text x="345.0" y="330.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">deep, Asp189 (−) at bottom</text><text x="345.0" y="350.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">after Lys, Arg (+)</text><rect x="465" y="42" width="210" height="330" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="570.0" y="62.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Elastase</text><path d="M 485 150 L 550 150 L 550 195 Q 570 215 590 195 L 590 150 L 655 150 L 655 315 L 485 315 Z" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><polyline points="495,115 645,115" fill="none" stroke="#d98a00" stroke-width="5"/><text x="515.0" y="100.0" font-size="11.5" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">substrate</text><polyline points="570,115 570,140" fill="none" stroke="#d98a00" stroke-width="4"/><text x="615.0" y="175.0" font-size="12" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">Ala</text><text x="570.0" y="330.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">shallow (Val, Thr block it)</text><text x="570.0" y="350.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">after Ala, Gly, small</text><rect x="30.0" y="383.5" width="180.0" height="23.0" rx="11.5" fill="#1f9d63"/><text x="120.0" y="395.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ hydrophobic S1 pocket</text><rect x="254.2" y="383.5" width="101.6" height="23.0" rx="11.5" fill="#d6453d"/><text x="305.0" y="395.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ same triad</text><rect x="377.8" y="383.5" width="144.3" height="23.0" rx="11.5" fill="#d6453d"/><text x="450.0" y="395.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Phe is uncharged</text><rect x="543.5" y="383.5" width="123.0" height="23.0" rx="11.5" fill="#d6453d"/><text x="605.0" y="395.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ no disulfides</text><text x="345.0" y="430.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">All three use Ser195, His57, Asp102; the pocket decides which bond is cut.</text></svg>
