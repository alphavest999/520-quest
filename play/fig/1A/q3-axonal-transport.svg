<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Axonal transport runs on microtubules with fixed polarity</text><circle cx="80" cy="175" r="58" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="80" cy="175" r="22" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="80.0" y="175.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">nucleus</text><text x="80.0" y="250.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cell body (soma)</text><rect x="135" y="160" width="430" height="30" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><polyline points="565,175 610,131.0" fill="none" stroke="#2f6fdb" stroke-width="8"/><polyline points="565,175 610,175.0" fill="none" stroke="#2f6fdb" stroke-width="8"/><polyline points="565,175 610,219.0" fill="none" stroke="#2f6fdb" stroke-width="8"/><circle cx="618" cy="127.0" r="14" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="618" cy="175.0" r="14" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="618" cy="223.0" r="14" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="615.0" y="250.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Axon terminal</text><polyline points="145,175 555,175" fill="none" stroke="#1f2430" stroke-width="4"/><circle cx="150" cy="175" r="11" fill="#1f2430" stroke="#1f2430" stroke-width="1.5"/><text x="150.0" y="174.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">−</text><circle cx="552" cy="175" r="11" fill="#1f2430" stroke="#1f2430" stroke-width="1.5"/><text x="552.0" y="175.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">+</text><text x="350.0" y="207.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">microtubule: minus end at soma, plus end at terminal</text><path d="M240,125 L470,125" fill="none" stroke="#1f9d63" stroke-width="3" marker-end="url(#ah)"/><circle cx="355" cy="105" r="15" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="400.0" y="105.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">cargo</text><text x="355.0" y="66.0" font-size="13.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Kinesin → plus end: anterograde (soma to terminal)</text><path d="M470,228 L240,228" fill="none" stroke="#d6453d" stroke-width="3" marker-end="url(#ah)"/><circle cx="355" cy="248" r="15" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="400.0" y="248.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">cargo</text><text x="350.0" y="285.0" font-size="13.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Dynein → minus end: retrograde (terminal back to soma)</text><text x="350.0" y="305.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">carries endosomes, recycled membrane, growth-factor signals</text><rect x="92.2" y="333" width="75.5" height="24" rx="12" fill="#1f9d63"/><text x="130.0" y="345.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ dynein</text><rect x="195.0" y="333" width="149.9" height="24" rx="12" fill="#d6453d"/><text x="270.0" y="345.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ kinesin: outward</text><rect x="360.0" y="333" width="149.9" height="24" rx="12" fill="#d6453d"/><text x="435.0" y="345.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ myosin II: actin</text><rect x="522.5" y="333" width="135.0" height="24" rx="12" fill="#d6453d"/><text x="590.0" y="345.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ tubulin: track</text><text x="340.0" y="380.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Rabies virus and tetanus toxin reach the CNS by hitching a ride on dynein.</text></svg>
