 y="140.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">4</text><circle cx="326.4" cy="115.1" r="19" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="326.4" y="115.1" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">L</text><text x="345.7" y="92.1" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">5</text><circle cx="326.4" cy="344.9" r="19" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="326.4" y="344.9" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">K</text><text x="345.7" y="367.9" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">6</text><circle cx="100.1" cy="305.0" r="19" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="100.1" y="305.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E</text><text x="74.1" y="320.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">7</text><circle cx="178.7" cy="89.0" r="19" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="178.7" y="89.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">L</text><text x="168.4" y="60.9" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">8</text><circle cx="377.7" cy="204.0" r="19" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="377.7" y="204.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">K</text><text x="407.3" y="198.7" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">9</text><circle cx="230.0" cy="380.0" r="19" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="230.0" y="380.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E</text><text x="230.0" y="410.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">10</text><circle cx="82.3" cy="204.0" r="19" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="82.3" y="204.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">L</text><text x="52.7" y="198.7" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">11</text><circle cx="281.3" cy="89.0" r="19" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="281.3" y="89.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">L</text><text x="291.6" y="60.9" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">12</text><circle cx="359.9" cy="305.0" r="19" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="359.9" y="305.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">K</text><text x="385.9" y="320.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">13</text><circle cx="133.6" cy="344.9" r="19" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="133.6" y="344.9" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E</text><text x="114.3" y="367.9" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">14</text><circle cx="133.6" cy="115.1" r="19" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="133.6" y="115.1" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">L</text><text x="114.3" y="92.1" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">15</text><circle cx="359.9" cy="155.0" r="19" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="359.9" y="155.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">K</text><text x="385.9" y="140.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">16</text><circle cx="281.3" cy="371.0" r="19" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="281.3" y="371.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E</text><text x="291.6" y="399.1" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">17</text><circle cx="82.3" cy="256.0" r="19" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="82.3" y="256.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">L</text><text x="52.7" y="261.3" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">18</text><text x="230.0" y="220.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">helix axis</text><text x="230.0" y="240.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(view down it)</text><text x="92.0" y="60.0" font-size="13" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">hydrophobic face</text><text x="430.0" y="80.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Sequence (1 → 18):</text><text x="430.0" y="102.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">L K E L L K E L K</text><text x="430.0" y="122.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">E L L K E L K E L</text><text x="430.0" y="150.0" font-size="12.5" font-weight="400" fill="#d98a00" text-anchor="start" dominant-baseline="middle">Leu at 1, 4, 5, 8, 11, 12, 15, 18</text><text x="430.0" y="170.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">spacing 3, 1, 3, 3, 1, 3, 3 (i, i+3, i+4, i+7)</text><text x="430.0" y="198.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Each residue is 100° further</text><text x="430.0" y="216.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">around, so 3.6 residues = 360°.</text><text x="430.0" y="234.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Residues 3 to 4 apart land on</text><text x="430.0" y="252.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">nearly the same side.</text><rect x="461.3" y="278" width="157.4" height="24" rx="12" fill="#1f9d63"/><text x="540.0" y="290.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ amphipathic helix</text><rect x="405.5" y="314" width="269.0" height="24" rx="12" fill="#d6453d"/><text x="540.0" y="326.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ transmembrane needs ~20 nonpolar</text><rect x="453.9" y="350" width="172.2" height="24" rx="12" fill="#d6453d"/><text x="540.0" y="362.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ β-strand repeat = 2</text><text x="540.0" y="398.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">K = Lys (+), E = Glu (−) on the polar face</text></svg>
