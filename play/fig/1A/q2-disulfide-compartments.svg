<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Where disulfide bonds can form</text><text x="340.0" y="50.0" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 Cys–SH  ⇌  Cys–S–S–Cys + 2 H⁺ + 2 e⁻     (forming S–S is an oxidation)</text><rect x="20" y="70" width="640" height="250" rx="40" fill="#e3f5ec" stroke="#1f9d63" stroke-width="2.5"/><text x="70.0" y="92.0" font-size="12" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">CELL</text><rect x="40" y="104" width="300" height="200" rx="24" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="190.0" y="128.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Cytosol: REDUCING</text><text x="190.0" y="152.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">GSH : GSSG &gt; 30 : 1</text><text x="190.0" y="172.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">thioredoxin and glutathione keep</text><text x="190.0" y="188.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">cysteines as free –SH</text><text x="190.0" y="222.0" font-size="14" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cys–SH   HS–Cys</text><rect x="129.9" y="242" width="120.2" height="24" rx="12" fill="#5b6474"/><text x="190.0" y="254.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">few disulfides</text><text x="190.0" y="284.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(cysteines ARE present, as thiols)</text><path d="M370,110 C360,150 420,150 410,190 S350,240 400,290 L640,290 L640,110 Z" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="530.0" y="128.0" font-size="14" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">ER lumen: OXIDIZING</text><text x="530.0" y="152.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">GSH : GSSG ≈ 1 : 1 to 3 : 1</text><text x="530.0" y="172.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Ero1 + protein disulfide</text><text x="530.0" y="188.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">isomerase (PDI) make S–S</text><text x="530.0" y="222.0" font-size="14" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cys–S–S–Cys</text><rect x="451.3" y="242" width="157.4" height="24" rx="12" fill="#1f9d63"/><text x="530.0" y="254.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ secretory pathway</text><path d="M530,290 L530,352" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="542.0" y="338.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">secretion</text><rect x="380" y="355" width="280" height="52" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="520.0" y="373.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Outside the cell: oxidizing</text><text x="520.0" y="388.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">S–S bonds stay intact (antibodies, insulin)</text><text x="190.0" y="352.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Translation and cysteine codons are the same</text><text x="190.0" y="370.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">for all ribosomes; temperature is not the switch.</text><text x="190.0" y="392.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The redox environment decides.</text></svg>
