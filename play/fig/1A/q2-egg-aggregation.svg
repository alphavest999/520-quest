<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Why a cooked egg white does not turn clear again</text><ellipse cx="55" cy="100" rx="26" ry="20" fill="#e0f3f4" stroke="#138f9a" stroke-width="2"/><ellipse cx="115" cy="85" rx="26" ry="20" fill="#e0f3f4" stroke="#138f9a" stroke-width="2"/><ellipse cx="80" cy="150" rx="26" ry="20" fill="#e0f3f4" stroke="#138f9a" stroke-width="2"/><ellipse cx="140" cy="140" rx="26" ry="20" fill="#e0f3f4" stroke="#138f9a" stroke-width="2"/><text x="100.0" y="190.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Native: compact, soluble</text><text x="100.0" y="208.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">hydrophobic core buried</text><text x="100.0" y="226.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">clear, runny liquid</text><path d="M180,120 L250,120" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="215.0" y="110.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">heat</text><polyline points="265,75 279,95 293,75 307,95 321,75 335,95 349,75" fill="none" stroke="#138f9a" stroke-width="2.5"/><circle cx="279" cy="95" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="321" cy="75" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="280,115 294,135 308,115 322,135 336,115 350,135 364,115" fill="none" stroke="#138f9a" stroke-width="2.5"/><circle cx="294" cy="135" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="336" cy="115" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="265,150 279,170 293,150 307,170 321,150 335,170 349,150" fill="none" stroke="#138f9a" stroke-width="2.5"/><circle cx="279" cy="170" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="321" cy="150" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="320.0" y="190.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Unfolded chains</text><text x="320.0" y="208.0" font-size="12" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">hydrophobic patches exposed</text><path d="M380,120 L450,120" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="415.0" y="110.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">stick together</text><polyline points="470,59 484,81 498,59 512,81 526,59 540,81" fill="none" stroke="#138f9a" stroke-width="2.5"/><circle cx="484" cy="81" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="526" cy="59" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="490,92 504,108 518,92 532,108 546,92 560,108" fill="none" stroke="#138f9a" stroke-width="2.5"/><circle cx="504" cy="108" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="546" cy="92" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="470,119 484,141 498,119 512,141 526,119 540,141" fill="none" stroke="#138f9a" stroke-width="2.5"/><circle cx="484" cy="141" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="526" cy="119" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="500,152 514,168 528,152 542,168 556,152 570,168" fill="none" stroke="#138f9a" stroke-width="2.5"/><circle cx="514" cy="168" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="556" cy="152" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="540,72 554,88 568,72 582,88 596,72 610,88" fill="none" stroke="#138f9a" stroke-width="2.5"/><circle cx="554" cy="88" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="596" cy="72" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="560,114 574,136 588,114 602,136 616,114 630,136" fill="none" stroke="#138f9a" stroke-width="2.5"/><circle cx="574" cy="136" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="616" cy="114" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="530,142 544,158 558,142 572,158 586,142 600,158" fill="none" stroke="#138f9a" stroke-width="2.5"/><circle cx="544" cy="158" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="586" cy="142" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="580,149 594,171 608,149 622,171 636,149 650,171" fill="none" stroke="#138f9a" stroke-width="2.5"/><circle cx="594" cy="171" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="636" cy="149" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="590,82 604,98 618,82 632,98 646,82 660,98" fill="none" stroke="#138f9a" stroke-width="2.5"/><circle cx="604" cy="98" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="646" cy="82" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="560.0" y="205.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Aggregated network (gel)</text><text x="560.0" y="223.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">scatters light: white and solid</text><path d="M540,250 Q325.0,280.0 110,250" fill="none" stroke="#d6453d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="330.0" y="246.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">cooling</text><text x="330.0" y="296.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">✗ chains are tangled with each other: they cannot find their way back to the native fold</text><rect x="15" y="318" width="650" height="72" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><rect x="72.4" y="330" width="105.3" height="24" rx="12" fill="#d6453d"/><text x="125.0" y="342.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ hydrolyzed</text><rect x="266.3" y="330" width="157.4" height="24" rx="12" fill="#d6453d"/><text x="345.0" y="342.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ made carbohydrate</text><rect x="476.3" y="330" width="157.4" height="24" rx="12" fill="#d6453d"/><text x="555.0" y="342.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ new peptide bonds</text><text x="340.0" y="372.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">None of these happen: peptide bonds survive; the change is unfolding plus noncovalent aggregation.</text></svg>
