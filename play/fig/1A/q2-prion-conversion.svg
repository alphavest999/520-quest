<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Prions spread a shape, not a gene</text><ellipse cx="90" cy="120" rx="44" ry="30" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><polyline points="64,105 68,111 72,105 76,111 80,105 84,111 88,105 92,111 96,105 100,111 104,105 108,111 112,105 116,111" fill="none" stroke="#2f6fdb" stroke-width="2"/><polyline points="64,117 68,123 72,117 76,123 80,117 84,123 88,117 92,123 96,117 100,123 104,117 108,123 112,117 116,123" fill="none" stroke="#2f6fdb" stroke-width="2"/><polyline points="64,129 68,135 72,129 76,135 80,129 84,135 88,129 92,135 96,129 100,135 104,129 108,135 112,129 116,135" fill="none" stroke="#2f6fdb" stroke-width="2"/><text x="90.0" y="168.0" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">PrPᶜ (normal)</text><text x="90.0" y="186.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">α-helix rich, soluble</text><text x="170.0" y="120.0" font-size="24" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+</text><rect x="206" y="90" width="88" height="60" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="2"/><polygon points="220,102 268,102 268,98 280,106 268,114 268,110 220,110" fill="#d6453d"/><polygon points="220,116 268,116 268,112 280,120 268,128 268,124 220,124" fill="#d6453d"/><polygon points="220,130 268,130 268,126 280,134 268,142 268,138 220,138" fill="#d6453d"/><text x="250.0" y="168.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">PrPˢᶜ (misfolded)</text><text x="250.0" y="186.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">β-sheet rich</text><path d="M305,120 L375,120" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="110.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">templating</text><rect x="386" y="90" width="88" height="60" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="2"/><polygon points="400,102 448,102 448,98 460,106 448,114 448,110 400,110" fill="#d6453d"/><polygon points="400,116 448,116 448,112 460,120 448,128 448,124 400,124" fill="#d6453d"/><polygon points="400,130 448,130 448,126 460,134 448,142 448,138 400,138" fill="#d6453d"/><rect x="486" y="90" width="88" height="60" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="2"/><polygon points="500,102 548,102 548,98 560,106 548,114 548,110 500,110" fill="#d6453d"/><polygon points="500,116 548,116 548,112 560,120 548,128 548,124 500,124" fill="#d6453d"/><polygon points="500,130 548,130 548,126 560,134 548,142 548,138 500,138" fill="#d6453d"/><text x="480.0" y="168.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">2 PrPˢᶜ</text><text x="480.0" y="186.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">each can convert more PrPᶜ</text><path d="M480,196 Q366.2,230.5 250,205" fill="none" stroke="#5b6474" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="365.0" y="240.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">cycle repeats</text><text x="620.0" y="100.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">→ amyloid</text><text x="620.0" y="118.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">fibrils,</text><text x="620.0" y="136.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">neuron loss</text><rect x="15" y="262" width="650" height="108" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="282.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Same amino acid sequence, different fold. No DNA or RNA is involved.</text><rect x="51.3" y="300" width="157.4" height="24" rx="12" fill="#d6453d"/><text x="130.0" y="312.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ DNA or RNA genome</text><rect x="253.9" y="300" width="172.2" height="24" rx="12" fill="#d6453d"/><text x="340.0" y="312.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ spreading mutations</text><rect x="449.0" y="300" width="202.0" height="24" rx="12" fill="#d6453d"/><text x="550.0" y="312.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ toxic peptide fragments</text><text x="340.0" y="346.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Red tags mark the wrong mechanisms: prions carry no genes, spread no mutations, and resist digestion.</text></svg>
