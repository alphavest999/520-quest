<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Where side chains sit in a soluble globular protein</text><rect x="20" y="45" width="420" height="335" rx="12" fill="#e6eefc"/><text x="60.0" y="64.0" font-size="13" font-weight="400" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">water</text><circle cx="230" cy="210" r="140" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><circle cx="230" cy="210" r="72" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="230.0" y="164.0" font-size="13" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">hydrophobic core</text><circle cx="202" cy="204" r="17" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="202.0" y="204.0" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Phe</text><circle cx="260" cy="206" r="17" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="260.0" y="206.0" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Leu</text><circle cx="222" cy="240" r="17" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="222.0" y="240.0" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Phe</text><circle cx="264" cy="246" r="17" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="264.0" y="246.0" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Val</text><circle cx="190" cy="240" r="17" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="190.0" y="240.0" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Ile</text><circle cx="206.38384783729748" cy="76.06614559033972" r="20" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="206.4" y="76.1" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Lys⁺</text><circle cx="112.22054508531633" cy="142.0" r="20" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><text x="112.2" y="142.0" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Glu⁻</text><circle cx="106.7421409630156" cy="267.4760835967351" r="20" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="106.7" y="267.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Arg⁺</text><circle cx="194.8006098660572" cy="341.3659123753133" r="20" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><text x="194.8" y="341.4" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Asp⁻</text><circle cx="317.41911491736937" cy="314.18204426418106" r="20" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="317.4" y="314.2" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Lys⁺</text><circle cx="357.7981964268836" cy="163.48526050770906" r="20" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><text x="357.8" y="163.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Glu⁻</text><circle cx="298.0" cy="92.22054508531635" r="20" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="298.0" y="92.2" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Arg⁺</text><rect x="478.9" y="108" width="172.2" height="24" rx="12" fill="#1f9d63"/><text x="565.0" y="120.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ Phenylalanine: core</text><rect x="493.8" y="153" width="142.5" height="24" rx="12" fill="#d6453d"/><text x="565.0" y="165.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Lysine: surface</text><rect x="482.6" y="198" width="164.8" height="24" rx="12" fill="#d6453d"/><text x="565.0" y="210.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Glutamate: surface</text><rect x="486.3" y="243" width="157.4" height="24" rx="12" fill="#d6453d"/><text x="565.0" y="255.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Arginine: surface</text><text x="565.0" y="305.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Burying nonpolar side chains</text><text x="565.0" y="325.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">frees ordered water</text><text x="565.0" y="345.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(hydrophobic effect)</text></svg>
