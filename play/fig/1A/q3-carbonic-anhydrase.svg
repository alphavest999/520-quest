<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 450" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Carbonic anhydrase: Zn²⁺ turns water into hydroxide</text><text x="345.0" y="50.0" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CO₂ + H₂O ⇌ HCO₃⁻ + H⁺   (the enzyme speeds both directions; Keq unchanged)</text><rect x="5" y="72" width="210" height="210" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><circle cx="110" cy="175" r="24" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="110.0" y="175.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Zn²⁺</text><polyline points="88.0,191.0 55,215" fill="none" stroke="#2f6fdb" stroke-width="2.5"/><text x="55.0" y="228.0" font-size="12" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">His</text><polyline points="110.0,199.8 110,237" fill="none" stroke="#2f6fdb" stroke-width="2.5"/><text x="110.0" y="250.0" font-size="12" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">His</text><polyline points="132.0,191.0 165,215" fill="none" stroke="#2f6fdb" stroke-width="2.5"/><text x="165.0" y="228.0" font-size="12" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">His</text><polyline points="110,151 110,128" fill="none" stroke="#1f2430" stroke-width="2.5"/><text x="110.0" y="113.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">H₂O</text><text x="110.0" y="88.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1. Water binds Zn²⁺</text><rect x="240" y="72" width="210" height="210" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><circle cx="345" cy="175" r="24" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="345.0" y="175.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Zn²⁺</text><polyline points="323.0,191.0 290,215" fill="none" stroke="#2f6fdb" stroke-width="2.5"/><text x="290.0" y="228.0" font-size="12" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">His</text><polyline points="345.0,199.8 345,237" fill="none" stroke="#2f6fdb" stroke-width="2.5"/><text x="345.0" y="250.0" font-size="12" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">His</text><polyline points="367.0,191.0 400,215" fill="none" stroke="#2f6fdb" stroke-width="2.5"/><text x="400.0" y="228.0" font-size="12" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">His</text><polyline points="345,151 345,128" fill="none" stroke="#1f9d63" stroke-width="2.5"/><text x="345.0" y="113.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">OH⁻</text><text x="345.0" y="88.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2. Loses H⁺ easily</text><rect x="475" y="72" width="210" height="210" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><circle cx="580" cy="175" r="24" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="580.0" y="175.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Zn²⁺</text><polyline points="558.0,191.0 525,215" fill="none" stroke="#2f6fdb" stroke-width="2.5"/><text x="525.0" y="228.0" font-size="12" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">His</text><polyline points="580.0,199.8 580,237" fill="none" stroke="#2f6fdb" stroke-width="2.5"/><text x="580.0" y="250.0" font-size="12" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">His</text><polyline points="602.0,191.0 635,215" fill="none" stroke="#2f6fdb" stroke-width="2.5"/><text x="635.0" y="228.0" font-size="12" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">His</text><polyline points="580,151 580,128" fill="none" stroke="#d98a00" stroke-width="2.5"/><text x="580.0" y="113.0" font-size="14" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">HCO₃⁻</text><text x="580.0" y="88.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3. OH⁻ attacks CO₂</text><path d="M218,175 L232,175" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M453,175 L467,175" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="345.0" y="268.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">bound H₂O pKa ≈ 7</text><text x="580.0" y="268.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">then H₂O displaces HCO₃⁻</text><rect x="15" y="295" width="660" height="70" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="345.0" y="314.4" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Zn²⁺ is a Lewis acid: it pulls electron density from the bound water, so at pH 7 much of it is</text><text x="345.0" y="330.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Zn–OH⁻, a strong nucleophile, ready to attack CO₂. The H⁺ is relayed out by His64.</text><text x="345.0" y="345.6" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">This is metal ion catalysis; the product leaves every cycle and the enzyme is unchanged.</text><rect x="60.7" y="380.5" width="158.6" height="23.0" rx="11.5" fill="#1f9d63"/><text x="140.0" y="392.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ Zn–OH⁻ nucleophile</text><rect x="251.4" y="380.5" width="137.2" height="23.0" rx="11.5" fill="#d6453d"/><text x="320.0" y="392.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ not a reduction</text><rect x="404.1" y="380.5" width="115.8" height="23.0" rx="11.5" fill="#d6453d"/><text x="462.0" y="392.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ HCO₃⁻ leaves</text><rect x="543.5" y="380.5" width="123.0" height="23.0" rx="11.5" fill="#d6453d"/><text x="605.0" y="392.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Keq unchanged</text><text x="345.0" y="428.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">One of the fastest enzymes known: about 10⁶ CO₂ hydrated per second.</text></svg>
