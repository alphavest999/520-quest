<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Sickle-cell hemoglobin: one surface residue changes</text><text x="160.0" y="60.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">HbA (normal): β6 = Glu</text><circle cx="110" cy="150" r="62" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="110.0" y="150.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">deoxy HbA</text><circle cx="168" cy="116" r="15" fill="#d6453d"/><text x="168.0" y="116.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">E</text><circle cx="260" cy="150" r="62" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="260.0" y="150.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">deoxy HbA</text><path d="M198,132 q 22,18 0,36" fill="#fdf1db" stroke="#d98a00" stroke-width="3"/><text x="185.0" y="236.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">charged Glu⁻ stays hydrated: no sticking</text><text x="500.0" y="60.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">HbS: β6 = Val</text><circle cx="430" cy="150" r="62" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="430.0" y="150.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">deoxy HbS</text><circle cx="500" cy="150" r="15" fill="#d98a00"/><text x="500.0" y="150.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">V</text><circle cx="570" cy="150" r="62" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="570.0" y="150.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">deoxy HbS</text><path d="M508,132 q 22,18 0,36" fill="#fdf1db" stroke="#d98a00" stroke-width="3"/><text x="500.0" y="236.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">hydrophobic Val fits a hydrophobic pocket</text><path d="M500,252 L500,282" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="500.0" y="300.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">HbS chains → long fibers → sickled cells</text><rect x="24.1" y="328" width="231.8" height="24" rx="12" fill="#d6453d"/><text x="140.0" y="340.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ disulfides (Val has no –SH)</text><rect x="345.5" y="328" width="269.0" height="24" rx="12" fill="#1f9d63"/><text x="480.0" y="340.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ hydrophobic patch binds neighbor</text><rect x="46.4" y="368" width="187.1" height="24" rx="12" fill="#d6453d"/><text x="140.0" y="380.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Fe²⁺ oxidized to Fe³⁺</text><rect x="386.4" y="368" width="187.1" height="24" rx="12" fill="#d6453d"/><text x="480.0" y="380.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ α₂β₂ assembly blocked</text></svg>
