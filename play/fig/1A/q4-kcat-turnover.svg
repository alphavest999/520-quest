<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Turnover number: catalytic cycles per active site per second</text><circle cx="140" cy="140" r="50" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="140.0" y="140.0" font-size="18" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E</text><circle cx="340" cy="140" r="50" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="340.0" y="140.0" font-size="18" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ES</text><circle cx="540" cy="140" r="50" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="540.0" y="140.0" font-size="16" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E + P</text><path d="M192,130 L288,130" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="240.0" y="120.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">+ S (binding)</text><path d="M392,130 L488,130" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="440.0" y="120.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">kcat (catalysis)</text><path d="M520,192 Q340.0,242.0 160,192" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="256.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">site is free again</text><text x="340.0" y="290.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">kcat = Vmax / [E]T  (units s⁻¹)</text><text x="340.0" y="314.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">e.g. kcat = 100 s⁻¹: each active site makes 100 product molecules per second at saturation</text><rect x="96.3" y="340" width="157.4" height="24" rx="12" fill="#d6453d"/><text x="175.0" y="352.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Km: [S] at Vmax/2</text><rect x="418.9" y="340" width="172.2" height="24" rx="12" fill="#d6453d"/><text x="505.0" y="352.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ [E]T: enzyme amount</text><rect x="81.4" y="376" width="187.1" height="24" rx="12" fill="#d6453d"/><text x="175.0" y="388.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Ki: inhibitor binding</text><rect x="426.3" y="376" width="157.4" height="24" rx="12" fill="#1f9d63"/><text x="505.0" y="388.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ kcat: turnovers/s</text></svg>
