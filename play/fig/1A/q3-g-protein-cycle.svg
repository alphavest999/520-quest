<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The G-protein cycle</text><rect x="20" y="50" width="280" height="105" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="160.0" y="86.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1. Inactive</text><text x="160.0" y="102.5" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gα·GDP bound to Gβγ</text><text x="160.0" y="118.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">receptor empty</text><rect x="390" y="50" width="280" height="105" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="530.0" y="86.2" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2. Ligand binds receptor</text><text x="530.0" y="102.5" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">receptor acts as GEF:</text><text x="530.0" y="118.8" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">GDP leaves, GTP enters Gα</text><rect x="390" y="215" width="280" height="105" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="530.0" y="251.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3. Active</text><text x="530.0" y="267.5" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gα·GTP leaves Gβγ</text><text x="530.0" y="283.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">and regulates an effector</text><rect x="20" y="215" width="280" height="105" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="160.0" y="251.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">4. Off switch</text><text x="160.0" y="267.5" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gα&#x27;s own GTPase:</text><text x="160.0" y="283.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">GTP → GDP + Pi</text><path d="M300,102.5 L390,102.5" fill="none" stroke="#1f9d63" stroke-width="3" marker-end="url(#ah)"/><text x="345.0" y="92.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ligand</text><path d="M530.0,155 L530.0,215" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M390,267.5 L300,267.5" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M160.0,215 L160.0,155" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="340" width="650" height="46" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="345.0" y="363.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gα has GTPase activity; the receptor never hydrolyzes GTP and is not a kinase for the G protein.</text><rect x="47.1" y="400.5" width="165.7" height="23.0" rx="11.5" fill="#1f9d63"/><text x="130.0" y="412.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ GEF: swap GDP → GTP</text><rect x="247.1" y="400.5" width="115.8" height="23.0" rx="11.5" fill="#d6453d"/><text x="305.0" y="412.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ not a kinase</text><rect x="372.8" y="400.5" width="144.3" height="23.0" rx="11.5" fill="#d6453d"/><text x="445.0" y="412.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ GTPase = Gα, off</text><rect x="540.7" y="400.5" width="108.7" height="23.0" rx="11.5" fill="#d6453d"/><text x="595.0" y="412.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ no cleavage</text></svg>
