<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Leukocytes leave the blood in steps</text><text x="345.0" y="50.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">blood flow →</text><rect x="10" y="220" width="670" height="34" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><polyline points="10,220 10,254" fill="none" stroke="#d6453d" stroke-width="1.2"/><polyline points="106,220 106,254" fill="none" stroke="#d6453d" stroke-width="1.2"/><polyline points="202,220 202,254" fill="none" stroke="#d6453d" stroke-width="1.2"/><polyline points="298,220 298,254" fill="none" stroke="#d6453d" stroke-width="1.2"/><polyline points="394,220 394,254" fill="none" stroke="#d6453d" stroke-width="1.2"/><polyline points="490,220 490,254" fill="none" stroke="#d6453d" stroke-width="1.2"/><polyline points="586,220 586,254" fill="none" stroke="#d6453d" stroke-width="1.2"/><text x="250.0" y="270.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">endothelium (vessel wall)</text><text x="470.0" y="300.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">tissue</text><text x="95.0" y="80.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">1. Rolling</text><text x="95.0" y="100.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">selectins ↔</text><text x="95.0" y="115.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">sugar ligands</text><text x="265.0" y="80.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2. Activation</text><text x="265.0" y="100.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">chemokines turn</text><text x="265.0" y="115.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">on integrins</text><text x="430.0" y="80.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3. Firm arrest</text><text x="430.0" y="100.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">integrins ↔</text><text x="430.0" y="115.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ICAM-1</text><text x="590.0" y="80.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">4. Transmigration</text><text x="590.0" y="100.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">squeezes between</text><text x="590.0" y="115.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">endothelial cells</text><circle cx="95" cy="175" r="36" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="95.0" y="175.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">WBC</text><polyline points="77,207 77,220" fill="none" stroke="#138f9a" stroke-width="3"/><polyline points="95,207 95,220" fill="none" stroke="#138f9a" stroke-width="3"/><polyline points="113,207 113,220" fill="none" stroke="#138f9a" stroke-width="3"/><path d="M140,150 Q157.5,142.0 175,150" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><circle cx="265" cy="180" r="36" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="265.0" y="180.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">WBC</text><circle cx="245" cy="214" r="4" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="285" cy="214" r="4" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><ellipse cx="430" cy="198" rx="52" ry="22" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="430.0" y="198.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">WBC</text><polyline points="400,216 400,222" fill="none" stroke="#7a4cd9" stroke-width="4"/><polyline points="420,216 420,222" fill="none" stroke="#7a4cd9" stroke-width="4"/><polyline points="440,216 440,222" fill="none" stroke="#7a4cd9" stroke-width="4"/><polyline points="460,216 460,222" fill="none" stroke="#7a4cd9" stroke-width="4"/><ellipse cx="590" cy="250" rx="22" ry="44" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="590.0" y="250.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">WBC</text><rect x="20" y="320" width="650" height="46" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="345.0" y="335.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Selectins (E- and P-selectin on endothelium, L-selectin on leukocytes) are lectins: they bind</text><text x="345.0" y="350.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">sialylated carbohydrates such as sialyl-Lewis X. Weak, fast-breaking bonds make the cell roll.</text><rect x="25.7" y="380.5" width="158.6" height="23.0" rx="11.5" fill="#1f9d63"/><text x="105.0" y="392.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ selectins: rolling</text><rect x="209.3" y="380.5" width="151.5" height="23.0" rx="11.5" fill="#d6453d"/><text x="285.0" y="392.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ integrins: arrest</text><rect x="397.8" y="380.5" width="94.4" height="23.0" rx="11.5" fill="#d6453d"/><text x="445.0" y="392.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ cadherins</text><rect x="532.8" y="380.5" width="94.4" height="23.0" rx="11.5" fill="#d6453d"/><text x="580.0" y="392.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ collagens</text></svg>
