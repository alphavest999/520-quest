<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cys₂His₂ zinc finger: Zn²⁺ holds a tiny fold together</text><polygon points="70,129 212,129 212,122 230,140 212,158 212,151 70,151" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><polygon points="230,239 88,239 88,232 70,250 88,268 88,261 230,261" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><path d="M230,140 C275,145 275,245 230,250" fill="none" stroke="#1f2430" stroke-width="2.5"/><text x="150.0" y="112.0" font-size="13" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">β-hairpin</text><rect x="450" y="100" width="46" height="190" rx="23" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><text x="520.0" y="195.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">α-helix</text><path d="M70,250 C20,262 30,320 120,318 L400,318 C470,318 473,300 473,290" fill="none" stroke="#1f2430" stroke-width="2.5"/><polyline points="225,162 350,195" fill="none" stroke="#d98a00" stroke-width="2.5" stroke-dasharray="6 4"/><polyline points="225,228 350,195" fill="none" stroke="#d98a00" stroke-width="2.5" stroke-dasharray="6 4"/><polyline points="452,150 350,195" fill="none" stroke="#7a4cd9" stroke-width="2.5" stroke-dasharray="6 4"/><polyline points="452,240 350,195" fill="none" stroke="#7a4cd9" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="225" cy="162" r="17" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="225.0" y="162.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cys</text><circle cx="225" cy="228" r="17" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="225.0" y="228.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cys</text><circle cx="452" cy="150" r="17" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="452.0" y="150.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">His</text><circle cx="452" cy="240" r="17" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="452.0" y="240.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">His</text><circle cx="350" cy="195" r="24" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="350.0" y="195.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Zn²⁺</text><text x="350.0" y="262.0" font-size="12" font-weight="600" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">4 ligands, tetrahedral</text><text x="350.0" y="278.0" font-size="12" font-weight="400" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">(2 Cys S, 2 His N)</text><text x="600.0" y="90.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">~30 residues:</text><text x="600.0" y="108.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">too small for a</text><text x="600.0" y="124.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">real hydrophobic</text><text x="600.0" y="140.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">core; Zn²⁺ acts</text><text x="600.0" y="156.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">as the core</text><rect x="15" y="332" width="650" height="60" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><rect x="16.6" y="338" width="216.9" height="24" rx="12" fill="#1f9d63"/><text x="125.0" y="350.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ structural, not catalytic</text><rect x="242.7" y="338" width="194.6" height="24" rx="12" fill="#d6453d"/><text x="340.0" y="350.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ Zn makes peptide bonds</text><rect x="462.6" y="338" width="164.8" height="24" rx="12" fill="#d6453d"/><text x="545.0" y="350.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ S–S between metals</text><text x="340.0" y="378.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Consensus: X₂–Cys–X₂₋₄–Cys–X₁₂–His–X₃₋₅–His. Remove Zn²⁺ (EDTA) and the finger unfolds.</text></svg>
