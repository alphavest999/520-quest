<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Backbone torsion angles: φ, ψ and ω</text><polyline points="70.0,154.0 132.35382907247958,226.0" fill="none" stroke="#1f9d63" stroke-width="5"/><text x="125.2" y="169.2" font-size="20" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">φ</text><polyline points="132.35382907247958,226.0 194.70765814495917,154.0" fill="none" stroke="#1f9d63" stroke-width="5"/><text x="187.5" y="210.8" font-size="20" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">ψ</text><polyline points="194.70765814495917,154.0 257.06148721743875,226.0" fill="none" stroke="#d6453d" stroke-width="3"/><text x="249.9" y="169.2" font-size="20" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">ω</text><polyline points="257.06148721743875,226.0 319.41531628991834,154.0" fill="none" stroke="#1f9d63" stroke-width="5"/><text x="312.2" y="210.8" font-size="20" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">φ</text><polyline points="319.41531628991834,154.0 381.7691453623979,226.0" fill="none" stroke="#1f9d63" stroke-width="5"/><text x="374.6" y="169.2" font-size="20" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">ψ</text><polyline points="132.35382907247958,226.0 132.35382907247958,276.0" fill="none" stroke="#7a4cd9" stroke-width="2.4"/><text x="142.4" y="254.0" font-size="18" font-weight="700" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">χ</text><circle cx="132.35382907247958" cy="290.0" r="14" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="132.4" y="290.0" font-size="14" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">R</text><polyline points="191.70765814495917,154.0 191.70765814495917,104.0" fill="none" stroke="#1f2430" stroke-width="2.4"/><polyline points="197.70765814495917,154.0 197.70765814495917,104.0" fill="none" stroke="#1f2430" stroke-width="2.4"/><circle cx="194.70765814495917" cy="90.0" r="13" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="194.7" y="90.0" font-size="15" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">O</text><polyline points="319.41531628991834,154.0 319.41531628991834,104.0" fill="none" stroke="#7a4cd9" stroke-width="2.4"/><text x="329.4" y="126.0" font-size="18" font-weight="700" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">χ</text><circle cx="319.41531628991834" cy="90.0" r="14" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="319.4" y="90.0" font-size="14" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">R</text><polyline points="378.7691453623979,226.0 378.7691453623979,276.0" fill="none" stroke="#1f2430" stroke-width="2.4"/><polyline points="384.7691453623979,226.0 384.7691453623979,276.0" fill="none" stroke="#1f2430" stroke-width="2.4"/><circle cx="381.7691453623979" cy="290.0" r="13" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="381.8" y="290.0" font-size="15" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">O</text><circle cx="70.0" cy="154.0" r="17" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="70.0" y="154.0" font-size="15" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">N</text><circle cx="132.35382907247958" cy="226.0" r="17" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="132.4" y="226.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cα</text><circle cx="194.70765814495917" cy="154.0" r="17" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="194.7" y="154.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><circle cx="257.06148721743875" cy="226.0" r="17" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="257.1" y="226.0" font-size="15" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">N</text><circle cx="319.41531628991834" cy="154.0" r="17" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="319.4" y="154.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cα</text><circle cx="381.7691453623979" cy="226.0" r="17" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="381.8" y="226.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><text x="32.0" y="154.0" font-size="18" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">…</text><text x="419.8" y="226.0" font-size="18" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">…</text><text x="490.0" y="135.0" font-size="13.5" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">φ: N–Cα bond, rotates</text><text x="490.0" y="160.0" font-size="13.5" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">ψ: Cα–C bond, rotates</text><text x="490.0" y="185.0" font-size="13.5" font-weight="600" fill="#d6453d" text-anchor="start" dominant-baseline="middle">ω: peptide C–N, fixed</text><text x="490.0" y="210.0" font-size="13.5" font-weight="600" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">χ: side-chain bonds</text><rect x="30" y="318" width="620" height="48" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="340.0" y="333.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Each residue contributes one φ and one ψ. The peptide bond (ω) is planar, C=O cannot rotate,</text><text x="340.0" y="350.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">and disulfides are side-chain links, so φ and ψ alone set the backbone fold.</text></svg>
