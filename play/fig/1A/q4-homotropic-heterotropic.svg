<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Homotropic vs heterotropic allosteric effects</text><rect x="10" y="45" width="325" height="255" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><rect x="345" y="45" width="325" height="255" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="172.0" y="68.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Homotropic: effector = the substrate</text><text x="507.0" y="68.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Heterotropic: effector ≠ substrate</text><rect x="40" y="110" width="110" height="90" rx="14" fill="#fff" stroke="#1f2430" stroke-width="1.8"/><rect x="150" y="110" width="110" height="90" rx="40" fill="#fff" stroke="#1f2430" stroke-width="1.8"/><circle cx="95" cy="130" r="12" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="95.0" y="130.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">S</text><text x="95.0" y="162.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">site 1</text><text x="95.0" y="177.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">substrate bound</text><path d="M205,118 a14,14 0 1,0 0.1,0" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="4 3"/><text x="205.0" y="162.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">site 2</text><text x="205.0" y="177.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">affinity ↑</text><path d="M110,130 L188,130" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><text x="172.0" y="230.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">S binding at one active site raises</text><text x="172.0" y="248.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">affinity of the other active sites</text><text x="172.0" y="274.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">example: O₂ binding to hemoglobin</text><rect x="385" y="110" width="245" height="90" rx="20" fill="#fff" stroke="#1f2430" stroke-width="1.8"/><circle cx="445" cy="130" r="12" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="445.0" y="130.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">S</text><text x="445.0" y="170.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">active site</text><polygon points="560,118 578,140 542,140" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.8"/><text x="570.0" y="162.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">regulatory site</text><text x="570.0" y="177.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(different molecule)</text><path d="M545,132 L462,132" fill="none" stroke="#7a4cd9" stroke-width="1.8" marker-end="url(#ah)"/><text x="507.0" y="230.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">a different molecule binds elsewhere</text><text x="507.0" y="248.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">and changes substrate binding</text><text x="507.0" y="274.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">examples: 2,3-BPG on Hb; ATP, AMP on PFK-1</text><rect x="67.1" y="317.5" width="209.8" height="25.0" rx="12.5" fill="#1f9d63"/><text x="172.0" y="330.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ homotropic (asked here)</text><rect x="444.8" y="317.5" width="124.5" height="25.0" rx="12.5" fill="#d6453d"/><text x="507.0" y="330.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ heterotropic</text></svg>
