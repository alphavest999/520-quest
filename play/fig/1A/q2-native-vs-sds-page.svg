<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Native PAGE vs SDS-PAGE</text><rect x="40" y="70" width="150" height="230" rx="6" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="115.0" y="46.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Native PAGE</text><text x="115.0" y="62.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">folded; illustrative positions</text><rect x="52" y="76" width="36" height="8" fill="#fff" stroke="#5b6474"/><text x="70.0" y="316.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><rect x="97" y="76" width="36" height="8" fill="#fff" stroke="#5b6474"/><text x="115.0" y="316.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><rect x="142" y="76" width="36" height="8" fill="#fff" stroke="#5b6474"/><text x="160.0" y="316.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><rect x="230" y="70" width="150" height="230" rx="6" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="305.0" y="46.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SDS-PAGE</text><text x="305.0" y="62.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">unfolded, uniform charge/mass</text><rect x="242" y="76" width="36" height="8" fill="#fff" stroke="#5b6474"/><text x="260.0" y="316.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><rect x="287" y="76" width="36" height="8" fill="#fff" stroke="#5b6474"/><text x="305.0" y="316.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><rect x="332" y="76" width="36" height="8" fill="#fff" stroke="#5b6474"/><text x="350.0" y="316.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><rect x="52" y="247" width="36" height="7" rx="2" fill="#7a4cd9"/><rect x="242" y="157.3" width="36" height="7" rx="2" fill="#7a4cd9"/><rect x="97" y="122" width="36" height="7" rx="2" fill="#138f9a"/><rect x="287" y="192.0" width="36" height="7" rx="2" fill="#138f9a"/><rect x="142" y="182" width="36" height="7" rx="2" fill="#d98a00"/><rect x="332" y="192.0" width="36" height="7" rx="2" fill="#d98a00"/><text x="32.0" y="290.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">+</text><text x="32.0" y="82.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">−</text><text x="400.0" y="92.5" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">A: 60 kDa monomer,</text><text x="400.0" y="107.5" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">compact, very negative</text><text x="400.0" y="132.5" font-size="12" font-weight="400" fill="#138f9a" text-anchor="start" dominant-baseline="middle">B: dimer of 30 kDa chains,</text><text x="400.0" y="147.5" font-size="12" font-weight="400" fill="#138f9a" text-anchor="start" dominant-baseline="middle">60 kDa native, weakly charged</text><text x="400.0" y="172.5" font-size="12" font-weight="400" fill="#d98a00" text-anchor="start" dominant-baseline="middle">C: 30 kDa monomer,</text><text x="400.0" y="187.5" font-size="12" font-weight="400" fill="#d98a00" text-anchor="start" dominant-baseline="middle">elongated, moderately charged</text><text x="400.0" y="222.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Native: position depends on charge,</text><text x="400.0" y="240.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">size and shape (A runs farthest).</text><text x="400.0" y="266.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">SDS: chains only, by mass</text><text x="400.0" y="284.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">(B and C both run at 30 kDa).</text><rect x="15" y="334" width="650" height="46" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><rect x="26.7" y="345" width="246.6" height="24" rx="12" fill="#1f9d63"/><text x="150.0" y="357.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ native: size + charge + shape</text><rect x="315.0" y="345" width="149.9" height="24" rx="12" fill="#d6453d"/><text x="390.0" y="357.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ mass alone = SDS</text><rect x="502.5" y="345" width="135.0" height="24" rx="12" fill="#d6453d"/><text x="570.0" y="357.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ pI alone = IEF</text></svg>
