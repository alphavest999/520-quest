<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Turnover number: divide Vmax by the active-site concentration</text><rect x="20" y="55" width="200" height="90" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="120.0" y="82.5" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Vmax</text><text x="120.0" y="100.0" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 × 10⁻⁴ M/s</text><text x="120.0" y="117.5" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(all sites, saturated)</text><text x="240.0" y="100.0" font-size="30" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">÷</text><rect x="260" y="55" width="200" height="90" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="360.0" y="82.5" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">[E]T</text><text x="360.0" y="100.0" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 × 10⁻⁸ M</text><text x="360.0" y="117.5" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(active sites)</text><text x="480.0" y="100.0" font-size="30" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">=</text><rect x="500" y="55" width="160" height="90" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="580.0" y="90.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">kcat</text><text x="580.0" y="110.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">10⁴ s⁻¹</text><text x="340.0" y="172.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Numbers: 2/2 = 1.   Exponents: 10⁻⁴ ÷ 10⁻⁸ = 10⁻⁴⁻⁽⁻⁸⁾ = 10⁴.   Units: (M/s) ÷ M = s⁻¹</text><text x="340.0" y="195.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Each active site converts 10,000 substrate molecules to product every second.</text><rect x="38.0" y="227" width="273.9" height="26" rx="13" fill="#d6453d"/><text x="175.0" y="240.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 10⁻⁴ s⁻¹: divided [E]T by Vmax</text><rect x="367.1" y="227" width="265.9" height="26" rx="13" fill="#d6453d"/><text x="500.0" y="240.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 4 × 10⁻¹²: multiplied instead</text><rect x="34.0" y="277" width="282.0" height="26" rx="13" fill="#d6453d"/><text x="175.0" y="290.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 10¹²: exponent subtraction slip</text><rect x="399.3" y="277" width="201.4" height="26" rx="13" fill="#1f9d63"/><text x="500.0" y="290.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ 10⁴ s⁻¹ = Vmax / [E]T</text><text x="340.0" y="336.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Check the units: a rate constant for one site must come out in s⁻¹.</text></svg>
