" y="108.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">50 kDa</text><text x="570.0" y="108.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">50 kDa</text><text x="20.0" y="164.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Noncovalent trimer, 3 × 50 kDa</text><rect x="290" y="142" width="80" height="44" rx="5" fill="#e6eefc" stroke="#2f6fdb"/><rect x="300" y="149.9" width="26" height="5" rx="2" fill="#1f2430"/><text x="348.0" y="152.4" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">150</text><rect x="410" y="142" width="80" height="44" rx="5" fill="#e6eefc" stroke="#2f6fdb"/><rect x="420" y="174.5" width="26" height="5" rx="2" fill="#1f2430"/><text x="468.0" y="177.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">50</text><rect x="530" y="142" width="80" height="44" rx="5" fill="#e6eefc" stroke="#2f6fdb"/><rect x="540" y="174.5" width="26" height="5" rx="2" fill="#1f2430"/><text x="588.0" y="177.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">50</text><circle cx="645" cy="164" r="12" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="645.0" y="164.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓</text><text x="20.0" y="220.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Disulfide-linked trimer, 3 × 50</text><rect x="290" y="198" width="80" height="44" rx="5" fill="#e6eefc" stroke="#2f6fdb"/><rect x="300" y="205.9" width="26" height="5" rx="2" fill="#1f2430"/><text x="348.0" y="208.4" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">150</text><rect x="410" y="198" width="80" height="44" rx="5" fill="#e6eefc" stroke="