<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Proteolytic cleavage changes primary structure</text><text x="30.0" y="70.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Proinsulin: one chain of 86 residues</text><rect x="30" y="90" width="198.0" height="34" rx="6" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="129.0" y="107.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B chain (30)</text><rect x="228.0" y="90" width="13.2" height="34" rx="6" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><rect x="241.2" y="90" width="204.6" height="34" rx="6" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="343.5" y="107.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C-peptide (31)</text><rect x="445.8" y="90" width="13.2" height="34" rx="6" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><rect x="459.0" y="90" width="138.6" height="34" rx="6" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="528.3" y="107.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A chain (21)</text><polyline points="234.6,80 234.6,134" fill="none" stroke="#d6453d" stroke-width="2.5"/><text x="234.6" y="146.0" font-size="15" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">✂</text><polyline points="452.4,80 452.4,134" fill="none" stroke="#d6453d" stroke-width="2.5"/><text x="452.4" y="146.0" font-size="15" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">✂</text><text x="340.0" y="168.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Prohormone convertases cut peptide bonds after the dibasic sites (orange: Arg-Arg, Lys-Arg)</text><path d="M340,180 L340,215" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="445.0" y="197.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">hydrolysis of peptide bonds</text><text x="30.0" y="236.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Insulin: two chains, 51 residues</text><rect x="60" y="250" width="198.0" height="30" rx="6" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="159.0" y="265.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B chain (30)</text><rect x="60" y="300" width="138.6" height="30" rx="6" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="129.3" y="315.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A chain (21)</text><polyline points="106.19999999999999,280 106.19999999999999,300" fill="none" stroke="#d98a00" stroke-width="3"/><polyline points="188.7,280 188.7,300" fill="none" stroke="#d98a00" stroke-width="3"/><text x="330.0" y="290.0" font-size="12" font-weight="400" fill="#d98a00" text-anchor="start" dominant-baseline="middle">S–S bonds (formed earlier in the ER) hold A and B together</text><rect x="395" y="245" width="120" height="30" rx="6" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="455.0" y="260.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C-peptide</text><text x="525.0" y="260.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">released</text><rect x="41.6" y="344" width="216.9" height="24" rx="12" fill="#1f9d63"/><text x="150.0" y="356.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ primary structure changed</text><text x="450.0" y="350.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Heat, urea and pH change only the fold;</text><text x="450.0" y="366.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">the covalent sequence stays the same.</text></svg>
