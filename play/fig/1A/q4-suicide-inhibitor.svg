<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Mechanism-based (suicide) inactivation</text><rect x="10" y="60" width="120" height="82" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="70.0" y="93.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Inhibitor looks</text><text x="70.0" y="108.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">like substrate</text><path d="M131,101 L144,101" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="145" y="60" width="120" height="82" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="205.0" y="93.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Binds the</text><text x="205.0" y="108.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">active site</text><path d="M266,101 L279,101" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="280" y="60" width="120" height="82" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="340.0" y="93.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Enzyme starts its</text><text x="340.0" y="108.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">normal catalysis</text><path d="M401,101 L414,101" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="415" y="60" width="120" height="82" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="475.0" y="93.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Reactive group</text><text x="475.0" y="108.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">unmasked</text><path d="M536,101 L549,101" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="550" y="60" width="120" height="82" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="610.0" y="85.4" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Covalent bond to</text><text x="610.0" y="101.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">active site: enzyme</text><text x="610.0" y="116.6" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">dead for good</text><text x="340.0" y="170.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The enzyme&#x27;s own mechanism creates the weapon, so the inhibitor is highly specific.</text><rect x="20" y="195" width="640" height="105" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="215.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Examples</text><text x="340.0" y="240.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Eflornithine (DFMO) → ornithine decarboxylase (sleeping sickness)</text><text x="340.0" y="262.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Clavulanic acid → bacterial β-lactamase (given with amoxicillin)</text><text x="340.0" y="284.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">5-Fluorouracil (as FdUMP) → thymidylate synthase (cancer chemotherapy)</text><rect x="77.7" y="323" width="194.6" height="24" rx="12" fill="#d6453d"/><text x="175.0" y="335.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ allosteric: reversible</text><rect x="396.6" y="323" width="216.9" height="24" rx="12" fill="#d6453d"/><text x="505.0" y="335.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ competitive: displaceable</text><rect x="77.7" y="360" width="194.6" height="24" rx="12" fill="#d6453d"/><text x="175.0" y="372.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ heat: not an inhibitor</text><rect x="463.5" y="360" width="83.0" height="24" rx="12" fill="#1f9d63"/><text x="505.0" y="372.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ suicide</text></svg>
