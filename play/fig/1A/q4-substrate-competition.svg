<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Two substrates competing for one enzyme</text><rect x="20" y="55" width="300" height="110" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="170.0" y="92.5" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Substrate A</text><text x="170.0" y="110.0" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">kcat/Km = 10⁶ M⁻¹s⁻¹</text><text x="170.0" y="127.5" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">[A] low</text><rect x="360" y="55" width="300" height="110" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="510.0" y="92.5" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Substrate B</text><text x="510.0" y="110.0" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">kcat/Km = 10⁴ M⁻¹s⁻¹</text><text x="510.0" y="127.5" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">[B] = [A]</text><text x="340.0" y="200.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">At low [S], each rate is v = (kcat/Km)·[E]·[S] with the SAME free [E]</text><text x="340.0" y="235.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">vA / vB = (10⁶ × [A]) / (10⁴ × [B]) = 10⁶⁻⁴ = 10² = 100</text><rect x="127.9" y="276" width="94.1" height="28" rx="14" fill="#1f9d63"/><text x="175.0" y="290.5" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ 100 : 1</text><rect x="407.7" y="278" width="194.6" height="24" rx="12" fill="#d6453d"/><text x="505.0" y="290.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 1 : 1: ignores kcat/Km</text><rect x="66.6" y="318" width="216.9" height="24" rx="12" fill="#d6453d"/><text x="175.0" y="330.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 2 : 1: compared exponents</text><rect x="407.7" y="318" width="194.6" height="24" rx="12" fill="#d6453d"/><text x="505.0" y="330.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 10⁴ : 1: exponent slip</text><text x="340.0" y="365.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">kcat/Km is the specificity constant: it decides which substrate an enzyme prefers.</text></svg>
