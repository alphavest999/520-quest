<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Proximity and orientation: paying the entropy cost</text><rect x="15" y="45" width="320" height="225" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="175.0" y="65.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">In solution</text><circle cx="60" cy="110" r="13" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="60.0" y="110.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><polyline points="61.138152652901205,97.04991858949552 62.10120489766377,86.0921573959917" fill="none" stroke="#d6453d" stroke-width="4"/><circle cx="150" cy="105" r="13" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="150.0" y="105.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><polyline points="160.36314519572022,97.15110060884835 169.13196036132965,90.50972420095079" fill="none" stroke="#d6453d" stroke-width="4"/><circle cx="250" cy="115" r="13" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="250.0" y="115.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><polyline points="239.67523337857614,107.10068394016726 230.93889239121748,100.41664727415494" fill="none" stroke="#d6453d" stroke-width="4"/><circle cx="95" cy="175" r="13" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="95.0" y="175.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><polyline points="102.308957105523,164.2492257939428 108.49345927173479,155.15241685035596" fill="none" stroke="#d6453d" stroke-width="4"/><circle cx="200" cy="165" r="13" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="200.0" y="165.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><polyline points="211.88112117891518,159.7237362147128 221.93437756107417,155.2592053194698" fill="none" stroke="#d6453d" stroke-width="4"/><circle cx="290" cy="185" r="13" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="290.0" y="185.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><polyline points="279.4069194491539,177.4643086287132 270.443543598438,171.08795439147053" fill="none" stroke="#d6453d" stroke-width="4"/><circle cx="55" cy="235" r="13" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="55.0" y="235.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><polyline points="66.31057899369486,241.40865062453778 75.88106891143666,246.8313549991467" fill="none" stroke="#d6453d" stroke-width="4"/><circle cx="150" cy="240" r="13" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="150.0" y="240.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><polyline points="154.05234496279408,252.35226701065505 157.48125223900448,262.8041852504401" fill="none" stroke="#d6453d" stroke-width="4"/><circle cx="240" cy="230" r="13" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="240.0" y="230.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><polyline points="241.23663008987967,242.941048876378 242.28300939670095,253.89116715639014" fill="none" stroke="#d6453d" stroke-width="4"/><circle cx="300" cy="120" r="13" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="300.0" y="120.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><polyline points="302.2810756890197,107.20169176410556 304.2112166566517,96.37235402604104" fill="none" stroke="#d6453d" stroke-width="4"/><text x="175.0" y="290.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">rare collisions, mostly in the wrong pose</text><rect x="355" y="45" width="320" height="225" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="515.0" y="65.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">In the active site</text><path d="M 385 250 L 385 120 L 455 120 L 470 175 L 560 175 L 575 120 L 645 120 L 645 250 Z" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><circle cx="493" cy="150" r="15" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="493.0" y="150.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><polyline points="508,150 518,150" fill="none" stroke="#d6453d" stroke-width="4"/><circle cx="537" cy="150" r="15" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="537.0" y="150.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><polyline points="522,150 521,150" fill="none" stroke="#d6453d" stroke-width="4"/><text x="515.0" y="215.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">enzyme</text><text x="515.0" y="290.0" font-size="12.5" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">held side by side, reactive groups aligned</text><rect x="15" y="303" width="660" height="72" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="345.0" y="323.4" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ΔG‡ = ΔH‡ − TΔS‡. Bringing two free molecules together in one pose costs a lot of entropy.</text><text x="345.0" y="339.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Binding energy pays that cost up front, so the catalyzed step has a smaller entropy penalty</text><text x="345.0" y="354.6" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">and a much higher effective concentration of reactants. ΔG of the overall reaction is unchanged.</text><rect x="60.7" y="385.5" width="158.6" height="23.0" rx="11.5" fill="#1f9d63"/><text x="140.0" y="397.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ lower entropy cost</text><rect x="242.1" y="385.5" width="115.8" height="23.0" rx="11.5" fill="#d6453d"/><text x="300.0" y="397.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ ΔG unchanged</text><rect x="375.8" y="385.5" width="144.3" height="23.0" rx="11.5" fill="#d6453d"/><text x="448.0" y="397.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ no heat supplied</text><rect x="535.0" y="385.5" width="130.1" height="23.0" rx="11.5" fill="#d6453d"/><text x="600.0" y="397.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ products leave</text><text x="345.0" y="428.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Red bars = reactive groups that must meet in the right orientation.</text></svg>
