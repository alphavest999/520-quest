<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">When does Km approximate Kd?</text><text x="170.0" y="75.0" font-size="18" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E + S</text><path d="M205,68 L300,68" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M300,82 L205,82" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="252.0" y="54.0" font-size="14" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">k₁</text><text x="252.0" y="98.0" font-size="14" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">k₋₁</text><text x="335.0" y="75.0" font-size="18" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ES</text><path d="M360,75 L450,75" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="405.0" y="60.0" font-size="14" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">kcat</text><text x="495.0" y="75.0" font-size="18" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E + P</text><text x="200.0" y="132.0" font-size="16" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Km = (k₋₁ + kcat) / k₁</text><text x="480.0" y="132.0" font-size="16" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Kd = k₋₁ / k₁</text><text x="340.0" y="157.0" font-size="13.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Km = Kd + kcat/k₁, so Km ≥ Kd always</text><rect x="20" y="185" width="310" height="150" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><rect x="350" y="185" width="310" height="150" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="175.0" y="207.0" font-size="15" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">kcat ≪ k₋₁</text><text x="505.0" y="207.0" font-size="15" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">kcat ≫ k₋₁</text><text x="175.0" y="237.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">k₁ = 10⁷ M⁻¹s⁻¹, k₋₁ = 100 s⁻¹, kcat = 1 s⁻¹</text><text x="175.0" y="262.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Kd = 1.0 × 10⁻⁵ M</text><text x="175.0" y="284.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Km = 101/10⁷ = 1.01 × 10⁻⁵ M</text><text x="175.0" y="304.2" font-size="12.5" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">ES falls apart before it reacts:</text><text x="175.0" y="319.8" font-size="12.5" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Km ≈ Kd (true affinity)</text><text x="505.0" y="237.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">k₁ = 10⁷ M⁻¹s⁻¹, k₋₁ = 100 s⁻¹, kcat = 1000 s⁻¹</text><text x="505.0" y="262.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Kd = 1.0 × 10⁻⁵ M</text><text x="505.0" y="284.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Km = 1100/10⁷ = 1.1 × 10⁻⁴ M</text><text x="505.0" y="304.2" font-size="12.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">ES mostly reacts: Km is 11 × Kd</text><text x="505.0" y="319.8" font-size="12.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">and understates affinity</text><text x="340.0" y="368.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Rule: Km is a good stand-in for Kd only when catalysis is slow compared with substrate release.</text></svg>
