<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 450" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Pancreatic zymogens are activated only in the duodenum</text><rect x="10" y="45" width="190" height="300" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="105.0" y="66.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Pancreas (acinar cells)</text><rect x="25" y="85" width="160" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="105.0" y="104.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">trypsinogen</text><rect x="25" y="135" width="160" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="105.0" y="154.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">chymotrypsinogen</text><rect x="25" y="185" width="160" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="105.0" y="204.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">proelastase</text><rect x="25" y="235" width="160" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="105.0" y="254.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">procarboxypeptidase</text><text x="105.0" y="300.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">all inactive: the gland</text><text x="105.0" y="318.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">does not digest itself</text><path d="M200,195 L238,195" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="219.0" y="185.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">duct</text><rect x="240" y="45" width="440" height="300" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="460.0" y="66.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Duodenum (lumen)</text><rect x="255" y="85" width="150" height="46" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="330.0" y="100.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">enteropeptidase</text><text x="330.0" y="115.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(brush border)</text><rect x="255" y="175" width="150" height="40" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="330.0" y="195.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">trypsinogen</text><path d="M330,131 L330,173" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="362.0" y="152.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">cleaves</text><rect x="445" y="175" width="120" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="505.0" y="195.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">TRYPSIN</text><path d="M405,195 L443,195" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M505,175 Q441.8,201.5 380,172" fill="none" stroke="#1f9d63" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="470.0" y="140.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">autoactivation</text><text x="608.0" y="255.0" font-size="13" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">chymotrypsin</text><path d="M505,215 L548,255" fill="none" stroke="#1f9d63" stroke-width="1.4" marker-end="url(#ah)"/><text x="608.0" y="285.0" font-size="13" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">elastase</text><path d="M505,215 L548,285" fill="none" stroke="#1f9d63" stroke-width="1.4" marker-end="url(#ah)"/><text x="608.0" y="315.0" font-size="13" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">carboxypeptidase</text><path d="M505,215 L548,315" fill="none" stroke="#1f9d63" stroke-width="1.4" marker-end="url(#ah)"/><text x="330.0" y="244.4" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">one enzyme step,</text><text x="330.0" y="260.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">then trypsin activates</text><text x="330.0" y="275.6" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">the rest (a cascade)</text><text x="345.0" y="370.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Activation = cutting specific peptide bonds (irreversible), not adding a cofactor or allosteric binding.</text><text x="345.0" y="392.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Contrast: pepsinogen in the stomach is activated by acid (HCl) and then by pepsin itself.</text><text x="345.0" y="420.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Pancreatic trypsin inhibitor adds a second safeguard against early trypsin activity in the gland.</text></svg>
