<text x="535.0" y="190.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C=N double, C–O⁻ single</text><rect x="30" y="215" width="620" height="74" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="340.0" y="238.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Real bond: in between. C–N ≈ 1.33 Å (single C–N ≈ 1.47 Å, double C=N ≈ 1.27 Å)</text><text x="340.0" y="264.0" font-size="13.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Partial double bond → no free rotation, six atoms locked in one plane</text><rect x="85.2" y="306" width="179.7" height="24" rx="12" fill="#d6453d"/><text x="175.0" y="318.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ full C=N double bond</text><rect x="381.7" y="306" width="246.6" height="24" rx="12" fill="#1f9d63"/><text x="505.0" y="318.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ partial double-bond character</text><rect x="62.8" y="340" width="224.3" height="24" rx="12" fill="#d6453d"/><text x="175.0" y="352.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ side chains block rotation</text><rect x="411.4" y="340" width="187.1" height="24" rx="12" fill="#d6453d"/><text x="505.0" y="352.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ water H-bonds lock it</text></svg>
