<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 460" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Vitamins become coenzymes</text><rect x="10" y="42" width="150" height="30" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="85.0" y="57.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Vitamin</text><rect x="165" y="42" width="220" height="30" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="275.0" y="57.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Coenzyme</text><rect x="390" y="42" width="290" height="30" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="535.0" y="57.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Used by</text><rect x="10" y="77" width="150" height="38" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="85.0" y="96.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">✗ B₁ thiamine</text><rect x="165" y="77" width="220" height="38" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="275.0" y="96.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">TPP (thiamine pyrophosphate)</text><rect x="390" y="77" width="290" height="38" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="535.0" y="96.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">pyruvate DH, α-KG DH, transketolase</text><rect x="10" y="119" width="150" height="38" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="85.0" y="138.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">✗ B₂ riboflavin</text><rect x="165" y="119" width="220" height="38" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="275.0" y="138.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">FAD, FMN</text><rect x="390" y="119" width="290" height="38" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="535.0" y="138.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">succinate DH, electron transfer</text><rect x="10" y="161" width="150" height="38" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="85.0" y="180.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">✓ B₃ niacin</text><rect x="165" y="161" width="220" height="38" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="275.0" y="180.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NAD⁺, NADP⁺</text><rect x="390" y="161" width="290" height="38" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="535.0" y="180.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">dehydrogenases (hydride carriers)</text><rect x="10" y="203" width="150" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="85.0" y="222.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B₅ pantothenate</text><rect x="165" y="203" width="220" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="275.0" y="222.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">coenzyme A</text><rect x="390" y="203" width="290" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="535.0" y="222.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">acyl-group carrier (acetyl-CoA)</text><rect x="10" y="245" width="150" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="85.0" y="264.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B₆ pyridoxine</text><rect x="165" y="245" width="220" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="275.0" y="264.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PLP (pyridoxal phosphate)</text><rect x="390" y="245" width="290" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="535.0" y="264.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">transaminases, decarboxylases</text><rect x="10" y="287" width="150" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="85.0" y="306.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B₇ biotin</text><rect x="165" y="287" width="220" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="275.0" y="306.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">biotin (bound to enzyme)</text><rect x="390" y="287" width="290" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="535.0" y="306.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">carboxylases (pyruvate carboxylase)</text><rect x="10" y="329" width="150" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="85.0" y="348.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B₉ folate</text><rect x="165" y="329" width="220" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="275.0" y="348.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">THF (tetrahydrofolate)</text><rect x="390" y="329" width="290" height="38" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="535.0" y="348.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">one-carbon transfers</text><rect x="10" y="371" width="150" height="38" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="85.0" y="390.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">✗ C ascorbate</text><rect x="165" y="371" width="220" height="38" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="275.0" y="390.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(used as itself)</text><rect x="390" y="371" width="290" height="38" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="535.0" y="390.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">keeps Fe²⁺ reduced in hydroxylases</text><text x="345.0" y="429.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">B vitamins are coenzyme precursors; vitamin C acts directly as a reducing agent.</text></svg>
