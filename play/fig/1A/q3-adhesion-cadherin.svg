<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cell adhesion molecules: who binds what</text><rect x="15" y="45" width="285" height="255" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><rect x="390" y="45" width="285" height="255" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="60.0" y="65.0" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Cell 1</text><text x="630.0" y="65.0" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Cell 2</text><rect x="15" y="345" width="660" height="40" rx="8" fill="#fdf1db" stroke="#d98a00"/><text x="525.0" y="365.0" font-size="12.5" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">extracellular matrix (fibronectin, collagen)</text><polyline points="130,355 175,375" fill="none" stroke="#d98a00" stroke-width="3"/><polyline points="200,355 245,375" fill="none" stroke="#d98a00" stroke-width="3"/><polyline points="270,355 315,375" fill="none" stroke="#d98a00" stroke-width="3"/><polyline points="340,355 385,375" fill="none" stroke="#d98a00" stroke-width="3"/><rect x="300" y="82" width="28" height="30" rx="5" fill="#f1f3f6" stroke="#5b6474" stroke-width="1.5"/><rect x="362" y="82" width="28" height="30" rx="5" fill="#f1f3f6" stroke="#5b6474" stroke-width="1.5"/><polyline points="300,97 390,97" fill="none" stroke="#5b6474" stroke-width="1.2" stroke-dasharray="6 4"/><text x="250.0" y="97.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">connexins</text><text x="440.0" y="97.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">gap junction pore</text><polyline points="300,150 343,150" fill="none" stroke="#1f9d63" stroke-width="6"/><polyline points="347,150 390,150" fill="none" stroke="#1f9d63" stroke-width="6"/><circle cx="315" cy="142" r="3.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="330" cy="142" r="3.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="360" cy="142" r="3.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="375" cy="142" r="3.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="300,172 343,172" fill="none" stroke="#1f9d63" stroke-width="6"/><polyline points="347,172 390,172" fill="none" stroke="#1f9d63" stroke-width="6"/><circle cx="315" cy="164" r="3.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="330" cy="164" r="3.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="360" cy="164" r="3.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="375" cy="164" r="3.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="300,161 240,161" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="390,161 450,161" fill="none" stroke="#d6453d" stroke-width="3"/><text x="235.0" y="150.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="end" dominant-baseline="middle">cadherins</text><text x="235.0" y="168.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">like-to-like, need Ca²⁺</text><text x="455.0" y="152.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="start" dominant-baseline="middle">linked to actin</text><text x="455.0" y="170.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">(adherens junction)</text><polyline points="300,235 335,235" fill="none" stroke="#138f9a" stroke-width="6"/><circle cx="342" cy="235" r="8" fill="#138f9a" stroke="#138f9a" stroke-width="1.5"/><polygon points="352,229 362,229 357,239" fill="#d23c8a"/><polygon points="364,229 374,229 369,239" fill="#d23c8a"/><polygon points="376,229 386,229 381,239" fill="#d23c8a"/><polyline points="388,235 352,235" fill="none" stroke="#d23c8a" stroke-width="2"/><text x="235.0" y="230.0" font-size="13" font-weight="700" fill="#138f9a" text-anchor="end" dominant-baseline="middle">selectins</text><text x="235.0" y="248.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">bind carbohydrates</text><text x="455.0" y="235.0" font-size="12" font-weight="400" fill="#d23c8a" text-anchor="start" dominant-baseline="middle">sugar ligand on cell 2</text><polyline points="73,280 73,355" fill="none" stroke="#7a4cd9" stroke-width="6"/><polyline points="87,280 87,355" fill="none" stroke="#7a4cd9" stroke-width="6"/><polyline points="80,280 80,262 45,262" fill="none" stroke="#d6453d" stroke-width="3"/><text x="45.0" y="248.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="start" dominant-baseline="middle">actin</text><text x="100.0" y="322.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">integrins (α and β chains): bind ECM outside, actin inside</text><rect x="11.5" y="398.5" width="237.0" height="23.0" rx="11.5" fill="#1f9d63"/><text x="130.0" y="410.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ cadherins: Ca²⁺, like-to-like</text><rect x="282.8" y="398.5" width="94.4" height="23.0" rx="11.5" fill="#d6453d"/><text x="330.0" y="410.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ integrins</text><rect x="422.8" y="398.5" width="94.4" height="23.0" rx="11.5" fill="#d6453d"/><text x="470.0" y="410.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ selectins</text><rect x="561.2" y="398.5" width="101.6" height="23.0" rx="11.5" fill="#d6453d"/><text x="612.0" y="410.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ aquaporins</text><text x="345.0" y="448.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Aquaporins are water channels, not adhesion molecules.</text></svg>
