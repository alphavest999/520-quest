<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 460" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Catalytic triad: histidine is the general base</text><polyline points="250.0,118.0 219.56619147855508,140.11145618000168 231.19087192664085,175.88854381999832 268.80912807335915,175.88854381999832 280.4338085214449,140.11145618000168 250.0,118.0" fill="none" stroke="#2f6fdb" stroke-width="2.5"/><polyline points="237.19087192664085,172.88854381999832 262.80912807335915,172.88854381999832" fill="none" stroke="#2f6fdb" stroke-width="1.5"/><polyline points="253.42380345866255,128.4875388202502 263.6952138346502,135.95015528100075" fill="none" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="219.56619147855508" cy="140.11145618000168" r="11" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="219.6" y="140.1" font-size="15" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">N</text><circle cx="280.4338085214449" cy="140.11145618000168" r="11" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="280.4" y="140.1" font-size="15" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">N</text><text x="199.6" y="140.1" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">H</text><polyline points="231.19087192664085,175.88854381999832 231.19087192664085,215.88854381999832" fill="none" stroke="#2f6fdb" stroke-width="2.5"/><text x="235.2" y="227.9" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">His57</text><text x="95.0" y="140.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Asp102</text><text x="95.0" y="160.0" font-size="14" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">–CH₂–COO⁻</text><polyline points="150,155 189.56619147855508,142.11145618000168" fill="none" stroke="#5b6474" stroke-width="1.5" stroke-dasharray="6 4"/><text x="390.0" y="165.0" font-size="14" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">H–O–CH₂–Ser195</text><polyline points="292.4338085214449,140.11145618000168 388,158" fill="none" stroke="#5b6474" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="560" y="125" width="110" height="60" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="615.0" y="147.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">substrate</text><text x="615.0" y="162.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">R–C(=O)–NH–R′</text><path d="M288.4338085214449,128.11145618000168 Q345.0,106.9 392,145" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="290.0" y="92.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1. His takes the Ser O–H proton</text><path d="M410,150 Q483.4,105.1 562,140" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="540.0" y="74.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2. Ser O⁻ attacks the C=O</text><text x="110.0" y="222.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">dashed lines = hydrogen bonds</text><rect x="15" y="245" width="150" height="30" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="90.0" y="260.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Histidine 57</text><rect x="170" y="245" width="505" height="30" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="422.5" y="260.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">general base: removes Ser H⁺, later gives it to the leaving amine</text><rect x="15" y="280" width="150" height="30" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="90.0" y="295.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Serine 195</text><rect x="170" y="280" width="505" height="30" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="422.5" y="295.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">nucleophile: forms the covalent acyl-enzyme intermediate</text><rect x="15" y="315" width="150" height="30" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="90.0" y="330.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Aspartate 102</text><rect x="170" y="315" width="505" height="30" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="422.5" y="330.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">orients His and stabilizes its + charge</text><rect x="15" y="350" width="150" height="30" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="90.0" y="365.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Oxyanion hole</text><rect x="170" y="350" width="505" height="30" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="422.5" y="365.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">N–H groups stabilize the tetrahedral O⁻ intermediate</text><rect x="15" y="385" width="150" height="30" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="90.0" y="400.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">S1 pocket</text><rect x="170" y="385" width="505" height="30" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="422.5" y="400.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">binds the residue before the cleaved bond: sets specificity</text><rect x="101.7" y="428.5" width="486.6" height="23.0" rx="11.5" fill="#1f9d63"/><text x="345.0" y="440.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ His = general base; covalent bond = Ser; specificity = S1 pocket</text></svg>
