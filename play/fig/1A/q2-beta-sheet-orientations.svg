ill="none" stroke="#1f9d63" stroke-width="2" stroke-dasharray="6 4"/><polyline points="503,138 525,192" fill="none" stroke="#1f9d63" stroke-width="2" stroke-dasharray="6 4"/><polyline points="525,192 547,138" fill="none" stroke="#1f9d63" stroke-width="2" stroke-dasharray="6 4"/><polyline points="547,138 569,192" fill="none" stroke="#1f9d63" stroke-width="2" stroke-dasharray="6 4"/><polyline points="569,192 591,138" fill="none" stroke="#1f9d63" stroke-width="2" stroke-dasharray="6 4"/><text x="502.0" y="240.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">neighbors run in the SAME direction</text><text x="502.0" y="258.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">H-bonds angled across</text><rect x="464.2" y="270" width="75.5" height="24" rx="12" fill="#5b6474"/><text x="502.0" y="282.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">parallel</text><text x="340.0" y="318.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">In both: hydrogen bonds join backbone groups of DIFFERENT strands (never within one strand),</text><text x="340.0" y="338.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">and side chains stick up and down out of the plane of the sheet (not in it).</text></svg>
