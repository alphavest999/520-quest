<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Antiparallel vs parallel β-sheets (view from above the sheet)</text><rect x="20" y="46" width="315" height="250" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="177.0" y="70.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Antiparallel</text><polygon points="65,114 268,114 268,106 290,125 268,144 268,136 65,136" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.8"/><text x="51.0" y="125.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">N</text><text x="304.0" y="125.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><polygon points="290,194 87,194 87,186 65,205 87,224 87,216 290,216" fill="#fdf1db" stroke="#d98a00" stroke-width="1.8"/><text x="304.0" y="205.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">N</text><text x="51.0" y="205.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><polyline points="90,138 90,192" fill="none" stroke="#1f9d63" stroke-width="2" stroke-dasharray="6 4"/><polyline points="134,138 134,192" fill="none" stroke="#1f9d63" stroke-width="2" stroke-dasharray="6 4"/><polyline points="178,138 178,192" fill="none" stroke="#1f9d63" stroke-width="2" stroke-dasharray="6 4"/><polyline points="