<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Feedback inhibition of a biosynthetic pathway</text><rect x="20" y="120" width="80" height="56" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="60.0" y="148.0" font-size="16" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><rect x="160" y="120" width="80" height="56" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="200.0" y="148.0" font-size="16" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><rect x="300" y="120" width="80" height="56" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="148.0" font-size="16" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><rect x="440" y="120" width="80" height="56" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="480.0" y="148.0" font-size="16" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">D</text><rect x="580" y="120" width="80" height="56" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="620.0" y="138.0" font-size="16" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">End</text><text x="620.0" y="158.0" font-size="16" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">product</text><path d="M100,148 L158,148" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="130.0" y="166.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">E1</text><path d="M240,148 L298,148" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="270.0" y="166.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">E2</text><path d="M380,148 L438,148" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="410.0" y="166.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">E3</text><path d="M520,148 L578,148" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="550.0" y="166.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">E4</text><text x="130.0" y="205.0" font-size="12.5" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">first committed step</text><text x="130.0" y="222.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">(E1 is the regulated enzyme)</text><path d="M620,118 C600,15 160,15 130,128" fill="none" stroke="#d6453d" stroke-width="2.2" stroke-dasharray="7 4"/><line x1="118" y1="128" x2="142" y2="128" stroke="#d6453d" stroke-width="3"/><text x="375.0" y="98.0" font-size="13" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">end product binds E1&#x27;s allosteric site and slows it</text><rect x="22.4" y="255" width="185.3" height="26" rx="13" fill="#1f9d63"/><text x="115.0" y="268.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ feedback inhibition</text><rect x="223.7" y="256" width="432.6" height="24" rx="12" fill="#d6453d"/><text x="440.0" y="268.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ feedforward: early metabolite activates a LATER enzyme</text><text x="340.0" y="305.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">When the end product is plentiful, the pathway shuts down at its start, so no intermediates pile up.</text></svg>
