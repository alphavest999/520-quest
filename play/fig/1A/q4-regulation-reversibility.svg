ht="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Allosteric inhibitor</text><rect x="215" y="136" width="120" height="46" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="275.0" y="159.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E + I</text><rect x="475" y="136" width="135" height="46" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="542.5" y="159.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E·I</text><path d="M340,152 L470,152" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M470,166 L340,166" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="405.0" y="128.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">noncovalent binding ⇌</text><text x="645.0" y="159.0" font-size="22" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">⇌</text><rect x="15" y="205" width="180" height="58" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="105.0" y="234.0" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Competitive inhibitor</text><rect x="215" y="211" width="120" height="46" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="275.0" y="234.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E + I</text><rect x="475" y="211" width="135" height="46" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="542.5" y="234.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E·I</text><path d="M340,227 L470,227" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M470,241 L340,241" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="405.0" y="203.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">displaced by high [S] ⇌</text><text x="645.0" y="234.0" font-size="22" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">⇌</text><rect x="15" y="280" width="180" height="58" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="105.0" y="309.0" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Zymogen activation</text><rect x="215" y="286" width="120" height="46" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="275.0" y="309.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">zymogen</text><rect x="475" y="286" width="135" height="46" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="542.5" y="301.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">active enzyme</text><text x="542.5" y="316.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+ peptide</text><path d="M340,309 L470,309" fill="none" stroke="#d6453d" stroke-width="2.6" marker-end="url(#ah)"/><text x="405.0" y="282.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">peptide bond cut (one way)</text><text x="645.0" y="309.0" font-size="22" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">→</text><text x="340.0" y="362.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Only proteolysis is irreversible: a cut peptide chain is never rejoined.</text><text x="340.0" y="384.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">An activated protease is switched off later by protein inhibitors or degradation.</text></svg>
