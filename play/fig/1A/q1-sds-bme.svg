<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SDS-PAGE sample prep: who does what</text><circle cx="95" cy="130" r="45" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="185" cy="130" r="45" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><polyline points="128,115 152,115" fill="none" stroke="#d98a00" stroke-width="4"/><text x="140.0" y="100.0" font-size="13" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">S–S</text><text x="140.0" y="195.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">folded protein, two chains</text><text x="140.0" y="213.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">linked by a disulfide</text><path d="M250,130 L400,130" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="325.0" y="120.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">SDS + β-ME + heat</text><polyline points="425,97 443,113 461,97 479,113 497,97 515,113 533,97 551,113 569,97 587,113 605,97 623,113" fill="none" stroke="#2f6fdb" stroke-width="3"/><text x="425.0" y="82.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><text x="461.0" y="82.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><text x="497.0" y="82.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><text x="533.0" y="82.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><text x="569.0" y="82.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><text x="605.0" y="82.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><text x="640.0" y="107.0" font-size="12" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">SH</text><polyline points="425,152 443,168 461,152 479,168 497,152 515,168 533,152 551,168 569,152 587,168 605,152 623,168" fill="none" stroke="#7a4cd9" stroke-width="3"/><text x="425.0" y="137.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><text x="461.0" y="137.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><text x="497.0" y="137.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><text x="533.0" y="137.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><text x="569.0" y="137.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><text x="605.0" y="137.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><text x="640.0" y="162.0" font-size="12" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">SH</text><text x="530.0" y="195.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">separate, unfolded, SDS-coated chains</text><text x="60.0" y="250.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">β-mercaptoethanol</text><text x="230.0" y="250.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">reduces S–S to 2 –SH (breaks covalent links)</text><text x="60.0" y="280.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">SDS</text><text x="230.0" y="280.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">denatures and coats chains with − charge</text><text x="60.0" y="310.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Heat</text><text x="230.0" y="310.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">speeds unfolding</text><rect x="69.0" y="338" width="202.0" height="24" rx="12" fill="#d6453d"/><text x="170.0" y="350.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ β-ME cuts peptide bonds</text><rect x="399.0" y="338" width="202.0" height="24" rx="12" fill="#d6453d"/><text x="500.0" y="350.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ β-ME gives the − charge</text><rect x="72.7" y="372" width="194.6" height="24" rx="12" fill="#d6453d"/><text x="170.0" y="384.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ β-ME keeps native fold</text><rect x="399.0" y="372" width="202.0" height="24" rx="12" fill="#1f9d63"/><text x="500.0" y="384.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ β-ME reduces disulfides</text></svg>
