<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ethanol competes with methanol for alcohol dehydrogenase</text><rect x="20" y="60" width="140" height="50" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="90.0" y="85.0" font-size="15" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Methanol</text><rect x="260" y="60" width="150" height="50" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="335.0" y="85.0" font-size="15" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Formaldehyde</text><rect x="500" y="60" width="160" height="50" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="580.0" y="69.4" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Formic acid</text><text x="580.0" y="85.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(toxic: acidosis,</text><text x="580.0" y="100.6" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">optic nerve damage)</text><path d="M160,85 L258,85" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="209.0" y="75.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ADH</text><path d="M410,85 L498,85" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="454.0" y="75.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ALDH</text><circle cx="210" cy="200" r="46" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="210.0" y="191.9" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ADH</text><text x="210.0" y="208.1" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">active site</text><rect x="20" y="175" width="120" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="80.0" y="191.2" font-size="14" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ethanol</text><text x="80.0" y="208.8" font-size="14" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(high dose)</text><path d="M140,200 L162,200" fill="none" stroke="#1f9d63" stroke-width="2.6" marker-end="url(#ah)"/><path d="M256,200 L330,200" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><rect x="332" y="175" width="150" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="407.0" y="191.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Acetaldehyde</text><text x="407.0" y="208.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(less toxic path)</text><text x="560.0" y="184.4" font-size="12.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">ADH busy with ethanol,</text><text x="560.0" y="200.0" font-size="12.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">so the methanol step</text><text x="560.0" y="215.6" font-size="12.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">above slows down</text><rect x="30" y="262" width="620" height="130" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="340.0" y="285.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Both alcohols are substrates of the same ADH active site.</text><text x="340.0" y="309.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A high ethanol level occupies most sites, so for methanol it acts like a</text><text x="340.0" y="333.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">competitive inhibitor: methanol&#x27;s apparent Km rises and less formaldehyde forms.</text><text x="340.0" y="357.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Unmetabolized methanol is excreted or removed by dialysis.</text><text x="340.0" y="379.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Fomepizole, the modern antidote, is a direct competitive inhibitor of ADH.</text></svg>
