stroke="#d6453d" stroke-width="3"/><polyline points="96.37894543796153,139.70763434999964 87.17581074352405,144.29700378337947" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="108.93517707977874,142.2257779036971 144.2884956125384,184.35822227524088" fill="none" stroke="#8a93a3" stroke-width="1.5"/><circle cx="158" cy="215" r="10" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="182" cy="215" r="10" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="170.0" y="58.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Axoneme cross-section: 9 + 2</text><text x="170.0" y="372.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">blue = microtubule doublets and central pair</text><text x="170.0" y="390.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">red = dynein arms; gray = radial spokes</text><text x="515.0" y="58.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Dynein walks on the neighbor doublet</text><polyline points="375,100 655,100" fill="none" stroke="#2f6fdb" stroke-width="8"/><polyline points="375,140 655,140" fill="none" stroke="#2f6fdb" stroke-width="8"/><polyline points="405,104 417,136" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="460,104 472,136" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="515,104 527,136" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="570,104 582,136" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="625,104 637,136" fill="none" stroke="#d6453d" stroke-width="3"/><path d="M475,162 L555,162" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="515.0" y="178.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">free doublets would just slide apart</text><text x="515.0" y="205.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Nexin links tie neighbors together, so</text><text x="515.0" y="223.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">the sliding force becomes a BEND:</text><polyline points="395,310.0 401,309.9604 407,309.8416 413,309.6436 419,309.3664 425,309.01 431,308.5744 437,308.0596 443,307.4656 449,306.7924 455,306.04 461,305.2084 467,304.2976 473,303.3076 479,302.2384 485,301.09 491,299.8624 497,298.5556 503,297.1696 509,295.7044 515,294.16 521,292.5364 527,290.8336 533,289.0516 539,287.1904 545,285.25 551,283.2304 557,281.1316 563,278.9536 569,276.6964 575,274.36 581,271.9444 587,269.4496 593,266.8756 599,264.2224 605,261.49 611,258.6784 617,255.7876 623,252.8176 629,249.76839999999999 635,246.64 641,243.4324 647,240.1456 653,236.77960000000002 659,233.33440000000002" fill="none" stroke="#2f6fdb" stroke-width="7"/><polyline points="395,326.0 401,325.9604 407,325.8416 413,325.6436 419,325.3664 425,325.01 431,324.5744 437,324.0596 443,323.4656 449,322.7924 455,322.04 461,321.2084 467,320.2976 473,319.3076 479,318.2384 485,317.09 491,315.8624 497,314.5556 503,313.1696 509,311.7044 515,310.16 521,308.5364 527,306.8336 533,305.0516 539,303.1904 545,301.25 551,299.2304 557,297.1316 563,294.9536 569,292.6964 575,290.36 581,287.9444 587,285.4496 593,282.8756 599,280.2224 605,277.49 611,274.6784 617,271.7876 623,268.81759999999997 629,265.7684 635,262.64 641,259.43240000000003 647,256.1456 653,252.77960000000002 659,249.33440000000002" fill="none" stroke="#2f6fdb" stroke-width="7"/><text x="387.0" y="322.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">base</text><rect x="360" y="348" width="320" height="52" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="520.0" y="366.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Bacterial flagella are different: a rotary</text><text x="520.0" y="381.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">motor driven by H⁺ flow, made of flagellin.</text><rect x="21.4" y="413.5" width="187.1" height="23.0" rx="11.5" fill="#1f9d63"/><text x="115.0" y="425.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ dynein slides doublets</text><rect x="220.0" y="413.5" width="130.1" height="23.0" rx="11.5" fill="#d6453d"/><text x="285.0" y="425.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ not actomyosin</text><rect x="369.3" y="413.5" width="151.5" height="23.0" rx="11.5" fill="#d6453d"/><text x="445.0" y="425.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ rotary = bacteria</text><rect x="545.7" y="413.5" width="108.7" height="23.0" rx="11.5" fill="#d6453d"/><text x="600.0" y="425.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ not kinesin</text></svg>
