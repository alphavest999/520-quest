<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Anfinsen&#x27;s experiment: the sequence encodes the fold</text><rect x="15" y="60" width="165" height="100" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="97.5" y="93.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Native RNase A</text><text x="97.5" y="110.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">4 correct S–S</text><text x="97.5" y="126.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">activity 100%</text><path d="M182,110 L265,110" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="223.0" y="80.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">8 M urea</text><text x="223.0" y="96.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">+ β-ME</text><rect x="268" y="60" width="160" height="100" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="348.0" y="93.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Unfolded, reduced</text><text x="348.0" y="110.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">8 free –SH</text><text x="348.0" y="126.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">activity ≈ 0%</text><path d="M428,85 L500,60" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="503" y="34" width="175" height="76" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="590.5" y="63.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Native again</text><text x="590.5" y="80.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">activity ≈ 100%</text><text x="560.0" y="128.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1. remove urea and β-ME slowly;</text><text x="560.0" y="144.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">chain folds, THEN air oxidizes –SH</text><rect x="471.4" y="160" width="187.1" height="24" rx="12" fill="#1f9d63"/><text x="565.0" y="172.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ sequence encodes fold</text><path d="M428,140 L500,238" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="503" y="222" width="175" height="76" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="590.5" y="251.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Scrambled S–S</text><text x="590.5" y="268.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">activity ≈ 1%</text><text x="560.0" y="316.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2. oxidize while still in 8 M urea,</text><text x="560.0" y="332.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">then remove urea</text><rect x="461.6" y="348" width="216.9" height="24" rx="12" fill="#d6453d"/><text x="570.0" y="360.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ S–S locked before folding</text><path d="M503,250 Q293.0,245.1 100,162" fill="none" stroke="#5b6474" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="300.0" y="268.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">add a trace of β-ME: S–S bonds reshuffle → native</text><text x="300.0" y="284.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(protein disulfide isomerase does this in the ER)</text><rect x="15" y="380" width="660" height="50" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="345.0" y="396.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">8 cysteines pair at random: 7 × 5 × 3 × 1 = 105 possible sets of 4 disulfides.</text><text x="345.0" y="415.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Only 1 is native, so random oxidation gives ≈ 1/105 ≈ 1% of the activity.</text><text x="160.0" y="318.0" font-size="12" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Wrong S–S pairs lock the chain into</text><text x="160.0" y="334.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">non-native shapes that cannot refold.</text><text x="160.0" y="356.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">β-ME = β-mercaptoethanol (reducing agent)</text></svg>
