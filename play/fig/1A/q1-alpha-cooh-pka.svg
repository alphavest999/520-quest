<text x="505.0" y="185.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glycine α-COOH</text><text x="505.0" y="210.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">pKa ≈ 2.3</text><text x="340.0" y="262.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The nearby –NH₃⁺ pulls electron density (inductive effect) and its + charge</text><text x="340.0" y="284.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">electrostatically stabilizes the –COO⁻ formed. Stabler conjugate base → stronger acid.</text><rect x="64.1" y="310" width="231.8" height="24" rx="12" fill="#1f9d63"/><text x="180.0" y="322.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ NH₃⁺ stabilizes carboxylate</text><rect x="391.6" y="310" width="216.9" height="24" rx="12" fill="#d6453d"/><text x="500.0" y="322.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ resonance with side chain</text><rect x="75.3" y="348" width="209.4" height="24" rx="12" fill="#d6453d"/><text x="180.0" y="360.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ stronger hydration alone</text><rect x="387.8" y="348" width="224.3" height="24" rx="12" fill="#d6453d"/><text x="500.0" y="360.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ larger size spreads charge</text></svg>
