<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cofactors, coenzymes and the holoenzyme</text><rect x="15" y="45" width="190" height="56" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="110.0" y="64.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Apoenzyme</text><text x="110.0" y="81.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">protein only: inactive</text><text x="222.0" y="73.0" font-size="24" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+</text><rect x="240" y="45" width="190" height="56" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="335.0" y="64.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cofactor</text><text x="335.0" y="81.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">any non-protein helper</text><text x="447.0" y="73.0" font-size="24" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→</text><rect x="465" y="45" width="210" height="56" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="570.0" y="64.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Holoenzyme</text><text x="570.0" y="81.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">complete and active</text><text x="160.0" y="130.0" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Sort cofactors by CHEMISTRY</text><rect x="15" y="145" width="290" height="62" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="160.0" y="167.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Inorganic: metal ions</text><text x="160.0" y="184.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Mg²⁺, Zn²⁺, Fe²⁺, Cu²⁺, Mn²⁺</text><rect x="15" y="215" width="290" height="62" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="160.0" y="237.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Organic = coenzymes</text><text x="160.0" y="254.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">often made from vitamins</text><text x="520.0" y="130.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">Sort cofactors by BINDING</text><rect x="370" y="145" width="305" height="62" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="522.5" y="168.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cosubstrate: binds loosely, leaves</text><text x="522.5" y="183.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">each cycle (NAD⁺, CoA, ATP)</text><rect x="370" y="215" width="305" height="62" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="522.5" y="238.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Prosthetic group: tight or covalent,</text><text x="522.5" y="253.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">stays (heme, FAD, biotin, PLP)</text><rect x="15" y="295" width="660" height="92" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="345.0" y="325.4" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Other terms: holoenzyme = apoenzyme + cofactor (active);</text><text x="345.0" y="341.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ribozyme = catalytic RNA (e.g. rRNA peptidyl transferase);</text><text x="345.0" y="356.6" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">isozymes = different proteins that catalyze the same reaction (e.g. LDH, hexokinase vs glucokinase).</text><rect x="62.8" y="403.5" width="94.4" height="23.0" rx="11.5" fill="#1f9d63"/><text x="110.0" y="415.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ apoenzyme</text><rect x="217.2" y="403.5" width="101.6" height="23.0" rx="11.5" fill="#d6453d"/><text x="268.0" y="415.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ holoenzyme</text><rect x="384.4" y="403.5" width="87.3" height="23.0" rx="11.5" fill="#d6453d"/><text x="428.0" y="415.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ ribozyme</text><rect x="547.9" y="403.5" width="80.2" height="23.0" rx="11.5" fill="#d6453d"/><text x="588.0" y="415.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ isozyme</text><text x="345.0" y="450.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">A metal ion can also be a prosthetic group if it is tightly bound (e.g. Zn²⁺ in carbonic anhydrase).</text></svg>
