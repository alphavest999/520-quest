<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Which effector does each Gα control?</text><rect x="10" y="42" width="210" height="356" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><rect x="70" y="55" width="90" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="115.0" y="72.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gs</text><rect x="240" y="42" width="210" height="356" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><rect x="300" y="55" width="90" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="345.0" y="72.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gi</text><rect x="470" y="42" width="210" height="356" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><rect x="530" y="55" width="90" height="34" rx="10" fill="#ffffff" stroke="#1f9d63" stroke-width="1.5"/><text x="575.0" y="72.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gq</text><rect x="25" y="110" width="180" height="40" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="115.0" y="130.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">adenylyl cyclase ON</text><rect x="25" y="166" width="180" height="40" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="115.0" y="186.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ATP → cAMP ↑</text><path d="M115.0,150 L115.0,166" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="25" y="222" width="180" height="40" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="115.0" y="242.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PKA active</text><path d="M115.0,206 L115.0,222" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="25" y="278" width="180" height="40" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="115.0" y="290.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">e.g. β-adrenergic,</text><text x="115.0" y="305.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">glucagon receptors</text><path d="M115.0,262 L115.0,278" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="255" y="110" width="180" height="40" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="345.0" y="130.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">adenylyl cyclase OFF</text><rect x="255" y="166" width="180" height="40" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="345.0" y="186.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cAMP ↓</text><path d="M345.0,150 L345.0,166" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="255" y="222" width="180" height="40" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="345.0" y="242.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PKA less active</text><path d="M345.0,206 L345.0,222" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="255" y="278" width="180" height="40" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="345.0" y="290.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">e.g. α₂-adrenergic,</text><text x="345.0" y="305.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">M2 muscarinic</text><path d="M345.0,262 L345.0,278" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="485" y="110" width="180" height="36" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="575.0" y="128.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">phospholipase C-β ON</text><rect x="485" y="158" width="180" height="36" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="575.0" y="176.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PIP₂ → IP₃ + DAG</text><path d="M575.0,146 L575.0,158" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="485" y="206" width="180" height="36" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="575.0" y="224.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">IP₃: ER releases Ca²⁺</text><path d="M575.0,194 L575.0,206" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="485" y="254" width="180" height="36" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="575.0" y="272.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DAG + Ca²⁺ → PKC</text><path d="M575.0,242 L575.0,254" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="485" y="302" width="180" height="36" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="575.0" y="312.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">e.g. α₁-adrenergic,</text><text x="575.0" y="327.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">M1/M3 muscarinic</text><path d="M575.0,290 L575.0,302" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="488.6" y="408.5" width="172.9" height="23.0" rx="11.5" fill="#1f9d63"/><text x="575.0" y="420.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ Gq → PLC → IP₃ + DAG</text><rect x="64.2" y="408.5" width="101.6" height="23.0" rx="11.5" fill="#d6453d"/><text x="115.0" y="420.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ this is Gs</text><rect x="294.2" y="408.5" width="101.6" height="23.0" rx="11.5" fill="#d6453d"/><text x="345.0" y="420.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ this is Gi</text><text x="345.0" y="452.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">A ligand-gated Na⁺ channel is its own receptor; Gq works through the enzyme PLC.</text></svg>
