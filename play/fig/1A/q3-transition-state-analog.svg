<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Active sites fit the transition state best</text><rect x="15" y="45" width="210" height="260" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="120.0" y="66.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Substrate</text><polygon points="40,150 75,150 120,195 165,150 200,150 200,230 40,230" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><text x="120.0" y="218.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">enzyme</text><rect x="65" y="132" width="110" height="14" rx="5" fill="#f1f3f6" stroke="#1f2430" stroke-width="2"/><circle cx="75" cy="150" r="3.5" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="165" cy="150" r="3.5" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><text x="120.0" y="260.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">partial fit:</text><text x="120.0" y="275.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">few contacts</text><rect x="240" y="45" width="210" height="260" rx="10" fill="#f1f3f6" stroke="#d98a00" stroke-width="1.5"/><text x="345.0" y="66.0" font-size="14" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">Transition state</text><polygon points="265,150 300,150 345,195 390,150 425,150 425,230 265,230" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><text x="345.0" y="218.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">enzyme</text><polyline points="302,141 345,184 388,141" fill="none" stroke="#d98a00" stroke-width="12"/><circle cx="310" cy="160" r="3.5" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="330" cy="180" r="3.5" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="360" cy="180" r="3.5" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="380" cy="160" r="3.5" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><text x="345.0" y="118.0" font-size="22" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">‡</text><text x="345.0" y="260.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">best fit, but lasts</text><text x="345.0" y="275.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">only ~10⁻¹³ s</text><rect x="465" y="45" width="210" height="260" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="570.0" y="66.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Transition-state analog</text><polygon points="490,150 525,150 570,195 615,150 650,150 650,230 490,230" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><text x="570.0" y="218.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">enzyme</text><polyline points="527,141 570,184 613,141" fill="none" stroke="#1f9d63" stroke-width="12"/><circle cx="535" cy="160" r="3.5" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="555" cy="180" r="3.5" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="585" cy="180" r="3.5" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="605" cy="160" r="3.5" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><text x="570.0" y="260.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">same shape, stable:</text><text x="570.0" y="275.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">binds most tightly</text><text x="345.0" y="322.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">red dots = favorable contacts (H-bonds, ionic, van der Waals)</text><rect x="25.7" y="343.5" width="208.5" height="23.0" rx="11.5" fill="#1f9d63"/><text x="130.0" y="355.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ analog binds more tightly</text><rect x="249.2" y="343.5" width="101.6" height="23.0" rx="11.5" fill="#d6453d"/><text x="300.0" y="355.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ not weaker</text><rect x="377.8" y="343.5" width="94.4" height="23.0" rx="11.5" fill="#d6453d"/><text x="425.0" y="355.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ not equal</text><rect x="505.0" y="343.5" width="130.1" height="23.0" rx="11.5" fill="#d6453d"/><text x="570.0" y="355.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ not allosteric</text><text x="345.0" y="385.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Many drugs are transition-state analogs, e.g. oseltamivir (neuraminidase) and HIV protease inhibitors.</text></svg>
