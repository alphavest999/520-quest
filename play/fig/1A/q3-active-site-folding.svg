<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 480" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The fold, not the sequence, builds the active site</text><text x="345.0" y="52.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Primary structure: chymotrypsin, 245 residues</text><rect x="40" y="77" width="610" height="16" rx="8" fill="#f1f3f6" stroke="#8a93a3"/><circle cx="180.0" cy="85" r="9" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="180.0" y="109.0" font-size="12.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">His57</text><circle cx="292.5" cy="85" r="9" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><text x="292.5" y="109.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Asp102</text><circle cx="525.0" cy="85" r="9" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="525.0" y="109.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Ser195</text><text x="40.0" y="109.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">N</text><text x="650.0" y="109.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">C</text><text x="345.0" y="135.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">His57 and Ser195 are 138 positions apart in the chain</text><path d="M345,150 L345,178" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="455.0" y="164.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">folding (tertiary structure)</text><path d="M 160,250 Q 200,205 230.0,210.0 Q 260,215 280.0,237.5 Q 300,260 290.0,280.0 Q 280,300 305.0,310.0 Q 330,320 337.5,305.0 Q 345,290 347.5,275.0 Q 350,260 365.0,240.0 Q 380,220 405.0,215.0 Q 430,210 450.0,225.0 Q 470,240 465.0,265.0 Q 460,290 430.0,295.0 Q 400,300 385.0,295.0 Q 370,290 365.0,310.0 Q 360,330 385.0,345.0 Q 410,360 440.0,355.0 Q 470,350 495.0,335.0 Q 520,320 530.0,295.0 Q 540,270 525.0,250.0" fill="none" stroke="#8a93a3" stroke-width="7" stroke-linecap="round"/><circle cx="345" cy="290" r="30" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="333" cy="278" r="8" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="360" cy="296" r="8" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><circle cx="338" cy="306" r="8" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><text x="250.0" y="345.0" font-size="12.5" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">active site</text><polyline points="285,340 318,305" fill="none" stroke="#d98a00" stroke-width="1.5"/><text x="150.0" y="235.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">N</text><text x="520.0" y="222.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">C</text><rect x="240.7" y="380.5" width="208.5" height="23.0" rx="11.5" fill="#1f9d63"/><text x="345.0" y="392.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ 3D fold brings them close</text><rect x="73.6" y="412.5" width="172.9" height="23.0" rx="11.5" fill="#d6453d"/><text x="160.0" y="424.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ no new peptide bonds</text><rect x="265.7" y="412.5" width="158.6" height="23.0" rx="11.5" fill="#d6453d"/><text x="345.0" y="424.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ no substrate links</text><rect x="455.0" y="412.5" width="130.1" height="23.0" rx="11.5" fill="#d6453d"/><text x="520.0" y="424.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ S–S not needed</text><text x="345.0" y="458.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Peptide bonds join only neighbours in the chain; distant residues meet by folding.</text></svg>
