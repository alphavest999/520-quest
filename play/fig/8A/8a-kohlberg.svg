<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="360.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Kohlberg&#x27;s stages of moral reasoning</text><rect x="20" y="300" width="180" height="95" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="110.0" y="347.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PRECONVENTIONAL</text><rect x="215" y="312" width="240" height="70" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="335.0" y="340.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Stage 1</text><text x="335.0" y="353.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Obedience: avoid punishment</text><rect x="465" y="312" width="240" height="70" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="585.0" y="340.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Stage 2</text><text x="585.0" y="353.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Self-interest: &#x27;what&#x27;s in it for me?&#x27;</text><rect x="20" y="185" width="180" height="95" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="110.0" y="232.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CONVENTIONAL</text><rect x="215" y="197" width="240" height="70" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="335.0" y="225.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Stage 3</text><text x="335.0" y="238.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Good boy/good girl: social approval</text><rect x="465" y="197" width="240" height="70" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="585.0" y="225.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Stage 4</text><text x="585.0" y="238.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Law and order: follow rules, keep order</text><rect x="20" y="70" width="180" height="95" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="110.0" y="117.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">POSTCONVENTIONAL</text><rect x="215" y="82" width="240" height="70" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="335.0" y="103.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Stage 5</text><text x="335.0" y="117.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Social contract: laws are</text><text x="335.0" y="130.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">agreements, changeable democratically</text><rect x="465" y="82" width="240" height="70" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="585.0" y="103.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Stage 6</text><text x="585.0" y="117.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Universal ethical principles</text><text x="585.0" y="130.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(e.g., value of human life)</text><text x="360.0" y="408.0" font-size="10.3" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Stage is scored from the REASONING, not the yes/no choice. Gilligan: male samples, justice over care.</text></svg>
