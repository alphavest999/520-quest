<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="320.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Vygotsky: zone of proximal development</text><ellipse cx="320" cy="180" rx="280" ry="125" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/><ellipse cx="320" cy="185" rx="185" ry="85" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><ellipse cx="320" cy="195" rx="85" ry="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="320.0" y="72.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cannot do yet, even with help</text><text x="320.0" y="120.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ZPD: can do WITH guidance</text><text x="320.0" y="136.0" font-size="10.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(scaffolding, faded as skill grows)</text><text x="320.0" y="192.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">can do</text><text x="320.0" y="208.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">alone</text><text x="320.0" y="322.0" font-size="10.3" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Social interaction pulls development forward; private speech is later internalized as inner speech.</text></svg>
