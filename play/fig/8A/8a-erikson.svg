e-width="1.5"/><text x="510.0" y="127.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">will</text><rect x="575" y="110" width="170" height="34" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="660.0" y="127.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Anal</text><rect x="20" y="150" width="180" height="34" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="110.0" y="167.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Preschool (3–6)</text><rect x="210" y="150" width="240" height="34" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="330.0" y="167.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Initiative vs guilt</text><rect x="460" y="150" width="100" height="34" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="510.0" y="167.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">purpose</text><rect x="575" y="150" width="170" height="34" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="660.0" y="167.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Phallic</text><rect x="20" y="190" width="180" height="34" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="110.0" y="207.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">School age (6–12)</text><rect x="210" y="190" width="240" height="34" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="330.0" y="207.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Industry vs inferiority</text><rect x="460" y="190" width="100" height="34" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="510.0" y="207.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">competence</text><rect x="575" y="190" width="170" height="34" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="660.0" y="207.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Latency</text><rect x="20" y="230" width="180" height="34" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="110.0" y="247.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Adolescence</text><rect x="210" y="230" width="240" height="34" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="330.0" y="247.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Identity vs role confusion</text><rect x="460" y="230" width="100" height="34" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="510.0" y="247.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">fidelity</text><rect x="575" y="230" width="170" height="34" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="660.0" y="247.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Genital (puberty on)</text><rect x="20" y="270" width="180" height="34" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="110.0" y="287.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Young adult</text><rect x="210" y="270" width="240" height="34" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="330.0" y="287.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Intimacy vs isolation</text><rect x="460" y="270" width="100" height="34" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="510.0" y="287.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">love</text><rect x="20" y="310" width="180" height="34" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="110.0" y="327.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Middle adult</text><rect x="210" y="310" width="240" height="34" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="330.0" y="327.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Generativity vs stagnation</text><rect x="460" y="310" width="100" height="34" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="510.0" y="327.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">care</text><rect x="20" y="350" width="180" height="34" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="110.0" y="367.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Late adult</text><rect x="210" y="350" width="240" height="34" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="330.0" y="367.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Integrity vs despair</text><rect x="460" y="350" width="100" height="34" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="510.0" y="367.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">wisdom</text><text x="380.0" y="405.0" font-size="10" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Erikson: social conflicts across the whole lifespan. Freud: sexual drives, ends at puberty; fixation (e.g., anal → orderly, rigid).</text></svg>
