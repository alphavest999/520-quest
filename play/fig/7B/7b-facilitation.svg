<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Others&#x27; presence: facilitation or loafing?</text><rect x="260" y="45" width="160" height="50" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="70.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">others present</text><rect x="60" y="140" width="240" height="60" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="180.0" y="163.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">my output is identifiable / evaluated</text><text x="180.0" y="176.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ arousal ↑</text><rect x="380" y="140" width="240" height="60" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="500.0" y="163.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">output pooled, not identifiable</text><text x="500.0" y="176.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ less effort</text><path d="M320,95 L180,140" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M360,95 L500,140" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="240" width="150" height="60" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="95.0" y="262.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">simple / practiced</text><text x="95.0" y="277.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">task: BETTER</text><rect x="190" y="240" width="150" height="60" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="265.0" y="262.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">complex / new</text><text x="265.0" y="277.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">task: WORSE</text><path d="M150,200 L95,240" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M210,200 L265,240" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="410" y="240" width="180" height="60" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="500.0" y="270.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">social loafing</text><path d="M500,200 L500,240" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="318.0" font-size="10.8" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Social facilitation: arousal strengthens the dominant response (Zajonc).</text><text x="340.0" y="336.0" font-size="10.8" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Proposed causes: mere presence, evaluation apprehension, distraction-conflict.</text></svg>
