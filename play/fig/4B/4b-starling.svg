<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Capillary fluid exchange and the lymphatic drain</text><rect x="80" y="130" width="520" height="50" rx="25" fill="#fbe7e5" stroke="#d6453d" stroke-width="2"/><text x="80.0" y="115.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">arteriole end</text><text x="600.0" y="115.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">venule end</text><path d="M90,155 L590,155" stroke="#d6453d" stroke-width="1.5" fill="none" marker-end="url(#ared)"/><path d="M160,180 L160,240" stroke="#2f6fdb" stroke-width="3" fill="none" marker-end="url(#ablue)"/><path d="M220,180 L220,240" stroke="#2f6fdb" stroke-width="3" fill="none" marker-end="url(#ablue)"/><path d="M280,180 L280,240" stroke="#2f6fdb" stroke-width="3" fill="none" marker-end="url(#ablue)"/><path d="M440,240 L440,184" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><path d="M500,240 L500,184" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="220.0" y="254.8" font-size="11.5" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">filtration: hydrostatic</text><text x="220.0" y="269.2" font-size="11.5" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">pressure &gt; oncotic pressure</text><text x="470.0" y="254.8" font-size="11.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">reabsorption: oncotic</text><text x="470.0" y="269.2" font-size="11.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">pressure &gt; hydrostatic</text><path d="M360,240 Q360,290 420,300" fill="none" stroke="#7a4cd9" stroke-width="3"/><text x="560.0" y="300.0" font-size="11.5" font-weight="600" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">lymphatics return the excess fluid</text><text x="340.0" y="52.8" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Hydrostatic pressure falls along the capillary; plasma-protein (oncotic) pressure stays ~constant.</text><text x="340.0" y="67.2" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Filtration slightly exceeds reabsorption, and blocked lymph drainage causes edema.</text></svg>
