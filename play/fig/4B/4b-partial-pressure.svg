<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Partial pressures: P_gas = fraction × (total − water vapor)</text><rect x="60" y="70" width="44.800000000000004" height="40" rx="2" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5" /><text x="82.4" y="90.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">O₂ 160</text><rect x="104.80000000000001" y="70" width="168.00000000000003" height="40" rx="2" fill="#f1f3f6" stroke="#5b6474" stroke-width="1.5" /><text x="188.8" y="90.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">N₂ and other gases 600</text><text x="60.0" y="58.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Dry air at sea level: 760 mmHg × 0.21 = 160 mmHg</text><rect x="60" y="160" width="13.160000000000002" height="40" rx="2" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5" /><text x="66.6" y="180.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">H₂O 47</text><rect x="73.16" y="160" width="42.00000000000001" height="40" rx="2" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5" /><text x="94.2" y="180.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">O₂ 150</text><rect x="115.16" y="160" width="157.64000000000001" height="40" rx="2" fill="#f1f3f6" stroke="#5b6474" stroke-width="1.5" /><text x="194.0" y="180.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">N₂ and others 563</text><text x="60.0" y="148.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Humidified in the airway: (760 − 47) × 0.21 ≈ 150 mmHg</text><text x="340.0" y="250.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Water vapor takes 47 mmHg at 37 °C whatever the total, so it dilutes the other gases.</text><text x="340.0" y="272.8" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Adding helium to a rigid sealed box at fixed T does NOT change P_O₂:</text><text x="340.0" y="287.2" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">its moles, volume and temperature are unchanged.</text></svg>
