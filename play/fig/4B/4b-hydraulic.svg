<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Pascal&#x27;s principle: a hydraulic lift</text><path d="M60,120 L60,270 L440,270 L440,170 L360,170 L360,250 L120,250 L120,120 Z" fill="#e6eefc" stroke="#1f2430" stroke-width="2"/><rect x="62" y="110" width="56" height="14" rx="4" fill="#d98a00" stroke="#1f2430" stroke-width="1.5" /><rect x="362" y="160" width="76" height="14" rx="4" fill="#d98a00" stroke="#1f2430" stroke-width="1.5" /><path d="M90,50 L90,105" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="138.0" y="77.5" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">small F₁</text><path d="M400,155 L400,95" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="444.0" y="125.0" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">25 × F₁</text><text x="90.0" y="290.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">area A</text><text x="400.0" y="290.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">area 25A</text><text x="90.0" y="135.0" font-size="11" font-weight="600" fill="#d6453d" text-anchor="start" dominant-baseline="middle">↓ 50 cm</text><text x="445.0" y="182.0" font-size="11" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">↑ 2 cm</text><rect x="480" y="70" width="180" height="110" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="570.0" y="101.6" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Same ΔP everywhere:</text><text x="570.0" y="117.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">F₁/A₁ = F₂/A₂</text><text x="570.0" y="132.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Same volume moves:</text><text x="570.0" y="148.4" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A₁d₁ = A₂d₂</text><text x="570.0" y="198.4" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Work in = work out.</text><text x="570.0" y="212.8" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">A pressure rise anywhere in</text><text x="570.0" y="227.2" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">a closed fluid (e.g. CSF)</text><text x="570.0" y="241.6" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">reaches every point.</text></svg>
