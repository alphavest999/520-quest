<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Laminar versus turbulent flow</text><polyline points="40,80 300,80" fill="none" stroke="#1f2430" stroke-width="2.5"/><polyline points="40,220 300,220" fill="none" stroke="#1f2430" stroke-width="2.5"/><path d="M70,92 L121.02040816326529,92" stroke="#2f6fdb" stroke-width="2" fill="none" marker-end="url(#ablue)"/><path d="M70,108 L170.0,108" stroke="#2f6fdb" stroke-width="2" fill="none" marker-end="url(#ablue)"/><path d="M70,124 L203.3061224489796,124" stroke="#2f6fdb" stroke-width="2" fill="none" marker-end="url(#ablue)"/><path d="M70,140 L220.93877551020407,140" stroke="#2f6fdb" stroke-width="2" fill="none" marker-end="url(#ablue)"/><path d="M70,156 L222.89795918367346,156" stroke="#2f6fdb" stroke-width="2" fill="none" marker-end="url(#ablue)"/><path d="M70,172 L209.18367346938777,172" stroke="#2f6fdb" stroke-width="2" fill="none" marker-end="url(#ablue)"/><path d="M70,188 L179.79591836734693,188" stroke="#2f6fdb" stroke-width="2" fill="none" marker-end="url(#ablue)"/><path d="M70,204 L134.73469387755102,204" stroke="#2f6fdb" stroke-width="2" fill="none" marker-end="url(#ablue)"/><path d="M70,80 Q370,150 70,220" fill="none" stroke="#2f6fdb" stroke-width="1.5" stroke-dasharray="4 3"/><text x="170.0" y="52.2" font-size="12.5" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Laminar: smooth layers,</text><text x="170.0" y="67.8" font-size="12.5" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">fastest at the center</text><polyline points="370,80 640,80" fill="none" stroke="#1f2430" stroke-width="2.5"/><polyline points="370,220 640,220" fill="none" stroke="#1f2430" stroke-width="2.5"/><path d="M402,120 a18,14 0 1,1 18,14 a10,8 0 1,1 -6,-10" fill="none" stroke="#d6453d" stroke-width="2"/><path d="M462,175 a18,14 0 1,1 18,14 a10,8 0 1,1 -6,-10" fill="none" stroke="#d6453d" stroke-width="2"/><path d="M522,115 a18,14 0 1,1 18,14 a10,8 0 1,1 -6,-10" fill="none" stroke="#d6453d" stroke-width="2"/><path d="M582,170 a18,14 0 1,1 18,14 a10,8 0 1,1 -6,-10" fill="none" stroke="#d6453d" stroke-width="2"/><path d="M432,150 a18,14 0 1,1 18,14 a10,8 0 1,1 -6,-10" fill="none" stroke="#d6453d" stroke-width="2"/><path d="M552,145 a18,14 0 1,1 18,14 a10,8 0 1,1 -6,-10" fill="none" stroke="#d6453d" stroke-width="2"/><text x="505.0" y="52.2" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Turbulent: eddies waste energy</text><text x="505.0" y="67.8" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">(and make noise)</text><text x="340.0" y="260.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Laminar: Q ∝ ΔP (Poiseuille).   Turbulent: Q grows only about with √ΔP, so doubling ΔP gives ~1.4× Q.</text><text x="340.0" y="290.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Turbulence starts at high speed, wide tubes, low viscosity (high Reynolds number).</text><text x="340.0" y="312.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Korotkoff sounds: fast jets through a partly squeezed artery become turbulent.</text></svg>
