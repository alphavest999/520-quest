<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">What a floating object displaces</text><rect x="40" y="110" width="270" height="150" fill="#e6eefc" stroke="#8a93a3"/><rect x="140" y="95" width="60" height="45" fill="#ffffff" stroke="#138f9a" stroke-width="2" opacity="0.9"/><text x="170.0" y="75.0" font-size="12" font-weight="600" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">ice: displaces its own WEIGHT</text><text x="175.0" y="282.8" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Meltwater has that same weight, so it fills</text><text x="175.0" y="297.2" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exactly the hole the ice made: level unchanged.</text><rect x="370" y="110" width="270" height="150" fill="#e6eefc" stroke="#8a93a3"/><path d="M420,100 L560,100 L540,130 L440,130 Z" fill="#fdf1db" stroke="#d98a00" stroke-width="2"/><circle cx="490" cy="92" r="9" fill="#5b6474"/><circle cx="600" cy="245" r="9" fill="#5b6474"/><path d="M520,92 L595,230" stroke="#5b6474" stroke-width="1.5" fill="none" marker-end="url(#asub)" stroke-dasharray="6 4"/><text x="505.0" y="75.0" font-size="12" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">rock: in the boat, displaces its WEIGHT</text><text x="505.0" y="282.8" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">On the bottom it displaces only its VOLUME,</text><text x="505.0" y="297.2" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">which is less (rock is denser): level falls.</text></svg>
