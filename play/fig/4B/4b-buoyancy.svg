<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Archimedes: buoyant force = weight of fluid displaced</text><rect x="40" y="110" width="270" height="200" fill="#e6eefc" stroke="#8a93a3"/><rect x="135" y="170" width="80" height="60" rx="4" fill="#f1f3f6" stroke="#1f2430" stroke-width="1.5" /><polyline points="175,60 175,170" fill="none" stroke="#5b6474" stroke-width="1.5"/><rect x="150" y="40" width="50" height="22" rx="4" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5" /><text x="175.0" y="51.0" font-size="10.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">scale</text><path d="M160,230 L160,290" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="146.0" y="260.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">W</text><path d="M190,290 L190,233" stroke="#2f6fdb" stroke-width="3" fill="none" marker-end="url(#ablue)"/><text x="208.0" y="261.5" font-size="12.5" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">F_b</text><text x="250.0" y="137.8" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">reading =</text><text x="250.0" y="152.2" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">W − F_b</text><rect x="340" y="60" width="320" height="120" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="500.0" y="96.6" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Aluminum: 27.0 N in air, 17.0 N in water</text><text x="500.0" y="112.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">F_b = 10.0 N = ρ_water g V</text><text x="500.0" y="127.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Density = W / F_b × ρ_water = 2.70 g/cm³</text><text x="500.0" y="143.4" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Bone: 6.0 / (6.0 − 2.0) = 1.50 g/cm³</text><rect x="340" y="195" width="320" height="75" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="500.0" y="224.7" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Wood (0.001 m³, 600 kg/m³) held under:</text><text x="500.0" y="240.3" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">F_b 10 N − weight 6 N = string tension 4 N</text><text x="500.0" y="292.8" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Floating: submerged fraction = ρ_object / ρ_fluid.</text><text x="500.0" y="307.2" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Air in the lungs lowers whole-body density.</text></svg>
