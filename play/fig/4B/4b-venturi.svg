<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A constriction: faster flow, lower pressure</text><polygon points="40,120 230,120 300,160 380,160 450,120 640,120 640,280 450,280 380,240 300,240 230,280 40,280" fill="#e6eefc"/><polyline points="40,120 230,120 300,160 380,160 450,120 640,120" fill="none" stroke="#1f2430" stroke-width="2.5"/><polyline points="40,280 230,280 300,240 380,240 450,280 640,280" fill="none" stroke="#1f2430" stroke-width="2.5"/><rect x="127" y="30" width="16" height="90" fill="#e6eefc" stroke="#8a93a3"/><rect x="127" y="50" width="16" height="70" fill="#2f6fdb" opacity="0.6"/><rect x="332" y="115" width="16" height="45" fill="#e6eefc" stroke="#8a93a3"/><rect x="332" y="135" width="16" height="25" fill="#d6453d" opacity="0.6"/><rect x="537" y="30" width="16" height="90" fill="#e6eefc" stroke="#8a93a3"/><rect x="537" y="50" width="16" height="70" fill="#2f6fdb" opacity="0.6"/><path d="M80,200 L150,200" stroke="#2f6fdb" stroke-width="3" fill="none" marker-end="url(#ablue)"/><text x="115.0" y="186.0" font-size="12.5" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">v</text><path d="M300,200 L400,200" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="350.0" y="186.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">4v</text><path d="M500,200 L570,200" stroke="#2f6fdb" stroke-width="3" fill="none" marker-end="url(#ablue)"/><text x="535.0" y="186.0" font-size="12.5" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">v</text><text x="135.0" y="247.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">r = 1.00 cm</text><text x="135.0" y="262.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">15.9 cm/s</text><text x="340.0" y="217.5" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">r = 0.50 cm</text><text x="340.0" y="232.5" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">63.7 cm/s</text><text x="340.0" y="300.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A₁v₁ = A₂v₂: ¼ the area → 4× the speed.   P + ½ρv² = constant: faster → lower P.</text><text x="340.0" y="324.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Same idea: fast wind over a roof lowers the pressure above it. At high speed, turbulence adds extra loss.</text><text x="545.0" y="243.1" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">manometer tubes:</text><text x="545.0" y="256.9" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">height = static pressure</text></svg>
