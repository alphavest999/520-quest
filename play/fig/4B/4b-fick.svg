<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="350.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fick&#x27;s law of diffusion across the alveolar wall</text><rect x="60" y="70" width="170" height="150" rx="4" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5" /><text x="145.0" y="100.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ALVEOLUS</text><text x="145.0" y="125.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P(O₂) ≈ 100 mmHg</text><rect x="240" y="70" width="40" height="150" rx="4" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5" /><text x="260.0" y="240.0" font-size="10.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">membrane</text><text x="260.0" y="256.0" font-size="10.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">thickness T</text><rect x="290" y="70" width="170" height="150" rx="4" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5" /><text x="375.0" y="100.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CAPILLARY</text><text x="375.0" y="125.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P(O₂) ≈ 40 mmHg</text><path d="M200,150 L330,150" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M200,175 L330,175" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M200,200 L330,200" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="590.0" y="110.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">rate ∝ A × ΔP / T</text><text x="590.0" y="145.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">↑ area → faster</text><text x="590.0" y="165.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">↑ pressure gap → faster</text><text x="590.0" y="185.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">↑ thickness (fibrosis,</text><text x="590.0" y="202.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">edema) → slower</text><text x="350.0" y="290.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Emphysema lowers A; pulmonary fibrosis raises T. Both reduce O₂ transfer.</text></svg>
