<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Pressure in a fluid: P = P₀ + ρgh</text><circle cx="90" cy="200" r="50" fill="#fdf1db" stroke="#1f2430" stroke-width="2"/><text x="90.0" y="200.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">gas</text><path d="M140,200 L170,200 L170,290 L250,290 L250,110" fill="none" stroke="#1f2430" stroke-width="14" stroke-linejoin="round" opacity="0.25"/><polyline points="170,230 170,290 250,290 250,150" fill="none" stroke="#5b6474" stroke-width="10"/><polyline points="262,150 262,230" fill="none" stroke="#d6453d" stroke-width="1.5"/><text x="268.0" y="190.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="start" dominant-baseline="middle">h = 20 cm Hg</text><text x="250.0" y="95.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">open to air</text><text x="200.0" y="320.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P_gauge = ρgh = 13,600 × 10 × 0.20 ≈ 2.7 × 10⁴ Pa</text><rect x="430" y="100" width="160" height="170" fill="#e6eefc" stroke="#1f2430" stroke-width="2"/><path d="M625,250 L625,150" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="625.0" y="135.0" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">a = 2 m/s²</text><polyline points="440,200 580,200" fill="none" stroke="#5b6474" stroke-width="1" stroke-dasharray="6 4"/><text x="510.0" y="214.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">1 m deep</text><text x="520.0" y="62.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Water in a lift accelerating up</text><text x="510.0" y="292.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">g_eff = 10 + 2 = 12 m/s²</text><text x="510.0" y="307.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P_gauge = 1000 × 12 × 1 = 12,000 Pa</text></svg>
