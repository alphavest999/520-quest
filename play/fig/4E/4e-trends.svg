<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="370.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Periodic trends</text><rect x="40" y="60" width="360" height="220" rx="4" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5" /><text x="220.0" y="50.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">periodic table (main group)</text><path d="M60,90 L380,90" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="220.0" y="82.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">across a period: Zeff ↑</text><path d="M60,110 L60,265" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="150.0" y="186.2" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">down a group:</text><text x="150.0" y="200.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">new shell, more</text><text x="150.0" y="213.8" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">shielding</text><rect x="430" y="60" width="290" height="100" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="575.0" y="83.8" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">IONIZATION ENERGY and</text><text x="575.0" y="96.9" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ELECTRON AFFINITY (magnitude)</text><text x="575.0" y="110.0" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">↑ across, ↓ down</text><text x="575.0" y="123.1" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(Cl releases most on gaining e⁻: −349 kJ/mol;</text><text x="575.0" y="136.2" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">F slightly less, −328, small crowded 2p)</text><rect x="430" y="170" width="290" height="110" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="575.0" y="198.8" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ATOMIC RADIUS</text><text x="575.0" y="211.9" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">↓ across (Na → Cl: 11 → 17 protons,</text><text x="575.0" y="225.0" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">same inner shielding), ↑ down</text><text x="575.0" y="238.1" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Zr ≈ Hf: 4f electrons shield poorly</text><text x="575.0" y="251.2" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(lanthanide contraction)</text><text x="380.0" y="305.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Isoelectronic series (10 e⁻): O²⁻ (8 p⁺) &gt; F⁻ (9) &gt; Ne (10) &gt; Na⁺ (11) in radius.</text><text x="380.0" y="327.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">More protons per electron = smaller and harder to ionize, so Na⁺ has the highest IE.</text></svg>
