" text-anchor="middle" dominant-baseline="middle">e⁺</text><text x="380.0" y="140.0" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">e⁻</text><circle cx="340" cy="140" r="26" fill="none" stroke="#d98a00" stroke-width="2" stroke-dasharray="4 3"/><path d="M310,120 L120,60" stroke="#d98a00" stroke-width="3" fill="none" marker-end="url(#aamber)"/><text x="205.0" y="76.0" font-size="12.5" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">γ 511 keV</text><path d="M370,160 L560,220" stroke="#d98a00" stroke-width="3" fill="none" marker-end="url(#aamber)"/><text x="475.0" y="204.0" font-size="12.5" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">γ 511 keV</text><text x="340.0" y="242.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Two 511 keV photons (mc² of each particle) leave back to back (~180°).</text><text x="340.0" y="257.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Detecting both at once places the event on the line between the detectors.</text></svg>
