<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 456" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Steroid receptors are ligand-activated transcription factors</text><rect x="20" y="70" width="640" height="250" rx="40" fill="#f1f3f6" stroke="#d98a00" stroke-width="5"/><text x="80.0" y="56.0" font-size="12" font-weight="400" fill="#d98a00" text-anchor="start" dominant-baseline="middle">plasma membrane (lipid bilayer)</text><polygon points="60,30 74,38 74,54 60,62 46,54 46,38" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><text x="60.0" y="46.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">S</text><path d="M70,64 L120,120" fill="none" stroke="#d98a00" stroke-width="1.8" marker-end="url(#ah)"/><text x="150.0" y="100.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">steroid diffuses through</text><ellipse cx="150" cy="160" rx="40" ry="20" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.6"/><text x="150.0" y="160.0" font-size="11" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">receptor</text><ellipse cx="150" cy="196" rx="30" ry="13" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.6"/><text x="150.0" y="196.0" font-size="10" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Hsp90</text><text x="150.0" y="224.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Hsp90 released</text><path d="M195,166 L330,186" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="262.5" y="162.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">R·S enters nucleus</text><ellipse cx="490" cy="200" rx="150" ry="100" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.6"/><text x="490.0" y="116.0" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Nucleus</text><rect x="380" y="214" width="70" height="24" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="415.0" y="226.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">HRE</text><rect x="450" y="214" width="160" height="24" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="530.0" y="226.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">target gene</text><ellipse cx="400" cy="196" rx="26" ry="14" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.6"/><text x="400.0" y="196.0" font-size="10" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">R·S</text><ellipse cx="446" cy="196" rx="26" ry="14" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.6"/><text x="446.0" y="196.0" font-size="10" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">R·S</text><text x="424.0" y="168.0" font-size="12" font-weight="600" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">dimer on DNA</text><path d="M445,250 L585,250" fill="none" stroke="#1f9d63" stroke-width="2" marker-end="url(#ah)"/><text x="515.0" y="264.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">transcription up or down</text><text x="340.0" y="342.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Effect is slow (hours) and lasts long: new mRNA and protein must be made.</text></svg>
