<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Negative vs positive control of transcription</text><rect x="20" y="46" width="310" height="180" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="175.0" y="70.0" font-size="15" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Negative control</text><text x="175.0" y="92.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bound protein = OFF</text><rect x="60" y="136" width="50" height="26" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="85.0" y="149.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P</text><rect x="110" y="136" width="40" height="26" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="130.0" y="149.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">O</text><rect x="150" y="136" width="160" height="26" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="230.0" y="149.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">genes</text><ellipse cx="130" cy="120" rx="34" ry="16" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.6"/><text x="130.0" y="120.0" font-size="11" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">LacI</text><text x="185.0" y="182.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">repressor on operator blocks RNA pol</text><rect x="350" y="46" width="310" height="180" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="505.0" y="70.0" font-size="15" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Positive control</text><text x="505.0" y="92.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bound protein = ON</text><rect x="410" y="136" width="50" height="26" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="435.0" y="149.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P</text><rect x="460" y="136" width="180" height="26" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="550.0" y="149.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">genes</text><rect x="370" y="136" width="40" height="26" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="390.0" y="149.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CAP</text><ellipse cx="390" cy="120" rx="40" ry="16" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><text x="390.0" y="120.0" font-size="11" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CAP·cAMP</text><text x="535.0" y="182.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">activator helps RNA pol bind</text><text x="340.0" y="250.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The lac operon has both: LacI (negative) and CAP·cAMP (positive).</text><text x="340.0" y="386.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Ask: does the protein&#x27;s binding turn transcription off (negative) or on (positive)?</text></svg>
