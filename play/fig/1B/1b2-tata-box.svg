<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Where the TATA box acts, and where the other signals sit</text><polyline points="20,210 660,210" fill="none" stroke="#5b6474" stroke-width="4"/><rect x="110" y="197" width="46" height="26" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="133.0" y="210.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">TATA</text><text x="133.0" y="240.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">−30 to −25</text><polyline points="190,210 190,176 225,176" fill="none" stroke="#1f9d63" stroke-width="2.5"/><path d="M215,176 L235,176" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><text x="190.0" y="240.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">+1</text><rect x="190" y="199" width="120" height="22" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="250.0" y="210.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 1</text><rect x="310" y="204" width="170" height="12" rx="3" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="395.0" y="232.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">intron</text><rect x="480" y="199" width="150" height="22" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="555.0" y="210.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 2</text><path d="M95,194 Q133,164 171,194" fill="none" stroke="#7a4cd9" stroke-width="10" stroke-linecap="round"/><text x="133.0" y="148.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">TBP (in TFIID)</text><text x="133.0" y="108.5" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">bends DNA; recruits TFIIB,</text><text x="133.0" y="123.5" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">other factors and RNA pol II</text><text x="270.0" y="262.0" font-size="12" font-weight="600" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">AUG start codon</text><path d="M270,252 L270,223" fill="none" stroke="#5b6474" stroke-width="1.8" marker-end="url(#ah)"/><text x="270.0" y="280.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(in the mRNA, read later)</text><text x="450.0" y="146.0" font-size="12" font-weight="600" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">branch-point A</text><path d="M450,156 L450,201" fill="none" stroke="#5b6474" stroke-width="1.8" marker-end="url(#ah)"/><text x="450.0" y="126.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(used in splicing)</text><text x="600.0" y="262.0" font-size="12" font-weight="600" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">AAUAAA signal</text><path d="M600,252 L600,223" fill="none" stroke="#5b6474" stroke-width="1.8" marker-end="url(#ah)"/><text x="600.0" y="280.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(cleavage + poly(A))</text><rect x="20" y="312" width="640" height="92" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="240.0" y="336.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">AUG is in the mRNA and acts at translation</text><text x="240.0" y="362.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">AAUAAA lies near the 3′ end of the transcript</text><text x="240.0" y="388.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">an adenine inside the intron, used by the spliceosome</text></svg>
