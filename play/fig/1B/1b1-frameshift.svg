<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Why a 1-nt insertion near the start is the worst</text><text x="20.0" y="56.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Original</text><text x="20.0" y="78.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">AUG CUG AAA GGU CAU UCC GAC UUU GGC AAG UAA</text><text x="20.0" y="100.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">protein: M-L-K-G-H-S-D-F-G-K-STOP   (10 aa)</text><text x="20.0" y="128.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">3rd-position swap</text><text x="20.0" y="150.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">AUG CUA AAA GGU CAU UCC GAC UUU GGC AAG UAA</text><text x="20.0" y="172.0" font-size="13" font-weight="400" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">protein: M-L-K-G-H-S-D-F-G-K-STOP   (10 aa)</text><text x="20.0" y="200.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">+3 nt near end</text><text x="20.0" y="222.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">AUG CUG AAA GGU CAU UCC GAC UUU GGC GCU AAG UAA</text><text x="20.0" y="244.0" font-size="13" font-weight="400" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">protein: M-L-K-G-H-S-D-F-G-A-K-STOP   (11 aa)</text><text x="20.0" y="272.0" font-size="13.5" font-weight="700" fill="#d6453d" text-anchor="start" dominant-baseline="middle">+1 nt near start</text><text x="20.0" y="294.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">AUG CAU GAA AGG UCA UUC CGA CUU UGG CAA GUA A</text><text x="20.0" y="316.0" font-size="13" font-weight="400" fill="#d6453d" text-anchor="start" dominant-baseline="middle">protein: M-H-E-R-S-F-R-L-W-Q-V...   (wrong from codon 2 on)</text><text x="340.0" y="375.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">One-letter amino acid codes. Changes in an intron far from splice sites are removed with the intron.</text></svg>
