<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">lac operon output needs BOTH: repressor off and CAP on</text><text x="70.0" y="66.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glucose</text><text x="160.0" y="66.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lactose</text><text x="250.0" y="66.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cAMP</text><text x="350.0" y="66.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CAP·cAMP</text><text x="470.0" y="66.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Repressor</text><text x="590.0" y="66.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">lac mRNA</text><rect x="24" y="82" width="632" height="36" rx="8" fill="#fbe7e5" stroke="none" stroke-width="2.5"/><text x="70.0" y="100.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+</text><text x="160.0" y="100.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">−</text><text x="250.0" y="100.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">low</text><text x="350.0" y="100.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">not bound</text><text x="470.0" y="100.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">on operator</text><text x="590.0" y="100.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">≈ none</text><rect x="24" y="126" width="632" height="36" rx="8" fill="#fdf1db" stroke="none"/><text x="70.0" y="144.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+</text><text x="160.0" y="144.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+</text><text x="250.0" y="144.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">low</text><text x="350.0" y="144.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">not bound</text><text x="470.0" y="144.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">off (inducer)</text><text x="590.0" y="144.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">LOW</text><rect x="24" y="170" width="632" height="36" rx="8" fill="#fbe7e5" stroke="none" stroke-width="2.5"/><text x="70.0" y="188.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">−</text><text x="160.0" y="188.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">−</text><text x="250.0" y="188.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">high</text><text x="350.0" y="188.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bound</text><text x="470.0" y="188.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">on operator</text><text x="590.0" y="188.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">≈ none</text><rect x="24" y="214" width="632" height="36" rx="8" fill="#e3f5ec" stroke="none" stroke-width="2.5"/><text x="70.0" y="232.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">−</text><text x="160.0" y="232.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+</text><text x="250.0" y="232.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">high</text><text x="350.0" y="232.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bound</text><text x="470.0" y="232.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">off (inducer)</text><text x="590.0" y="232.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">HIGH</text><text x="340.0" y="296.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glucose present → cAMP low → CAP cannot help RNA polymerase bind the weak lac promoter.</text><text x="340.0" y="406.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Highest output: no glucose and lactose present.</text></svg>
