<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Scanning ribosomes usually start at the first good AUG</text><polyline points="70,150 640,150" fill="none" stroke="#1f2430" stroke-width="3"/><circle cx="56" cy="150" r="14" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="56.0" y="150.0" font-size="10" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">m⁷G</text><text x="56.0" y="178.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">5′ cap</text><rect x="150" y="136" width="46" height="28" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="173.0" y="150.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">uAUG</text><rect x="310" y="136" width="46" height="28" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="333.0" y="150.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">AUG</text><rect x="356" y="136" width="200" height="28" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="456.0" y="150.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">normal coding sequence</text><text x="600.0" y="124.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">AAAA…</text><text x="600.0" y="176.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">poly(A) 3′</text><text x="230.0" y="122.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">5′ UTR</text><ellipse cx="110" cy="110" rx="34" ry="18" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.6"/><text x="110.0" y="110.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">40S</text><path d="M148,96 L240,96" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="194.0" y="84.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">scans 5′→3′</text><path d="M173,172 L173,196 L340,196 L340,172" fill="none" stroke="#d6453d" stroke-width="2"/><text x="256.0" y="214.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">out-of-frame peptide; ends at a stop codon</text><text x="256.0" y="230.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">(usually not the normal protein)</text><rect x="30" y="260" width="620" height="70" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="340.0" y="284.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Most ribosomes start at the new upstream AUG, so fewer reach the normal AUG.</text><text x="340.0" y="306.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Strong context = Kozak consensus, e.g. gccRccAUGG (R = A or G).</text></svg>
