<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Alternative splicing: one gene, several proteins</text><text x="20.0" y="54.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">pre-mRNA (one gene)</text><polyline points="90,88 560,88" fill="none" stroke="#8a93a3" stroke-width="3"/><rect x="20" y="73" width="70" height="30" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="55.0" y="88.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 1</text><rect x="150" y="73" width="70" height="30" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="185.0" y="88.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 2</text><rect x="280" y="73" width="70" height="30" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="315.0" y="88.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 3a</text><rect x="410" y="73" width="70" height="30" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="445.0" y="88.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 3b</text><rect x="560" y="73" width="70" height="30" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="595.0" y="88.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 4</text><text x="20.0" y="166.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">mRNA → isoform A (e.g. in muscle)</text><rect x="20" y="185" width="70" height="30" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="55.0" y="200.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 1</text><rect x="90" y="185" width="70" height="30" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="125.0" y="200.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 2</text><rect x="160" y="185" width="70" height="30" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="195.0" y="200.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 3a</text><rect x="230" y="185" width="70" height="30" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="265.0" y="200.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 4</text><ellipse cx="480" cy="200" rx="70" ry="22" fill="#fdf1db" stroke="#d98a00" stroke-width="2"/><text x="480.0" y="200.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">isoform A</text><path d="M310,200 L402,200" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="356.0" y="190.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">translate</text><text x="20.0" y="256.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">mRNA → isoform B (e.g. in neurons)</text><rect x="20" y="275" width="70" height="30" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="55.0" y="290.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 1</text><rect x="90" y="275" width="70" height="30" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="125.0" y="290.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 2</text><rect x="160" y="275" width="70" height="30" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="195.0" y="290.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 3b</text><rect x="230" y="275" width="70" height="30" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="265.0" y="290.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exon 4</text><ellipse cx="480" cy="290" rx="70" ry="22" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><text x="480.0" y="290.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">isoform B</text><path d="M310,290 L402,290" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="356.0" y="280.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">translate</text><rect x="20" y="330" width="650" height="86" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="345.0" y="350.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Same reading frame logic, same chromosome, introns still removed:</text><text x="345.0" y="404.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">≈20,000 human genes give a much larger set of proteins this way.</text></svg>
