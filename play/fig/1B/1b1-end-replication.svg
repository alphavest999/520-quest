<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The end-replication problem</text><text x="20.0" y="55.0" font-size="13.5" font-weight="700" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">1  The last Okazaki fragment starts with an RNA primer at the very end</text><polyline points="40,85 600,85" fill="none" stroke="#1f2430" stroke-width="3"/><text x="30.0" y="85.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">5′</text><text x="608.0" y="85.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">3′</text><text x="540.0" y="71.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">parental (template) strand</text><polyline points="40,103 520,103" fill="none" stroke="#2f6fdb" stroke-width="6"/><polyline points="520,103 600,103" fill="none" stroke="#d6453d" stroke-width="6"/><text x="30.0" y="103.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">3′</text><text x="608.0" y="103.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">5′</text><text x="560.0" y="122.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">primer</text><text x="20.0" y="160.0" font-size="13.5" font-weight="700" fill="#d6453d" text-anchor="start" dominant-baseline="middle">2  The primer is removed. To fill the gap, polymerase would need a 3′-OH on its right: none exists</text><polyline points="40,190 600,190" fill="none" stroke="#1f2430" stroke-width="3"/><text x="30.0" y="190.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">5′</text><text x="608.0" y="190.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">3′</text><polyline points="40,208 520,208" fill="none" stroke="#2f6fdb" stroke-width="6"/><text x="30.0" y="208.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">3′</text><text x="530.0" y="208.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">5′</text><rect x="522" y="198" width="78" height="20" fill="none" stroke="#d6453d" stroke-dasharray="4 3"/><text x="561.0" y="232.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">unfillable gap</text><text x="20.0" y="270.0" font-size="13.5" font-weight="700" fill="#d98a00" text-anchor="start" dominant-baseline="middle">3  The new strand is shorter; the template is left with a 3′ overhang</text><polyline points="40,300 600,300" fill="none" stroke="#1f2430" stroke-width="3"/><text x="30.0" y="300.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">5′</text><text x="608.0" y="300.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">3′</text><polyline points="40,318 520,318" fill="none" stroke="#2f6fdb" stroke-width="6"/><text x="30.0" y="318.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">3′</text><text x="530.0" y="318.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">5′</text><text x="560.0" y="285.0" font-size="12" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">3′ overhang</text><rect x="20" y="345" width="640" height="60" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="363.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The leading strand can be copied right to the end; the problem is only the lagging-strand end.</text><text x="340.0" y="385.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Each division loses telomere sequence. Telomerase adds repeats back; ligase cannot help with a gap.</text></svg>
