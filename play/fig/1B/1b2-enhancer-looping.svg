<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Enhancers act at a distance by DNA looping</text><path d="M670,300 L330,300 C200,300 40,320 40,230 C40,140 170,125 230,150" fill="none" stroke="#5b6474" stroke-width="5"/><rect x="495" y="289" width="170" height="22" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="580.0" y="300.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">gene (exons + introns)</text><polyline points="478,300 478,270 500,270" fill="none" stroke="#1f9d63" stroke-width="2.5"/><path d="M496,270 L514,270" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><rect x="395" y="289" width="46" height="22" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="418.0" y="300.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">TATA</text><text x="418.0" y="326.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">core promoter</text><path d="M180,134 L232,149" fill="none" stroke="#138f9a" stroke-width="12" stroke-linecap="round"/><text x="205.0" y="178.0" font-size="13" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">enhancer</text><rect x="170" y="100" width="72" height="34" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="206.0" y="117.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DBD</text><rect x="242" y="100" width="72" height="34" rx="10" fill="#fbe6f1" stroke="#d23c8a" stroke-width="1.5"/><text x="278.0" y="117.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">AD</text><text x="242.0" y="84.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">activator protein</text><ellipse cx="385" cy="150" rx="44" ry="30" fill="#f1f3f6" stroke="#5b6474" stroke-width="2"/><text x="385.0" y="150.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Mediator</text><ellipse cx="412" cy="248" rx="56" ry="36" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><text x="412.0" y="240.5" font-size="12" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">RNA pol II +</text><text x="412.0" y="255.5" font-size="12" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">general factors</text><polyline points="385,180 400,212" fill="none" stroke="#5b6474" stroke-width="3"/><rect x="398" y="275" width="40" height="14" rx="4" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="360.0" y="286.0" font-size="12" font-weight="600" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">TFIID</text><polyline points="314,117 346,138" fill="none" stroke="#d23c8a" stroke-width="3"/><text x="560.0" y="77.5" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">DNA-binding domain (DBD):</text><text x="560.0" y="92.5" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">zinc finger, helix-turn-helix</text><text x="560.0" y="107.5" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">or leucine zipper reads the</text><text x="560.0" y="122.5" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">enhancer sequence</text><text x="560.0" y="165.0" font-size="12" font-weight="400" fill="#d23c8a" text-anchor="middle" dominant-baseline="middle">activation domain (AD):</text><text x="560.0" y="180.0" font-size="12" font-weight="400" fill="#d23c8a" text-anchor="middle" dominant-baseline="middle">recruits Mediator, coactivators</text><text x="560.0" y="195.0" font-size="12" font-weight="400" fill="#d23c8a" text-anchor="middle" dominant-baseline="middle">and chromatin modifiers</text><text x="170.0" y="332.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">loop: the enhancer may be thousands of bp away,</text><text x="170.0" y="347.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">upstream, downstream or in an intron</text><rect x="20" y="372" width="320" height="84" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="180.0" y="397.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Core promoter: at the start site;</text><text x="180.0" y="414.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">fixed orientation; binds general</text><text x="180.0" y="430.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">factors + RNA pol II</text><rect x="350" y="372" width="320" height="84" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="510.0" y="397.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Enhancer: far away, either</text><text x="510.0" y="414.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">orientation; binds activators;</text><text x="510.0" y="430.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">raises transcription</text></svg>
