<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Normal leading strand + many short pieces = no ligase</text><text x="20.0" y="58.0" font-size="13.5" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">Normal cell: Okazaki fragments joined into one strand</text><polyline points="40,88 600,88" fill="none" stroke="#2f6fdb" stroke-width="5"/><path d="M598,88 L620,88" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><text x="630.0" y="88.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">leading</text><polyline points="40,118 600,118" fill="none" stroke="#2f6fdb" stroke-width="5"/><text x="630.0" y="118.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">lagging</text><text x="20.0" y="158.0" font-size="13.5" font-weight="700" fill="#d6453d" text-anchor="start" dominant-baseline="middle">Mutant at restrictive temperature: fragments made but never joined</text><polyline points="40,188 600,188" fill="none" stroke="#2f6fdb" stroke-width="5"/><path d="M598,188 L620,188" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><text x="630.0" y="188.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">leading</text><polyline points="42,218 128,218" fill="none" stroke="#2f6fdb" stroke-width="5"/><polyline points="136,218 222,218" fill="none" stroke="#2f6fdb" stroke-width="5"/><polyline points="230,218 316,218" fill="none" stroke="#2f6fdb" stroke-width="5"/><polyline points="324,218 410,218" fill="none" stroke="#2f6fdb" stroke-width="5"/><polyline points="418,218 504,218" fill="none" stroke="#2f6fdb" stroke-width="5"/><polyline points="512,218 598,218" fill="none" stroke="#2f6fdb" stroke-width="5"/><text x="630.0" y="218.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">lagging</text><rect x="40" y="272" width="600" height="32" rx="8" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="55.0" y="288.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">If helicase failed</text><text x="250.0" y="288.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">no unwinding → neither strand made</text><rect x="40" y="312" width="600" height="32" rx="8" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="55.0" y="328.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">If primase failed</text><text x="250.0" y="328.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">no primers → lagging pieces never start</text><rect x="40" y="352" width="600" height="32" rx="8" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="55.0" y="368.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">If topoisomerase failed</text><text x="250.0" y="368.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">supercoils build up → whole fork stalls</text><rect x="40" y="392" width="600" height="32" rx="8" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="55.0" y="408.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">If ligase failed</text><text x="250.0" y="408.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">pieces made but nicks left open</text></svg>
