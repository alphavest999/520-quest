<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Telomerase: a reverse transcriptase with its own RNA template</text><text x="20.0" y="52.0" font-size="13.5" font-weight="700" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">1  The RNA template base-pairs with the 3′ overhang (TTAGGG repeats)</text><text x="38.0" y="88.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">5′</text><text x="60.0" y="88.0" font-size="16" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">T</text><text x="90.0" y="88.0" font-size="16" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">T</text><text x="120.0" y="88.0" font-size="16" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">A</text><text x="150.0" y="88.0" font-size="16" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">G</text><text x="180.0" y="88.0" font-size="16" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">G</text><text x="210.0" y="88.0" font-size="16" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">G</text><text x="240.0" y="88.0" font-size="16" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">T</text><text x="270.0" y="88.0" font-size="16" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">T</text><text x="300.0" y="88.0" font-size="16" font-weight="700" fill="#2f6fdb" t