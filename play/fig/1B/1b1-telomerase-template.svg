/text><text x="420.0" y="206.0" font-size="16" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">T</text><text x="450.0" y="206.0" font-size="16" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">T</text><text x="480.0" y="206.0" font-size="16" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">A</text><text x="510.0" y="206.0" font-size="16" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">G</text><text x="540.0" y="206.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">3′</text><rect x="192" y="226" width="336" height="32" rx="8" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="180.0" y="242.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3′</text><text x="207.0" y="242.0" font-size="15" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">C</text><text x="237.0" y="242.0" font-size="15" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">A</text><text x="267.0" y="242.0" font-size="15" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">A</text><text x="297.0" y="242.0" font-size="15" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">U</text><text x="327.0" y="242.0" font-size="15" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">C</text><text x="357.0" y="242.0" font-size="15" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">C</text><text x="387.0" y="242.0" font-size="15" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">C</text><text x="417.0" y="242.0" font-size="15" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">A</text><text x="447.0" y="242.0" font-size="15" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">A</text><text x="477.0" y="242.0" font-size="15" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">U</text><text x="507.0" y="242.0" font-size="15" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">C</text><text x="538.0" y="242.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">5′</text><text x="20.0" y="288.0" font-size="13.5" font-weight="700" fill="#d98a00" text-anchor="start" dominant-baseline="middle">3  It slides along (translocates) and repeats; primase + polymerase then fill in the other strand</text><rect x="20" y="308" width="640" height="56" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="326.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Telomerase = protein (TERT, reverse transcriptase) + RNA (carries the template).</text><text x="340.0" y="346.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">It extends the 3′ end, like every polymerase, one nucleotide at a time.</text></svg>
