<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A polyubiquitin chain marks a protein for the proteasome</text><rect x="40" y="60" width="110" height="50" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="95.0" y="85.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E1</text><text x="95.0" y="128.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">activates Ub (ATP)</text><path d="M150,85 L180,85" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="180" y="60" width="110" height="50" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="235.0" y="85.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E2</text><text x="235.0" y="128.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">carries Ub</text><path d="M290,85 L320,85" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="320" y="60" width="110" height="50" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="375.0" y="85.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E3 ligase</text><text x="375.0" y="128.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">picks the target</text><path d="M430,85 L458,85" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><ellipse cx="510" cy="90" rx="50" ry="30" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.6"/><text x="510.0" y="90.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">target</text><circle cx="570" cy="90" r="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="591" cy="90" r="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="612" cy="90" r="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="633" cy="90" r="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="600.0" y="62.0" font-size="12" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">polyubiquitin (≥4 Ub)</text><path d="M500,122 L492,176" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="420" y="180" width="140" height="80" rx="16" fill="#f1f3f6" stroke="#1f2430" stroke-width="1.6"/><polyline points="430,196 550,196" fill="none" stroke="#8a93a3" stroke-width="1"/><polyline points="430,212 550,212" fill="none" stroke="#8a93a3" stroke-width="1"/><polyline points="430,228 550,228" fill="none" stroke="#8a93a3" stroke-width="1"/><polyline points="430,244 550,244" fill="none" stroke="#8a93a3" stroke-width="1"/><text x="490.0" y="274.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">26S proteasome</text><path d="M560,220 L602,220" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="608.0" y="212.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">short</text><text x="608.0" y="228.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">peptides</text><path d="M420,220 L340,220" fill="none" stroke="#1f2430" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="300.0" y="204.0" font-size="12" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">ubiquitin</text><text x="300.0" y="238.0" font-size="12" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">recycled</text><text x="130.0" y="262.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Used for: misfolded proteins,</text><text x="130.0" y="278.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">cyclins, short-lived regulators</text><text x="340.0" y="400.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Ubiquitin is a 76-amino-acid protein; chains linked through Lys48 signal degradation.</text></svg>
