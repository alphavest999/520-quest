 fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">T</text><text x="148.0" y="275.0" font-size="15" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">G</text><text x="182.0" y="275.0" font-size="15" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">C</text><text x="216.0" y="275.0" font-size="15" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">C</text><text x="250.0" y="275.0" font-size="15" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">T</text><text x="284.0" y="275.0" font-size="15" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">A</text><text x="318.0" y="275.0" font-size="15" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">A</text><text x="50.0" y="275.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">5′</text><text x="50.0" y="303.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3′</text><text x="364.0" y="275.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">← corrected</text><rect x="20" y="330" width="640" height="58" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="348.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3′→5′ exo = proofreading at the growing end (≈100× fewer errors).</text><text x="340.0" y="370.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">5′→3′ exo (pol I) removes primers ahead; no double-strand cuts or ligation are involved.</text></svg>
