<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Two accuracy checks, and only one looks at the amino acid</text><rect x="20" y="46" width="640" height="170" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="40.0" y="68.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">Check 1: aminoacyl-tRNA synthetase (cytosol, before the ribosome)</text><rect x="40" y="86" width="290" height="44" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="185.0" y="108.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">amino acid + ATP → aminoacyl-AMP + PPᵢ</text><rect x="345" y="86" width="295" height="44" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="492.5" y="108.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">aminoacyl-AMP + tRNA → aa-tRNA + AMP</text><text x="40.0" y="152.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">The enzyme must recognize BOTH the right amino acid and the right tRNA (anticodon and</text><text x="40.0" y="169.6" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">acceptor stem). Many synthetases also have an editing site that hydrolyzes a wrong amino acid.</text><text x="40.0" y="187.1" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Usually one synthetase per amino acid (about 20 kinds); error rate roughly 1 in 10⁴ or less.</text><path d="M340,218 L340,250" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="252" width="640" height="120" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="40.0" y="274.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">Check 2: ribosome (small subunit decoding centre)</text><text x="40.0" y="300.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Checks only codon–anticodon base pairing in the A site.</text><text x="40.0" y="317.6" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">It never inspects the amino acid, so a tRNA charged with the wrong amino acid</text><text x="40.0" y="335.1" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">puts that wrong amino acid into the protein: check 1 is the only guard.</text></svg>
