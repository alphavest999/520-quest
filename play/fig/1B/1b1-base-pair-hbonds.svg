<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Why G–C pairs hold the helix together more tightly</text><rect x="40" y="60" width="170" height="104" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="125.0" y="102.6" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Adenine</text><text x="125.0" y="121.4" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(purine)</text><rect x="470" y="60" width="150" height="104" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="545.0" y="102.6" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Thymine</text><text x="545.0" y="121.4" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(pyrimidine)</text><text x="218.0" y="96.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">N6–H</text><text x="462.0" y="96.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="end" dominant-baseline="middle">O4</text><polyline points="285,96 395,96" fill="none" stroke="#1f9d63" stroke-width="2.2" stroke-dasharray="6 4"/><text x="218.0" y="128.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">N1</text><text x="462.0" y="128.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="end" dominant-baseline="middle">H–N3</text><polyline points="285,128 395,128" fill="none" stroke="#1f9d63" stroke-width="2.2" stroke-dasharray="6 4"/><text x="340.0" y="50.0" font-size="13" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">2 hydrogen bonds</text><rect x="40" y="190" width="170" height="136" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="125.0" y="248.6" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Guanine</text><text x="125.0" y="267.4" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(purine)</text><rect x="470" y="190" width="150" height="136" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="545.0" y="248.6" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cytosine</text><text x="545.0" y="267.4" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(pyrimidine)</text><text x="218.0" y="226.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">O6</text><text x="462.0" y="226.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="end" dominant-baseline="middle">H–N4</text><polyline points="285,226 395,226" fill="none" stroke="#1f9d63" stroke-width="2.2" stroke-dasharray="6 4"/><text x="218.0" y="258.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">N1–H</text><text x="462.0" y="258.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="end" dominant-baseline="middle">N3</text><polyline points="285,258 395,258" fill="none" stroke="#1f9d63" stroke-width="2.2" stroke-dasharray="6 4"/><text x="218.0" y="290.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">N2–H</text><text x="462.0" y="290.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="end" dominant-baseline="middle">O2</text><polyline points="285,290 395,290" fill="none" stroke="#1f9d63" stroke-width="2.2" stroke-dasharray="6 4"/><text x="340.0" y="180.0" font-size="13" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">3 hydrogen bonds</text><rect x="40" y="334" width="600" height="58" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="352.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Both pairs: noncovalent H-bonds (dashed) + base stacking, which is stronger for G–C steps.</text><text x="340.0" y="374.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Every pair has one purine; every nucleotide has one backbone link, whatever its base.</text></svg>
