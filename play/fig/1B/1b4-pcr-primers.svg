<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 425" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Two primers, one on each strand, define both ends of the product</text><rect x="220" y="78" width="240" height="94" rx="6" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="340.0" y="125.0" font-size="13" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">target region</text><polyline points="70,100 610,100" fill="none" stroke="#1f2430" stroke-width="3"/><polyline points="70,150 610,150" fill="none" stroke="#1f2430" stroke-width="3"/><text x="52.0" y="100.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">5′</text><text x="628.0" y="100.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">3′</text><text x="52.0" y="150.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">3′</text><text x="628.0" y="150.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">5′</text><text x="340.0" y="185.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">template duplex; after denaturation the two strands separate:</text><polyline points="70,255 610,255" fill="none" stroke="#1f2430" stroke-width="3"/><text x="52.0" y="255.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">3′</text><text x="628.0" y="255.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">5′</text><polyline points="222,241 282,241" fill="none" stroke="#7a4cd9" stroke-width="6"/><path d="M282,241 L440,241" fill="none" stroke="#1f9d63" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="252.0" y="225.0" font-size="12.5" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">forward primer 5′→3′</text><text x="340.0" y="273.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bottom strand: forward primer anneals, extends to the right</text><polyline points="70,325 610,325" fill="none" stroke="#1f2430" stroke-width="3"/><text x="52.0" y="325.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">5′</text><text x="628.0" y="325.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">3′</text><polyline points="398,339 458,339" fill="none" stroke="#7a4cd9" stroke-width="6"/><path d="M398,339 L240,339" fill="none" stroke="#1f9d63" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="428.0" y="359.0" font-size="12.5" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">reverse primer 3′←5′</text><text x="340.0" y="307.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">top strand: reverse primer anneals, extends to the left</text><text x="340.0" y="387.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3′ ends face each other, so each new strand contains the other primer&#x27;s binding site:</text><text x="340.0" y="402.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">the product (between the primers) doubles every cycle.</text></svg>
