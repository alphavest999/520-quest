<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Mismatch repair: the methyl tag marks the old strand</text><polyline points="80,110 640,110" fill="none" stroke="#1f2430" stroke-width="4"/><polyline points="80,150 640,150" fill="none" stroke="#2f6fdb" stroke-width="4"/><text x="72.0" y="110.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="end" dominant-baseline="middle">parent</text><text x="72.0" y="150.0" font-size="12.5" font-weight="400" fill="#2f6fdb" text-anchor="end" dominant-baseline="middle">new</text><text x="130.0" y="80.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">GATC</text><polyline points="130,110 130,94" fill="none" stroke="#7a4cd9" stroke-width="2"/><circle cx="130" cy="90" r="0" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="156.0" y="96.0" font-size="12" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">CH₃</text><text x="130.0" y="172.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">GATC (no CH₃ yet)</text><text x="560.0" y="80.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">GATC</text><polyline points="560,110 560,94" fill="none" stroke="#7a4cd9" stroke-width="2"/><circle cx="560" cy="90" r="0" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="586.0" y="96.0" font-size="12" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">CH₃</text><text x="560.0" y="172.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">GATC (no CH₃ yet)</text><circle cx="340" cy="130.0" r="14" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="340.0" y="130.0" font-size="11" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">G·T</text><rect x="305" y="58" width="70" height="26" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="340.0" y="71.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">MutS</text><rect x="215" y="184" width="120" height="26" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="275.0" y="197.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">MutH nicks here</text><polyline points="250,184 132,152" fill="none" stroke="#138f9a" stroke-width="1.5"/><text x="40.0" y="240.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">1  MutS binds the mismatch; MutL links it to MutH at a nearby GATC</text><text x="40.0" y="266.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">2  MutH nicks the UNMETHYLATED (new) strand: the old strand is trusted</text><text x="40.0" y="292.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">3  Exonuclease removes the new-strand stretch containing the wrong base</text><text x="40.0" y="318.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">4  DNA polymerase III refills the gap from the parent template; ligase seals</text><text x="340.0" y="404.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Eukaryotes use MSH/MLH proteins and probably recognize the new strand by its nicks and gaps.</text></svg>
