"middle">• densely packed</text><text x="508.0" y="228.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">• mostly silent (centromeres,</text><text x="508.0" y="243.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">   telomeres, inactive X)</text><text x="508.0" y="259.4" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">• stains darkly</text><rect x="63.6" y="308" width="216.9" height="24" rx="12" fill="#5b6474"/><text x="172.0" y="320.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">loosely packed, transcribed</text><text x="340.0" y="370.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Both are built on nucleosomes, and both exist in interphase (not only in mitosis).</text></svg>
