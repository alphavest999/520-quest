<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Template read 3′ → 5′, RNA built 5′ → 3′</text><polyline points="40,90 640,90" fill="none" stroke="#8a93a3" stroke-width="4"/><text x="28.0" y="90.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">5′</text><text x="654.0" y="90.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3′</text><text x="120.0" y="72.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">coding strand</text><polyline points="40,190 640,190" fill="none" stroke="#2f6fdb" stroke-width="4"/><text x="28.0" y="190.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">3′</text><text x="654.0" y="190.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">5′</text><text x="120.0" y="210.0" font-size="12" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">template strand</text><ellipse cx="420" cy="140.0" rx="80" ry="62" fill="#e3f5ec" stroke="#1f9d63" stroke-width="2" fill-opacity="0.85"/><text x="420.0" y="104.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">RNA polymerase</text><path d="M455,168 L380,168 C330,168 310,120 260,62 " fill="none" stroke="#d6453d" stroke-width="4"/><text x="250.0" y="50.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">5′</text><text x="470.0" y="168.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">3′</text><text x="250.0" y="128.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">RNA</text><path d="M520,230 L620,230" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><text x="570.0" y="248.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">polymerase moves</text><text x="300.0" y="270.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">each NTP is added to the RNA&#x27;s free 3′-OH, so the RNA grows 5′ → 3′</text><rect x="20" y="298" width="640" height="90" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="250.0" y="320.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">antiparallel pairing forces 3′→5′ reading</text><text x="250.0" y="346.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">polymerases add only to a 3′-OH</text><text x="250.0" y="372.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">the template strand varies by gene; the direction never does</text></svg>
