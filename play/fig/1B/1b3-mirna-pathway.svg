<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">microRNAs act on mRNA, after transcription</text><rect x="20" y="44" width="250" height="250" rx="22" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.6"/><text x="145.0" y="64.0" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Nucleus</text><rect x="40" y="80" width="210" height="44" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="145.0" y="102.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">miRNA gene → pri-miRNA</text><text x="145.0" y="138.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(transcribed, not translated)</text><path d="M145,150 L145,180" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="193.0" y="165.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Drosha cuts</text><rect x="40" y="182" width="210" height="40" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="145.0" y="202.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">pre-miRNA hairpin</text><path d="M250,202 L320,202" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="285.0" y="192.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">export</text><rect x="320" y="180" width="150" height="44" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="395.0" y="194.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Dicer cuts →</text><text x="395.0" y="209.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">~22-nt duplex</text><path d="M470,202 L500,202" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="500" y="180" width="160" height="44" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="580.0" y="194.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">one strand</text><text x="580.0" y="209.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">loaded into RISC</text><path d="M580,224 L580,256" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="490.0" y="150.0" font-size="13" font-weight="700" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Cytoplasm</text><polyline points="300,290 650,290" fill="none" stroke="#1f2430" stroke-width="3"/><text x="294.0" y="290.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">5′</text><text x="656.0" y="290.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">3′</text><rect x="340" y="281" width="170" height="18" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="425.0" y="290.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">coding sequence</text><text x="580.0" y="312.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">3′ UTR</text><ellipse cx="580" cy="268" rx="40" ry="14" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.6"/><text x="580.0" y="268.0" font-size="10" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">RISC + miRNA</text><text x="480.0" y="340.0" font-size="12.5" font-weight="600" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">partial pairing (seed region) → translation repressed</text><text x="480.0" y="358.0" font-size="12.5" font-weight="600" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">and/or poly-A tail shortened → mRNA decays</text></svg>
