<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The replication fork and its enzymes</text><polyline points="30,125 470,125 520,198 675,198" fill="none" stroke="#1f2430" stroke-width="3"/><polyline points="30,295 470,295 520,222 675,222" fill="none" stroke="#1f2430" stroke-width="3"/><text x="18.0" y="125.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3′</text><text x="18.0" y="295.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">5′</text><text x="682.0" y="184.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">5′</text><text x="682.0" y="236.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3′</text><polyline points="40,141 70,141" fill="none" stroke="#d6453d" stroke-width="6"/><polyline points="70,141 432,141" fill="none" stroke="#2f6fdb" stroke-width="5"/><path d="M430,141 L452,141" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><rect x="395" y="153" width="70" height="26" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="430.0" y="166.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">pol III</text><text x="345.0" y="78.0" font-size="13" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Leading strand: one primer, then continuous 5′ → 3′ toward the fork</text><polyline points="40,279 150,279" fill="none" stroke="#2f6fdb" stroke-width="5"/><polyline points="152,279 240,279" fill="none" stroke="#2f6fdb" stroke-width="5"/><polyline points="240,279 262,279" fill="none" stroke="#d6453d" stroke-width="6"/><polyline points="266,279 360,279" fill="none" stroke="#2f6fdb" stroke-width="5"/><polyline points="360,279 380,279" fill="none" stroke="#d6453d" stroke-width="6"/><polyline points="412,279 445,279" fill="none" stroke="#2f6fdb" stroke-width="5"/><polyline points="445,279 466,279" fill="none" stroke="#d6453d" stroke-width="6"/><path d="M414,279 L398,279" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><rect x="388" y="233" width="66" height="26" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="421.0" y="246.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">pol III</text><polyline points="421,259 421,273" fill="none" stroke="#2f6fdb" stroke-width="1.5"/><rect x="420" y="309" width="72" height="26" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="456.0" y="322.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">primase</text><polyline points="456,309 456,282" fill="none" stroke="#d98a00" stroke-width="1.5"/><rect x="95" y="309" width="72" height="26" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="131.0" y="322.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ligase</text><polyline points="140,309 151,282" fill="none" stroke="#7a4cd9" stroke-width="1.5"/><rect x="228" y="309" width="64" height="26" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="260.0" y="322.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">pol I</text><polyline points="262,309 264,282" fill="none" stroke="#138f9a" stroke-width="1.5"/><circle cx="390" cy="295" r="6" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><circle cx="488" cy="282" r="6" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><circle cx="503" cy="258" r="6" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="530.0" y="301.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">SSB proteins</text><circle cx="520" cy="210" r="24" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="520.0" y="210.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">hel</text><text x="520.0" y="168.0" font-size="12" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">helicase (ATP)</text><rect x="585" y="180" width="84" height="60" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="627.0" y="202.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">topo-</text><text x="627.0" y="217.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">isomerase</text><path d="M575,256 L655,256" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="615.0" y="270.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">fork moves</text><text x="345.0" y="362.0" font-size="13" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Lagging strand: Okazaki fragments, each made 5′ → 3′ AWAY from the fork</text><text x="345.0" y="390.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">red = RNA primer · blue = new DNA · black = parental template</text><text x="345.0" y="414.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">SSBs coat single strands; helicase unwinds; topoisomerase relieves supercoils ahead</text></svg>
