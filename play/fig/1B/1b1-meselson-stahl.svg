<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Meselson–Stahl: ¹⁵N DNA moved to ¹⁴N medium</text><rect x="125" y="70" width="70" height="210" rx="18" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><rect x="132" y="243.0" width="56" height="14.0" rx="2" fill="#1f2430"/><text x="160.0" y="300.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gen 0</text><text x="160.0" y="322.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">all heavy</text><rect x="220" y="70" width="70" height="210" rx="18" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><rect x="227" y="173.0" width="56" height="14.0" rx="2" fill="#1f2430"/><text x="255.0" y="300.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gen 1</text><text x="255.0" y="322.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">all hybrid</text><rect x="315" y="70" width="70" height="210" rx="18" fill="#e3f5ec" stroke="#8a93a3" stroke-width="1.5"/><rect x="322" y="175.5" width="56" height="9.0" rx="2" fill="#1f2430"/><rect x="322" y="105.5" width="56" height="9.0" rx="2" fill="#1f2430"/><text x="350.0" y="300.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gen 2</text><text x="350.0" y="322.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">½ hybrid + ½ light</text><text x="255.0" y="50.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Observed (semiconservative)</text><line x1="420" y1="60" x2="420" y2="335" stroke="#8a93a3" stroke-dasharray="5 4"/><text x="545.0" y="50.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Gen 2 predicted by other models</text><rect x="453" y="70" width="70" height="210" rx="18" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><rect x="460" y="246.8" width="56" height="6.5" rx="2" fill="#1f2430"/><rect x="460" y="104.2" width="56" height="11.5" rx="2" fill="#1f2430"/><text x="488.0" y="300.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Conservative</text><text x="488.0" y="322.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">¼ heavy + ¾ light</text><rect x="570" y="70" width="70" height="210" rx="18" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><rect x="577" y="138.0" width="56" height="14.0" rx="2" fill="#1f2430"/><text x="605.0" y="300.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Dispersive</text><text x="605.0" y="322.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">one band, ¼ heavy</text><text x="18.0" y="102.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">light</text><text x="18.0" y="117.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">¹⁴N/¹⁴N</text><text x="18.0" y="172.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">hybrid</text><text x="18.0" y="187.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">¹⁵N/¹⁴N</text><text x="18.0" y="242.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">heavy</text><text x="18.0" y="257.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">¹⁵N/¹⁵N</text><rect x="20" y="345" width="640" height="62" rx="10" fill="white" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="364.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Each old (heavy) strand stays paired with one new (light) strand. Gen 1: 2 hybrid molecules.</text><text x="340.0" y="386.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gen 2: those 2 old strands sit in 2 hybrids out of 4 molecules → ½ hybrid, ½ light; heavy never returns.</text></svg>
