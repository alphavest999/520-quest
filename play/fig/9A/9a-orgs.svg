<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="380.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Formal organizations</text><rect x="20" y="55" width="230" height="150" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="135.0" y="95.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">WEBER&#x27;S BUREAUCRACY</text><text x="135.0" y="109.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">hierarchy of authority</text><text x="135.0" y="123.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">written rules</text><text x="135.0" y="136.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">division of labor</text><text x="135.0" y="150.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">impersonality</text><text x="135.0" y="164.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">merit-based hiring</text><rect x="265" y="55" width="230" height="150" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="380.0" y="88.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">McDONALDIZATION (Ritzer)</text><text x="380.0" y="102.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">efficiency</text><text x="380.0" y="116.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">calculability: count it</text><text x="380.0" y="130.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(patients per hour)</text><text x="380.0" y="143.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">predictability</text><text x="380.0" y="157.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">control: machines/rules</text><text x="380.0" y="171.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">replace judgment</text><rect x="510" y="55" width="230" height="150" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="625.0" y="102.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ETZIONI&#x27;S TYPES</text><text x="625.0" y="116.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">normative: shared values,</text><text x="625.0" y="130.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">unpaid (volunteers)</text><text x="625.0" y="143.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">coercive: forced (prison)</text><text x="625.0" y="157.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">utilitarian: paid (jobs)</text><rect x="140" y="230" width="480" height="70" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="380.0" y="257.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">IRON LAW OF OLIGARCHY (Michels)</text><text x="380.0" y="272.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">even democratic groups drift toward rule by a small elite</text><text x="380.0" y="335.0" font-size="10.2" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Bureaucratic ritualism: following rules for their own sake; McDonaldization extends bureaucracy&#x27;s rationalization.</text></svg>
