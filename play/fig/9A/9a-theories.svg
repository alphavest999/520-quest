<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="400.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Sociological theories at a glance</text><rect x="20" y="48" width="185" height="32" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="112.5" y="64.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Theory</text><rect x="215" y="48" width="75" height="32" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="252.5" y="64.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Level</text><rect x="300" y="48" width="235" height="32" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="417.5" y="64.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Core idea</text><rect x="545" y="48" width="235" height="32" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="662.5" y="64.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Example</text><rect x="20" y="88" width="185" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="112.5" y="104.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">FUNCTIONALISM</text><text x="112.5" y="117.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(Durkheim, Merton)</text><rect x="215" y="88" width="75" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="252.5" y="111.0" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">macro</text><rect x="300" y="88" width="235" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="417.5" y="104.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">parts keep society stable;</text><text x="417.5" y="117.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">manifest + latent functions</text><rect x="545" y="88" width="235" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="662.5" y="104.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">new daycare as two-earner</text><text x="662.5" y="117.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">families rise</text><rect x="20" y="140" width="185" height="46" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="112.5" y="156.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CONFLICT THEORY</text><text x="112.5" y="169.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(Marx)</text><rect x="215" y="140" width="75" height="46" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="252.5" y="163.0" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">macro</text><rect x="300" y="140" width="235" height="46" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="417.5" y="156.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">groups compete for scarce</text><text x="417.5" y="169.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">resources and power</text><rect x="545" y="140" width="235" height="46" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="662.5" y="156.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">property-tax school funding</text><text x="662.5" y="169.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">keeps the rich ahead</text><rect x="20" y="192" width="185" height="46" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="112.5" y="215.0" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">FEMINIST THEORY</text><rect x="215" y="192" width="75" height="46" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="252.5" y="215.0" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">macro</text><rect x="300" y="192" width="235" height="46" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="417.5" y="208.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">gendered power built</text><text x="417.5" y="221.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">into institutions</text><rect x="545" y="192" width="235" height="46" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="662.5" y="208.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">medicalization of birth;</text><text x="662.5" y="221.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">unpaid emotional labor</text><rect x="20" y="244" width="185" height="46" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="112.5" y="260.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SOCIAL</text><text x="112.5" y="273.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CONSTRUCTIONISM</text><rect x="215" y="244" width="75" height="46" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="252.5" y="267.0" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">macro</text><rect x="300" y="244" width="235" height="46" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="417.5" y="260.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">shared agreement makes</text><text x="417.5" y="273.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">categories seem real</text><rect x="545" y="244" width="235" height="46" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="662.5" y="260.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">money, race categories,</text><text x="662.5" y="273.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">childhood</text><rect x="20" y="296" width="185" height="46" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="112.5" y="312.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SYMBOLIC</text><text x="112.5" y="325.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">INTERACTIONISM</text><rect x="215" y="296" width="75" height="46" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="252.5" y="319.0" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">micro</text><rect x="300" y="296" width="235" height="46" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="417.5" y="312.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">meaning from symbols in</text><text x="417.5" y="325.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">face-to-face interaction</text><rect x="545" y="296" width="235" height="46" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="662.5" y="312.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Thomas theorem: situations</text><text x="662.5" y="325.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">defined as real are real</text><rect x="20" y="348" width="185" height="46" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="112.5" y="364.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">RATIONAL CHOICE /</text><text x="112.5" y="377.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SOCIAL EXCHANGE</text><rect x="215" y="348" width="75" height="46" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="252.5" y="371.0" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">micro</text><rect x="300" y="348" width="235" height="46" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="417.5" y="364.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">weigh costs and benefits;</text><text x="417.5" y="377.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">relationships as exchange</text><rect x="545" y="348" width="235" height="46" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="662.5" y="364.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">choosing a major by salary;</text><text x="662.5" y="377.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">principle of least interest</text><text x="400.0" y="412.0" font-size="10" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Constructionism = how society builds shared &#x27;realities&#x27; (broad); interactionism = how individuals make meaning in interaction.</text></svg>
