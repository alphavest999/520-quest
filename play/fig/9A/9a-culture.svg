<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="380.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Culture: key distinctions</text><rect x="20" y="50" width="230" height="120" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="135.0" y="82.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">MATERIAL vs SYMBOLIC</text><text x="135.0" y="96.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">objects vs values, norms,</text><text x="135.0" y="110.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">beliefs, language</text><text x="135.0" y="123.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(Sapir–Whorf: language</text><text x="135.0" y="137.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">shapes thought)</text><rect x="265" y="50" width="230" height="120" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="380.0" y="89.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">IDEAL vs REAL</text><text x="380.0" y="103.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">what people SAY they value</text><text x="380.0" y="116.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">vs what they actually DO</text><text x="380.0" y="130.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(honesty vs tax evasion)</text><rect x="510" y="50" width="230" height="120" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="625.0" y="82.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SUBCULTURE vs</text><text x="625.0" y="96.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">COUNTERCULTURE</text><text x="625.0" y="110.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">distinct but fits in</text><text x="625.0" y="123.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">vs actively opposes</text><text x="625.0" y="137.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">mainstream norms</text><text x="380.0" y="200.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Sources of cultural change</text><rect x="50" y="215" width="200" height="70" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="150.0" y="243.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">INVENTION</text><text x="150.0" y="256.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">something new is created</text><rect x="280" y="215" width="200" height="70" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="380.0" y="236.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DISCOVERY</text><text x="380.0" y="250.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">something that existed is</text><text x="380.0" y="263.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">recognized (germs)</text><rect x="510" y="215" width="200" height="70" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="610.0" y="236.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DIFFUSION</text><text x="610.0" y="250.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">spreads from one</text><text x="610.0" y="263.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">culture to another</text><text x="380.0" y="312.0" font-size="10" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Cultural lag: material culture changes faster than norms catch up. Culture shock: disorientation in an unfamiliar culture.</text></svg>
