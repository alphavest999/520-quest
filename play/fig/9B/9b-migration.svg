<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 290" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="370.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lee&#x27;s push–pull model of migration</text><rect x="20" y="60" width="200" height="150" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="120.0" y="105.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ORIGIN</text><text x="120.0" y="120.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="120.0" y="135.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PUSH factors</text><text x="120.0" y="150.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">war, persecution,</text><text x="120.0" y="165.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">poverty, disaster</text><rect x="270" y="95" width="200" height="80" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="370.0" y="120.6" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">INTERVENING</text><text x="370.0" y="135.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">OBSTACLES</text><text x="370.0" y="149.4" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cost, distance, visa laws</text><rect x="520" y="60" width="200" height="150" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="620.0" y="105.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DESTINATION</text><text x="620.0" y="120.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="620.0" y="135.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PULL factors</text><text x="620.0" y="150.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">jobs, higher wages,</text><text x="620.0" y="165.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">safety, family</text><path d="M222,135 L268,135" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M472,135 L518,135" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="370.0" y="245.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Personal factors (age, education, risk tolerance) shape who actually moves.</text></svg>
