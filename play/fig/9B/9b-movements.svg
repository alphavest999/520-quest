<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="380.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Social movements</text><text x="250.0" y="58.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Aberle&#x27;s types</text><text x="175.0" y="82.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">LIMITED change</text><text x="345.0" y="82.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">RADICAL change</text><text x="45.0" y="130.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Individuals</text><text x="45.0" y="220.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Society</text><rect x="95" y="92" width="160" height="75" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="175.0" y="122.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ALTERNATIVE</text><text x="175.0" y="136.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(eat less meat)</text><rect x="265" y="92" width="160" height="75" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="345.0" y="122.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">REDEMPTIVE</text><text x="345.0" y="136.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(religious conversion)</text><rect x="95" y="180" width="160" height="75" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="175.0" y="210.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">REFORMATIVE</text><text x="175.0" y="224.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(change a law)</text><rect x="265" y="180" width="160" height="75" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="345.0" y="210.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">REVOLUTIONARY</text><text x="345.0" y="224.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(replace the system)</text><rect x="450" y="50" width="290" height="205" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="595.0" y="100.0" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">WHY MOVEMENTS FORM</text><text x="595.0" y="113.1" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">relative deprivation: worse off</text><text x="595.0" y="126.2" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">than others/expectations</text><text x="595.0" y="139.4" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">resource mobilization: money,</text><text x="595.0" y="152.5" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">leaders, media</text><text x="595.0" y="165.6" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">political process: open</text><text x="595.0" y="178.8" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">political opportunities</text><text x="595.0" y="191.9" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">free-rider problem: benefit</text><text x="595.0" y="205.0" font-size="10.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">without joining</text><text x="380.0" y="285.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Life cycle</text><rect x="40" y="300" width="150" height="55" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="115.0" y="327.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">emergence</text><path d="M192,327 L218,327" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="300" width="150" height="55" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="295.0" y="327.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">coalescence</text><path d="M372,327 L398,327" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="400" y="300" width="150" height="55" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="475.0" y="320.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bureaucratization</text><text x="475.0" y="334.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(staff, formal rules)</text><path d="M552,327 L578,327" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="580" y="300" width="150" height="55" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="655.0" y="327.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">decline</text></svg>
