<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><polygon points="30,90 220,90 280,125 400,125 460,90 630,90 630,210 460,210 400,175 280,175 220,210 30,210" fill="#e6eefc" stroke="none"/><polyline points="30,90 220,90 280,125 400,125 460,90 630,90" fill="none" stroke="#1f2430" stroke-width="2.5"/><polyline points="30,210 220,210 280,175 400,175 460,210 630,210" fill="none" stroke="#1f2430" stroke-width="2.5"/><path d="M60,150 L100,150" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><path d="M130,150 L170,150" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><path d="M300,150 L380,150" fill="none" stroke="#2f6fdb" stroke-width="3" marker-end="url(#ah)"/><path d="M490,150 L530,150" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><path d="M560,150 L600,150" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><rect x="116" y="10" width="18" height="80" fill="#fff" stroke="#8a93a3"/><rect x="116" y="20" width="18" height="70" fill="#2f6fdb" opacity=".55"/><text x="141.0" y="20.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">P₁ high</text><rect x="331" y="45" width="18" height="80" fill="#fff" stroke="#8a93a3"/><rect x="331" y="95" width="18" height="30" fill="#2f6fdb" opacity=".55"/><text x="356.0" y="55.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="start" dominant-baseline="middle">P₂ low</text><rect x="536" y="10" width="18" height="80" fill="#fff" stroke="#8a93a3"/><rect x="536" y="20" width="18" height="70" fill="#2f6fdb" opacity=".55"/><text x="561.0" y="20.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">P₃ high</text><text x="125.0" y="236.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">wide: A big → v slow</text><text x="340.0" y="236.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">narrow: A small → v fast</text><text x="545.0" y="236.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">wide again: v slow</text><text x="330.0" y="258.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">A₁v₁ = A₂v₂ and Bernoulli: faster flow → lower pressure</text></svg>
