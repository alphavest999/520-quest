" cy="160" r="14" fill="#e3f5ec" stroke="#1f2430" stroke-width="1.5"/><text x="680.0" y="160.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">V</text><text x="470.0" y="225.0" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">I = I₁ + I₂</text><text x="360.0" y="285.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Series: R_eq = R₁ + R₂     Parallel: 1/R_eq = 1/R₁ + 1/R₂ (smaller than either)</text></svg>
