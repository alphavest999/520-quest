<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><polyline points="480,150 720,150" fill="none" stroke="#1f2430" stroke-width="3"/><polyline points="480,172 720,172" fill="none" stroke="#1f2430" stroke-width="3"/><polyline points="40,70 400,70 480,150" fill="none" stroke="#1f2430" stroke-width="3"/><polyline points="40,252 400,252 480,172" fill="none" stroke="#1f2430" stroke-width="3"/><text x="30.0" y="70.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">3′</text><text x="728.0" y="150.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">5′</text><text x="30.0" y="252.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">5′</text><text x="728.0" y="172.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">3′</text><text x="110.0" y="52.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">parental (template) strand</text><text x="110.0" y="272.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">parental (template) strand</text><polyline points="50,92 70,92" fill="none" stroke="#d6453d" stroke-width="5"/><path d="M70,92 L380,92" fill="none" stroke="#2f6fdb" stroke-width="3" marker-end="url(#ah)"/><text x="30.0" y="92.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="end" dominant-baseline="middle">5′</text><text x="215.0" y="110.0" font-size="12.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">LEADING strand: continuous, toward the fork</text><rect x="382" y="80" width="54" height="24" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="409.0" y="92.0" font-size="11" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Pol III</text><polyline points="395,230 417,230" fill="none" stroke="#d6453d" stroke-width="5"/><text x="406.0" y="246.0" font-size="10.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">primer</text><polyline points="310,230 330,230" fill="none" stroke="#d6453d" stroke-width="5"/><path d="M310,230 L190,230" fill="none" stroke="#1f9d63" stroke-width="3" marker-end="url(#ah)"/><polyline points="170,230 190,230" fill="none" stroke="#d6453d" stroke-width="5"/><path d="M170,230 L55,230" fill="none" stroke="#1f9d63" stroke-width="3" marker-end="url(#ah)"/><text x="250.0" y="212.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">LAGGING strand: Okazaki fragments, away from the fork</text><text x="180.0" y="244.0" font-size="11" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">ligase</text><circle cx="488" cy="161" r="20" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="488.0" y="196.0" font-size="12" font-weight="700" fill="#9a6200" text-anchor="middle" dominant-baseline="middle">helicase</text><circle cx="440" cy="228" r="6" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><circle cx="458" cy="228" r="6" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="470.0" y="220.0" font-size="11" font-weight="400" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">SSB</text><rect x="590" y="128" width="100" height="22" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="640.0" y="139.0" font-size="11" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">topoisomerase</text><path d="M600,105 L690,105" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="645.0" y="92.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">fork moves</text><text x="370.0" y="316.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Red = RNA primer (made by primase). New DNA always grows 5′ → 3′.</text></svg>
