<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="320.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ΔG = ΔH − TΔS: when is a reaction spontaneous?</text><rect x="63" y="68" width="264" height="134" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="195.0" y="103.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ΔH &gt; 0, ΔS &lt; 0</text><text x="195.0" y="144.2" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">NEVER spontaneous</text><text x="195.0" y="161.8" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">(ΔG always &gt; 0)</text><rect x="333" y="68" width="264" height="134" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="465.0" y="103.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ΔH &gt; 0, ΔS &gt; 0</text><text x="465.0" y="144.2" font-size="14" font-weight="700" fill="#9a6200" text-anchor="middle" dominant-baseline="middle">Spontaneous at HIGH T</text><text x="465.0" y="161.8" font-size="14" font-weight="700" fill="#9a6200" text-anchor="middle" dominant-baseline="middle">(entropy wins when hot)</text><rect x="63" y="208" width="264" height="134" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="195.0" y="243.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ΔH &lt; 0, ΔS &lt; 0</text><text x="195.0" y="284.2" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Spontaneous at LOW T</text><text x="195.0" y="301.8" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">(enthalpy wins when cold)</text><rect x="333" y="208" width="264" height="134" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="465.0" y="243.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ΔH &lt; 0, ΔS &gt; 0</text><text x="465.0" y="284.2" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">ALWAYS spontaneous</text><text x="465.0" y="301.8" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">(ΔG always &lt; 0)</text><path d="M50,205 L625,205" fill="none" stroke="#5b6474" stroke-width="1.8" marker-end="url(#ah)"/><text x="630.0" y="191.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">ΔS</text><path d="M330,355 L330,47" fill="none" stroke="#5b6474" stroke-width="1.8" marker-end="url(#ah)"/><text x="342.0" y="51.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">ΔH</text></svg>
