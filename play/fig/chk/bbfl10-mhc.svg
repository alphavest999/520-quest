<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><rect x="20" y="40" width="335" height="70" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="187.5" y="66.2" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Any nucleated cell</text><text x="187.5" y="83.8" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(e.g., virus-infected)</text><rect x="120" y="125" width="135" height="36" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="187.5" y="143.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">MHC I</text><text x="187.0" y="170.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">peptide from INSIDE</text><text x="187.0" y="185.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">the cell</text><path d="M187,198 L187,222" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="80" y="226" width="215" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="187.5" y="246.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CD8⁺ cytotoxic T cell</text><text x="187.0" y="290.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">kills the cell</text><rect x="385" y="40" width="335" height="70" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="552.5" y="66.2" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Antigen-presenting cell</text><text x="552.5" y="83.8" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(dendritic, macrophage, B cell)</text><rect x="485" y="125" width="135" height="36" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="552.5" y="143.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">MHC II</text><text x="552.0" y="170.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">peptide from OUTSIDE</text><text x="552.0" y="185.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(engulfed microbe)</text><path d="M552,198 L552,222" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="445" y="226" width="215" height="40" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="552.5" y="246.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CD4⁺ helper T cell</text><text x="552.0" y="282.2" font-size="12.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">activates B cells,</text><text x="552.0" y="297.8" font-size="12.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">macrophages, CD8 cells</text><text x="370.0" y="322.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Rule of 8:  MHC I × CD8 = 8,   MHC II × CD4 = 8</text></svg>
