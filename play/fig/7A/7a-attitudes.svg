<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">How persuasion and attitudes drive behavior</text><text x="170.0" y="50.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Elaboration likelihood model</text><rect x="20" y="70" width="140" height="50" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="90.0" y="95.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">message</text><rect x="200" y="62" width="130" height="60" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="265.0" y="85.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">motivated AND</text><text x="265.0" y="98.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">able to think?</text><path d="M160,95 L200,92" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="30" y="160" width="150" height="70" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="105.0" y="181.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CENTRAL route:</text><text x="105.0" y="195.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">argument quality</text><text x="105.0" y="208.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ lasting change</text><rect x="200" y="160" width="150" height="70" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="275.0" y="181.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PERIPHERAL route:</text><text x="275.0" y="195.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">attractiveness, cues</text><text x="275.0" y="208.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ short-lived</text><path d="M240,122 L110,160" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="175.0" y="131.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">yes</text><path d="M285,122 L275,160" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="294.0" y="141.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">no</text><text x="510.0" y="50.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Theory of planned behavior</text><rect x="400" y="70" width="140" height="44" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="470.0" y="92.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">attitude</text><path d="M540,92 L575,152" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="400" y="130" width="140" height="44" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="470.0" y="152.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">subjective norms</text><path d="M540,152 L575,152" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="400" y="190" width="140" height="44" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="470.0" y="212.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">perceived control</text><path d="M540,212 L575,152" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="575" y="130" width="90" height="44" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="620.0" y="152.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">intention</text><path d="M620,174 L620,220" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="575" y="220" width="90" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="620.0" y="240.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">behavior</text><text x="340.0" y="300.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Implicit attitudes (e.g., slower responses on an IAT) can differ from stated, explicit attitudes.</text><text x="340.0" y="322.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Role-playing a position and cognitive dissonance can shift attitudes toward behavior.</text></svg>
