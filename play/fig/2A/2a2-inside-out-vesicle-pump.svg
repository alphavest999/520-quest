 dominant-baseline="middle">3 Na⁺</text><text x="316.0" y="228.0" font-size="12" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">2 K⁺</text><text x="135.0" y="240.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">lumen</text><text x="470.0" y="58.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Inside-out vesicle</text><circle cx="470" cy="200" r="105" fill="#e6eefc" stroke="#c9a24a" stroke-width="18"/><rect x="553" y="174" width="44" height="52" rx="6" fill="#ffffff" stroke="#1f2430" stroke-width="1.5"/><rect x="587" y="174" width="10" height="52" fill="#d98a00"/><text x="639.0" y="154.0" font-size="13" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">ATP</text><text x="470.0" y="335.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ATP in medium reaches the pump</text><path d="M635,190 L525,190" fill="none" stroke="#d6453d" stroke-width="2.4" marker-end="url(#ah_d6453d)"/><path d="M525,214 L635,214" fill="none" stroke="#2f6fdb" stroke-width="2.4" marker-end="url(#ah_2f6fdb)"/><text x="649.0" y="178.0" font-size="12" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">3 Na⁺</text><text x="539.0" y="228.0" font-size="12" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">2 K⁺</text><text x="440.0" y="240.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">lumen</text><rect x="40" y="355" width="12" height="12" fill="#d98a00"/><text x="58.0" y="361.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">= cytosolic face of the pump (ATP site, Na⁺ binding sites)</text><rect x="75.3" y="388" width="529.4" height="24" rx="12" fill="#1f9d63"/><text x="340.0" y="400.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ inside-out + ATP outside: Na⁺ pumped INTO vesicle, K⁺ OUT to medium</text></svg>
