<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_138f9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="ah_d6453d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="ah_1f9d63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Na⁺ reabsorption: apical entry, basolateral Na⁺/K⁺-ATPase</text><rect x="20" y="50" width="640" height="50" rx="6" fill="#fdf1db" stroke="#fdf1db" stroke-width="0"/><text x="340.0" y="66.0" font-size="13" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">tubular lumen (filtrate → urine)</text><rect x="23" y="100" width="124" height="190" rx="6" fill="#fbfcfe" stroke="#1f2430" stroke-width="2"/><rect x="153" y="100" width="374" height="190" rx="6" fill="#fbfcfe" stroke="#1f2430" stroke-width="2"/><rect x="533" y="100" width="124" height="190" rx="6" fill="#fbfcfe" stroke="#1f2430" stroke-width="2"/><rect x="144" y="100" width="12" height="18" rx="3" fill="#7a4cd9" stroke="#7a4cd9" stroke-width="0"/><rect x="524" y="100" width="12" height="18" rx="3" fill="#7a4cd9" stroke="#7a4cd9" stroke-width="0"/><rect x="20" y="294" width="640" height="46" rx="6" fill="#fbe7e5" stroke="#fbe7e5" stroke-width="0"/><text x="160.0" y="308.2" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">interstitium → peritubular</text><text x="160.0" y="323.8" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">capillary blood</text><line x1="29" y1="101.5" x2="141" y2="101.5" stroke="#138f9a" stroke-width="4"/><path d="M24.5,120 L24.5,288.5 L145.5,288.5 L145.5,120" fill="none" stroke="#d6453d" stroke-width="3.5"/><line x1="159" y1="101.5" x2="521" y2="101.5" stroke="#138f9a" stroke-width="4"/><path d="M154.5,120 L154.5,288.5 L525.5,288.5 L525.5,120" fill="none" stroke="#d6453d" stroke-width="3.5"/><line x1="539" y1="101.5" x2="651" y2="101.5" stroke="#138f9a" stroke-width="4"/><path d="M534.5,120 L534.5,288.5 L655.5,288.5 L655.5,120" fill="none" stroke="#d6453d" stroke-width="3.5"/><rect x="330" y="90" width="20" height="22" rx="4" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><path d="M340,76 L340,140" fill="none" stroke="#138f9a" stroke-width="2.4" marker-end="url(#ah_138f9a)"/><text x="356.0" y="118.0" font-size="12" font-weight="600" fill="#138f9a" text-anchor="start" dominant-baseline="middle">Na⁺ enters by channels</text><text x="356.0" y="134.0" font-size="12" font-weight="600" fill="#138f9a" text-anchor="start" dominant-baseline="middle">or symporters, down</text><text x="356.0" y="150.0" font-size="12" font-weight="600" fill="#138f9a" text-anchor="start" dominant-baseline="middle">its gradient</text><text x="340.0" y="190.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cell [Na⁺] kept low (≈ 10–15 mM)</text><circle cx="340.0" cy="290.0" r="18" fill="#fbe7e5" stroke="#d6453d" stroke-width="2"/><text x="340.0" y="290.0" font-size="12" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">ATP</text><path d="M330,304 L300,334" fill="none" stroke="#d6453d" stroke-width="2.2" marker-end="url(#ah_d6453d)"/><text x="294.0" y="350.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="end" dominant-baseline="middle">3 Na⁺ out</text><path d="M380,334 L352,306" fill="none" stroke="#1f9d63" stroke-width="2.2" marker-end="url(#ah_1f9d63)"/><text x="386.0" y="350.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">2 K⁺ in</text><text x="340.0" y="238.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Na⁺/K⁺-ATPase on the basolateral membrane</text><text x="85.0" y="132.0" font-size="12" font-weight="600" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">teal edge:</text><text x="85.0" y="148.0" font-size="12" font-weight="600" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">APICAL</text><text x="85.0" y="164.0" font-size="12" font-weight="600" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">membrane</text><text x="85.0" y="180.0" font-size="12" font-weight="600" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">(faces lumen)</text><text x="85.0" y="214.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">red edges:</text><text x="85.0" y="230.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">BASOLATERAL</text><text x="85.0" y="246.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">membrane</text><text x="85.0" y="262.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">(sides + base,</text><text x="85.0" y="278.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">faces blood)</text><text x="595.0" y="150.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">tight</text><text x="595.0" y="167.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">junctions</text><text x="595.0" y="184.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">(purple)</text><text x="595.0" y="201.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">seal gaps;</text><text x="595.0" y="218.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">no pumps</text><rect x="172.0" y="368" width="335.9" height="24" rx="12" fill="#1f9d63"/><text x="340.0" y="380.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ basolateral pump → net lumen-to-blood Na⁺</text><text x="30.0" y="412.0" font-size="12.5" font-weight="400" fill="#d6453d" text-anchor="start" dominant-baseline="middle">✗ An apical pump would send Na⁺ back into the urine.  ✗ The nuclear envelope has no Na⁺/K⁺-ATPase.</text></svg>
