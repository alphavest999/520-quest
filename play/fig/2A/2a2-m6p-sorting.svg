<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Mannose-6-phosphate: the Golgi&#x27;s lysosome address tag</text><rect x="20" y="70" width="130" height="60" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="85.0" y="85.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Rough ER</text><text x="85.0" y="100.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">enzyme made,</text><text x="85.0" y="115.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">N-glycosylated</text><rect x="195" y="70" width="140" height="60" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="265.0" y="85.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cis Golgi</text><text x="265.0" y="100.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">phosphotransferase</text><text x="265.0" y="115.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">adds M6P</text><rect x="380" y="70" width="130" height="60" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="445.0" y="85.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">trans Golgi</text><text x="445.0" y="100.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">M6P receptor</text><text x="445.0" y="115.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">binds enzyme</text><rect x="550" y="70" width="115" height="60" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="607.5" y="92.5" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Endosome →</text><text x="607.5" y="107.5" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">lysosome</text><path d="M150,100.0 L195,100.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M335,100.0 L380,100.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M510,100.0 L550,100.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="160.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Normal: tagged enzymes reach lysosomes and digest their substrates</text><polyline points="10,182 670,182" fill="none" stroke="#8a93a3" stroke-width="1" stroke-dasharray="6 4"/><rect x="20" y="220" width="130" height="60" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="85.0" y="242.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Rough ER</text><text x="85.0" y="257.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(normal)</text><rect x="195" y="220" width="140" height="60" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="265.0" y="242.5" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cis Golgi</text><text x="265.0" y="257.5" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NO M6P added</text><rect x="380" y="220" width="130" height="60" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="445.0" y="235.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">trans Golgi</text><text x="445.0" y="250.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">receptor cannot</text><text x="445.0" y="265.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bind enzyme</text><rect x="550" y="220" width="115" height="60" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="607.5" y="242.5" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Default path:</text><text x="607.5" y="257.5" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SECRETED</text><path d="M150,250.0 L195,250.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M335,250.0 L380,250.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M510,250.0 L550,250.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><ellipse cx="470" cy="345" rx="70" ry="34" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="470.0" y="334.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">lysosome</text><text x="470.0" y="354.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">undigested material</text><text x="607.0" y="307.5" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">high enzyme</text><text x="607.0" y="322.5" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">levels in blood</text><text x="160.0" y="315.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">I-cell disease</text><rect x="112.5" y="393" width="455.0" height="24" rx="12" fill="#1f9d63"/><text x="340.0" y="405.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ enzymes secreted; lysosomes fill with undigested material</text><text x="160.0" y="330.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Enzymes still leave the ER and</text><text x="160.0" y="345.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">fold correctly: not retained,</text><text x="160.0" y="360.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">not sent to nucleus or proteasome.</text></svg>
