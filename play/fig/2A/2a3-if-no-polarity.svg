<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Why intermediate filaments have no polarity</text><text x="70.0" y="60.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">monomer</text><polyline points="40,86 100,86" fill="none" stroke="#d98a00" stroke-width="4"/><circle cx="40.0" cy="86.0" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><path d="M112,92 L142,92" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah_1f2430)"/><text x="185.0" y="60.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">parallel dimer</text><text x="185.0" y="128.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(coiled coil)</text><polyline points="155,86 215,86" fill="none" stroke="#d98a00" stroke-width="4"/><circle cx="155.0" cy="86.0" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="155,98 215,98" fill="none" stroke="#d98a00" stroke-width="4"/><circle cx="155.0" cy="98.0" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><path d="M228,92 L258,92" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah_1f2430)"/><text x="330.0" y="60.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">antiparallel tetramer</text><polyline points="275,80 335,80" fill="none" stroke="#d98a00" stroke-width="4"/><circle cx="275.0" cy="80.0" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="275,90 335,90" fill="none" stroke="#d98a00" stroke-width="4"/><circle cx="275.0" cy="90.0" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><polyline points="305,100 365,100" fill="none" stroke="#138f9a" stroke-width="4"/><circle cx="365.0" cy="100.0" r="6" fill="#138f9a" stroke="#138f9a" stroke-width="1.5"/><polyline points="305,110 365,110" fill="none" stroke="#138f9a" stroke-width="4"/><circle cx="365.0" cy="110.0" r="6" fill="#138f9a" stroke="#138f9a" stroke-width="1.5"/><text x="330.0" y="128.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">heads point both ways</text><path d="M378,92 L408,92" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah_1f2430)"/><text x="540.0" y="60.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">rope-like filament (~10 nm)</text><polyline points="420,76 486,76" fill="none" stroke="#d98a00" stroke-width="3.5"/><polyline points="496,76 562,76" fill="none" stroke="#d98a00" stroke-width="3.5"/><polyline points="572,76 638,76" fill="none" stroke="#d98a00" stroke-width="3.5"/><polyline points="454,85 520,85" fill="none" stroke="#138f9a" stroke-width="3.5"/><polyline points="530,85 596,85" fill="none" stroke="#138f9a" stroke-width="3.5"/><polyline points="606,85 672,85" fill="none" stroke="#138f9a" stroke-width="3.5"/><polyline points="420,94 486,94" fill="none" stroke="#d98a00" stroke-width="3.5"/><polyline points="496,94 562,94" fill="none" stroke="#d98a00" stroke-width="3.5"/><polyline points="572,94 638,94" fill="none" stroke="#d98a00" stroke-width="3.5"/><polyline points="454,103 520,103" fill="none" stroke="#138f9a" stroke-width="3.5"/><polyline points="530,103 596,103" fill="none" stroke="#138f9a" stroke-width="3.5"/><polyline points="606,103 672,103" fill="none" stroke="#138f9a" stroke-width="3.5"/><text x="540.0" y="128.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">both ends identical: no + or − end</text><rect x="150" y="156" width="159" height="30" rx="6" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="229.5" y="171.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Actin filament</text><rect x="315" y="156" width="174" height="30" rx="6" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="402.0" y="171.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Intermediate filament</text><rect x="495" y="156" width="159" height="30" rx="6" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="574.5" y="171.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Microtubule</text><rect x="20" y="192" width="640" height="46" rx="4" fill="#f1f3f6" stroke="#f1f3f6" stroke-width="0"/><text x="30.0" y="215.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Subunit</text><text x="229.5" y="215.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">globular G-actin</text><text x="402.0" y="207.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">fibrous rods (keratin,</text><text x="402.0" y="222.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">vimentin, lamins)</text><text x="574.5" y="215.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">globular α/β-tubulin</text><text x="30.0" y="261.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Nucleotide</text><text x="229.5" y="261.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ATP</text><text x="402.0" y="261.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">none</text><text x="574.5" y="261.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">GTP</text><rect x="20" y="284" width="640" height="46" rx="4" fill="#f1f3f6" stroke="#f1f3f6" stroke-width="0"/><text x="30.0" y="307.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Polarity</text><text x="229.5" y="307.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">yes (+ and −)</text><text x="402.0" y="307.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">no</text><text x="574.5" y="307.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">yes (+ and −)</text><text x="30.0" y="353.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Motors</text><text x="229.5" y="353.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">myosins</text><text x="402.0" y="353.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">none</text><text x="574.5" y="353.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">kinesins, dyneins</text><rect x="20" y="376" width="640" height="46" rx="4" fill="#f1f3f6" stroke="#f1f3f6" stroke-width="0"/><text x="30.0" y="399.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Turnover</text><text x="229.5" y="399.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">fast treadmilling</text><text x="402.0" y="399.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">slow, very stable</text><text x="574.5" y="399.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">dynamic instability</text><text x="30.0" y="445.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Main job</text><text x="229.5" y="437.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">crawling, cortex,</text><text x="229.5" y="452.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cytokinesis</text><text x="402.0" y="445.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">tensile strength</text><text x="574.5" y="437.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">transport, spindle,</text><text x="574.5" y="452.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cilia</text></svg>
