<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_d6453d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Tight junctions are both a gate and a fence</text><rect x="30" y="84" width="170" height="236" rx="8" fill="#fbfcfe" stroke="#1f2430" stroke-width="2"/><rect x="210" y="84" width="170" height="236" rx="8" fill="#fbfcfe" stroke="#1f2430" stroke-width="2"/><text x="205.0" y="58.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">lumen (apical side)</text><text x="205.0" y="340.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">blood side (basolateral)</text><polyline points="196,92 214,92" fill="none" stroke="#1f9d63" stroke-width="3.4"/><polyline points="196,100 214,100" fill="none" stroke="#1f9d63" stroke-width="3.4"/><polyline points="196,108 214,108" fill="none" stroke="#1f9d63" stroke-width="3.4"/><rect x="53" y="77" width="14" height="14" rx="2" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.6"/><rect x="93" y="77" width="14" height="14" rx="2" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.6"/><rect x="133" y="77" width="14" height="14" rx="2" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.6"/><rect x="233" y="77" width="14" height="14" rx="2" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.6"/><rect x="283" y="77" width="14" height="14" rx="2" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.6"/><rect x="333" y="77" width="14" height="14" rx="2" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.6"/><circle cx="30" cy="170" r="7" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><circle cx="30" cy="250" r="7" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><circle cx="380" cy="200" r="7" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><circle cx="380" cy="280" r="7" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><circle cx="200" cy="200" r="7" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><circle cx="210" cy="260" r="7" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><circle cx="90" cy="320" r="7" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><circle cx="300" cy="320" r="7" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><rect x="173" y="77" width="14" height="14" rx="2" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.6"/><path d="M188,86 Q200.0,108.1 192,132" fill="none" stroke="#d6453d" stroke-width="2" marker-end="url(#ah_d6453d)"/><circle cx="176" cy="122" r="11" fill="#d6453d"/><text x="176.0" y="122.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✕</text><path d="M205,70 L205,86" fill="none" stroke="#d6453d" stroke-width="2" marker-end="url(#ah_d6453d)"/><text x="410.0" y="100.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">Gate:</text><text x="462.0" y="100.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">blocks solutes leaking</text><text x="462.0" y="118.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">between cells</text><text x="410.0" y="160.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">Fence:</text><text x="468.0" y="160.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">stops membrane proteins</text><text x="468.0" y="178.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">(and outer-leaflet lipids)</text><text x="468.0" y="196.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">drifting between domains</text><rect x="412" y="234" width="14" height="14" rx="2" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.6"/><text x="434.0" y="241.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">apical proteins (e.g. SGLT1)</text><circle cx="419" cy="268" r="7" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><text x="434.0" y="268.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">basolateral (e.g. Na⁺/K⁺-ATPase)</text><text x="410.0" y="300.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Keeping the two sets apart is what</text><text x="410.0" y="318.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">makes the epithelium polarized.</text><text x="340.0" y="376.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Passing signals between neighbors is a gap junction job, not a tight junction job.</text></svg>
