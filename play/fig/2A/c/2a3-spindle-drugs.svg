<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 445" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Spindle microtubules must grow AND shrink to separate chromatids</text><text x="170.0" y="62.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Normal anaphase</text><circle cx="50.0" cy="130.0" r="7" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><circle cx="290.0" cy="130.0" r="7" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><line x1="50.0" y1="130.0" x2="116.0" y2="100.0" stroke="#1f9d63" stroke-width="3" stroke-linecap="round"/><polyline points="110,91 103,100 110,109" fill="none" stroke="#7a4cd9" stroke-width="4"/><line x1="290.0" y1="130.0" x2="224.0" y2="100.0" stroke="#1f9d63" stroke-width="3" stroke-linecap="round"/><polyline points="230,91 237,100 230,109" fill="none" stroke="#7a4cd9" stroke-width="4"/><line x1="50.0" y1="130.0" x2="116.0" y2="130.0" stroke="#1f9d63" stroke-width="3" stroke-linecap="round"/><polyline points="110,121 103,130 110,139" fill="none" stroke="#7a4cd9" stroke-width="4"/><line x1="290.0" y1="130.0" x2="224.0" y2="130.0" stroke="#1f9d63" stroke-width="3" stroke-linecap="round"/><polyline points="230,121 237,130 230,139" fill="none" stroke="#7a4cd9" stroke-width="4"/><line x1="50.0" y1="130.0" x2="116.0" y2="160.0" stroke="#1f9d63" stroke-width="3" stroke-linecap="round"/><polyline points="110,151 103,160 110,169" fill="none" stroke="#7a4cd9" stroke-width="4"/><line x1="290.0" y1="130.0" x2="224.0" y2="160.0" stroke="#1f9d63" stroke-width="3" stroke-linecap="round"/><polyline points="230,151 237,160 230,169" fill="none" stroke="#7a4cd9" stroke-width="4"/><text x="170.0" y="192.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">kinetochore microtubules shorten (lose GDP-tubulin)</text><text x="170.0" y="88.0" font-size="12.5" font-weight="600" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">← chromatids pulled to poles →</text><text x="510.0" y="62.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">With paclitaxel</text><circle cx="390.0" cy="130.0" r="7" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><circle cx="630.0" cy="130.0" r="7" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><line x1="390.0" y1="130.0" x2="506.0" y2="100.0" stroke="#1f9d63" stroke-width="3" stroke-linecap="round"/><polyline points="500,91 493,100 500,109" fill="none" stroke="#7a4cd9" stroke-width="4"/><line x1="630.0" y1="130.0" x2="514.0" y2="100.0" stroke="#1f9d63" stroke-width="3" stroke-linecap="round"/><polyline points="520,91 527,100 520,109" fill="none" stroke="#7a4cd9" stroke-width="4"/><line x1="390.0" y1="130.0" x2="506.0" y2="130.0" stroke="#1f9d63" stroke-width="3" stroke-linecap="round"/><polyline points="500,121 493,130 500,139" fill="none" stroke="#7a4cd9" stroke-width="4"/><line x1="630.0" y1="130.0" x2="514.0" y2="130.0" stroke="#1f9d63" stroke-width="3" stroke-linecap="round"/><polyline points="520,121 527,130 520,139" fill="none" stroke="#7a4cd9" stroke-width="4"/><line x1="390.0" y1="130.0" x2="506.0" y2="160.0" stroke="#1f9d63" stroke-width="3" stroke-linecap="round"/><polyline points="500,151 493,160 500,169" fill="none" stroke="#7a4cd9" stroke-width="4"/><line x1="630.0" y1="130.0" x2="514.0" y2="160.0" stroke="#1f9d63" stroke-width="3" stroke-linecap="round"/><polyline points="520,151 527,160 520,169" fill="none" stroke="#7a4cd9" stroke-width="4"/><text x="510.0" y="192.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">microtubules frozen: cannot shorten</text><text x="510.0" y="212.2" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">chromatids stuck at the middle;</text><text x="510.0" y="227.8" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">checkpoint arrests mitosis</text><rect x="20" y="262" width="640" height="165" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="282.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Two opposite ways to poison the spindle; both arrest mitosis</text><rect x="36" y="300" width="296" height="112" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="184.0" y="318.0" font-size="13.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Block growth</text><text x="50.0" y="342.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">colchicine, vinca alkaloids</text><text x="50.0" y="361.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">(vincristine, vinblastine)</text><text x="50.0" y="380.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">→ no spindle forms</text><rect x="348" y="300" width="296" height="112" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="496.0" y="318.0" font-size="13.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Block shrinkage</text><text x="362.0" y="342.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">paclitaxel (Taxol), other taxanes</text><text x="362.0" y="361.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">→ spindle forms but is frozen;</text><text x="362.0" y="380.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">chromatids cannot be pulled apart</text></svg>
