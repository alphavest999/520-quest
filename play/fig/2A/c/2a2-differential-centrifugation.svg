<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Differential centrifugation: bigger, denser particles pellet first</text><text x="70.0" y="54.2" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1,000 g</text><text x="70.0" y="69.8" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">10 min</text><path d="M44,88 L44,230 Q44,262 70,262 Q96,262 96,230 L96,88" fill="#e6eefc" stroke="#5b6474" stroke-width="2"/><path d="M44,238 Q44,262 70,262 Q96,262 96,238 Z" fill="#2f6fdb"/><text x="70.0" y="300.0" font-size="12" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">nuclei</text><text x="70.0" y="365.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">DNA polymerase</text><path d="M104,120 L190,120" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah_1f2430)"/><text x="148.0" y="106.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">supernatant</text><text x="230.0" y="54.2" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">20,000 g</text><text x="230.0" y="69.8" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">20 min</text><path d="M204,88 L204,230 Q204,262 230,262 Q256,262 256,230 L256,88" fill="#e6eefc" stroke="#5b6474" stroke-width="2"/><path d="M204,238 Q204,262 230,262 Q256,262 256,238 Z" fill="#1f9d63"/><text x="230.0" y="285.0" font-size="12" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">mitochondria,</text><text x="230.0" y="300.0" font-size="12" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">lysosomes,</text><text x="230.0" y="315.0" font-size="12" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">peroxisomes</text><text x="230.0" y="350.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">succinate DH,</text><text x="230.0" y="365.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">acid phosphatase,</text><text x="230.0" y="380.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">catalase</text><path d="M264,120 L350,120" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah_1f2430)"/><text x="308.0" y="106.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">supernatant</text><text x="390.0" y="54.2" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">100,000 g</text><text x="390.0" y="69.8" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">60 min</text><path d="M364,88 L364,230 Q364,262 390,262 Q416,262 416,230 L416,88" fill="#e6eefc" stroke="#5b6474" stroke-width="2"/><path d="M364,238 Q364,262 390,262 Q416,262 416,238 Z" fill="#7a4cd9"/><text x="390.0" y="292.5" font-size="12" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">microsomes</text><text x="390.0" y="307.5" font-size="12" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">(ER fragments)</text><text x="390.0" y="357.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">glucose-6-</text><text x="390.0" y="372.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">phosphatase</text><path d="M424,120 L510,120" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah_1f2430)"/><text x="468.0" y="106.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">supernatant</text><text x="550.0" y="54.2" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">300,000 g</text><text x="550.0" y="69.8" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 h</text><path d="M524,88 L524,230 Q524,262 550,262 Q576,262 576,230 L576,88" fill="#e6eefc" stroke="#5b6474" stroke-width="2"/><path d="M524,238 Q524,262 550,262 Q576,262 576,238 Z" fill="#d98a00"/><text x="550.0" y="292.5" font-size="12" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">ribosomes,</text><text x="550.0" y="307.5" font-size="12" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">large complexes</text><text x="550.0" y="365.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">rRNA</text><text x="20.0" y="340.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">markers:</text><text x="470.0" y="427.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Speed rises left to right: each spin pellets</text><text x="470.0" y="442.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">smaller or less dense particles from the previous supernatant.</text></svg>
