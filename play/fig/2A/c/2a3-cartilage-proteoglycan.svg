" dominant-baseline="middle">−</text><polyline points="250,172 220,164" fill="none" stroke="#138f9a" stroke-width="2"/><text x="216.0" y="163.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><polyline points="250,172 280,164" fill="none" stroke="#138f9a" stroke-width="2"/><text x="284.0" y="163.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><polyline points="250,188 220,180" fill="none" stroke="#138f9a" stroke-width="2"/><text x="216.0" y="179.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><polyline points="250,188 280,180" fill="none" stroke="#138f9a" stroke-width="2"/><text x="284.0" y="179.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><polyline points="250,204 220,196" fill="none" stroke="#138f9a" stroke-width="2"/><text x="216.0" y="195.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><polyline points="250,204 280,196" fill="none" stroke="#138f9a" stroke-width="2"/><text x="284.0" y="195.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">−</text><text x="180.0" y="264.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">purple: core protein · teal: GAG chains</text><text x="180.0" y="282.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(chondroitin and keratan sulfate)</text><rect x="360" y="70" width="300" height="210" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="510.0" y="92.0" font-size="13.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Why this resists squeezing</text><text x="374.0" y="118.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">1  Sulfate and carboxyl groups make</text><text x="374.0" y="137.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">   the GAGs strongly negative.</text><text x="374.0" y="156.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">2  They attract Na⁺ and other cations;</text><text x="374.0" y="175.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">   water follows by osmosis.</text><text x="374.0" y="194.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">3  Swollen gel is held in by the</text><text x="374.0" y="213.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">   type II collagen net.</text><text x="374.0" y="232.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">4  Load pushes water out slowly;</text><text x="374.0" y="251.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">   the gel pushes back, then refills.</text><rect x="20" y="336" width="640" height="82" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="34.0" y="358.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">✗ Hydroxyapatite mineral is bone, not cartilage.</text><text x="34.0" y="378.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">✗ Cartilage is mostly matrix with few chondrocytes in lacunae.</text><text x="34.0" y="398.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">✗ Cartilage has no blood vessels at all.</text></svg>
