<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_d98a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="ah_2f6fdb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ah_138f9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glucose absorption by an intestinal epithelial cell</text><rect x="160" y="70" width="360" height="260" rx="16" fill="#fbfcfe" stroke="#1f2430" stroke-width="2"/><text x="90.0" y="191.9" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Gut lumen</text><text x="90.0" y="208.1" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(apical side)</text><text x="600.0" y="191.9" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Blood</text><text x="600.0" y="208.1" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(basolateral)</text><text x="340.0" y="191.9" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Cytosol: [glucose] high,</text><text x="340.0" y="208.1" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">[Na⁺] low (≈15 mM)</text><rect x="140" y="100" width="40" height="80" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="160.0" y="58.0" font-size="13" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">SGLT1</text><path d="M100,124 L214,124" fill="none" stroke="#d98a00" stroke-width="2.6" marker-end="url(#ah_d98a00)"/><text x="232.0" y="124.0" font-size="12.5" font-weight="600" fill="#d98a00" text-anchor="start" dominant-baseline="middle">2 Na⁺ (downhill)</text><path d="M100,156 L214,156" fill="none" stroke="#2f6fdb" stroke-width="2.6" marker-end="url(#ah_2f6fdb)"/><text x="232.0" y="156.0" font-size="12.5" font-weight="600" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">glucose (uphill)</text><rect x="500" y="100" width="40" height="60" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="520.0" y="58.0" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">GLUT2</text><path d="M470,130 L580,130" fill="none" stroke="#2f6fdb" stroke-width="2.4" marker-end="url(#ah_2f6fdb)"/><text x="592.0" y="122.5" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">glucose</text><text x="592.0" y="137.5" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">(downhill)</text><rect x="500" y="220" width="40" height="80" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="420.0" y="314.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">Na⁺/K⁺-ATPase</text><path d="M470,240 L580,240" fill="none" stroke="#d98a00" stroke-width="2.4" marker-end="url(#ah_d98a00)"/><text x="592.0" y="240.0" font-size="12.5" font-weight="400" fill="#d98a00" text-anchor="start" dominant-baseline="middle">3 Na⁺</text><path d="M580,280 L470,280" fill="none" stroke="#138f9a" stroke-width="2.4" marker-end="url(#ah_138f9a)"/><text x="592.0" y="280.0" font-size="12.5" font-weight="400" fill="#138f9a" text-anchor="start" dominant-baseline="middle">2 K⁺</text><text x="460.0" y="260.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">ATP</text><rect x="20" y="352" width="640" height="56" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="370.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SGLT1 burns no ATP: Na⁺ flowing downhill pays for glucose going uphill (secondary active).</text><text x="340.0" y="392.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The basolateral pump spends ATP to keep cytosolic Na⁺ low, so the gradient lasts.</text></svg>
