<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_7a4cd9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ah_d23c8a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d23c8a"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cargo enters the Golgi at the cis face and leaves from the trans face</text><rect x="20" y="160" width="110" height="90" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="75.0" y="205.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">rough ER</text><path d="M220,120 q-22,85 0,170" fill="none" stroke="#2f6fdb" stroke-width="16" stroke-linecap="round"/><text x="216.0" y="312.0" font-size="12" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">cis</text><path d="M275,120 q-22,85 0,170" fill="none" stroke="#138f9a" stroke-width="16" stroke-linecap="round"/><text x="271.0" y="312.0" font-size="12" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">medial</text><path d="M330,120 q-22,85 0,170" fill="none" stroke="#138f9a" stroke-width="16" stroke-linecap="round"/><text x="326.0" y="312.0" font-size="12" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">medial</text><path d="M385,120 q-22,85 0,170" fill="none" stroke="#d23c8a" stroke-width="16" stroke-linecap="round"/><text x="381.0" y="312.0" font-size="12" font-weight="700" fill="#d23c8a" text-anchor="middle" dominant-baseline="middle">trans</text><circle cx="170" cy="170" r="9" fill="#fff" stroke="#7a4cd9" stroke-width="3"/><circle cx="170" cy="240" r="9" fill="#fff" stroke="#7a4cd9" stroke-width="3"/><path d="M132,205 L190,205" fill="none" stroke="#7a4cd9" stroke-width="2.2" marker-end="url(#ah_7a4cd9)"/><text x="160.0" y="132.5" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">COPII</text><text x="160.0" y="147.5" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">vesicles</text><path d="M395,205 L470,205" fill="none" stroke="#d23c8a" stroke-width="2.2" marker-end="url(#ah_d23c8a)"/><circle cx="490" cy="130" r="10" fill="#fff" stroke="#d23c8a" stroke-width="3"/><text x="508.0" y="130.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">to plasma membrane</text><path d="M460,205 L478,138" fill="none" stroke="#d23c8a" stroke-width="1.6" marker-end="url(#ah_d23c8a)"/><circle cx="490" cy="205" r="10" fill="#fff" stroke="#d23c8a" stroke-width="3"/><text x="508.0" y="205.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">secretory granules</text><circle cx="490" cy="280" r="10" fill="#fff" stroke="#d23c8a" stroke-width="3"/><text x="508.0" y="280.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">to lysosomes (M6P)</text><path d="M460,205 L478,272" fill="none" stroke="#d23c8a" stroke-width="1.6" marker-end="url(#ah_d23c8a)"/><text x="340.0" y="390.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Medial cisternae are reached only after the cis face.</text></svg>
