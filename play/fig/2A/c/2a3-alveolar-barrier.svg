ll="#e3f5ec" stroke="#1f9d63" stroke-width="1"/><rect x="401.1111111111111" y="182" width="29.11111111111111" height="12" rx="3" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1"/><rect x="432.22222222222223" y="182" width="29.11111111111111" height="12" rx="3" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1"/><rect x="463.3333333333333" y="182" width="29.11111111111111" height="12" rx="3" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1"/><rect x="494.44444444444446" y="182" width="29.11111111111111" height="12" rx="3" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1"/><rect x="525.5555555555555" y="182" width="29.11111111111111" height="12" rx="3" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1"/><rect x="556.6666666666666" y="182" width="29.11111111111111" height="12" rx="3" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1"/><rect x="587.7777777777778" y="182" width="29.11111111111111" height="12" rx="3" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1"/><rect x="618.8888888888889" y="182" width="29.11111111111111" height="12" rx="3" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1"/><rect x="370" y="198" width="280" height="3" rx="1" fill="#138f9a" stroke="#138f9a" stroke-width="0"/><rect x="370" y="204" width="280" height="22" rx="6" fill="#fdecea" stroke="#fdecea" stroke-width="0"/><text x="510.0" y="215.0" font-size="12.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">blood</text><text x="510.0" y="240.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">many layers: tens of μm or more</text><rect x="20" y="256" width="640" height="130" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="278.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fick&#x27;s law: rate of diffusion ∝ (area × partial-pressure difference) / thickness</text><text x="36.0" y="304.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Simple = one layer; squamous = flat. Together they give the shortest diffusion path.</text><text x="36.0" y="323.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Stratified squamous (skin, esophagus) resists abrasion but blocks fast exchange.</text><text x="36.0" y="342.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Simple columnar (intestine) absorbs and secretes; tall cells add distance.</text><text x="36.0" y="361.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Transitional (bladder) stretches; it is many layers thick.</text></svg>
