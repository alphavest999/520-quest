<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_d6453d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="ah_1f9d63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Loading a synaptic vesicle: pump first, then antiporter</text><ellipse cx="340" cy="190" rx="150" ry="110" fill="#fdf1db" stroke="#d98a00" stroke-width="3"/><text x="340.0" y="175.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">vesicle lumen:</text><text x="340.0" y="195.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">high [H⁺] (pH ≈ 5.5)</text><text x="340.0" y="217.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">transmitter piles up</text><text x="60.0" y="70.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Cytosol (pH ≈ 7.2)</text><rect x="166" y="160" width="44" height="60" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="120.0" y="128.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">V-type ATPase</text><path d="M100,190 L236,190" fill="none" stroke="#d6453d" stroke-width="2.6" marker-end="url(#ah_d6453d)"/><text x="84.0" y="190.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="end" dominant-baseline="middle">H⁺</text><text x="120.0" y="236.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ATP → ADP + Pᵢ</text><text x="120.0" y="256.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">(primary active)</text><rect x="470" y="160" width="44" height="60" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="560.0" y="128.0" font-size="13" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">vesicular transporter</text><path d="M620,176 L448,176" fill="none" stroke="#1f9d63" stroke-width="2.6" marker-end="url(#ah_1f9d63)"/><text x="560.0" y="160.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">transmitter in</text><path d="M448,206 L620,206" fill="none" stroke="#d6453d" stroke-width="2.6" marker-end="url(#ah_d6453d)"/><text x="560.0" y="222.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">H⁺ out</text><text x="560.0" y="252.0" font-size="12" font-weight="400" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">opposite directions = antiporter</text><text x="560.0" y="270.0" font-size="12" font-weight="400" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">powered by H⁺ gradient = secondary</text><rect x="20" y="322" width="640" height="64" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="343.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Classify by direction (same = symporter, opposite = antiporter, one solute = uniporter)</text><text x="340.0" y="365.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">and by energy (ATP used by this protein = primary; ion gradient = secondary).</text></svg>
