<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_d6453d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="ah_1f9d63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Liposome test: glucose moves in only with an inward Na⁺ gradient</text><text x="150.0" y="56.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Na⁺ higher outside</text><circle cx="150" cy="190" r="88" fill="#e6eefc" stroke="#c9a24a" stroke-width="14"/><rect x="224" y="166" width="28" height="48" rx="6" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="130.0" y="160.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">inside: Na⁺ 10 mM</text><text x="210.0" y="78.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">outside: Na⁺ 150 mM</text><path d="M300,180 L190,180" fill="none" stroke="#d6453d" stroke-width="2.2" marker-end="url(#ah_d6453d)"/><text x="300.0" y="166.0" font-size="12" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Na⁺</text><path d="M300,204 L190,204" fill="none" stroke="#1f9d63" stroke-width="2.2" marker-end="url(#ah_1f9d63)"/><text x="300.0" y="220.0" font-size="12" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">glucose</text><text x="130.0" y="230.0" font-size="12" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">glucose accumulates</text><text x="470.0" y="56.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">No Na⁺ gradient</text><circle cx="470" cy="190" r="88" fill="#e6eefc" stroke="#c9a24a" stroke-width="14"/><rect x="544" y="166" width="28" height="48" rx="6" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="450.0" y="160.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">inside: Na⁺ 10 mM</text><text x="530.0" y="78.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">outside: Na⁺ 10 mM</text><path d="M578,180 L602,204 M602,180 L578,204" stroke="#d6453d" stroke-width="3.5" stroke-linecap="round"/><text x="450.0" y="230.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">no glucose uptake</text><rect x="30.4" y="303" width="239.2" height="24" rx="12" fill="#1f9d63"/><text x="150.0" y="315.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ Na⁺–glucose symporter (SGLT)</text><text x="340.0" y="352.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">A GLUT uniporter would carry glucose down its own gradient whether or not Na⁺ is present.</text><text x="340.0" y="374.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">The Na⁺/K⁺-ATPase moves no glucose, and channels pass ions, not sugars.</text><text x="340.0" y="404.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Downhill Na⁺ entry pays for uphill glucose entry: secondary active transport.</text></svg>
