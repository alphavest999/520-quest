<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_d6453d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Bafilomycin blocks the lysosome&#x27;s proton pump</text><text x="150.0" y="56.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Untreated</text><ellipse cx="150" cy="180" rx="110" ry="85" fill="#fdf1db" stroke="#d98a00" stroke-width="3"/><text x="150.0" y="160.0" font-size="14" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">pH ≈ 4.5–5</text><text x="150.0" y="177.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">hydrolases active;</text><text x="150.0" y="192.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">proteins digested</text><rect x="242" y="150" width="32" height="60" rx="8" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="258.0" y="196.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">V</text><path d="M308,170 L218,170" fill="none" stroke="#d6453d" stroke-width="2.2" marker-end="url(#ah_d6453d)"/><text x="298.0" y="156.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">H⁺</text><text x="302.0" y="228.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">ATP → ADP</text><text x="470.0" y="56.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+ Bafilomycin A1</text><ellipse cx="470" cy="180" rx="110" ry="85" fill="#f1f3f6" stroke="#8a93a3" stroke-width="3"/><text x="470.0" y="160.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">pH ≈ 6.5 (rising)</text><text x="470.0" y="177.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">hydrolases slow;</text><text x="470.0" y="192.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">proteins pile up</text><rect x="562" y="150" width="32" height="60" rx="8" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="578.0" y="196.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">V</text><path d="M565,167 L591,193 M591,167 L565,193" stroke="#d6453d" stroke-width="3.5" stroke-linecap="round"/><text x="598.0" y="240.0" font-size="12" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">bafilomycin A1</text><rect x="186.9" y="298" width="306.2" height="24" rx="12" fill="#1f9d63"/><text x="340.0" y="310.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ higher lysosomal pH, slower breakdown</text><text x="340.0" y="345.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">V-type pumps use ATP to acidify lysosomes. Mitochondrial F-type ATP synthase is a different enzyme</text><text x="340.0" y="363.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">that runs H⁺ downhill to make ATP, so it keeps working.</text></svg>
