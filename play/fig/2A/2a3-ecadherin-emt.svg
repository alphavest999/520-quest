<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_d6453d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Losing E-cadherin lets carcinoma cells detach and invade</text><text x="170.0" y="70.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Normal epithelium</text><rect x="45" y="120" width="56" height="110" rx="8" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><ellipse cx="73" cy="185" rx="12" ry="10" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/><rect x="107" y="120" width="56" height="110" rx="8" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><ellipse cx="135" cy="185" rx="12" ry="10" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/><rect x="169" y="120" width="56" height="110" rx="8" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><ellipse cx="197" cy="185" rx="12" ry="10" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/><rect x="231" y="120" width="56" height="110" rx="8" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><ellipse cx="259" cy="185" rx="12" ry="10" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/><polyline points="95,140 113,140" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="95,152 113,152" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="157,140 175,140" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="157,152 175,152" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="219,140 237,140" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="219,152 237,152" fill="none" stroke="#d6453d" stroke-width="3"/><text x="170.0" y="96.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">E-cadherin zipper (red) at adherens junctions</text><rect x="30" y="236" width="280" height="10" rx="3" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="170.0" y="262.0" font-size="12" font-weight="400" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">basement membrane</text><path d="M318,175 L360,175" fill="none" stroke="#1f2430" stroke-width="2.4" marker-end="url(#ah_1f2430)"/><text x="512.0" y="70.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">After E-cadherin loss (EMT)</text><path d="M380,125 c20,-12 45,-6 50,14 c4,18 -10,40 -28,44 c-22,6 -36,-12 -34,-28 c-6,-4 -2,-22 12,-30 z" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><path d="M452,140 c20,-12 45,-6 50,14 c4,18 -10,40 -28,44 c-22,6 -36,-12 -34,-28 c-6,-4 -2,-22 12,-30 z" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><path d="M540,115 c20,-12 45,-6 50,14 c4,18 -10,40 -28,44 c-22,6 -36,-12 -34,-28 c-6,-4 -2,-22 12,-30 z" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><path d="M600,205 c20,-12 45,-6 50,14 c4,18 -10,40 -28,44 c-22,6 -36,-12 -34,-28 c-6,-4 -2,-22 12,-30 z" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><rect x="372" y="236" width="120" height="10" rx="3" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><rect x="540" y="236" width="120" height="10" rx="3" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><path d="M618,230 L628,300" fill="none" stroke="#d6453d" stroke-width="2.2" marker-end="url(#ah_d6453d)"/><text x="580.0" y="318.0" font-size="12.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">invades tissue, enters vessels</text><rect x="334.1" y="278" width="231.8" height="24" rx="12" fill="#1f9d63"/><text x="450.0" y="290.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ cells detach from neighbors</text><rect x="20" y="340" width="640" height="72" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="34.0" y="360.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">✗ Still divide: cadherin loss does not stop proliferation (it can even release β-catenin signaling).</text><text x="34.0" y="379.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">✗ Integrins (cell–matrix) are a separate system and are needed to crawl.</text><text x="34.0" y="398.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">✗ Gap junctions only pass small molecules; they do not hold cells in place.</text></svg>
