<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Junctions between epithelial cells</text><rect x="40" y="66" width="156" height="260" rx="8" fill="#fbfcfe" stroke="#1f2430" stroke-width="2"/><rect x="214" y="66" width="156" height="260" rx="8" fill="#fbfcfe" stroke="#1f2430" stroke-width="2"/><rect x="30" y="332" width="350" height="14" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.2"/><text x="118.0" y="54.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">apical surface</text><text x="292.0" y="54.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">apical surface</text><polyline points="192,78 218,78" fill="none" stroke="#1f9d63" stroke-width="3"/><polyline points="192,86 218,86" fill="none" stroke="#1f9d63" stroke-width="3"/><polyline points="192,94 218,94" fill="none" stroke="#1f9d63" stroke-width="3"/><polyline points="196,118 214,118" fill="none" stroke="#138f9a" stroke-width="1.6"/><polyline points="196,124 214,124" fill="none" stroke="#138f9a" stroke-width="1.6"/><polyline points="196,130 214,130" fill="none" stroke="#138f9a" stroke-width="1.6"/><polyline points="136,124 194,124" fill="none" stroke="#d6453d" stroke-width="2"/><polyline points="216,124 274,124" fill="none" stroke="#d6453d" stroke-width="2"/><rect x="188" y="176" width="7" height="34" fill="#1f2430"/><rect x="215" y="176" width="7" height="34" fill="#1f2430"/><polyline points="196,182 214,182" fill="none" stroke="#d98a00" stroke-width="1.6"/><polyline points="196,190 214,190" fill="none" stroke="#d98a00" stroke-width="1.6"/><polyline points="196,198 214,198" fill="none" stroke="#d98a00" stroke-width="1.6"/><polyline points="196,206 214,206" fill="none" stroke="#d98a00" stroke-width="1.6"/><path d="M188,185 C136,145 126,209 188,197.0" fill="none" stroke="#d98a00" stroke-width="1.4"/><path d="M222,185 C274,145 284,209 222,197.0" fill="none" stroke="#d98a00" stroke-width="1.4"/><path d="M188,201 C136,241 126,177 188,189.0" fill="none" stroke="#d98a00" stroke-width="1.4"/><path d="M222,201 C274,241 284,177 222,189.0" fill="none" stroke="#d98a00" stroke-width="1.4"/><rect x="191" y="244" width="28" height="8" rx="2" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.4"/><polyline points="193,248 217,248" fill="none" stroke="#2f6fdb" stroke-width="1"/><rect x="191" y="256" width="28" height="8" rx="2" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.4"/><polyline points="193,260 217,260" fill="none" stroke="#2f6fdb" stroke-width="1"/><rect x="191" y="268" width="28" height="8" rx="2" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.4"/><polyline points="193,272 217,272" fill="none" stroke="#2f6fdb" stroke-width="1"/><rect x="100" y="317" width="40" height="6" fill="#1f2430"/><polyline points="106,323 106,334" fill="none" stroke="#7a4cd9" stroke-width="2"/><polyline points="120,323 120,334" fill="none" stroke="#7a4cd9" stroke-width="2"/><polyline points="134,323 134,334" fill="none" stroke="#7a4cd9" stroke-width="2"/><path d="M104,317 C90,266 150,266 136,317" fill="none" stroke="#d98a00" stroke-width="1.4"/><polyline points="224,86 390,80" fill="none" stroke="#1f9d63" stroke-width="1.2" stroke-dasharray="6 4"/><text x="396.0" y="71.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">Tight junction (claudins, occludin)</text><text x="396.0" y="89.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">seals the space between cells</text><polyline points="224,124 390,140" fill="none" stroke="#138f9a" stroke-width="1.2" stroke-dasharray="6 4"/><text x="396.0" y="131.0" font-size="12.5" font-weight="700" fill="#138f9a" text-anchor="start" dominant-baseline="middle">Adherens junction (cadherins)</text><text x="396.0" y="149.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">links the actin belts of neighbors</text><polyline points="224,193 390,200" fill="none" stroke="#d98a00" stroke-width="1.2" stroke-dasharray="6 4"/><text x="396.0" y="191.0" font-size="12.5" font-weight="700" fill="#d98a00" text-anchor="start" dominant-baseline="middle">Desmosome (desmosomal cadherins)</text><text x="396.0" y="209.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">spot weld to keratin: cell–cell strength</text><polyline points="224,260 390,260" fill="none" stroke="#2f6fdb" stroke-width="1.2" stroke-dasharray="6 4"/><text x="396.0" y="251.0" font-size="12.5" font-weight="700" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">Gap junction (connexons)</text><text x="396.0" y="269.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">channels join cytoplasms: ions, dyes</text><polyline points="140,320 390,320" fill="none" stroke="#7a4cd9" stroke-width="1.2" stroke-dasharray="6 4"/><text x="396.0" y="311.0" font-size="12.5" font-weight="700" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">Hemidesmosome (integrins)</text><text x="396.0" y="329.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">anchors cell to basal lamina (laminin)</text><text x="205.0" y="380.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">basement membrane (basal lamina)</text><text x="340.0" y="404.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Junctions are drawn on one boundary for clarity; real cells have them all around.</text></svg>
