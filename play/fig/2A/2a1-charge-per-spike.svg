<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">How much Na⁺ enters during one action potential?</text><circle cx="120" cy="160" r="80" fill="#fdf1db" stroke="#d98a00" stroke-width="3"/><text x="120.0" y="150.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cell body</text><text x="120.0" y="170.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">diameter 50 μm</text><text x="120.0" y="262.0" font-size="13" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">[Na⁺]in ≈ 15 mM</text><text x="236.0" y="74.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Charge to move Vm by 100 mV:</text><text x="236.0" y="102.0" font-size="13" font-weight="400" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">Q = C·ΔV = (1 μF/cm²)(0.1 V) = 1 × 10⁻⁷ C/cm²</text><text x="236.0" y="130.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Moles of Na⁺ per cm² of membrane:</text><text x="236.0" y="158.0" font-size="13" font-weight="400" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">Q / F = 10⁻⁷ / 96 485 ≈ 1.0 × 10⁻¹² mol/cm²</text><text x="236.0" y="186.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Spread through the cell volume (A/V = 3/r):</text><text x="236.0" y="214.0" font-size="13" font-weight="400" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">Δ[Na⁺] ≈ 1.2 μM</text><rect x="20" y="300" width="640" height="86" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="340.0" y="322.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">≈ 1.2 μM out of 15 000 μM ≈ 0.008% change per spike</text><text x="340.0" y="346.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Even if real influx is a few times this minimum, the change stays tiny.</text><text x="340.0" y="366.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gradients barely move per spike; the pump restores them slowly over many spikes.</text></svg>
