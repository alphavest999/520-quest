<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_d98a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="ah_2f6fdb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Isosmotic is not the same as isotonic</text><text x="20.0" y="58.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="start" dominant-baseline="middle">Red cell in 300 mM urea (urea crosses the membrane)</text><ellipse cx="110" cy="150" rx="58" ry="50" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="110.0" y="135.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">300 mOsm</text><text x="110.0" y="150.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">impermeant</text><text x="110.0" y="165.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">solutes</text><ellipse cx="340" cy="150" rx="62" ry="54" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="340.0" y="135.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">impermeant</text><text x="340.0" y="150.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">solutes</text><text x="340.0" y="165.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+ urea</text><ellipse cx="570" cy="150" rx="78" ry="66" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5" stroke-dasharray="6 4"/><text x="570.0" y="141.9" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">swells,</text><text x="570.0" y="158.1" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">then lyses</text><text x="110.0" y="82.0" font-size="12" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">urea 300 outside</text><path d="M20,150 L50,150" fill="none" stroke="#d98a00" stroke-width="2.4" marker-end="url(#ah_d98a00)"/><text x="34.0" y="136.0" font-size="11.5" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">urea</text><path d="M248,150 L276,150" fill="none" stroke="#2f6fdb" stroke-width="2.4" marker-end="url(#ah_2f6fdb)"/><text x="262.0" y="136.0" font-size="11.5" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">H₂O</text><path d="M432,150 L404,150" fill="none" stroke="#2f6fdb" stroke-width="2.4" marker-end="url(#ah_2f6fdb)"/><text x="418.0" y="136.0" font-size="11.5" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">H₂O</text><text x="110.0" y="224.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1. Urea diffuses in</text><text x="340.0" y="224.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2. Urea equal on both sides;</text><text x="340.0" y="242.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cell&#x27;s own solutes pull water in</text><text x="570.0" y="236.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3. Hemolysis</text><rect x="20" y="268" width="640" height="150" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="36.0" y="290.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">Contrast: red cell in 300 mOsm NaCl (150 mM), where Na⁺ is kept out</text><ellipse cx="110" cy="352" rx="52" ry="44" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="110.0" y="344.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">300 mOsm</text><text x="110.0" y="359.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">inside</text><text x="186.0" y="330.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Outside solute cannot enter, so the 300 vs 300</text><text x="186.0" y="350.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">balance holds: isotonic, no net water flow.</text><text x="186.0" y="378.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Tonicity counts only solutes that stay on one side.</text><text x="186.0" y="398.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Urea solutions behave like pure water to a red cell.</text></svg>
