circle cx="571.7" cy="224.0" r="42.0" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.4"/><text x="571.7" y="224.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">O</text><polyline points="438.25421361613905,326.0 401.3542136161391,326.0" fill="none" stroke="#1f2430" stroke-width="3"/><circle cx="401.4" cy="326.0" r="21.0" fill="#d9dde4" stroke="#5b6474" stroke-width="1.2"/><circle cx="438.3" cy="326.0" r="42.0" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.4"/><text x="438.3" y="326.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">O</text><polyline points="571.745786383861,326.0 608.6457863838609,326.0" fill="none" stroke="#1f2430" stroke-width="3"/><circle cx="608.6" cy="326.0" r="21.0" fill="#d9dde4" stroke="#5b6474" stroke-width="1.2"/><circle cx="571.7" cy="326.0" r="42.0" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.4"/><text x="571.7" y="326.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">O</text><circle cx="505" cy="173.0" r="28.5" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><text x="505.0" y="173.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Na⁺</text><circle cx="505" cy="275.0" r="28.5" fill="#fdf1db" stroke="#d98a00" stroke-width="1.6"/><text x="505.0" y="275.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Na⁺</text><polyline points="505,275.0 571.745786383861,326.0" fill="none" stroke="#1f2430" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="44.2" y="380" width="261.5" height="24" rx="12" fill="#1f9d63"/><text x="175.0" y="392.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ snug: ion–O contact, gap 0.07 Å</text><rect x="389.1" y="380" width="231.8" height="24" rx="12" fill="#d6453d"/><text x="505.0" y="392.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ loose: 0.45 Å gap to each O</text><text x="175.0" y="422.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Oxygens replace K⁺&#x27;s water shell almost</text><text x="175.0" y="437.6" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">perfectly, so shedding water costs</text><text x="175.0" y="453.2" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">little net energy.</text><text x="505.0" y="422.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Na⁺ binds water more tightly and cannot</text><text x="505.0" y="437.6" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">touch all the filter oxygens at once, so</text><text x="505.0" y="453.2" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">dehydrating it is not repaid.</text><text x="340.0" y="480.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Both ions carry +1, and size exclusion cannot work: Na⁺ is the smaller ion.</text><text x="340.0" y="495.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">No ATP is used; ions flow down their electrochemical gradient.</text></svg>
