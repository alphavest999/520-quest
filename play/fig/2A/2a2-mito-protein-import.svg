<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_138f9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Most mitochondrial proteins are imported from the cytosol</text><ellipse cx="90" cy="120" rx="70" ry="55" fill="#e6eefc" stroke="#2f6fdb" stroke-width="3"/><text x="90.0" y="110.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">nucleus</text><text x="90.0" y="130.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">~1000+ genes</text><path d="M162,120 L215,120" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah_1f2430)"/><text x="188.0" y="105.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">mRNA</text><ellipse cx="250" cy="112" rx="26" ry="12" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><ellipse cx="250" cy="130" rx="32" ry="15" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="250.0" y="152.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">free cytosolic</text><text x="250.0" y="167.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ribosome</text><path d="M276,118 q20,-15 40,0 q20,15 40,0" fill="none" stroke="#d6453d" stroke-width="3"/><text x="330.0" y="95.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">presequence (+)</text><path d="M360,125 L455,190" fill="none" stroke="#1f2430" stroke-width="2" marker-end="url(#ah_1f2430)"/><ellipse cx="520" cy="285" rx="150" ry="110" fill="#ffffff" stroke="#1f9d63" stroke-width="3"/><ellipse cx="520" cy="295" rx="128" ry="86" fill="#e3f5ec" stroke="#1f9d63" stroke-width="3"/><rect x="446" y="172" width="32" height="20" rx="4" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="438.0" y="182.0" font-size="12" font-weight="700" fill="#138f9a" text-anchor="end" dominant-baseline="middle">TOM</text><rect x="456" y="204" width="32" height="20" rx="4" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="448.0" y="214.0" font-size="12" font-weight="700" fill="#138f9a" text-anchor="end" dominant-baseline="middle">TIM</text><path d="M468,222 L500,270" fill="none" stroke="#138f9a" stroke-width="2" marker-end="url(#ah_138f9a)"/><text x="530.0" y="290.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">matrix: presequence cleaved,</text><text x="530.0" y="308.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">protein folds (chaperones)</text><path d="M470,345 a14,14 0 1,0 0.1,0" fill="none" stroke="#7a4cd9" stroke-width="2.5"/><text x="495.0" y="337.5" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">mtDNA: 13 proteins</text><text x="495.0" y="352.5" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">+ 2 rRNA + 22 tRNA</text><rect x="15.5" y="248" width="269.0" height="24" rx="12" fill="#1f9d63"/><text x="150.0" y="260.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ nuclear-encoded, imported (most)</text><rect x="41.6" y="283" width="216.9" height="24" rx="12" fill="#d6453d"/><text x="150.0" y="295.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ made from mtDNA (only 13)</text><rect x="78.8" y="318" width="142.5" height="24" rx="12" fill="#d6453d"/><text x="150.0" y="330.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ via ER vesicles</text><rect x="52.7" y="353" width="194.6" height="24" rx="12" fill="#d6453d"/><text x="150.0" y="365.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ endocytosed from blood</text><text x="340.0" y="412.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Proteins enter mitochondria post-translationally and unfolded, through TOM (outer) and TIM (inner) complexes.</text></svg>
