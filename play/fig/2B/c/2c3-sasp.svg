<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Senescent cells harm their neighbors through what they secrete</text><circle cx="150" cy="160" r="60" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="150" cy="160" r="25.2" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="100.0" y="247.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">senescent cell</text><text x="100.0" y="262.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(no division, still active)</text><path d="M199.02684435961459,118.86159298006149 L241.92533317427734,82.8654868376153" fill="none" stroke="#d98a00" stroke-width="1.8" marker-end="url(#ah)"/><text x="248.1" y="77.7" font-size="12.5" font-weight="600" fill="#d98a00" text-anchor="start" dominant-baseline="middle">IL-6, IL-8 (cytokines)</text><path d="M214.0,160.0 L270.0,160.0" fill="none" stroke="#d98a00" stroke-width="1.8" marker-end="url(#ah)"/><text x="278.0" y="160.0" font-size="12.5" font-weight="600" fill="#d98a00" text-anchor="start" dominant-baseline="middle">chemokines</text><path d="M199.02684435961459,201.1384070199385 L241.92533317427734,237.1345131623847" fill="none" stroke="#d98a00" stroke-width="1.8" marker-end="url(#ah)"/><text x="248.1" y="242.3" font-size="12.5" font-weight="600" fill="#d98a00" text-anchor="start" dominant-baseline="middle">MMPs (proteases)</text><rect x="440" y="70" width="220" height="150" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="550.0" y="95.0" font-size="13.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">SASP effects on tissue</text><text x="452.0" y="126.6" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• chronic low-grade inflammation</text><text x="452.0" y="142.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• matrix and tissue damage</text><text x="452.0" y="157.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• stem cell function impaired</text><text x="452.0" y="173.4" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• can even help nearby tumors</text><path d="M372,160 L438,160" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="285" width="640" height="120" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="32.0" y="340.9" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Removing them (genetically or with senolytic drugs) delays several age-related declines, so</text><text x="32.0" y="356.5" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">they were actively harmful, not harmless bystanders. Senescence still protects early on by</text><text x="32.0" y="372.1" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">stopping damaged cells from dividing.</text></svg>
