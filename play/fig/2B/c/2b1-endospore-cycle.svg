<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Endospores: survival, not reproduction</text><rect x="20" y="87" width="90" height="36" rx="18" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><line x1="53" y1="105" x2="77" y2="105" stroke="#7a4cd9" stroke-width="3"/><rect x="150" y="87" width="90" height="36" rx="18" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><line x1="213" y1="87" x2="213" y2="123" stroke="#d98a00" stroke-width="2"/><circle cx="225" cy="105" r="9" fill="#ffffff" stroke="#7a4cd9" stroke-width="2"/><rect x="285" y="87" width="90" height="36" rx="18" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><ellipse cx="350" cy="105" rx="17.0" ry="12.0" fill="#4a4f5c" stroke="#1f2430" stroke-width="1"/><ellipse cx="350" cy="105" rx="13.0" ry="9.0" fill="#8a7a5a" stroke="#d98a00" stroke-width="1"/><ellipse cx="350" cy="105" rx="8.0" ry="5.5" fill="#c9b98a" stroke="#d98a00" stroke-width="1"/><rect x="420" y="87" width="90" height="36" rx="18" fill="none" stroke="#8a93a3" stroke-width="1.5" stroke-dasharray="4 4"/><ellipse cx="465" cy="105" rx="22.1" ry="15.600000000000001" fill="#4a4f5c" stroke="#1f2430" stroke-width="1"/><ellipse cx="465" cy="105" rx="16.900000000000002" ry="11.700000000000001" fill="#8a7a5a" stroke="#d98a00" stroke-width="1"/><ellipse cx="465" cy="105" rx="10.4" ry="7.15" fill="#c9b98a" stroke="#d98a00" stroke-width="1"/><rect x="555" y="87" width="90" height="36" rx="18" fill="#e3f5ec" stroke="#d98a00" stroke-width="1.5"/><path d="M115,105 L145,105" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M245,105 L280,105" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M380,105 L415,105" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M515,105 L550,105" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="65.0" y="147.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">vegetative cell</text><text x="65.0" y="162.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(nutrients run out)</text><text x="195.0" y="147.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">asymmetric septum</text><text x="195.0" y="162.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">makes a forespore</text><text x="330.0" y="147.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">mother cell builds</text><text x="330.0" y="162.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cortex and coats</text><text x="465.0" y="147.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">mother cell lyses;</text><text x="465.0" y="162.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">dormant spore</text><text x="600.0" y="147.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">germination when</text><text x="600.0" y="162.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">conditions improve</text><rect x="20" y="185" width="640" height="34" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="340.0" y="202.0" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Count: 1 vegetative cell  →  1 endospore  →  1 vegetative cell  (no increase in number)</text><ellipse cx="120" cy="310" rx="95" ry="62" fill="#4a4f5c" stroke="#1f2430" stroke-width="1.5"/><ellipse cx="120" cy="310" rx="78" ry="49" fill="#8a7a5a" stroke="#d98a00" stroke-width="1.5"/><ellipse cx="120" cy="310" rx="58" ry="34" fill="#e9dfc0" stroke="#d98a00" stroke-width="1.5"/><text x="120.0" y="310.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">core</text><text x="232.0" y="258.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">coat: protein layers</text><text x="232.0" y="283.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">cortex: modified peptidoglycan</text><text x="232.0" y="310.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">core: DNA, ribosomes, very little water,</text><text x="232.0" y="328.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Ca²⁺–dipicolinic acid, SASP-protected DNA</text><polyline points="195,285 228,258" fill="none" stroke="#8a93a3" stroke-width="1"/><polyline points="190,295 228,283" fill="none" stroke="#8a93a3" stroke-width="1"/><polyline points="160,310 228,310" fill="none" stroke="#8a93a3" stroke-width="1"/><text x="232.0" y="350.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Boiling (100 °C) kills vegetative cells in minutes;</text><text x="232.0" y="365.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">spores need an autoclave (121 °C, about 15 min).</text></svg>
