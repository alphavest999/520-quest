<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah_5b6474" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker><marker id="ah_1f9d63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="ah_d6453d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Where common antibiotics hit a bacterial cell</text><rect x="40.0" y="85.0" width="600" height="300" rx="150.0" fill="#fdf1db" stroke="#d98a00" stroke-width="6"/><rect x="48.0" y="93.0" width="584" height="284" rx="142.0" fill="white" stroke="#138f9a" stroke-width="2"/><text x="340.0" y="76.0" font-size="12" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">cell wall (peptidoglycan)</text><text x="340.0" y="101.0" font-size="12" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">plasma membrane</text><rect x="70" y="170" width="120" height="46" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="130.0" y="185.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DNA</text><text x="130.0" y="200.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">replication</text><rect x="270" y="170" width="140" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="340.0" y="185.2" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">transcription</text><text x="340.0" y="200.8" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(RNA polymerase)</text><rect x="490" y="170" width="120" height="46" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="550.0" y="185.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">translation</text><text x="550.0" y="200.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(70S ribosome)</text><path d="M190,193 L268,193" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah_1f2430)"/><path d="M410,193 L488,193" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah_1f2430)"/><text x="229.0" y="182.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">DNA</text><text x="449.0" y="182.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">mRNA</text><rect x="70" y="290" width="170" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="155.0" y="310.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">folate synthesis</text><path d="M228,290 L192,214" fill="none" stroke="#5b6474" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah_5b6474)"/><text x="155.0" y="345.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">→ nucleotides</text><text x="130.0" y="232.5" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">fluoroquinolones</text><text x="130.0" y="247.5" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">(DNA gyrase)</text><path d="M340,240 L340,220" fill="none" stroke="#1f9d63" stroke-width="2" marker-end="url(#ah_1f9d63)"/><rect x="270" y="242" width="140" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="340.0" y="254.2" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">rifampin</text><text x="340.0" y="269.8" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(β subunit)</text><text x="550.0" y="225.5" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">30S: tetracyclines,</text><text x="550.0" y="240.5" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">aminoglycosides</text><text x="550.0" y="255.5" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">50S: chloramphenicol,</text><text x="550.0" y="270.5" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">macrolides</text><text x="330.0" y="312.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="start" dominant-baseline="middle">sulfonamides, trimethoprim</text><path d="M325,312 L243,310" fill="none" stroke="#d6453d" stroke-width="1.4" marker-end="url(#ah_d6453d)"/><text x="340.0" y="128.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">β-lactams, vancomycin (wall); polymyxins (membrane / outer membrane)</text></svg>
