<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Induction needs a signal AND a competent responder</text><rect x="20" y="50" width="310" height="300" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="175.0" y="70.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Induction chain in the eye</text><polyline points="40,120 310,120" fill="none" stroke="#2f6fdb" stroke-width="6"/><text x="175.0" y="100.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">head surface ectoderm</text><path d="M60,300 C60,220 110,140 175,135 C240,140 290,220 290,300" fill="#e0f3f4" stroke="#138f9a" stroke-width="2"/><text x="175.0" y="214.4" font-size="12.5" font-weight="400" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">optic vesicle</text><text x="175.0" y="230.0" font-size="12.5" font-weight="400" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">(outgrowth of</text><text x="175.0" y="245.6" font-size="12.5" font-weight="400" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">forebrain)</text><ellipse cx="175" cy="125" rx="40" ry="10" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="175.0" y="160.0" font-size="12" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">lens placode</text><text x="175.0" y="312.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1 optic vesicle → induces lens</text><text x="175.0" y="327.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 lens → induces cornea</text><rect x="350" y="50" width="310" height="300" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="505.0" y="70.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Competence: can the tissue respond?</text><rect x="370" y="110" width="120" height="44" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="430.0" y="124.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">inducing</text><text x="430.0" y="139.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">tissue</text><path d="M490,132 L520,132" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="520" y="110" width="125" height="44" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="582.5" y="124.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">young</text><text x="582.5" y="139.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">head ectoderm</text><rect x="370" y="230" width="120" height="44" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="430.0" y="244.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">inducing</text><text x="430.0" y="259.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">tissue</text><path d="M490,252 L520,252" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="520" y="230" width="125" height="44" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="582.5" y="244.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">older</text><text x="582.5" y="259.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">head ectoderm</text><text x="505.0" y="322.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">older cells lack receptors and</text><text x="505.0" y="337.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">transcription factors to respond</text><rect x="20" y="362" width="640" height="66" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="32.0" y="398.4" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Signal present, response absent: older ectoderm can no longer respond.</text></svg>
