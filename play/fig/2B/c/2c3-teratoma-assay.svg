<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Teratoma assay: one tumor, all three germ layers</text><rect x="20" y="60" width="140" height="70" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="90.0" y="86.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cultured cells</text><text x="90.0" y="103.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(test line)</text><path d="M160,95 L250,95" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="205.0" y="85.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">inject</text><rect x="250" y="60" width="170" height="70" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="335.0" y="86.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Immunodeficient</text><text x="335.0" y="103.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">mouse (no rejection)</text><path d="M420,95 L500,95" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="460.0" y="85.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">weeks</text><ellipse cx="580" cy="95" rx="78" ry="48" fill="#fbe6f1" stroke="#d23c8a" stroke-width="1.5"/><text x="580.0" y="95.0" font-size="14" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">teratoma</text><rect x="20" y="175" width="200" height="75" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="120.0" y="204.1" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ectoderm</text><text x="120.0" y="220.9" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ neural tissue</text><path d="M560,143 L120,173" fill="none" stroke="#5b6474" stroke-width="1.8" marker-end="url(#ah)"/><rect x="240" y="175" width="200" height="75" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="340.0" y="204.1" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Mesoderm</text><text x="340.0" y="220.9" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ cartilage</text><path d="M560,143 L340,173" fill="none" stroke="#5b6474" stroke-width="1.8" marker-end="url(#ah)"/><rect x="460" y="175" width="200" height="75" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="560.0" y="204.1" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Endoderm</text><text x="560.0" y="220.9" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ gut-like epithelium</text><path d="M580,143 L560,173" fill="none" stroke="#5b6474" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="275" width="640" height="52" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="340.0" y="301.0" font-size="14" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">All three germ layers from one cell population → the cells are pluripotent.</text><rect x="20" y="340" width="205" height="70" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="32.0" y="378.7" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">would make just one cell</text><text x="32.0" y="394.3" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">type</text><rect x="237" y="340" width="205" height="70" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="249.0" y="386.5" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">blood lineages only</text><rect x="455" y="340" width="205" height="70" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="467.0" y="386.5" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">no longer makes new types</text></svg>
