<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Tumors past ~1–2 mm need new blood vessels</text><circle cx="140" cy="200" r="70" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><circle cx="140" cy="200" r="34" fill="#e9c9c5" stroke="#d6453d" stroke-width="1.5"/><text x="140.0" y="192.5" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">hypoxic</text><text x="140.0" y="207.5" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">core</text><text x="140.0" y="317.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">small tumor: O₂ diffuses only</text><text x="140.0" y="332.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">~0.1–0.2 mm from a vessel</text><circle cx="228.0" cy="200.0" r="4.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="202.22539674441617" cy="262.2253967444162" r="4.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="140.0" cy="288.0" r="4.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="77.77460325558383" cy="262.2253967444162" r="4.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="52.0" cy="200.0" r="4.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="77.7746032555838" cy="137.77460325558383" r="4.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="139.99999999999997" cy="112.0" r="4.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="202.22539674441617" cy="137.7746032555838" r="4.5" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="140.0" y="88.0" font-size="12.5" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">secretes VEGF (dots)</text><rect x="330" y="120" width="40" height="230" rx="20" fill="#f5c9c4" stroke="#d6453d" stroke-width="1.5"/><text x="350.0" y="368.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">vessel</text><path d="M330,160 C295.0,150 260,165 260,160" fill="none" stroke="#d6453d" stroke-width="7" stroke-linecap="round"/><path d="M330,215 C282.5,205 235,220 235,215" fill="none" stroke="#d6453d" stroke-width="7" stroke-linecap="round"/><path d="M330,275 C300.0,265 270,280 270,275" fill="none" stroke="#d6453d" stroke-width="7" stroke-linecap="round"/><text x="280.0" y="322.5" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">new sprouts</text><text x="280.0" y="337.5" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">(angiogenesis)</text><rect x="410" y="70" width="250" height="150" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="535.0" y="90.0" font-size="13.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Anti-VEGF antibody</text><path d="M520,180 L520,140 L495,115 M520,140 L545,115" stroke="#2f6fdb" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="490" cy="110" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="550" cy="110" r="6" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="535.0" y="197.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">VEGF trapped → no new vessels</text><text x="535.0" y="212.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ tumor starved of O₂ and nutrients</text></svg>
