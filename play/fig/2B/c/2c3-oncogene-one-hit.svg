<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">One activating hit turns a proto-oncogene into an oncogene</text><rect x="20" y="50" width="310" height="380" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="175.0" y="72.0" font-size="14.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Proto-oncogene → oncogene</text><text x="175.0" y="94.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">normally PROMOTES growth (gas pedal)</text><circle cx="65" cy="140" r="22" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><rect x="105" y="124" width="56" height="14" rx="7" fill="#dfe3ea" stroke="#8a93a3" stroke-width="1.5"/><rect x="105" y="142" width="56" height="14" rx="7" fill="#dfe3ea" stroke="#8a93a3" stroke-width="1.5"/><text x="180.0" y="140.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">normal</text><circle cx="65" cy="202" r="22" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><rect x="105" y="186" width="56" height="14" rx="7" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><text x="133.0" y="193.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">ON</text><rect x="105" y="204" width="56" height="14" rx="7" fill="#dfe3ea" stroke="#8a93a3" stroke-width="1.5"/><text x="180.0" y="202.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">one activating hit</text><rect x="66.6" y="318" width="216.9" height="24" rx="12" fill="#5b6474"/><text x="175.0" y="330.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">growth ON: gain of function</text><text x="175.0" y="366.9" font-size="13" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">ONE mutant allele is enough →</text><text x="175.0" y="383.1" font-size="13" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">dominant at the cell level</text><rect x="350" y="50" width="310" height="380" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="505.0" y="72.0" font-size="14.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Tumor suppressor gene</text><text x="505.0" y="94.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">normally RESTRAINS growth (brake), e.g. p53, Rb</text><circle cx="395" cy="140" r="22" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><rect x="435" y="124" width="56" height="14" rx="7" fill="#dfe3ea" stroke="#8a93a3" stroke-width="1.5"/><rect x="435" y="142" width="56" height="14" rx="7" fill="#dfe3ea" stroke="#8a93a3" stroke-width="1.5"/><text x="510.0" y="140.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">normal</text><circle cx="395" cy="202" r="22" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><rect x="435" y="186" width="56" height="14" rx="7" fill="#ffffff" stroke="#d6453d" stroke-dasharray="4 3" stroke-width="1.5"/><text x="463.0" y="193.5" font-size="10.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">lost</text><rect x="435" y="204" width="56" height="14" rx="7" fill="#dfe3ea" stroke="#8a93a3" stroke-width="1.5"/><text x="510.0" y="202.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">one hit</text><circle cx="395" cy="264" r="22" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><rect x="435" y="248" width="56" height="14" rx="7" fill="#ffffff" stroke="#d6453d" stroke-dasharray="4 3" stroke-width="1.5"/><text x="463.0" y="255.5" font-size="10.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">lost</text><rect x="435" y="266" width="56" height="14" rx="7" fill="#ffffff" stroke="#d6453d" stroke-dasharray="4 3" stroke-width="1.5"/><text x="463.0" y="273.5" font-size="10.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">lost</text><text x="510.0" y="264.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">two hits</text><rect x="392.8" y="318" width="224.3" height="24" rx="12" fill="#5b6474"/><text x="505.0" y="330.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">brake lost: loss of function</text><text x="505.0" y="366.9" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">BOTH alleles must be lost →</text><text x="505.0" y="383.1" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">recessive at the cell level</text></svg>
