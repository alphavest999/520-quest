<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Exotoxin vs. endotoxin</text><rect x="20" y="45" width="310" height="200" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="175.0" y="66.0" font-size="15" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Exotoxin</text><rect x="45" y="95" width="120" height="60" rx="28" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/><text x="105.0" y="117.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bacterium</text><text x="105.0" y="132.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(Gram+ or Gram−)</text><path d="M170,125 L220,125" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="195.0" y="115.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">secreted</text><circle cx="240" cy="105" r="8" fill="#d6453d"/><circle cx="262" cy="128" r="8" fill="#d6453d"/><circle cx="240" cy="150" r="8" fill="#d6453d"/><circle cx="285" cy="108" r="8" fill="#d6453d"/><circle cx="290" cy="145" r="8" fill="#d6453d"/><text x="175.0" y="182.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Protein, specific target, usually</text><text x="175.0" y="197.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">heat-labile, can be made into a toxoid</text><text x="175.0" y="228.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">e.g. tetanus, botulinum, diphtheria, cholera</text><rect x="350" y="45" width="310" height="200" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="505.0" y="66.0" font-size="15" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">Endotoxin (LPS)</text><polyline points="380,175 640,175" fill="none" stroke="#d23c8a" stroke-width="8"/><text x="505.0" y="196.0" font-size="12" font-weight="400" fill="#d23c8a" text-anchor="middle" dominant-baseline="middle">Gram-negative outer membrane</text><rect x="402" y="160" width="36" height="16" rx="3" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><polyline points="420,160 420,135" fill="none" stroke="#1f2430" stroke-width="3"/><polyline points="420,135 414,135 426,126 414,117 426,108 414,99 426,90" fill="none" stroke="#1f9d63" stroke-width="2.4"/><rect x="487" y="160" width="36" height="16" rx="3" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><polyline points="505,160 505,135" fill="none" stroke="#1f2430" stroke-width="3"/><polyline points="505,135 499,135 511,126 499,117 511,108 499,99 511,90" fill="none" stroke="#1f9d63" stroke-width="2.4"/><rect x="572" y="160" width="36" height="16" rx="3" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><polyline points="590,160 590,135" fill="none" stroke="#1f2430" stroke-width="3"/><polyline points="590,135 584,135 596,126 584,117 596,108 584,99 596,90" fill="none" stroke="#1f9d63" stroke-width="2.4"/><text x="505.0" y="222.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Lipid A (red) = toxic part; core; O-antigen (green)</text><rect x="20" y="260" width="640" height="60" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="340.0" y="280.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Exotoxins: secreted PROTEINS made by Gram-positives and Gram-negatives.</text><text x="340.0" y="302.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Endotoxin: LPS, a structural lipid–sugar of Gram-negatives, released when cells die.</text></svg>
