roke="#7a4cd9" stroke-width="1.6"/><text x="515.0" y="125.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">donor</text><rect x="568.0" y="146.0" width="86" height="38" rx="19.0" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.6"/><text x="611.0" y="165.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">recipient</text><polyline points="548,141 575,150" fill="none" stroke="#7a4cd9" stroke-width="5"/><text x="563.0" y="205.0" font-size="12" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">DNA stays inside cells</text><text x="340.0" y="250.0" font-size="13" font-weight="700" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">DNase added to medium</text><rect x="17" y="260" width="200" height="32" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="117.0" y="276.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">blocked</text><rect x="240" y="260" width="200" height="32" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="340.0" y="276.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">not blocked</text><rect x="463" y="260" width="200" height="32" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="563.0" y="276.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">not blocked</text><text x="340.0" y="312.0" font-size="13" font-weight="700" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Filter keeps cells apart</text><rect x="17" y="322" width="200" height="32" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="117.0" y="338.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">not blocked</text><rect x="240" y="322" width="200" height="32" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="340.0" y="338.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">not blocked</text><rect x="463" y="322" width="200" height="32" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="563.0" y="338.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">blocked</text><text x="340.0" y="374.0" font-size="13" font-weight="700" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Needs a living donor?</text><rect x="17" y="384" width="200" height="42" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="117.0" y="397.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">no (DNA can be</text><text x="117.0" y="412.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">from dead cells)</text><rect x="240" y="384" width="200" height="42" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="405.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">no (phage carries it)</text><rect x="463" y="384" width="200" height="42" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="563.0" y="405.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">yes</text></svg>
