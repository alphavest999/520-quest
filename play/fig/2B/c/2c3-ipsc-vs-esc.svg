<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 256" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Patient-derived iPS cells: same genome, same antigens</text><rect x="20" y="55" width="130" height="70" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="85.0" y="81.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Patient&#x27;s skin</text><text x="85.0" y="98.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">fibroblast</text><path d="M150,90 L250,90" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="200.0" y="68.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">add Oct4, Sox2,</text><text x="200.0" y="106.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Klf4, c-Myc</text><rect x="250" y="55" width="130" height="70" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="315.0" y="81.9" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">iPS cells</text><text x="315.0" y="98.1" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(pluripotent)</text><path d="M380,90 L470,90" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="425.0" y="80.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">differentiate</text><rect x="470" y="55" width="190" height="70" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="565.0" y="81.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">New tissue with the</text><text x="565.0" y="98.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">patient&#x27;s own MHC</text><rect x="20" y="170" width="130" height="70" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="85.0" y="196.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Donated</text><text x="85.0" y="213.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">embryo (ICM)</text><path d="M150,205 L250,205" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="250" y="170" width="130" height="70" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="315.0" y="196.9" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ES cells</text><text x="315.0" y="213.1" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(pluripotent)</text><path d="M380,205 L470,205" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="425.0" y="195.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">differentiate</text><rect x="470" y="170" width="190" height="70" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="565.0" y="196.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">New tissue with a</text><text x="565.0" y="213.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">stranger&#x27;s MHC</text><rect x="20" y="290" width="310" height="125" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="32.0" y="347.8" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Like ES cells, iPS cells are pluripotent</text><text x="32.0" y="364.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">and can form teratomas if undifferentiated</text><text x="32.0" y="380.2" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">cells are transplanted.</text><rect x="350" y="290" width="310" height="125" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="362.0" y="347.8" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">iPS cells are pluripotent, not totipotent.</text><text x="362.0" y="364.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Making them also requires added</text><text x="362.0" y="380.2" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">transcription factors.</text></svg>
