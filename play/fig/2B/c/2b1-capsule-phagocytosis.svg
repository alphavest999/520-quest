<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 412" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Why a capsule protects bacteria from phagocytes</text><text x="170.0" y="52.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Capsule-deficient mutant</text><text x="510.0" y="52.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Wild type with capsule</text><path d="M80,260 Q60,160 115,125 Q170,105 225,125 Q280,160 260,260 Q170,295 80,260 z" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><circle cx="205" cy="230" r="20" fill="#7a4cd9" opacity="0.35"/><circle cx="150" cy="170" r="30" fill="#ffffff" stroke="#7a4cd9" stroke-width="2" stroke-dasharray="5 3"/><rect x="130" y="160" width="40" height="20" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="170.0" y="292.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Engulfed into a phagosome,</text><text x="170.0" y="307.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">killed, and cleared</text><path d="M440,290 Q420,190 475,155 Q530,135 585,155 Q640,190 620,290 Q530,325 440,290 z" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><circle cx="565" cy="260" r="20" fill="#7a4cd9" opacity="0.35"/><rect x="440" y="80" width="110" height="60" rx="30" fill="#e0f3f4" stroke="#138f9a" stroke-width="2" stroke-dasharray="6 4"/><rect x="465" y="97" width="60" height="26" rx="13" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><path d="M540,160 L520,140" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="615.0" y="142.5" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">pseudopods</text><text x="615.0" y="157.5" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">slip off</text><text x="495.0" y="72.0" font-size="12" font-weight="400" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">polysaccharide capsule</text><text x="510.0" y="327.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Escapes phagocytosis, multiplies,</text><text x="510.0" y="342.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">spreads: lethal infection</text><rect x="15" y="360" width="650" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="380.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Antibodies against capsule sugars (opsonization) overcome this: the basis of pneumococcal and Hib vaccines.</text><text x="130.0" y="245.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">macrophage</text><text x="490.0" y="265.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">macrophage</text></svg>
