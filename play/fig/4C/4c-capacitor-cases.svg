<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Capacitor changes: which quantity is held fixed?</text><text x="340.0" y="52.0" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C = κε₀A/d · Q = CV · U = ½CV² = Q²/(2C)</text><text x="130.0" y="88.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="300.0" y="88.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><text x="390.0" y="88.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Q</text><text x="480.0" y="88.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">V</text><text x="570.0" y="88.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">U</text><rect x="30" y="100" width="620" height="26" rx="10" fill="#e6eefc" stroke="#8a93a3" stroke-width="1.5"/><text x="40.0" y="113.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Still connected (V fixed)</text><text x="70.0" y="146.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">double d</text><text x="300.0" y="146.0" font-size="14" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">÷2</text><text x="390.0" y="146.0" font-size="14" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">÷2</text><text x="480.0" y="146.0" font-size="14" font-weight="600" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">same</text><text x="570.0" y="146.0" font-size="14" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">÷2</text><text x="70.0" y="180.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">insert dielectric κ</text><text x="300.0" y="180.0" font-size="14" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">×κ</text><text x="390.0" y="180.0" font-size="14" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">×κ</text><text x="480.0" y="180.0" font-size="14" font-weight="600" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">same</text><text x="570.0" y="180.0" font-size="14" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">×κ</text><rect x="30" y="202" width="620" height="26" rx="10" fill="#fdf1db" stroke="#8a93a3" stroke-width="1.5"/><text x="40.0" y="215.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Disconnected (Q fixed)</text><text x="70.0" y="248.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">double d</text><text x="300.0" y="248.0" font-size="14" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">÷2</text><text x="390.0" y="248.0" font-size="14" font-weight="600" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">same</text><text x="480.0" y="248.0" font-size="14" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">×2</text><text x="570.0" y="248.0" font-size="14" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">×2</text><text x="70.0" y="282.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">insert dielectric κ</text><text x="300.0" y="282.0" font-size="14" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">×κ</text><text x="390.0" y="282.0" font-size="14" font-weight="600" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">same</text><text x="480.0" y="282.0" font-size="14" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">÷κ</text><text x="570.0" y="282.0" font-size="14" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">÷κ</text><text x="340.0" y="335.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Connected: the battery holds V, so Q follows C. Disconnected: no path for charge, so V and U follow C.</text></svg>
