<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Series–parallel circuit, reduced step by step</text><polyline points="60,90 60,174.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="60,186.0 60,270" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="44,174.0 76,174.0" fill="none" stroke="#1f2430" stroke-width="2.5"/><polyline points="52,186.0 68,186.0" fill="none" stroke="#1f2430" stroke-width="4"/><text x="82.0" y="168.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">+</text><text x="82.0" y="194.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">−</text><text x="20.0" y="180.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">24 V</text><polyline points="60,90 60,70 130,70" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="130,70 154.0,70.0 160.0,78.0 172.0,62.0 184.0,78.0 196.0,62.0 208.0,78.0 220.0,62.0 226.0,70.0 250,70" fill="none" stroke="#1f2430" stroke-width="2"/><text x="190.0" y="54.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">4 Ω</text><polyline points="250,70 300,70" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="300,70 300,120" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="300,70 420,70 420,120" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="300,120 300.0,142.0 292.0,147.5 308.0,158.5 292.0,169.5 308.0,180.5 292.0,191.5 308.0,202.5 300.0,208.0 300,230" fill="none" stroke="#1f2430" stroke-width="2"/><text x="266.0" y="175.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">6 Ω</text><polyline points="420,120 420.0,142.0 412.0,147.5 428.0,158.5 412.0,169.5 428.0,180.5 412.0,191.5 428.0,202.5 420.0,208.0 420,230" fill="none" stroke="#1f2430" stroke-width="2"/><text x="456.0" y="175.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">12 Ω</text><polyline points="300,230 300,290 60,290 60,270" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="420,230 420,290 300,290" fill="none" stroke="#1f2430" stroke-width="2"/><path d="M150,100 L230,100" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="190.0" y="116.0" font-size="12" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">I = 3 A</text><rect x="470" y="70" width="195" height="230" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="480.0" y="84.8" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">1  Parallel pair:</text><text x="480.0" y="99.2" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">6·12/(6+12) = 4 Ω</text><text x="480.0" y="128.8" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">2  Total:</text><text x="480.0" y="143.2" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">4 + 4 = 8 Ω</text><text x="480.0" y="172.8" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">3  Current:</text><text x="480.0" y="187.2" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">I = 24 / 8 = 3 A</text><text x="480.0" y="216.8" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">4  Across pair:</text><text x="480.0" y="231.2" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">V = 3 × 4 = 12 V</text><text x="480.0" y="260.8" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">5  In 6 Ω:</text><text x="480.0" y="275.2" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">12/6 = 2 A;  in 12 Ω: 1 A</text><text x="340.0" y="335.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Parallel branches share one voltage; series parts share one current.</text></svg>
