<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Standard reduction potentials: higher E° is reduced (cathode)</text><polyline points="150,70 150,330" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="144,70.0 156,70.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><text x="130.0" y="70.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">+1.0 V</text><polyline points="144,162.85714285714286 156,162.85714285714286" fill="none" stroke="#1f2430" stroke-width="1.8"/><text x="130.0" y="162.9" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">0.0 V</text><polyline points="144,255.71428571428572 156,255.71428571428572" fill="none" stroke="#1f2430" stroke-width="1.8"/><text x="130.0" y="255.7" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">-1.0 V</text><polyline points="150,88.57142857142857 180,88.57142857142857" fill="none" stroke="#1f2430" stroke-width="2"/><text x="188.0" y="88.6" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Ag⁺ + e⁻ → Ag   +0.80</text><polyline points="150,162.85714285714286 180,162.85714285714286" fill="none" stroke="#5b6474" stroke-width="2"/><text x="188.0" y="162.9" font-size="12.5" font-weight="600" fill="#5b6474" text-anchor="start" dominant-baseline="middle">2H⁺ + 2e⁻ → H₂   0.00 (SHE)</text><polyline points="150,186.07142857142858 180,186.07142857142858" fill="none" stroke="#1f9d63" stroke-width="2"/><text x="188.0" y="186.1" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">Ni²⁺ + 2e⁻ → Ni   −0.25</text><polyline points="150,203.71428571428572 180,203.71428571428572" fill="none" stroke="#7a4cd9" stroke-width="2"/><text x="188.0" y="203.7" font-size="12.5" font-weight="600" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">M²⁺ + 2e⁻ → M   −0.44 (unknown)</text><polyline points="150,317.0 180,317.0" fill="none" stroke="#2f6fdb" stroke-width="2"/><text x="188.0" y="317.0" font-size="12.5" font-weight="600" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">Al³⁺ + 3e⁻ → Al   −1.66</text><path d="M470,317.0 L470,186.07142857142858" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="480.0" y="244.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="start" dominant-baseline="middle">E°cell = E°cathode − E°anode</text><text x="480.0" y="259.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="start" dominant-baseline="middle">= −0.25 − (−1.66) = +1.41 V</text><text x="340.0" y="360.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">E° is intensive: multiplying a half-reaction to balance electrons never changes its E°.</text></svg>
