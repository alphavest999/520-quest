<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Concentration cell: same electrodes, different concentrations</text><path d="M70,140 L70,300 L260,300 L260,140" fill="none" stroke="#8a93a3" stroke-width="2"/><rect x="72" y="188.0" width="186" height="110.0" fill="#e6eefc"/><path d="M420,140 L420,300 L610,300 L610,140" fill="none" stroke="#8a93a3" stroke-width="2"/><rect x="422" y="188.0" width="186" height="110.0" fill="#e6eefc"/><rect x="150" y="110" width="30" height="160" fill="#c8793a" stroke="#1f2430"/><rect x="500" y="110" width="30" height="160" fill="#c8793a" stroke="#1f2430"/><text x="165.0" y="325.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">0.1 M Cu²⁺ (dilute)</text><text x="515.0" y="325.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1.0 M Cu²⁺ (concentrated)</text><polyline points="165,110 165,75 300,75" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="380,75 515,75 515,110" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="340" cy="75" r="22" fill="#f1f3f6" stroke="#1f2430" stroke-width="1.5"/><text x="340.0" y="75.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">V</text><path d="M205,56 L290,56" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><path d="M390,56 L475,56" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="38.0" font-size="12.5" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">electrons: dilute → concentrated</text><path d="M230,240 L230,128 L450,128 L450,240" fill="none" stroke="#138f9a" stroke-width="14" opacity="0.35"/><rect x="40" y="345" width="270" height="36" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="175.0" y="363.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Anode: Cu → Cu²⁺ (dilute side rises)</text><rect x="370" y="345" width="270" height="36" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="505.0" y="363.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cathode: Cu²⁺ → Cu (concentrated side falls)</text><text x="340.0" y="184.4" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E = (0.0592 / n) log(ratio)</text><text x="340.0" y="200.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">= (0.0592 / 2) × log 10</text><text x="340.0" y="215.6" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">≈ 0.030 V</text></svg>
