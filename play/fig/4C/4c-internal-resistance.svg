<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Internal resistance lowers the terminal voltage</text><rect x="40" y="60" width="150" height="220" rx="12" fill="#f1f3f6" stroke="#8a93a3" stroke-dasharray="6 4"/><text x="115.0" y="76.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">real battery</text><polyline points="115,100 115,129.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="115,141.0 115,170" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="99,129.0 131,129.0" fill="none" stroke="#1f2430" stroke-width="2.5"/><polyline points="107,141.0 123,141.0" fill="none" stroke="#1f2430" stroke-width="4"/><text x="137.0" y="123.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">+</text><text x="137.0" y="149.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">−</text><text x="75.0" y="135.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">9 V</text><polyline points="115,175 115.0,191.0 107.0,195.0 123.0,203.0 107.0,211.0 123.0,219.0 107.0,227.0 123.0,235.0 115.0,239.0 115,255" fill="none" stroke="#1f2430" stroke-width="2"/><text x="73.0" y="215.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">r = 1 Ω</text><polyline points="115,100 115,90 190,90 330,90" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="115,255 115,265 190,265 330,265" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="330,90 330.0,125.0 322.0,133.75 338.0,151.25 322.0,168.75 338.0,186.25 322.0,203.75 338.0,221.25 330.0,230.0 330,265" fill="none" stroke="#1f2430" stroke-width="2"/><text x="284.0" y="177.5" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">R = 2 Ω</text><circle cx="190" cy="90" r="4" fill="#1f2430"/><circle cx="190" cy="265" r="4" fill="#1f2430"/><text x="200.0" y="230.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">terminals</text><text x="370.0" y="130.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">I = emf / (R + r) = 9 / (2 + 1) = 3 A</text><text x="370.0" y="170.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Lost inside: I·r = 3 × 1 = 3 V</text><text x="370.0" y="201.9" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Terminal voltage: 9 − 3 = 6 V</text><text x="370.0" y="218.1" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">(check: I·R = 3 × 2 = 6 V)</text></svg>
