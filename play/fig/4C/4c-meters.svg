<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ammeter in series, voltmeter in parallel</text><polyline points="80,90 80,164.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="80,176.0 80,250" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="64,164.0 96,164.0" fill="none" stroke="#1f2430" stroke-width="2.5"/><polyline points="72,176.0 88,176.0" fill="none" stroke="#1f2430" stroke-width="4"/><text x="102.0" y="158.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">+</text><text x="102.0" y="184.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">−</text><text x="40.0" y="170.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">emf</text><polyline points="80,90 80,70 200,70" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="230" cy="70" r="22" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="230.0" y="70.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><polyline points="252,70 330,70" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="330,70 358.0,70.0 365.0,78.0 379.0,62.0 393.0,78.0 407.0,62.0 421.0,78.0 435.0,62.0 442.0,70.0 470,70" fill="none" stroke="#1f2430" stroke-width="2"/><text x="400.0" y="54.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">R</text><polyline points="470,70 560,70 560,270 80,270 80,250" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="330,70 330,150" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="470,70 470,150" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="330,150 378,150" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="422,150 470,150" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="400" cy="150" r="22" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="400.0" y="150.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">V</text><rect x="150" y="190" width="170" height="56" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="235.0" y="210.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ammeter: in series,</text><text x="235.0" y="225.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">very LOW resistance</text><rect x="360" y="190" width="170" height="56" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="445.0" y="210.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Voltmeter: in parallel,</text><text x="445.0" y="225.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">very HIGH resistance</text><text x="340.0" y="305.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">The same current must pass through an ammeter; a voltmeter compares two points without drawing current.</text></svg>
