<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Field at the midpoint of +q and −q</text><circle cx="140" cy="120" r="22" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="140.0" y="120.0" font-size="15" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+q</text><circle cx="540" cy="120" r="22" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="540.0" y="120.0" font-size="15" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">−q</text><circle cx="340" cy="120" r="5" fill="#1f2430"/><polyline points="162,120 518,120" fill="none" stroke="#8a93a3" stroke-width="1.2" stroke-dasharray="6 4"/><text x="240.0" y="150.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">d/2</text><text x="440.0" y="150.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">d/2</text><path d="M340,92 L420,92" fill="none" stroke="#d6453d" stroke-width="2.4" marker-end="url(#ah)"/><text x="380.0" y="76.0" font-size="11.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">from +q: kq/(d/2)² = 4kq/d²</text><path d="M340,60 L420,60" fill="none" stroke="#2f6fdb" stroke-width="2.4" marker-end="url(#ah)"/><text x="380.0" y="44.0" font-size="11.5" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">from −q: 4kq/d²</text><text x="340.0" y="191.9" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Both point the same way (away from +, toward −), so they add:</text><text x="340.0" y="208.1" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E = 8kq/d², pointing toward −q</text></svg>
