<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Electrolytic cell: an outside source drives a nonspontaneous reaction</text><path d="M170,150 L170,320 L510,320 L510,150" fill="none" stroke="#8a93a3" stroke-width="2"/><rect x="172" y="201.0" width="336" height="116.99999999999999" fill="#f1f3f6"/><text x="340.0" y="300.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">molten NaCl (Na⁺ and Cl⁻ only)</text><rect x="215" y="115" width="30" height="165" fill="#9aa3b2" stroke="#1f2430"/><rect x="435" y="115" width="30" height="165" fill="#9aa3b2" stroke="#1f2430"/><polyline points="230,115 230,75 320,75" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="360,75 450,75 450,115" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="320,60 320,90" fill="none" stroke="#1f2430" stroke-width="2.5"/><polyline points="360,66 360,84" fill="none" stroke="#1f2430" stroke-width="4"/><polyline points="320,75 360,75" fill="none" stroke="#ffffff" stroke-width="0"/><text x="340.0" y="48.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">external power source</text><text x="306.0" y="98.0" font-size="15" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">+</text><text x="374.0" y="98.0" font-size="15" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">−</text><path d="M255,128 L300,128" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><path d="M385,128 L430,128" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="128.0" font-size="11.5" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">e⁻ flow</text><rect x="40" y="330" width="290" height="58" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="185.0" y="351.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ANODE (+): oxidation</text><text x="185.0" y="366.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2Cl⁻ → Cl₂(g) + 2e⁻</text><rect x="350" y="330" width="290" height="58" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="495.0" y="351.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CATHODE (−): reduction</text><text x="495.0" y="366.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Na⁺ + e⁻ → Na(l)</text><text x="110.0" y="148.4" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Signs flip vs</text><text x="110.0" y="162.8" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">a galvanic cell;</text><text x="110.0" y="177.2" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">AN OX and RED CAT</text><text x="110.0" y="191.6" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">still hold.</text><text x="585.0" y="148.4" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">In water, H₂O is</text><text x="585.0" y="162.8" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">reduced instead</text><text x="585.0" y="177.2" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">of Na⁺, so H₂(g)</text><text x="585.0" y="191.6" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">forms at the cathode.</text></svg>
