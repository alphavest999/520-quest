<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="380.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Charges in electric fields</text><rect x="20" y="55" width="230" height="210" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="135.0" y="111.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PROTON vs ELECTRON</text><text x="135.0" y="125.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">same |q| = e, so same</text><text x="135.0" y="139.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">force size F = eE</text><text x="135.0" y="153.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(opposite directions)</text><text x="135.0" y="166.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="135.0" y="180.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">a = F/m: electron&#x27;s</text><text x="135.0" y="194.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">acceleration is ~1836×</text><text x="135.0" y="208.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">larger (much lighter)</text><rect x="265" y="55" width="230" height="210" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="380.0" y="118.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">OIL DROP (Millikan)</text><text x="380.0" y="132.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">hovering: qE = mg</text><text x="380.0" y="146.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">q = (1.6×10⁻¹⁵)(10)/10⁵</text><text x="380.0" y="160.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">= 1.6×10⁻¹⁹ C = e</text><text x="380.0" y="173.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="380.0" y="187.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">field up, force up</text><text x="380.0" y="201.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ drop is POSITIVE</text><rect x="510" y="55" width="230" height="210" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="625.0" y="111.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CONDUCTOR (Faraday cage)</text><text x="625.0" y="125.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">charges move to the surface</text><text x="625.0" y="139.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">until E inside = 0</text><text x="625.0" y="153.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="625.0" y="166.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">electric vs gravity:</text><text x="625.0" y="180.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">both ∝ 1/r², so their</text><text x="625.0" y="194.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ratio (~10³⁶ for protons)</text><text x="625.0" y="208.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">does not depend on r</text><text x="380.0" y="295.0" font-size="10.8" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Conventional current = flow of positive charge (+ to −); electrons move the opposite way.</text></svg>
