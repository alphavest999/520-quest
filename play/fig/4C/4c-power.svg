<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="380.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Power in circuits: pick the right form of P</text><rect x="20" y="55" width="230" height="200" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="135.0" y="100.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PARALLEL: same V</text><text x="135.0" y="113.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P = V²/R</text><text x="135.0" y="127.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="135.0" y="141.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 Ω and 8 Ω on one battery:</text><text x="135.0" y="155.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 Ω uses 4× the power</text><text x="135.0" y="168.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(smaller R, more power)</text><text x="135.0" y="182.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="135.0" y="196.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">parallel cells: same 1.5 V,</text><text x="135.0" y="210.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">current shared, last longer</text><rect x="265" y="55" width="230" height="200" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="380.0" y="106.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SERIES: same I</text><text x="380.0" y="120.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P = I²R</text><text x="380.0" y="134.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="380.0" y="148.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">larger R, more power</text><text x="380.0" y="161.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="380.0" y="175.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ohm&#x27;s law check:</text><text x="380.0" y="189.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">12 V across 4 Ω</text><text x="380.0" y="203.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">I = 3 A, P = IV = 36 W</text><rect x="510" y="55" width="230" height="200" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="625.0" y="100.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">POWER LINES</text><text x="625.0" y="113.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P delivered = IV (fixed)</text><text x="625.0" y="127.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="625.0" y="141.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">double V → half I</text><text x="625.0" y="155.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">line loss = I²R</text><text x="625.0" y="168.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ (½)² = ¼ the loss</text><text x="625.0" y="182.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="625.0" y="196.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">why grids use</text><text x="625.0" y="210.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">high voltage</text><text x="380.0" y="290.0" font-size="10.8" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">All three forms are the same law: P = IV = I²R = V²/R. Use the one whose quantity is held constant.</text></svg>
