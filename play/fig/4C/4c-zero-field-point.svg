<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Where two like charges&#x27; fields cancel</text><polyline points="60,130 620,130" fill="none" stroke="#8a93a3" stroke-width="1.4"/><polyline points="110,124 110,136" fill="none" stroke="#8a93a3" stroke-width="1.8"/><text x="110.0" y="170.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">0 m</text><polyline points="260,124 260,136" fill="none" stroke="#8a93a3" stroke-width="1.8"/><text x="260.0" y="170.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">1 m</text><polyline points="410,124 410,136" fill="none" stroke="#8a93a3" stroke-width="1.8"/><text x="410.0" y="170.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">2 m</text><polyline points="560,124 560,136" fill="none" stroke="#8a93a3" stroke-width="1.8"/><text x="560.0" y="170.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">3 m</text><circle cx="110" cy="130" r="20" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="110.0" y="130.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+q</text><circle cx="560" cy="130" r="26" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="560.0" y="130.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+4q</text><circle cx="260" cy="130" r="6" fill="#1f9d63"/><path d="M260,100 L330,100" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><path d="M260,80 L190,80" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="380.0" y="100.0" font-size="11.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">push from +q</text><text x="140.0" y="80.0" font-size="11.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">push from +4q</text><text x="340.0" y="196.9" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">kq/x² = k(4q)/(3 − x)²  →  3 − x = 2x  →  x = 1 m</text><text x="340.0" y="213.1" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The null point lies between them, closer to the smaller charge.</text></svg>
