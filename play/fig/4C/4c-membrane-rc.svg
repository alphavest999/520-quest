<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A membrane patch is a resistor and a capacitor in parallel</text><rect x="40" y="70" width="230" height="40" fill="#e6eefc"/><rect x="40" y="200" width="230" height="40" fill="#fdf1db"/><text x="155.0" y="90.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">outside</text><text x="155.0" y="220.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">inside</text><polyline points="100,110 100,200" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="84,150 116,150" fill="none" stroke="#1f2430" stroke-width="3"/><polyline points="84,160 116,160" fill="none" stroke="#1f2430" stroke-width="3"/><polyline points="210,110 210,120" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="210,120 210.0,134.0 202.0,137.5 218.0,144.5 202.0,151.5 218.0,158.5 202.0,165.5 218.0,172.5 210.0,176.0 210,190" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="210,190 210,200" fill="none" stroke="#1f2430" stroke-width="2"/><text x="60.0" y="155.0" font-size="15" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">C</text><text x="240.0" y="155.0" font-size="15" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">R</text><text x="155.0" y="262.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">C: the lipid bilayer stores charge</text><text x="155.0" y="277.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">R: open ion channels let current leak</text><text x="300.0" y="110.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">ΔV = I·R: fewer open channels, higher R, larger ΔV</text><text x="300.0" y="150.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">τ = R·C: time to change V; rises with R or C</text><text x="300.0" y="190.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">λ grows with membrane R: less leak, spreads farther</text><text x="300.0" y="230.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Myelin: R up and C down: faster, farther spread</text></svg>
