<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">From charge to moles of metal (Faraday&#x27;s law)</text><rect x="20" y="80" width="140" height="60" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="90.0" y="102.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">charge Q</text><text x="90.0" y="117.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(coulombs = I × t)</text><rect x="270" y="80" width="140" height="60" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="340.0" y="102.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">moles of e⁻</text><text x="340.0" y="117.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">= Q / F</text><rect x="520" y="80" width="140" height="60" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="590.0" y="102.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">moles of metal</text><text x="590.0" y="117.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">= mol e⁻ / n</text><path d="M160,110.0 L270,110.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="215.0" y="96.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">÷ 96,485 C/mol</text><path d="M410,110.0 L520,110.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="465.0" y="96.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">÷ e⁻ per ion (n)</text><rect x="110" y="175" width="210" height="60" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="215.0" y="197.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ag⁺ + e⁻ → Ag</text><text x="215.0" y="212.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1 mol e⁻ → 1 mol Ag</text><rect x="360" y="175" width="210" height="60" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="465.0" y="197.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cu²⁺ + 2e⁻ → Cu</text><text x="465.0" y="212.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1 mol e⁻ → ½ mol Cu</text><text x="340.0" y="265.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">One faraday = the charge of 1 mol of electrons. The same charge deposits half as many moles of Cu as Ag.</text></svg>
