<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Galvanic cell: oxidation at the anode, electrons to the cathode</text><path d="M60,150 L60,320 L250,320 L250,150" fill="none" stroke="#8a93a3" stroke-width="2"/><rect x="62" y="201.0" width="186" height="116.99999999999999" fill="#e6eefc"/><path d="M430,150 L430,320 L620,320 L620,150" fill="none" stroke="#8a93a3" stroke-width="2"/><rect x="432" y="201.0" width="186" height="116.99999999999999" fill="#fdf1db"/><rect x="135" y="120" width="40" height="160" fill="#9aa3b2" stroke="#1f2430"/><rect x="505" y="120" width="40" height="160" fill="#c8793a" stroke="#1f2430"/><text x="155.0" y="300.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Zn</text><text x="525.0" y="300.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cu</text><text x="155.0" y="345.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Zn²⁺ solution</text><text x="525.0" y="345.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Cu²⁺ solution</text><polyline points="155,120 155,80 300,80" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="380,80 525,80 525,120" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="340" cy="80" r="22" fill="#f1f3f6" stroke="#1f2430" stroke-width="1.5"/><text x="340.0" y="80.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">V</text><path d="M200,62 L290,62" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><path d="M390,62 L480,62" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="44.0" font-size="12.5" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">electrons: anode → cathode</text><path d="M215,250 L215,135 L465,135 L465,250" fill="none" stroke="#138f9a" stroke-width="16" stroke-linejoin="round" opacity="0.35"/><text x="340.0" y="122.0" font-size="12" font-weight="600" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">salt bridge (KNO₃)</text><path d="M400,160 L280,160" fill="none" stroke="#7a4cd9" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="176.0" font-size="11.5" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">anions → anode</text><path d="M280,200 L400,200" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="216.0" font-size="11.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">cations → cathode</text><rect x="40" y="365" width="280" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="180.0" y="380.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ANODE (−): oxidation</text><text x="180.0" y="395.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Zn → Zn²⁺ + 2e⁻</text><rect x="360" y="365" width="280" height="46" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="500.0" y="380.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CATHODE (+): reduction</text><text x="500.0" y="395.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cu²⁺ + 2e⁻ → Cu</text></svg>
