<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Three ways to say a reaction is spontaneous</text><rect x="250" y="60" width="180" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="340.0" y="85.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">E°cell &gt; 0</text><rect x="70" y="190" width="180" height="50" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="160.0" y="215.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ΔG° &lt; 0</text><rect x="430" y="190" width="180" height="50" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="520.0" y="215.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">K &gt; 1</text><path d="M280,110 L200,190" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="190.0" y="140.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ΔG° = −nFE°</text><path d="M400,110 L480,190" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="510.0" y="140.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">nFE° = RT ln K</text><path d="M250,215.0 L430,215.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="340.0" y="200.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ΔG° = −RT ln K</text><text x="340.0" y="262.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Galvanic cells: all three. Electrolytic cells: E°cell &lt; 0, ΔG° &gt; 0, K &lt; 1.</text></svg>
