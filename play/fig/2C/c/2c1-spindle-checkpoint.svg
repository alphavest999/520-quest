<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">One unattached kinetochore holds up anaphase chemically</text><rect x="20" y="50" width="170" height="54" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="105.0" y="68.6" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Unattached</text><text x="105.0" y="85.4" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">kinetochore</text><rect x="245" y="50" width="180" height="54" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="335.0" y="68.6" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">“Wait” signal</text><text x="335.0" y="85.4" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(Mad2, MCC)</text><rect x="480" y="50" width="180" height="54" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="570.0" y="68.6" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">APC/C–Cdc20</text><text x="570.0" y="85.4" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(ubiquitin ligase)</text><path d="M190,77 L243,77" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="425,77 474,77" fill="none" stroke="#d6453d" stroke-width="2.4"/><polyline points="474.0,65.0 474.0,89.0" fill="none" stroke="#d6453d" stroke-width="3.5"/><rect x="480" y="135" width="180" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="570.0" y="149.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ubiquitin tags →</text><text x="570.0" y="164.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">proteasome</text><path d="M570,104 L570,133" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="230" y="135" width="200" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="330.0" y="149.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cyclin B destroyed →</text><text x="330.0" y="164.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CDK1 off → exit mitosis</text><path d="M478,157 L432,157" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="480" y="210" width="180" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="570.0" y="230.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">securin destroyed</text><path d="M570,179 L570,208" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="480" y="282" width="180" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="570.0" y="295.9" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">separase active</text><text x="570.0" y="312.1" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(a protease)</text><path d="M570,250 L570,280" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="470.0" y="265.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">securin no longer blocks it</text><rect x="250" y="282" width="170" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="335.0" y="304.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cohesin cut</text><path d="M478,304 L422,304" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><ellipse cx="60" cy="270" rx="17" ry="4" fill="none" stroke="#d98a00" stroke-width="2.5"/><ellipse cx="60" cy="290" rx="17" ry="4" fill="none" stroke="#d98a00" stroke-width="2.5"/><ellipse cx="60" cy="310" rx="17" ry="4" fill="none" stroke="#d98a00" stroke-width="2.5"/><ellipse cx="60" cy="330" rx="17" ry="4" fill="none" stroke="#d98a00" stroke-width="2.5"/><g transform="rotate(0 60.0 300.0)"><rect x="47.5" y="255.0" width="12" height="90" rx="6.0" fill="#2f6fdb" transform="rotate(0 53.5 300.0)"/><rect x="60.5" y="255.0" width="12" height="90" rx="6.0" fill="#2f6fdb" transform="rotate(0 66.5 300.0)"/></g><text x="60.0" y="360.0" font-size="12" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">cohesin rings</text><path d="M86,300 L122,300" fill="none" stroke="#1f2430" stroke-width="1.5" marker-end="url(#ah)"/><rect x="144.0" y="255.0" width="12" height="90" rx="6.0" fill="#2f6fdb" transform="rotate(0 150.0 300.0)"/><rect x="194.0" y="255.0" width="12" height="90" rx="6.0" fill="#2f6fdb" transform="rotate(0 200.0 300.0)"/><path d="M144,240 L116,240" fill="none" stroke="#1f2430" stroke-width="1.5" marker-end="url(#ah)"/><path d="M206,240 L234,240" fill="none" stroke="#1f2430" stroke-width="1.5" marker-end="url(#ah)"/><text x="175.0" y="222.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">to the poles</text><text x="175.0" y="360.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">anaphase</text></svg>
