<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Is the naked RNA genome infectious? It depends on its sense</text><rect x="15" y="45" width="650" height="150" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="30.0" y="66.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Positive-sense (+) RNA, polio-like: same sense as mRNA</text><rect x="30" y="90" width="140" height="60" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="100.0" y="111.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Naked (+) RNA</text><text x="100.0" y="128.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">injected</text><rect x="210" y="90" width="140" height="60" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="280.0" y="111.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Host ribosomes</text><text x="280.0" y="128.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">translate it</text><rect x="390" y="90" width="120" height="60" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="450.0" y="111.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Viral proteins</text><text x="450.0" y="128.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">incl. RdRp</text><rect x="545" y="90" width="105" height="60" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="597.5" y="111.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">New</text><text x="597.5" y="128.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">virions</text><path d="M170,120.0 L210,120.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M350,120.0 L390,120.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M510,120.0 L545,120.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="15" y="210" width="650" height="160" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="30.0" y="231.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Negative-sense (−) RNA, influenza-like: complementary to mRNA</text><rect x="30" y="255" width="140" height="60" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="100.0" y="276.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Naked (−) RNA</text><text x="100.0" y="293.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">injected</text><rect x="210" y="255" width="160" height="60" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="290.0" y="268.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ribosomes cannot</text><text x="290.0" y="285.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">read it; host has</text><text x="290.0" y="301.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">no RdRp</text><rect x="410" y="255" width="240" height="60" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="530.0" y="276.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">In a real virion: packaged</text><text x="530.0" y="293.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">RdRp copies (−) → (+) mRNA</text><path d="M170,285.0 L210,285.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M370,285.0 L410,285.0" fill="none" stroke="#1f2430" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="402.7" y="333" width="194.6" height="24" rx="12" fill="#5b6474"/><text x="500.0" y="345.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">needs its own polymerase</text><text x="340.0" y="390.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">RdRp = RNA-dependent RNA polymerase. Strand sense, not length, DNA, or reverse transcriptase,</text><text x="340.0" y="408.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">decides whether the genome can be translated directly.</text></svg>
