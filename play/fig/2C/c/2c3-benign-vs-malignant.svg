<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">What defines malignancy: invasion and metastasis</text><rect x="20" y="50" width="310" height="270" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><rect x="142.8" y="57" width="64.4" height="26" rx="13" fill="#5b6474"/><text x="175.0" y="70.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Benign</text><polyline points="35,240 315,240" fill="none" stroke="#7a4cd9" stroke-width="3"/><rect x="350" y="50" width="310" height="270" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><polyline points="365,240 645,240" fill="none" stroke="#7a4cd9" stroke-width="3" stroke-dasharray="6 4"/><circle cx="175" cy="160" r="62" fill="#ffffff" stroke="#1f2430" stroke-width="1.5"/><circle cx="175" cy="160" r="55" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="175.0" y="152.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">encapsulated,</text><text x="175.0" y="167.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">stays local</text><text x="175.0" y="255.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">basement membrane intact</text><text x="175.0" y="290.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">can be very large; still benign</text><path d="M455,130 C490,100 540,110 560,140 C600,150 590,190 560,200 C560,230 540,260 520,275 C500,250 470,220 450,200 C420,180 430,150 455,130 Z" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="505.0" y="157.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">invades</text><text x="505.0" y="172.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">tissue</text><rect x="565" y="270" width="90" height="30" rx="15" fill="#f5c9c4" stroke="#d6453d" stroke-width="1.5"/><text x="610.0" y="285.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">vessel</text><path d="M530,270 L575,285" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="505.0" y="307.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">crosses basement membrane, spreads</text><rect x="20" y="330" width="640" height="80" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="32.0" y="373.7" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Both kinds are made of abnormal, overgrowing cells, and growth rate overlaps. The defining</text><text x="32.0" y="389.3" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">difference is the ability to invade and metastasize.</text></svg>
