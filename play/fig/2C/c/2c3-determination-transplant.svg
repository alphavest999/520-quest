<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Transplant test: specified vs determined tissue</text><ellipse cx="110" cy="140" rx="80" ry="50" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="110.0" y="202.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">donor embryo</text><circle cx="80" cy="125" r="14" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="80.0" y="125.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">A</text><path d="M100,120 Q175.0,100.0 250,120" fill="none" stroke="#d98a00" stroke-width="1.8" marker-end="url(#ah)"/><text x="175.0" y="84.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">move patch</text><ellipse cx="330" cy="140" rx="80" ry="50" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="330.0" y="202.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">host embryo, site B</text><circle cx="355" cy="155" r="14" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="355.0" y="155.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">A</text><path d="M420,140 L460,140" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="465" y="95" width="195" height="95" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="562.5" y="126.2" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Determined: graft forms the</text><text x="562.5" y="142.5" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">structure of its ORIGINAL</text><text x="562.5" y="158.8" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">site</text><rect x="195.0" y="224" width="290.0" height="26" rx="13" fill="#5b6474"/><text x="340.0" y="237.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Specified only (not yet committed)</text><ellipse cx="110" cy="325" rx="80" ry="50" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="110.0" y="387.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">donor embryo</text><circle cx="80" cy="310" r="14" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="80.0" y="310.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">A</text><path d="M100,305 Q175.0,285.0 250,305" fill="none" stroke="#d98a00" stroke-width="1.8" marker-end="url(#ah)"/><text x="175.0" y="269.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">move patch</text><ellipse cx="330" cy="325" rx="80" ry="50" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="330.0" y="387.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">host embryo, site B</text><circle cx="355" cy="340" r="14" fill="#2f6fdb" stroke="#d98a00" stroke-width="1.5"/><text x="355.0" y="340.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">B</text><path d="M420,325 L460,325" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="465" y="280" width="195" height="95" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="562.5" y="319.4" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Graft takes on the fate</text><text x="562.5" y="335.6" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">of its NEW surroundings</text><text x="340.0" y="422.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle" font-style="italic">Determination happens BEFORE any visible differentiation; the commitment is hidden in gene expression.</text></svg>
