<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Leaving the cycle (G0) and the restriction point</text><path d="M175.0,83.0 A122,122 0 0 1 246.7,106.3 L217.3,146.8 A72,72 0 0 0 175.0,133.0 Z" fill="#d23c8a" stroke="#ffffff" stroke-width="3"/><text x="205.0" y="112.7" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">M</text><path d="M246.7,106.3 A122,122 0 0 1 175.0,327.0 L175.0,277.0 A72,72 0 0 0 217.3,146.8 Z" fill="#2f6fdb" stroke="#ffffff" stroke-width="3"/><text x="267.3" y="235.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">G1</text><path d="M175.0,327.0 A122,122 0 0 1 59.0,167.3 L106.5,182.8 A72,72 0 0 0 175.0,277.0 Z" fill="#1f9d63" stroke="#ffffff" stroke-width="3"/><text x="96.5" y="262.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">S</text><path d="M59.0,167.3 A122,122 0 0 1 175.0,83.0 L175.0,133.0 A72,72 0 0 0 106.5,182.8 Z" fill="#d98a00" stroke="#ffffff" stroke-width="3"/><text x="118.0" y="126.5" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">G2</text><path d="M291.0,138.0 A134,134 0 0 1 242.0,321.0" fill="none" stroke="#5b6474" stroke-width="2" marker-end="url(#ah)"/><line x1="192.1" y1="268.8" x2="208.1" y2="328.6" stroke="#7a4cd9" stroke-width="5" stroke-linecap="round"/><text x="135.0" y="355.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">restriction point</text><text x="135.0" y="372.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">(late G1)</text><polyline points="208.12883777312268,328.63850576500073 165,345" fill="none" stroke="#7a4cd9" stroke-width="1.2"/><circle cx="342.9261690792433" cy="322.58316945196447" r="40" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="342.9" y="322.6" font-size="20" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">G0</text><path d="M298.9244625503679,209.32753759111012 Q340.3,234.7 352.9261690792433,281.58316945196447" fill="none" stroke="#138f9a" stroke-width="1.8" marker-end="url(#ah)"/><path d="M304.9261690792433,336.58316945196447 Q269.2,332.8 254.70566360113088,299.9895109467533" fill="none" stroke="#138f9a" stroke-width="1.8" marker-end="url(#ah)"/><text x="344.9" y="378.6" font-size="12" font-weight="400" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">quiescent</text><rect x="395" y="50" width="275" height="108" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><rect x="405.0" y="55" width="68.1" height="24" rx="12" fill="#5b6474"/><text x="439.0" y="67.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Neurons</text><text x="407.0" y="100.2" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Terminally differentiated: stay in G0</text><text x="407.0" y="116.5" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">for life and normally never divide</text><text x="407.0" y="132.8" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">again.</text><rect x="395" y="168" width="275" height="108" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><rect x="405.0" y="173" width="97.8" height="24" rx="12" fill="#5b6474"/><text x="453.9" y="185.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Hepatocytes</text><text x="407.0" y="218.2" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Quiescent G0, but growth factors (e.g.</text><text x="407.0" y="234.5" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">HGF) after injury bring them back into</text><text x="407.0" y="250.8" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">G1 to regrow the liver.</text><rect x="395" y="286" width="275" height="120" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><rect x="405.0" y="291" width="142.5" height="24" rx="12" fill="#5b6474"/><text x="476.2" y="303.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Restriction point</text><text x="407.0" y="334.1" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Before it, removing mitogens sends the</text><text x="407.0" y="350.4" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">cell to G0. After it (Rb</text><text x="407.0" y="366.6" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">phosphorylated, E2F free), the cell</text><text x="407.0" y="382.9" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">finishes the cycle without them.</text></svg>
