<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fas engagement starts the extrinsic pathway</text><text x="130.0" y="54.0" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">EXTRINSIC (death receptor)</text><rect x="40" y="70" width="180" height="44" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="130.0" y="92.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fas ligand (on T cell)</text><path d="M130,114 L130,134" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40" y="136" width="180" height="44" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="130.0" y="158.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fas receptor + FADD</text><path d="M130,180 L130,200" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40" y="202" width="180" height="44" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="130.0" y="224.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">caspase-8 (initiator)</text><text x="500.0" y="54.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">INTRINSIC (mitochondrial)</text><rect x="400" y="70" width="200" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="500.0" y="92.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DNA damage, stress</text><path d="M500,114 L500,134" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="400" y="136" width="200" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="500.0" y="150.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Bax / Bak open pores in</text><text x="500.0" y="165.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">outer mitochondrial membrane</text><path d="M500,180 L500,200" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="400" y="202" width="200" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="500.0" y="224.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cytochrome c → cytosol</text><path d="M500,246 L500,266" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="400" y="268" width="200" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="500.0" y="282.5" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">apoptosome (Apaf-1)</text><text x="500.0" y="297.5" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ caspase-9 (initiator)</text><rect x="255" y="136" width="110" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="310.0" y="158.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Bcl-2</text><line x1="365" y1="158" x2="396" y2="158" stroke="#d6453d" stroke-width="3"/><line x1="396.0" y1="167.0" x2="396.0" y2="149.0" stroke="#d6453d" stroke-width="4" stroke-linecap="round"/><text x="310.0" y="192.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">anti-apoptotic</text><rect x="200" y="340" width="280" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="362.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">executioner caspases 3, 7</text><path d="M130,246 L250,338" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M500,312 L430,338" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M340,384 L340,402" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="415.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">proteins cleaved → cell dismantled into apoptotic bodies</text></svg>
