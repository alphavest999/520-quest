iddle">inflammation</text><circle cx="80" cy="290" r="36" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="80" cy="290" r="15.12" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="80.0" y="342.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">injured cell</text><path d="M122,290 L162,290" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><circle cx="215" cy="290" r="48" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="215" cy="290" r="16" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="215.0" y="352.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">swells (water in)</text><path d="M268,290 L306,290" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M318,262 A40,40 0 1 1 330,322" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5" stroke-dasharray="8 5"/><circle cx="372" cy="266" r="4" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="384" cy="266" r="4" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="396" cy="266" r="4" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="372" cy="288" r="4" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="384" cy="288" r="4" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="396" cy="288" r="4" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="372" cy="310" r="4" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="384" cy="310" r="4" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="396" cy="310" r="4" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><text x="350.0" y="352.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">bursts, contents spill</text><path d="M420,290 L446,290" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><circle cx="462" cy="290" r=