<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Asymmetric division: self-renewal plus a differentiating cell</text><circle cx="115" cy="120" r="24" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><circle cx="115" cy="120" r="10.08" fill="#7a4cd9" stroke="#7a4cd9" stroke-width="1.5"/><path d="M105,146 L65,205" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M125,146 L165,205" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><circle cx="55" cy="232" r="24" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><circle cx="55" cy="232" r="10.08" fill="#7a4cd9" stroke="#7a4cd9" stroke-width="1.5"/><circle cx="175" cy="232" r="24" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="175" cy="232" r="10.08" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="115.0" y="292.2" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Pool stays the same size</text><text x="115.0" y="307.8" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">and makes specialized cells</text><rect x="257.6" y="50" width="164.8" height="24" rx="12" fill="#5b6474"/><text x="340.0" y="62.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Stem cell divisions</text><circle cx="340" cy="120" r="24" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><circle cx="340" cy="120" r="10.08" fill="#7a4cd9" stroke="#7a4cd9" stroke-width="1.5"/><path d="M330,146 L290,205" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M350,146 L390,205" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><circle cx="280" cy="232" r="24" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><circle cx="280" cy="232" r="10.08" fill="#7a4cd9" stroke="#7a4cd9" stroke-width="1.5"/><circle cx="400" cy="232" r="24" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><circle cx="400" cy="232" r="10.08" fill="#7a4cd9" stroke="#7a4cd9" stroke-width="1.5"/><text x="340.0" y="292.2" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Pool grows</text><text x="340.0" y="307.8" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(e.g. during development, repair)</text><circle cx="565" cy="120" r="24" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><circle cx="565" cy="120" r="10.08" fill="#7a4cd9" stroke="#7a4cd9" stroke-width="1.5"/><path d="M555,146 L515,205" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M575,146 L615,205" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><circle cx="505" cy="232" r="24" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="505" cy="232" r="10.08" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><circle cx="625" cy="232" r="24" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="625" cy="232" r="10.08" fill="#d98a00" stroke="#d98a00" stroke-width="1.5"/><text x="565.0" y="300.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Pool shrinks by one</text><circle cx="150" cy="352" r="11" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="168.0" y="352.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">stem cell</text><circle cx="330" cy="352" r="11" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="348.0" y="352.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">committed (differentiating) cell</text><text x="340.0" y="378.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle" font-style="italic">All three are mitosis: each daughter gets a full diploid genome.</text></svg>
