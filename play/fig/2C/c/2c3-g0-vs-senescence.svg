<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Quiescence (G0) is reversible; senescence is not</text><circle cx="340" cy="150" r="70" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="340.0" y="142.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">dividing</text><text x="340.0" y="162.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">G1 → S → G2 → M</text><circle cx="120" cy="150" r="50" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="120.0" y="141.9" font-size="13" font-weight="600" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">G0</text><text x="120.0" y="158.1" font-size="13" font-weight="600" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">quiescent</text><path d="M268,135 L172,135" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="220.0" y="125.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">no mitogens</text><path d="M172,168 L268,168" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="220.0" y="182.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">growth signals</text><circle cx="560" cy="150" r="55" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="560.0" y="150.0" font-size="13" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">senescent</text><path d="M412,150 L503,150" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="560.0" y="62.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">short telomeres, DNA</text><text x="560.0" y="77.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">damage, oncogene stress</text><line x1="440" y1="190" x2="480" y2="210" stroke="#d6453d" stroke-width="4"/><line x1="480" y1="190" x2="440" y2="210" stroke="#d6453d" stroke-width="4"/><text x="460.0" y="217.5" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">no way back, even</text><text x="460.0" y="232.5" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">with growth factors</text><rect x="20" y="260" width="310" height="150" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><rect x="30.0" y="265" width="120.2" height="24" rx="12" fill="#5b6474"/><text x="90.1" y="277.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Quiescent (G0)</text><text x="32.0" y="330.9" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Reversible pause; re-enters G1 when</text><text x="32.0" y="346.5" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">stimulated (e.g. hepatocytes after injury).</text><text x="32.0" y="362.1" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Alive.</text><rect x="350" y="260" width="310" height="150" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="362.0" y="323.1" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Stable, essentially permanent arrest held by</text><text x="362.0" y="338.7" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">p53–p21 and p16–Rb. Alive, nucleus intact,</text><text x="362.0" y="354.3" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">metabolically active, often secretes factors</text><text x="362.0" y="369.9" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">(SASP).</text></svg>
