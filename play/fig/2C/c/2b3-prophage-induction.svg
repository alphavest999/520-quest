<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 284" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">UV induction of a λ prophage (the SOS switch)</text><rect x="25" y="50" width="190" height="74" rx="10" fill="#e6eefc" stroke="#8a93a3" stroke-width="1.5"/><text x="120.0" y="70.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lysogen: λ prophage in the</text><text x="120.0" y="87.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">chromosome; cI repressor</text><text x="120.0" y="103.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">holds lytic genes OFF</text><rect x="245" y="50" width="190" height="74" rx="10" fill="#fdf1db" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="70.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">UV damages host DNA;</text><text x="340.0" y="87.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">single-stranded DNA</text><text x="340.0" y="103.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">activates RecA (SOS)</text><rect x="465" y="50" width="190" height="74" rx="10" fill="#fdf1db" stroke="#8a93a3" stroke-width="1.5"/><text x="560.0" y="70.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Activated RecA stimulates</text><text x="560.0" y="87.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cI repressor to cut itself;</text><text x="560.0" y="103.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">repressor falls off</text><rect x="25" y="170" width="190" height="74" rx="10" fill="#fbe7e5" stroke="#8a93a3" stroke-width="1.5"/><text x="120.0" y="190.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Phages released by</text><text x="120.0" y="207.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">lysis: all made AFTER</text><text x="120.0" y="223.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">the UV exposure</text><rect x="245" y="170" width="190" height="74" rx="10" fill="#fbe7e5" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="190.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lytic genes expressed:</text><text x="340.0" y="207.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">phage DNA copied, heads</text><text x="340.0" y="223.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">and tails assembled</text><rect x="465" y="170" width="190" height="74" rx="10" fill="#fbe7e5" stroke="#8a93a3" stroke-width="1.5"/><text x="560.0" y="190.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Prophage excises from</text><text x="560.0" y="207.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">the chromosome</text><text x="560.0" y="223.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(enters lytic program)</text><path d="M215,87.0 L245,87.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M435,87.0 L465,87.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M560.0,124 L560.0,170" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M465,207.0 L435,207.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M245,207.0 L215,207.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="268.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Before UV, a lysogen contains only phage DNA, never finished phage particles.</text><rect x="20" y="290" width="640" height="118" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/></svg>
