<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">p53: a tumor suppressor that stops or kills damaged cells</text><rect x="250" y="55" width="180" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="340.0" y="75.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DNA damage</text><path d="M340,95 L340,118" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="250" y="120" width="180" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="140.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ATM/ATR kinases</text><path d="M340,160 L340,183" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="250" y="185" width="180" height="44" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="340.0" y="198.9" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">p53 stabilized</text><text x="340.0" y="215.1" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(transcription factor)</text><path d="M280,229 L160,260" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M400,229 L520,260" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40" y="262" width="240" height="56" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="160.0" y="282.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">p21 → CDKs off</text><text x="160.0" y="297.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">G1 arrest, time to repair</text><rect x="400" y="262" width="240" height="56" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="520.0" y="282.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Bax, PUMA → apoptosis</text><text x="520.0" y="297.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">if damage is too great</text><rect x="20" y="335" width="640" height="85" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="32.0" y="381.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Damaged cells neither arrest nor die: they keep dividing, pile up mutations and resist</text><text x="32.0" y="396.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">DNA-damaging drugs that kill through p53-triggered apoptosis.</text></svg>
