<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">p21 is a CDK inhibitor: it blocks cyclin–CDK</text><rect x="240" y="48" width="120" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="300.0" y="68.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DNA damage</text><rect x="395" y="48" width="90" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="440.0" y="68.0" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">p53</text><rect x="520" y="48" width="120" height="40" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="580.0" y="68.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">p21</text><path d="M360,68 L393,68" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M485,68 L518,68" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="30" y="120" width="160" height="46" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="110.0" y="134.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Growth factors</text><text x="110.0" y="151.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(mitogens)</text><rect x="240" y="120" width="400" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="440.0" y="143.0" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cyclin D–CDK4/6, then cyclin E–CDK2 (kinases)</text><path d="M190,143 L238,143" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="580,88 580,118" fill="none" stroke="#d6453d" stroke-width="2.4"/><polyline points="568,118 592,118" fill="none" stroke="#d6453d" stroke-width="3.5"/><rect x="220" y="212" width="170" height="52" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="305.0" y="229.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Rb–E2F</text><text x="305.0" y="246.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(E2F held: genes off)</text><rect x="480" y="212" width="160" height="52" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="560.0" y="238.0" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Rb–P  +  free E2F</text><path d="M390,238 L478,238" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="434.0" y="252.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">+ phosphate</text><path d="M435,166 L435,236" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="505.0" y="195.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">phosphorylates Rb</text><rect x="480" y="300" width="160" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="560.0" y="315.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">S-phase genes ON</text><text x="560.0" y="330.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(cyclin E, DNA pol, …)</text><path d="M560,264 L560,298" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="250" y="300" width="140" height="46" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="320.0" y="323.0" font-size="14" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">G1 → S entry</text><path d="M478,323 L392,323" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="25" y="205" width="170" height="140" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="110.0" y="228.1" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DNA damage stabilises</text><text x="110.0" y="243.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">p53, which turns on the</text><text x="110.0" y="259.4" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">p21 gene. p21 binds</text><text x="110.0" y="275.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cyclin–CDK, Rb stays</text><text x="110.0" y="290.6" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">unphosphorylated and</text><text x="110.0" y="306.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">the cell pauses in G1</text><text x="110.0" y="321.9" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">to repair.</text></svg>
