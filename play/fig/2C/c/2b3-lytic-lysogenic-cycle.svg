<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Temperate phage: lytic vs. lysogenic cycle</text><rect x="245" y="45" width="190" height="56" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="64.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Phage attaches and</text><text x="340.0" y="81.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">injects its DNA</text><rect x="20" y="140" width="200" height="56" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="120.0" y="159.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lytic: phage genes</text><text x="120.0" y="176.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">transcribed at once</text><rect x="20" y="230" width="200" height="56" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="120.0" y="249.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Phage DNA copied;</text><text x="120.0" y="266.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">heads + tails assembled</text><rect x="20" y="320" width="200" height="56" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="120.0" y="339.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cell lyses, releasing</text><text x="120.0" y="356.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">~100 new phages</text><rect x="460" y="140" width="200" height="56" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="560.0" y="159.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lysogenic: DNA integrates</text><text x="560.0" y="176.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">as a prophage (DNA)</text><rect x="460" y="230" width="200" height="56" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="560.0" y="249.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Most phage genes silent</text><text x="560.0" y="266.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(repressor made)</text><rect x="460" y="320" width="200" height="56" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="560.0" y="339.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Prophage copied with</text><text x="560.0" y="356.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">host DNA at each division</text><path d="M340.0,101 L120.0,140" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M340.0,101 L560.0,140" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M120.0,196 L120.0,230" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M120.0,286 L120.0,320" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M560.0,196 L560.0,230" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M560.0,286 L560.0,320" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M460,258.0 L220,258.0" fill="none" stroke="#1f2430" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="340.0" y="228.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">stress / DNA damage:</text><text x="340.0" y="243.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">induction (excision)</text></svg>
