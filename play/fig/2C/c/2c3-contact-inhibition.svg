<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Contact inhibition: normal cells stop at a monolayer</text><rect x="97.2" y="47.5" width="155.5" height="25.0" rx="12.5" fill="#5b6474"/><text x="175.0" y="60.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Normal fibroblasts</text><polyline points="30,250 320,250" fill="none" stroke="#5b6474" stroke-width="3"/><text x="175.0" y="268.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">dish surface</text><ellipse cx="46" cy="238" rx="16" ry="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><ellipse cx="78" cy="238" rx="16" ry="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><ellipse cx="110" cy="238" rx="16" ry="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><ellipse cx="142" cy="238" rx="16" ry="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><ellipse cx="174" cy="238" rx="16" ry="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><ellipse cx="206" cy="238" rx="16" ry="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><ellipse cx="238" cy="238" rx="16" ry="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><ellipse cx="270" cy="238" rx="16" ry="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><ellipse cx="302" cy="238" rx="16" ry="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><polyline points="360,250 650,250" fill="none" stroke="#5b6474" stroke-width="3"/><text x="505.0" y="268.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">dish surface</text><ellipse cx="376" cy="238" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="408" cy="238" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="440" cy="238" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="472" cy="238" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="504" cy="238" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="536" cy="238" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="568" cy="238" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="600" cy="238" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="632" cy="238" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="410" cy="217" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="442" cy="217" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="474" cy="217" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="506" cy="217" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="538" cy="217" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="570" cy="217" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="426" cy="196" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="458" cy="196" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="490" cy="196" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="522" cy="196" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="554" cy="196" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="442" cy="175" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="474" cy="175" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="506" cy="175" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="538" cy="175" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="474" cy="154" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="506" cy="154" rx="16" ry="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="175.0" y="141.9" font-size="13" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">touching on all sides</text><text x="175.0" y="158.1" font-size="13" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">→ division stops</text><text x="505.0" y="120.0" font-size="13" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">keep dividing, pile up into a focus</text><rect x="20" y="295" width="640" height="70" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="340.0" y="321.9" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Transformed cells have lost contact inhibition (and often anchorage dependence). They</text><text x="340.0" y="338.1" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">still replicate DNA and still have nuclei; the change is in growth control.</text></svg>
