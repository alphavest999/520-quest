th d="M420,199 L390,236" fill="none" stroke="#1f2430" stroke-width="1.2" marker-end="url(#ah)"/><circle cx="390" cy="256" r="18" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="390.0" y="256.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">46</text><path d="M420,199 L450,236" fill="none" stroke="#1f2430" stroke-width="1.2" marker-end="url(#ah)"/><circle cx="450" cy="256" r="18" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="450.0" y="256.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">46</text><path d="M540,199 L510,236" fill="none" stroke="#d6453d" stroke-width="1.2" marker-end="url(#ah)"/><circle cx="510" cy="256" r="18" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="510.0" y="256.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">47</text><path d="M540,199 L570,236" fill="none" stroke="#d6453d" stroke-width="1.2" marker-end="url(#ah)"/><circle cx="570" cy="256" r="18" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="570.0" y="256.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">45</text><text x="565.0" y="214.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="start" dominant-baseline="middle">nondisjunction</text><text x="608.0" y="256.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">usually lost</text><text x="480.0" y="300.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">46 and 47 cell lines: mosaic</text></svg>
