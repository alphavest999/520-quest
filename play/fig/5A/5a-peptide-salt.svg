.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Added salt (Na⁺, Cl⁻) screens the charges, weakening the pull, so more peptide is needed (higher MIC).</text><text x="340.0" y="320.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Membrane disruption is physical, so bacteria cannot easily evolve resistance.</text></svg>
