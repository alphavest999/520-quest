<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Coevolution: each species is the other&#x27;s selective pressure</text><rect x="40" y="70" width="250" height="80" rx="10" fill="#fbe7e5" stroke="#d23c8a" stroke-width="1.5"/><text x="165.0" y="101.6" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Flower: nectar deeper in a</text><text x="165.0" y="118.4" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">longer tube (spur)</text><rect x="390" y="70" width="250" height="80" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="515.0" y="101.6" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Pollinator: longer tongue</text><text x="515.0" y="118.4" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">reaches the nectar</text><path d="M290,95 L390,95" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="83.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">selects for</text><path d="M390,128 L290,128" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="142.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">selects for</text><text x="340.0" y="175.0" font-size="12.2" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Long-tubed flowers are pollinated only by long-tongued visitors (it pushes in deep, so pollen sticks to it);</text><text x="340.0" y="194.0" font-size="12.2" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">long-tongued pollinators get more nectar. Each change favors a matching change in the partner.</text><rect x="40" y="220" width="600" height="70" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="340.0" y="247.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Classic case: Darwin&#x27;s star orchid has a nectar spur about 30 cm long. In 1862 Darwin predicted</text><text x="340.0" y="262.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">a moth with an equally long tongue; a hawk moth with a ~25 cm tongue was described in 1903.</text><rect x="40" y="305" width="290" height="78" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="185.0" y="327.8" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Coevolution</text><text x="185.0" y="344.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">reciprocal change between</text><text x="185.0" y="360.2" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">interacting species</text><rect x="350" y="305" width="290" height="78" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="495.0" y="327.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Convergent evolution</text><text x="495.0" y="344.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">unrelated species evolve similar</text><text x="495.0" y="360.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">traits independently</text><rect x="121.2" y="288" width="127.6" height="24" rx="12" fill="#1f9d63"/><text x="185.0" y="300.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ this question</text></svg>
