xt x="345.0" y="343.1" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">0.09</text><text x="195.0" y="66.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">p (A) = 0.7</text><text x="345.0" y="66.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">q (a) = 0.3</text><text x="82.0" y="185.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">p (A) = 0.7</text><text x="82.0" y="335.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">q (a) = 0.3</text><polygon points="90,80 390,80 390,290.0 300.0,290.0 300.0,380 90,380" fill="none" stroke="#1f9d63" stroke-width="3.5"/><text x="240.0" y="400.0" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Green outline: dominant phenotype, 1 − q² = 0.91</text><text x="540.0" y="90.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">q² = 0.09 → q = 0.3, p = 0.7</text><text x="540.0" y="115.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Aa = 2pq = 0.42</text><text x="540.0" y="140.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">dominant = 1 − 0.09 = 0.91</text><text x="540.0" y="172.0" font-size="15" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">0.42 / 0.91 = 6/13 ≈ 0.46</text><rect x="483.6" y="203" width="112.7" height="24" rx="12" fill="#1f9d63"/><text x="540.0" y="215.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ 6/13 ≈ 0.46</text><rect x="442.7" y="243" width="194.6" height="24" rx="12" fill="#d6453d"/><text x="540.0" y="255.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle"