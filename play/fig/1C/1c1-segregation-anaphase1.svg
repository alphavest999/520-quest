<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Where the allele pair A / a actually separates</text><rect x="15" y="42" width="206" height="250" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="118.0" y="62.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1. Metaphase I</text><rect x="237" y="42" width="206" height="250" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="62.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2. Anaphase I</text><rect x="459" y="42" width="206" height="250" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="562.0" y="62.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3. After anaphase II</text><rect x="69.0" y="100" width="14" height="110" rx="7.0" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><rect x="68.0" y="178" width="16" height="8" fill="#2f6fdb"/><rect x="87.0" y="100" width="14" height="110" rx="7.0" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><rect x="86.0" y="178" width="16" height="8" fill="#2f6fdb"/><circle cx="85" cy="145" r="6" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="85.0" y="226.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">A A</text><rect x="134.0" y="100" width="14" height="110" rx="7.0" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><rect x="133.0" y="178" width="16" height="8" fill="#7a4cd9"/><rect x="152.0" y="100" width="14" height="110" rx="7.0" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><rect x="151.0" y="178" width="16" height="8" fill="#7a4cd9"/><circle cx="150" cy="145" r="6" fill="#7a4cd9" stroke="#7a4cd9" stroke-width="1.5"/><text x="150.0" y="226.0" font-size="14" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">a a</text><text x="118.0" y="254.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">homologs paired</text><text x="118.0" y="272.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(each = 2 sister chromatids)</text><rect x="284.0" y="100" width="14" height="110" rx="7.0" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><rect x="283.0" y="178" width="16" height="8" fill="#2f6fdb"/><rect x="302.0" y="100" width="14" height="110" rx="7.0" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><rect x="301.0" y="178" width="16" height="8" fill="#2f6fdb"/><circle cx="300" cy="145" r="6" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="300.0" y="226.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">A A</text><rect x="364.0" y="100" width="14" height="110" rx="7.0" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><rect x="363.0" y="178" width="16" height="8" fill="#7a4cd9"/><rect x="382.0" y="100" width="14" height="110" rx="7.0" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><rect x="381.0" y="178" width="16" height="8" fill="#7a4cd9"/><circle cx="380" cy="145" r="6" fill="#7a4cd9" stroke="#7a4cd9" stroke-width="1.5"/><text x="380.0" y="226.0" font-size="14" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">a a</text><path d="M282,150 L250,150" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M398,150 L430,150" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="340,82 340,240" fill="none" stroke="#8a93a3" stroke-width="1.2" stroke-dasharray="6 4"/><text x="340.0" y="254.0" font-size="12" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">A and a go to</text><text x="340.0" y="272.0" font-size="12" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">different cells</text><circle cx="510" cy="120" r="26" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="510.0" y="120.0" font-size="18" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><circle cx="580" cy="120" r="26" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="580.0" y="120.0" font-size="18" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><circle cx="510" cy="195" r="26" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="510.0" y="195.0" font-size="18" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">a</text><circle cx="580" cy="195" r="26" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="580.0" y="195.0" font-size="18" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">a</text><text x="562.0" y="254.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">sisters part, but they</text><text x="562.0" y="272.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">already carried the same allele</text><path d="M222,165 L234,165" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M444,165 L456,165" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="33.1" y="310" width="283.8" height="24" rx="12" fill="#1f9d63"/><text x="175.0" y="322.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ anaphase I: homologs (A vs a) part</text><rect x="359.4" y="310" width="291.3" height="24" rx="12" fill="#d6453d"/><text x="505.0" y="322.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ anaphase II: identical sisters part</text><rect x="51.7" y="348" width="246.6" height="24" rx="12" fill="#d6453d"/><text x="175.0" y="360.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ crossing over: swaps segments</text><rect x="381.7" y="348" width="246.6" height="24" rx="12" fill="#d6453d"/><text x="505.0" y="360.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ cytokinesis: splits cytoplasm</text><text x="340.0" y="398.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Segregation = one allele per gamete, because one homolog goes to each daughter cell in meiosis I.</text></svg>
