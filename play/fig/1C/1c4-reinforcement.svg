<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Reinforcement: selection against hybrids strengthens isolation</text><rect x="20" y="46" width="400" height="50" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="220.0" y="63.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1. Populations diverge apart</text><text x="220.0" y="82.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(e.g. allopatry)</text><path d="M220,96 L220,108" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="108" width="400" height="50" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="220.0" y="125.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2. Secondary contact</text><text x="220.0" y="144.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ranges meet again</text><path d="M220,158 L220,170" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="170" width="400" height="50" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="220.0" y="187.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3. Hybrids have low fitness</text><text x="220.0" y="206.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">postzygotic barrier</text><path d="M220,220 L220,232" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="232" width="400" height="50" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="220.0" y="249.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">4. Mating with own type pays off</text><text x="220.0" y="268.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">those individuals leave more surviving offspring</text><path d="M220,282 L220,294" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="294" width="400" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="220.0" y="311.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">5. Prezygotic barriers (mate preference,</text><text x="220.0" y="330.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">timing) become STRONGER near the contact zone</text><rect x="440" y="46" width="220" height="112" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="550.0" y="66.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Not reinforcement:</text><text x="550.0" y="90.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">gene flow: would merge</text><text x="550.0" y="110.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">the two populations</text><text x="550.0" y="134.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">hybrid vigor: hybrids FITTER</text><rect x="440" y="176" width="220" height="108" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="550.0" y="196.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Signature in data:</text><text x="550.0" y="220.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">mate discrimination is</text><text x="550.0" y="240.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">stronger where species</text><text x="550.0" y="260.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">overlap than where apart</text><rect x="460.2" y="296" width="179.7" height="24" rx="12" fill="#1f9d63"/><text x="550.0" y="308.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ completes speciation</text><text x="340.0" y="394.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Wasted matings (unfit hybrids) are the selective pressure; the outcome is stronger prezygotic isolation.</text></svg>
