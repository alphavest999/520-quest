<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">An unrepaired uracil becomes a C → T transition</text><text x="375.0" y="70.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">replication 1</text><text x="565.0" y="70.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">replication 2</text><rect x="17" y="178" width="76" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="55.0" y="200.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C–G</text><text x="55.0" y="238.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">original</text><path d="M95,200 L165,200" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="130.0" y="184.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">deaminated</text><rect x="167" y="178" width="76" height="44" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="205.0" y="200.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">U–G</text><text x="205.0" y="238.0" font-size="12" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">U–G mismatch</text><path d="M245,200 L335,140" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/><rect x="337" y="118" width="76" height="44" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="375.0" y="140.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">U–A</text><path d="M245,200 L335,260" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/><rect x="337" y="238" width="76" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="375.0" y="260.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">G–C</text><text x="375.0" y="108.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">U strand + new A</text><text x="375.0" y="292.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">G strand + new C</text><path d="M415,140 L525,105" fill="none" stroke="#1f2430" stroke-width="1.3" marker-end="url(#ah)"/><rect x="527" y="83" width="76" height="44" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="565.0" y="105.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">U–A</text><path d="M415,140 L525,165" fill="none" stroke="#1f2430" stroke-width="1.3" marker-end="url(#ah)"/><rect x="527" y="143" width="76" height="44" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="565.0" y="165.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">T–A</text><path d="M415,260 L525,235" fill="none" stroke="#1f2430" stroke-width="1.3" marker-end="url(#ah)"/><rect x="527" y="213" width="76" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="565.0" y="235.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">G–C</text><path d="M415,260 L525,295" fill="none" stroke="#1f2430" stroke-width="1.3" marker-end="url(#ah)"/><rect x="527" y="273" width="76" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="565.0" y="295.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C–G</text><text x="608.0" y="165.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="start" dominant-baseline="middle">← mutant</text><rect x="30" y="350" width="620" height="108" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="50.0" y="372.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">U pairs with A, so the U strand gives U–A; that new A strand then templates T, giving T–A.</text><text x="50.0" y="394.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">C → T is pyrimidine → pyrimidine: a TRANSITION (not a transversion).</text><text x="50.0" y="416.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">The G strand keeps giving normal G–C pairs, so only one of the four descendants has T–A.</text><text x="50.0" y="438.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Replication never leaves a mismatch: each new strand pairs correctly with its template.</text></svg>
