xt><text x="128.0" y="199.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">0.03</text><rect x="176.0" y="176.0" width="32.0" height="32.0" fill="#e6eefc" stroke="#ffffff" stroke-width="2"/><rect x="208.0" y="176.0" width="192.0" height="32.0" fill="#e6eefc" stroke="#ffffff" stroke-width="2"/><text x="304.0" y="184.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><text x="304.0" y="199.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">0.06</text><rect x="80.0" y="208.0" width="96.0" height="192.0" fill="#e3f5ec" stroke="#ffffff" stroke-width="2"/><text x="128.0" y="296.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><text x="128.0" y="311.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">0.18</text><rect x="176.0" y="208.0" width="32.0" height="192.0" fill="#e6eefc" stroke="#ffffff" stroke-width="2"/><text x="192.0" y="296.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><text x="192.0" y="311.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">0.06</text><rect x="208.0" y="208.0" width="192.0" height="192.0" fill="#f1f3f6" stroke="#ffffff" stroke-width="2"/><text x="304.0" y="296.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">O</text><text x="304.0" y="311.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">0.36</text><text x="128.0" y="66.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Iᴬ = 0.3</text><text x="192.0" y="66.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Iᴮ = 0.1</text><text x="304.0" y="66.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">i = 0.6</text><text x="72.0" y="128.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">Iᴬ = 0.3</text><text x="72.0" y="192.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">Iᴮ = 0.1</text><text x="72.0" y="304.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">i = 0.6</text><rect x="80.0" y="80.0" width="96.0" height="96.0" fill="none" stroke="#1f9d63" stroke-width="3"/><rect x="208.0" y="80.0" width="192.0" height="96.0" fill="none" stroke="#1f9d63" stroke-width="3"/><rect x="80.0" y="208.0" width="96.0" height="192.0" fill="none" stroke="#1f9d63" stroke-width="3"/><text x="240.0" y="420.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Green outline = type A cells. Small cells (Iᴮ rows) are type B or AB.</text><text x="550.0" y="90.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Type A = IᴬIᴬ + Iᴬi</text><text x="550.0" y="116.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">IᴬIᴬ = 0.3² = 0.09</text><text x="550.0" y="138.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Iᴬi = 2(0.3)(0.6) = 0.36</text><text x="550.0" y="164.0" font-size="15" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Total = 0.45</text><rect x="463.9" y="198" width="172.2" height="24" rx="12" fill="#1f9d63"/><text x="550.0" y="210.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ 0.45 both genotypes</text><rect x="482.5" y="240" width="135.0" height="24" rx="12" fill="#d6453d"/><text x="550.0" y="252.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 0.09 IᴬIᴬ only</text><rect x="449.0" y="282" width="202.0" height="24" rx="12" fill="#d6453d"/><text x="550.0" y="294.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 0.36 Iᴬi only (= O too)</text><rect x="467.6" y="324" width="164.8" height="24" rx="12" fill="#d6453d"/><text x="550.0" y="336.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 0.30 is the allele</text><text x="550.0" y="370.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Type O = i² = 0.36</text></svg>
