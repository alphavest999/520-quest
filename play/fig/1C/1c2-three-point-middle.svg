<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A double crossover swaps only the middle gene</text><text x="50.0" y="58.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Parental chromatids (from the parental classes)</text><clipPath id="c2tp1"><rect x="50" y="92" width="300" height="16" rx="8"/></clipPath><rect x="50" y="92" width="300" height="16" fill="#2f6fdb" clip-path="url(#c2tp1)"/><rect x="50" y="92" width="300" height="16" rx="8" fill="none" stroke="#1f2430" stroke-width="1.2"/><text x="90.0" y="80.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><text x="200.0" y="80.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><text x="310.0" y="80.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><clipPath id="c2tp2"><rect x="50" y="142" width="300" height="16" rx="8"/></clipPath><rect x="50" y="142" width="300" height="16" fill="#d6453d" clip-path="url(#c2tp2)"/><rect x="50" y="142" width="300" height="16" rx="8" fill="none" stroke="#1f2430" stroke-width="1.2"/><text x="90.0" y="130.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">a</text><text x="200.0" y="130.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">b</text><text x="310.0" y="130.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">c</text><polyline points="133,88 157,162" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="157,88 133,162" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="243,88 267,162" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="267,88 243,162" fill="none" stroke="#1f2430" stroke-width="2"/><text x="145.0" y="178.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">crossover 1</text><text x="255.0" y="178.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">crossover 2</text><path d="M200,192 L200,222" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="50.0" y="240.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Double-crossover products (the rarest classes)</text><clipPath id="c2tp3"><rect x="50" y="277" width="300" height="16" rx="8"/></clipPath><rect x="50" y="277" width="95" height="16" fill="#2f6fdb" clip-path="url(#c2tp3)"/><rect x="145" y="277" width="110" height="16" fill="#d6453d" clip-path="url(#c2tp3)"/><rect x="255" y="277" width="95" height="16" fill="#2f6fdb" clip-path="url(#c2tp3)"/><rect x="50" y="277" width="300" height="16" rx="8" fill="none" stroke="#1f2430" stroke-width="1.2"/><text x="90.0" y="265.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><text x="200.0" y="265.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">b</text><text x="310.0" y="265.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><clipPath id="c2tp4"><rect x="50" y="327" width="300" height="16" rx="8"/></clipPath><rect x="50" y="327" width="95" height="16" fill="#d6453d" clip-path="url(#c2tp4)"/><rect x="145" y="327" width="110" height="16" fill="#2f6fdb" clip-path="url(#c2tp4)"/><rect x="255" y="327" width="95" height="16" fill="#d6453d" clip-path="url(#c2tp4)"/><rect x="50" y="327" width="300" height="16" rx="8" fill="none" stroke="#1f2430" stroke-width="1.2"/><text x="90.0" y="315.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">a</text><text x="200.0" y="315.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><text x="310.0" y="315.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">c</text><text x="200.0" y="375.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Only the gene between the two crossovers changes partner</text><text x="200.0" y="397.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">AbC vs ABC: only B differs → B is in the middle</text><text x="535.0" y="90.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Compare rarest class</text><text x="535.0" y="110.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">with parental class:</text><rect x="440" y="130" width="190" height="70" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="535.0" y="156.2" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">parental  A B C</text><text x="535.0" y="173.8" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">rarest      A b C</text><rect x="452.6" y="223" width="164.8" height="24" rx="12" fill="#1f9d63"/><text x="535.0" y="235.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ B is in the middle</text><rect x="463.8" y="263" width="142.5" height="24" rx="12" fill="#d6453d"/><text x="535.0" y="275.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ A: still with C</text><rect x="463.8" y="303" width="142.5" height="24" rx="12" fill="#d6453d"/><text x="535.0" y="315.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ C: still with A</text><rect x="463.8" y="343" width="142.5" height="24" rx="12" fill="#d6453d"/><text x="535.0" y="355.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ needs distances</text></svg>
