ne="middle">with probability 1/2</text><text x="520.0" y="195.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Step 3: a carrier&#x27;s son gets Xᵐ</text><text x="520.0" y="215.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">with probability 1/2</text><rect x="30" y="355" width="620" height="38" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="340.0" y="374.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P(son affected) = 1/2 × 1/2 = 1/4</text><rect x="66.7" y="408" width="246.6" height="24" rx="12" fill="#d6453d"/><text x="190.0" y="420.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 1/2: assumes she is a carrier</text><rect x="392.7" y="408" width="194.6" height="24" rx="12" fill="#d6453d"/><text x="490.0" y="420.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 1/8: extra 1/2 for sex</text><rect x="235.3" y="446" width="209.4" height="24" rx="12" fill="#d6453d"/><text x="340.0" y="458.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 1/6: autosomal 2/3 logic</text></svg>
