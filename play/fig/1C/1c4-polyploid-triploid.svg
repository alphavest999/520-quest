<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Why a tetraploid is instantly isolated from its diploid parent</text><text x="115.0" y="52.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Diploid parent (2n)</text><rect x="103.5" y="77.0" width="9" height="46" rx="4.5" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><rect x="117.5" y="77.0" width="9" height="46" rx="4.5" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><path d="M115,128 L115,160" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="115.0" y="176.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">makes n gametes</text><rect x="110.5" y="197.0" width="9" height="36" rx="4.5" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="565.0" y="52.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Tetraploid (4n)</text><rect x="539.5" y="77.0" width="9" height="46" rx="4.5" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><rect x="553.5" y="77.0" width="9" height="46" rx="4.5" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><rect x="567.5" y="77.0" width="9" height="46" rx="4.5" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><rect x="581.5" y="77.0" width="9" height="46" rx="4.5" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><path d="M565,128 L565,160" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="565.0" y="176.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">makes 2n gametes</text><rect x="553.5" y="197.0" width="9" height="36" rx="4.5" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><rect x="567.5" y="197.0" width="9" height="36" rx="4.5" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><path d="M150,215 L290,255" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M530,215 L390,255" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="230.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">fertilization works</text><rect x="255" y="255" width="170" height="70" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="340.0" y="272.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Triploid hybrid (3n)</text><rect x="321.5" y="287.0" width="9" height="30" rx="4.5" fill="#7a4cd9" stroke="#7a4cd9" stroke-width="1.5"/><rect x="335.5" y="287.0" width="9" height="30" rx="4.5" fill="#7a4cd9" stroke="#7a4cd9" stroke-width="1.5"/><rect x="349.5" y="287.0" width="9" height="30" rx="4.5" fill="#7a4cd9" stroke="#7a4cd9" stroke-width="1.5"/><rect x="20" y="342" width="640" height="74" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="340.0" y="360.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Meiosis: 3 homologs cannot split evenly, so each chromosome type goes 2:1 at random.</text><text x="340.0" y="381.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">With 7 chromosome types, a balanced gamete (all 1 copy or all 2) has chance 2 × (1/2)⁷ = 1/64 ≈ 1.6%.</text><text x="340.0" y="402.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Almost all gametes are unbalanced, so the triploid hybrid is essentially sterile.</text></svg>
