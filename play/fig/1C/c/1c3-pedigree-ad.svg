<text x="300.0" y="220.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Aa</text><polyline points="250.0,80 250.0,157.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><polyline points="110,157.0 300,157.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><polyline points="110,157.0 110,173.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><polyline points="200,157.0 200,173.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><polyline points="300,157.0 300,173.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><circle cx="400" cy="190" r="17.0" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><text x="400.0" y="220.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">aa</text><polyline points="317.0,190 383.0,190" fill="none" stroke="#1f2430" stroke-width="1.8"/><rect x="233.0" y="283.0" width="34" height="34" fill="#1f2430" stroke="#1f2430" stroke-width="2"/><text x="250.0" y="330.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Aa</text><circle cx="350" cy="300" r="17.0" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><text x="350.0" y="330.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">aa</text><circle cx="450" cy="300" r="17.0" fill="#1f2430" stroke="#1f2430" stroke-width="2"/><text x="450.0" y="330.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Aa</text><polyline points="350.0,190 350.0,267.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><polyline points="250,267.0 450,267.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><polyline points="250,267.0 250,283.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><polyline points="350,267.0 350,283.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><polyline points="450,267.0 450,283.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><rect x="278" y="168" width="44" height="44" fill="none" stroke="#d98a00" stroke-width="2.5" stroke-dasharray="5 3"/><rect x="228" y="278" width="44" height="44" fill="none" stroke="#d98a00" stroke-width="2.5" stroke-dasharray="5 3"/><text x="150.0" y="285.0" font-size="12" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">father → son:</text><text x="150.0" y="300.0" font-size="12" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">rules out X-linked</text><text x="150.0" y="315.0" font-size="12" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">and mitochondrial</text><rect x="510.0" y="60.0" width="20" height="20" fill="#1f2430" stroke="#1f2430" stroke-width="2"/><text x="538.0" y="70.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">affected male</text><circle cx="520" cy="98" r="10.0" fill="#1f2430" stroke="#1f2430" stroke-width="2"/><text x="538.0" y="98.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">affected female</text><rect x="510.0" y="116.0" width="20" height="20" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><text x="538.0" y="126.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">unaffected</text><text x="340.0" y="375.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Seen in every generation, in males and females alike, and passed from father to son.</text><text x="340.0" y="398.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">An affected child has an affected parent; unaffected parents pass it on to no one.</text></svg>
