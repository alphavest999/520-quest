<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Somatic mutations stay in the body; germline mutations are inherited</text><circle cx="340" cy="70" r="26" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="70.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">zygote</text><path d="M320,92 L190,140" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M360,92 L490,140" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="90" y="142" width="200" height="44" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="190.0" y="164.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">germline (gonads)</text><rect x="390" y="142" width="200" height="44" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="490.0" y="164.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">somatic cells (body)</text><path d="M190,186 L190,226" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="110" y="228" width="160" height="40" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="190.0" y="248.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">eggs or sperm</text><path d="M190,268 L190,300" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="110" y="302" width="160" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="190.0" y="322.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">children</text><text x="190.0" y="362.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">a mutation here can be</text><text x="190.0" y="380.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">passed to offspring</text><path d="M490,186 L490,226" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="490.0" y="242.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">adult skin</text><circle cx="420" cy="262" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="420" cy="284" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="420" cy="306" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="420" cy="328" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="442" cy="262" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="442" cy="284" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="442" cy="306" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="442" cy="328" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="464" cy="262" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="464" cy="284" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="464" cy="306" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="464" cy="328" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="486" cy="262" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="486" cy="284" r="9" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="486" cy="306" r="9" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="486" cy="328" r="9" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="508" cy="262" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="508" cy="284" r="9" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="508" cy="306" r="9" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="508" cy="328" r="9" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="530" cy="262" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="530" cy="284" r="9" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="530" cy="306" r="9" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="530" cy="328" r="9" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><circle cx="552" cy="262" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="552" cy="284" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="552" cy="306" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="552" cy="328" r="9" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="490.0" y="362.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">mutation arises in one skin cell:</text><text x="490.0" y="380.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">only its descendants carry it</text></svg>
