<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Imprinting: same deletion, different parent, different syndrome</text><rect x="15" y="42" width="320" height="300" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="175.0" y="62.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Deletion on the paternal 15</text><rect x="94.0" y="100" width="22" height="200" rx="11.0" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><rect x="93.0" y="137" width="24" height="6" fill="#ffffff"/><text x="105.0" y="88.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">paternal 15</text><rect x="91" y="146" width="28" height="44" fill="#ffffff" stroke="#d6453d" stroke-dasharray="4 3" stroke-width="2"/><text x="105.0" y="168.0" font-size="16" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Δ</text><rect x="234.0" y="100" width="22" height="200" rx="11.0" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><rect x="233.0" y="137" width="24" height="6" fill="#ffffff"/><text x="245.0" y="88.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">maternal 15</text><rect x="233" y="150" width="24" height="14" fill="#8a93a3"/><rect x="233" y="172" width="24" height="14" fill="#1f9d63"/><text x="175.0" y="157.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">PWS genes</text><text x="175.0" y="179.0" font-size="12" fon