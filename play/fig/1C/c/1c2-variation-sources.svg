<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Sources of genetic difference among siblings</text><rect x="240" y="50" width="200" height="50" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="75.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Two parents</text><path d="M340,100 L120,140" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/><rect x="20" y="142" width="200" height="60" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="120.0" y="163.6" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Crossing over</text><text x="120.0" y="180.4" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(prophase I)</text><text x="120.0" y="222.2" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">new allele combinations</text><text x="120.0" y="237.8" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">within each chromosome</text><rect x="48.8" y="266" width="142.5" height="24" rx="12" fill="#5b6474"/><text x="120.0" y="278.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">creates variation</text><path d="M340,100 L340,140" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/><rect x="240" y="142" width="200" height="60" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="340.0" y="163.6" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Independent assortment</text><text x="340.0" y="180.4" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(metaphase I)</text><text x="340.0" y="222.2" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">2²³ ≈ 8 million mixes</text><text x="340.0" y="237.8" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">of whole chromosomes</text><rect x="268.8" y="266" width="142.5" height="24" rx="12" fill="#5b6474"/><text x="340.0" y="278.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">creates variation</text><path d="M340,100 L560,140" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/><rect x="460" y="142" width="200" height="60" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="560.0" y="172.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Random fertilization</text><text x="560.0" y="222.2" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">any of ~8 million eggs ×</text><text x="560.0" y="237.8" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">any of ~8 million sperm</text><rect x="488.8" y="266" width="142.5" height="24" rx="12" fill="#5b6474"/><text x="560.0" y="278.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">creates variation</text><rect x="140" y="320" width="400" height="80" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="340.0" y="342.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Mitosis: sister chromatids separate</text><text x="340.0" y="364.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ two genetically identical daughter cells</text><text x="340.0" y="384.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(makes copies; generates no differences between siblings)</text></svg>
