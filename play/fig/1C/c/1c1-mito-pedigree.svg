<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Mitochondrial inheritance: only through mothers</text><circle cx="280" cy="70" r="15.0" fill="#1f2430" stroke="#1f2430" stroke-width="2"/><text x="280.0" y="99.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">I-1</text><rect x="365.0" y="55.0" width="30" height="30" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><text x="380.0" y="99.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">I-2</text><polyline points="295.0,70 365.0,70" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="330.0,70 330.0,151.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="130,151.0 530,151.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="130,151.0 130,165.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="230,151.0 230,165.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="430,151.0 430,165.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="530,151.0 530,165.0" fill="none" stroke="#1f2430" stroke-width="2"/><rect x="115.0" y="165.0" width="30" height="30" fill="#1f2430" stroke="#1f2430" stroke-width="2"/><circle cx="230" cy="180" r="15.0" fill="#1f2430" stroke="#1f2430" stroke-width="2"/><rect x="415.0" y="165.0" width="30" height="30" fill="#1f2430" stroke="#1f2430" stroke-width="2"/><circle cx="530" cy="180" r="15.0" fill="#1f2430" stroke="#1f2430" stroke-width="2"/><circle cx="60" cy="180" r="15.0" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><polyline points="75.0,180 115.0,180" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="95.0,180 95.0,271.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="55,271.0 135,271.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="55,271.0 55,285.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="135,271.0 135,285.0" fill="none" stroke="#1f2430" stroke-width="2"/><rect x="40.0" y="285.0" width="30" height="30" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><circle cx="135" cy="300" r="15.0" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><text x="95.0" y="352.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">affected father:</text><text x="95.0" y="370.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">no children affected</text><rect x="605.0" y="165.0" width="30" height="30" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><polyline points="545.0,180 605.0,180" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="575.0,180 575.0,271.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="535,271.0 615,271.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="535,271.0 535,285.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="615,271.0 615,285.0" fill="none" stroke="#1f2430" stroke-width="2"/><rect x="520.0" y="285.0" width="30" height="30" fill="#1f2430" stroke="#1f2430" stroke-width="2"/><circle cx="615" cy="300" r="15.0" fill="#1f2430" stroke="#1f2430" stroke-width="2"/><text x="575.0" y="352.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">affected mother:</text><text x="575.0" y="370.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">all children affected</text><rect x="230" y="250" width="230" height="96" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="345.0" y="274.6" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Mitochondria come from the</text><text x="345.0" y="290.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">egg cytoplasm; sperm</text><text x="345.0" y="305.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">mitochondria are destroyed</text><text x="345.0" y="321.4" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">after fertilization.</text><text x="340.0" y="402.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">X-linked dominant would let affected fathers pass it to every daughter.</text></svg>
