<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The two short distances add up to the long one</text><polyline points="38,100 302,100" fill="none" stroke="#8a93a3" stroke-width="6"/><polyline points="50,86 50,114" fill="none" stroke="#1f2430" stroke-width="3"/><text x="50.0" y="72.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><polyline points="190,86 190,114" fill="none" stroke="#1f2430" stroke-width="3"/><text x="190.0" y="72.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><polyline points="290,86 290,114" fill="none" stroke="#1f2430" stroke-width="3"/><text x="290.0" y="72.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><text x="120.0" y="128.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">7 cM</text><text x="240.0" y="128.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">5 cM</text><text x="50.0" y="154.0" font-size="13" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">A–C 7 + C–B 5 = 12 = A–B, as measured</text><polyline points="38,215 402,215" fill="none" stroke="#8a93a3" stroke-width="6"/><polyline points="50,201 50,229" fill="none" stroke="#1f2430" stroke-width="3"/><text x="50.0" y="187.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><polyline points="290,201 290,229" fill="none" stroke="#1f2430" stroke-width="3"/><text x="290.0" y="187.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><polyline points="390,201 390,229" fill="none" stroke="#1f2430" stroke-width="3"/><text x="390.0" y="187.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><text x="170.0" y="243.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">12 cM</text><text x="340.0" y="243.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">5 cM</text><text x="50.0" y="269.0" font-size="13" font-weight="400" fill="#d6453d" text-anchor="start" dominant-baseline="middle">then A–C would be 12 + 5 = 17, not 7</text><polyline points="38,330 442,330" fill="none" stroke="#8a93a3" stroke-width="6"/><polyline points="50,316 50,344" fill="none" stroke="#1f2430" stroke-width="3"/><text x="50.0" y="302.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><polyline points="290,316 290,344" fill="none" stroke="#1f2430" stroke-width="3"/><text x="290.0" y="302.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><polyline points="430,316 430,344" fill="none" stroke="#1f2430" stroke-width="3"/><text x="430.0" y="302.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">C</text><text x="170.0" y="358.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">12 cM</text><text x="360.0" y="358.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">7 cM</text><text x="50.0" y="384.0" font-size="13" font-weight="400" fill="#d6453d" text-anchor="start" dominant-baseline="middle">then B–C would be 12 + 7 = 19, not 5</text><text x="560.0" y="246.4" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Only one order is</text><text x="560.0" y="262.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">consistent, so the</text><text x="560.0" y="277.6" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">order is determined</text></svg>
