240" y="313" width="100" height="14" fill="#2f6fdb" clip-path="url(#c2dh5)"/><rect x="40" y="313" width="300" height="14" rx="7" fill="none" stroke="#1f2430" stroke-width="1.2"/><text x="65.0" y="302.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><text x="315.0" y="302.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B</text><clipPath id="c2dh6"><rect x="40" y="353" width="300" height="14" rx="7"/></clipPath><rect x="40" y="353" width="100" height="14" fill="#d6453d" clip-path="url(#c2dh6)"/><rect x="140" y="353" width="100" height="14" fill="#2f6fdb" clip-path="url(#c2dh6)"/><rect x="240" y="353" width="100" height="14" fill="#d6453d" clip-path="url(#c2dh6)"/><rect x="40" y="353" width="300" height="14" rx="7" fill="none" stroke="#1f2430" stroke-width="1.2"/><text x="65.0" y="342.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">a</text><text x="315.0" y="342.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">b</text><polyline points="131,311 149,369" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="149,311 131,369" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="231,311 249,369" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="249,311 231,369" fill="none" stroke="#1f2430" stroke-width="2"/><text x="370.0" y="340.0" font-size="13" font-weight="600" fill="#d6453d" text-anchor="start" dominant-baseline="middle">AB, ab: look parental (missed!)</text><text x="340.0" y="405.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Long intervals often have 2 crossovers, so RF underestimates distance and levels off near 50%.</text></svg>
