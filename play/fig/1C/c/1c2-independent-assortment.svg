<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Each homolog pair lines up independently: 2ⁿ combinations</text><text x="130.0" y="62.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Orientation 1</text><polyline points="130,76 130,230" fill="none" stroke="#8a93a3" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="114" y="85" width="12" height="70" rx="6" fill="#2f6fdb"/><rect x="134" y="85" width="12" height="70" rx="6" fill="#d6453d"/><rect x="114" y="175" width="12" height="40" rx="6" fill="#2f6fdb"/><rect x="134" y="175" width="12" height="40" rx="6" fill="#d6453d"/><text x="70.0" y="240.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">← pole</text><text x="190.0" y="240.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">pole →</text><text x="130.0" y="262.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">big M + small M</text><text x="130.0" y="280.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">big P + small P</text><text x="360.0" y="62.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Orientation 2</text><polyline points="360,76 360,230" fill="none" stroke="#8a93a3" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="344" y="85" width="12" height="70" rx="6" fill="#2f6fdb"/><rect x="364" y="85" width="12" height="70" rx="6" fill="#d6453d"/><rect x="344" y="175" width="12" height="40" rx="6" fill="#d6453d"/><rect x="364" y="175" width="12" height="40" rx="6" fill="#2f6fdb"/><text x="300.0" y="240.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">← pole</text><text x="420.0" y="240.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">pole →</text><text x="360.0" y="262.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">big M + small P</text><text x="360.0" y="280.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">big P + small M</text><text x="570.0" y="100.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">n = 2 pairs</text><text x="570.0" y="120.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 orientations</text><text x="570.0" y="140.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ 2² = 4 gamete types</text><text x="570.0" y="175.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">M = maternal (blue)</text><text x="570.0" y="193.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">P = paternal (red)</text><rect x="30" y="315" width="620" height="108" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="50.0" y="338.0" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Human: n = 23 pairs, each oriented 2 ways independently</text><text x="50.0" y="362.0" font-size="13.5" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">2 × 2 × ... × 2 (23 times) = 2²³ = 8,388,608 ≈ 8 million</text></svg>
