<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">X-linked recessive: affected father × normal mother</text><rect x="30" y="52" width="72" height="72" rx="0" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><rect x="102" y="52" width="72" height="72" rx="0" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="138.0" y="88.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Xᴬ</text><rect x="174" y="52" width="72" height="72" rx="0" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="210.0" y="88.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Xᴬ</text><rect x="30" y="124" width="72" height="72" rx="0" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="66.0" y="160.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Xᵃ</text><rect x="30" y="196" width="72" height="72" rx="0" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="66.0" y="232.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Y</text><rect x="102" y="124" width="72" height="72" rx="0" fill="#fdf1db" stroke="#8a93a3" stroke-width="1.5"/><text x="138.0" y="160.0" font-size="16" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">XᴬXᵃ</text><rect x="174" y="124" width="72" height="72" rx="0" fill="#fdf1db" stroke="#8a93a3" stroke-width="1.5"/><text x="210.0" y="160.0" font-size="16" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">XᴬXᵃ</text><rect x="102" y="196" width="72" height="72" rx="0" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="138.0" y="232.0" font-size="16" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">XᴬY</text><rect x="174" y="196" width="72" height="72" rx="0" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="210.0" y="232.0" font-size="16" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">XᴬY</text><text x="138.0" y="300.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">top: mother&#x27;s eggs (all Xᴬ)</text><text x="138.0" y="318.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">side: father&#x27;s sperm</text><path d="M330,132 L296,132" fill="none" stroke="#d98a00" stroke-width="1.8" marker-end="url(#ah)"/><text x="338.0" y="124.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">every daughter gets dad&#x27;s only X</text><text x="338.0" y="142.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">→ all daughters are carriers</text><path d="M330,204 L296,204" fill="none" stroke="#5b6474" stroke-width="1.8" marker-end="url(#ah)"/><text x="338.0" y="196.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">every son gets dad&#x27;s Y</text><text x="338.0" y="214.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">and mom&#x27;s normal X → unaffected</text></svg>
