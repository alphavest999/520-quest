<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">X-linked recessive allele with q = 0.1</text><text x="170.0" y="60.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Males: one X (hemizygous)</text><text x="510.0" y="60.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Females: two X&#x27;s</text><rect x="30.0" y="85" width="252.0" height="44" fill="#e6eefc" stroke="#fff" stroke-width="2"/><text x="156.0" y="107.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">XᴬY  0.9</text><rect x="282.0" y="85" width="28.0" height="44" fill="#d6453d" stroke="#fff" stroke-width="2"/><text x="296.0" y="145.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">XᵃY 0.1</text><text x="170.0" y="175.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">affected males = q = 0.1</text><rect x="370.0" y="85" width="226.8" height="44" fill="#e6eefc" stroke="#fff" stroke-width="2"/><text x="483.4" y="107.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">XᴬXᴬ 0.81</text><rect x="596.8" y="85" width="50.4" height="44" fill="#efe8fc" stroke="#fff" stroke-width="2"/><text x="622.0" y="99.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">XᴬXᵃ</text><text x="622.0" y="114.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">0.18</text><rect x="647.2" y="85" width="2.8" height="44" fill="#d6453d" stroke="#fff" stroke-width="2"/><text x="648.6" y="145.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="end" dominant-baseline="middle">XᵃXᵃ 0.01</text><text x="510.0" y="175.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">affected females = q² = 0.01</text><rect x="30" y="205" width="620" height="70" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="228.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A male needs ONE copy, so male frequency = allele frequency q.</text><text x="340.0" y="252.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A female needs TWO copies, so she is affected with probability q × q.</text></svg>
