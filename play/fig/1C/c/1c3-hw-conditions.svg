<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Hardy–Weinberg: five conditions, each switching off one force</text><rect x="30" y="52" width="250" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="155.0" y="72.0" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Large population</text><path d="M290,72 L370,72" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="330.0" y="62.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">blocks</text><rect x="380" y="52" width="270" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="515.0" y="72.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">genetic drift</text><rect x="30" y="104" width="250" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="155.0" y="124.0" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Random mating</text><path d="M290,124 L370,124" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="330.0" y="114.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">blocks</text><rect x="380" y="104" width="270" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="515.0" y="124.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">inbreeding / assortative mating</text><rect x="30" y="156" width="250" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="155.0" y="176.0" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">No mutation</text><path d="M290,176 L370,176" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="330.0" y="166.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">blocks</text><rect x="380" y="156" width="270" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="515.0" y="176.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">new alleles appearing</text><rect x="30" y="208" width="250" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="155.0" y="228.0" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">No migration</text><path d="M290,228 L370,228" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="330.0" y="218.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">blocks</text><rect x="380" y="208" width="270" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="515.0" y="228.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">gene flow</text><rect x="30" y="260" width="250" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="155.0" y="280.0" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">No natural selection</text><path d="M290,280 L370,280" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="330.0" y="270.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">blocks</text><rect x="380" y="260" width="270" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="515.0" y="280.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">unequal reproductive success</text><rect x="30" y="322" width="620" height="90" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="340.0" y="375.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Equilibrium holds at ANY allele frequencies: p = 0.9, q = 0.1 is as stable as 0.5 / 0.5.</text><text x="340.0" y="397.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">What stays constant is p and q themselves, and genotypes stay at p², 2pq, q².</text></svg>
