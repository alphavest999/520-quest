<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Chain the independent steps: 2/3 × 1/4</text><rect x="65.0" y="55.0" width="30" height="30" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><rect x="65.0" y="55.0" width="15.0" height="30" fill="#1f2430"/><circle cx="180" cy="70" r="15.0" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><path d="M180,55.0 A15.0,15.0 0 0 0 180,85.0 Z" fill="#1f2430"/><polyline points="95.0,70 165.0,70" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="130.0,70 130.0,141.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="90,141.0 170,141.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="90,141.0 90,155.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="170,141.0 170,155.0" fill="none" stroke="#1f2430" stroke-width="2"/><rect x="75.0" y="155.0" width="30" height="30" fill="#1f2430" stroke="#1f2430" stroke-width="2"/><text x="90.0" y="199.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">brother</text><circle cx="170" cy="170" r="15.0" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><text x="170.0" y="171.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">?</text><text x="170.0" y="199.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">woman</text><rect x="275.0" y="155.0" width="30" height="30" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><rect x="275.0" y="155.0" width="15.0" height="30" fill="#1f2430"/><text x="290.0" y="199.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">known carrier</text><polyline points="185.0,170 275.0,170" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="230.0,170 230.0,251.0" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="230,251.0 230,265.0" fill="none" stroke="#1f2430" stroke-width="2"/><polygon points="230,262.75 247.25,280 230,297.25 212.75,280" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><text x="230.0" y="281.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">?</text><text x="230.0" y="309.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">child (sex not given)</text><rect x="360" y="50" width="300" height="66" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="510.0" y="74.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Step 1: woman is a carrier?</text><text x="510.0" y="91.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P = 2/3 (aa excluded)</text><rect x="360" y="130" width="300" height="66" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="510.0" y="154.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Step 2: if both parents are Aa,</text><text x="510.0" y="171.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P(child aa) = 1/4</text><rect x="360" y="210" width="300" height="46" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="510.0" y="233.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2/3 × 1/4 = 2/12 = 1/6</text><rect x="83.4" y="318" width="53.2" height="24" rx="12" fill="#1f9d63"/><text x="110.0" y="330.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ 1/6</text><rect x="376.4" y="278" width="187.1" height="24" rx="12" fill="#d6453d"/><text x="470.0" y="290.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 1/8: uses 1/2 for her</text><rect x="372.7" y="314" width="194.6" height="24" rx="12" fill="#d6453d"/><text x="470.0" y="326.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 1/4: assumes she is Aa</text><rect x="380.2" y="350" width="179.7" height="24" rx="12" fill="#d6453d"/><text x="470.0" y="362.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ 1/12: an extra × 1/2</text><text x="170.0" y="362.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">half-filled = carrier, ? = status unknown</text><text x="170.0" y="380.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">diamond = sex not specified</text></svg>
