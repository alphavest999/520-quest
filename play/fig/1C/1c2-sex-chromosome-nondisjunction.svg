<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Paternal sex-chromosome nondisjunction: meiosis I vs II</text><text x="170.0" y="56.0" font-size="15" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Error in meiosis I</text><circle cx="170" cy="105" r="30" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="170.0" y="105.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">XY</text><path d="M146.0,135 L90,160" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/><circle cx="90" cy="185" r="24" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="90.0" y="185.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">XY</text><path d="M90,210 L58,238" fill="none" stroke="#1f2430" stroke-width="1.3" marker-end="url(#ah)"/><circle cx="58" cy="262" r="22" fill="#fff" stroke="#8a93a3" stroke-width="1.5"/><text x="58.0" y="262.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">XY</text><path d="M90,210 L122,238" fill="none" stroke="#1f2430" stroke-width="1.3" marker-end="url(#ah)"/><circle cx="122" cy="262" r="22" fill="#fff" stroke="#8a93a3" stroke-width="1.5"/><text x="122.0" y="262.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">XY</text><path d="M194.0,135 L250,160" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/><circle cx="250" cy="185" r="24" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="250.0" y="185.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">∅</text><path d="M250,210 L218,238" fill="none" stroke="#1f2430" stroke-width="1.3" marker-end="url(#ah)"/><circle cx="218" cy="262" r="22" fill="#fff" stroke="#8a93a3" stroke-width="1.5"/><text x="218.0" y="262.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">∅</text><path d="M250,210 L282,238" fill="none" stroke="#1f2430" stroke-width="1.3" marker-end="url(#ah)"/><circle cx="282" cy="262" r="22" fill="#fff" stroke="#8a93a3" stroke-width="1.5"/><text x="282.0" y="262.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">∅</text><text x="58.0" y="302.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">+ X egg</text><text x="58.0" y="322.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">47,XXY</text><text x="122.0" y="302.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">+ X egg</text><text x="122.0" y="322.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">47,XXY</text><text x="218.0" y="302.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">+ X egg</text><text x="218.0" y="322.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">45,X</text><text x="282.0" y="302.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">+ X egg</text><text x="282.0" y="322.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">45,X</text><text x="510.0" y="56.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Error in meiosis II</text><circle cx="510" cy="105" r="30" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="510.0" y="105.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">XY</text><path d="M486.0,135 L430,160" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/><circle cx="430" cy="185" r="24" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="430.0" y="185.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">X</text><path d="M430,210 L398,238" fill="none" stroke="#1f2430" stroke-width="1.3" marker-end="url(#ah)"/><circle cx="398" cy="262" r="22" fill="#fff" stroke="#8a93a3" stroke-width="1.5"/><text x="398.0" y="262.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">XX</text><path d="M430,210 L462,238" fill="none" stroke="#1f2430" stroke-width="1.3" marker-end="url(#ah)"/><circle cx="462" cy="262" r="22" fill="#fff" stroke="#8a93a3" stroke-width="1.5"/><text x="462.0" y="262.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">∅</text><path d="M534.0,135 L590,160" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/><circle cx="590" cy="185" r="24" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="590.0" y="185.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Y</text><path d="M590,210 L558,238" fill="none" stroke="#1f2430" stroke-width="1.3" marker-end="url(#ah)"/><circle cx="558" cy="262" r="22" fill="#fff" stroke="#8a93a3" stroke-width="1.5"/><text x="558.0" y="262.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Y</text><path d="M590,210 L622,238" fill="none" stroke="#1f2430" stroke-width="1.3" marker-end="url(#ah)"/><circle cx="622" cy="262" r="22" fill="#fff" stroke="#8a93a3" stroke-width="1.5"/><text x="622.0" y="262.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Y</text><text x="398.0" y="302.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">+ X egg</text><text x="398.0" y="322.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">47,XXX</text><text x="462.0" y="302.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">+ X egg</text><text x="462.0" y="322.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">45,X</text><text x="558.0" y="302.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">+ X egg</text><text x="558.0" y="322.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">46,XY</text><text x="622.0" y="302.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">+ X egg</text><text x="622.0" y="322.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">46,XY</text><polyline points="340,45 340,340" fill="none" stroke="#8a93a3" stroke-width="1" stroke-dasharray="6 4"/><text x="510.0" y="350.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(error shown in the X-bearing cell; if the Y cell</text><text x="510.0" y="366.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">fails instead, YY sperm give 47,XYY)</text><rect x="102.5" y="353" width="135.0" height="24" rx="12" fill="#1f9d63"/><text x="170.0" y="365.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ 47,XXY or 45,X</text><rect x="368.1" y="388" width="283.8" height="24" rx="12" fill="#d6453d"/><text x="510.0" y="400.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ XXX or XYY need a meiosis II error</text><text x="170.0" y="400.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">∅ = no sex chromosome</text></svg>
