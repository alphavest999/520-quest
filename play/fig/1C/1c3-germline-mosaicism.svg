<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Germline mosaicism: a mutation confined to part of one parent&#x27;s germline</text><text x="24.0" y="80.0" font-size="15" font-weight="700" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">I</text><text x="24.0" y="200.0" font-size="15" font-weight="700" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">II</text><rect x="123.0" y="63.0" width="34" height="34" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><text x="140.0" y="110.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">body cells: dd</text><circle cx="260" cy="80" r="17.0" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><text x="260.0" y="110.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">dd</text><polyline points="157.0,80 243.0,80" fill="none" stroke="#1f2430" stroke-width="1.8"/><circle cx="110" cy="200" r="17.0" fill="#1f2430" stroke="#1f2430" stroke-width="2"/><text x="110.0" y="230.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Dd</text><rect x="183.0" y="183.0" width="34" height="34" fill="#ffffff" stroke="#1f2430" stroke-width="2"/><text x="200.0" y="230.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">dd</text><rect x="273.0" y="183.0" width="34" height="34" fill="#1f2430" stroke="#1f2430" stroke-width="2"/><text x="290.0" y="230.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Dd</text><polyline points="200.0,80 200.0,167.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><polyline points="110,167.0 290,167.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><polyline points="110,167.0 110,183.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><polyline points="200,167.0 200,183.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><polyline points="290,167.0 290,183.0" fill="none" stroke="#1f2430" stroke-width="1.8"/><ellipse cx="500" cy="150" rx="110" ry="75" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><path d="M500,150 L610,150 A110,75 0 0,0 555,85 Z" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="460.0" y="164.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">normal germ cells</text><text x="460.0" y="179.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(d sperm)</text><text x="562.0" y="120.5" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">mutant</text><text x="562.0" y="135.5" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">clone</text><text x="500.0" y="58.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Father&#x27;s gonad (schematic)</text><text x="200.0" y="250.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">d = normal allele, D = dominant disease allele</text><circle cx="420" cy="270" r="13" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="420.0" y="270.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">d</text><circle cx="460" cy="270" r="13" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="460.0" y="270.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">d</text><circle cx="500" cy="270" r="13" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="500.0" y="270.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">D</text><circle cx="540" cy="270" r="13" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="540.0" y="270.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">d</text><circle cx="580" cy="270" r="13" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="580.0" y="270.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">D</text><text x="500.0" y="298.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">sperm: some carry the new dominant allele D</text><text x="340.0" y="340.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Blood and other body cells test normal, yet several children can inherit the mutation.</text><rect x="47.6" y="368" width="164.8" height="24" rx="12" fill="#1f9d63"/><text x="130.0" y="380.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✓ germline mosaicism</text><rect x="276.7" y="368" width="246.6" height="24" rx="12" fill="#d6453d"/><text x="400.0" y="380.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ two independent new mutations</text><rect x="47.6" y="408" width="164.8" height="24" rx="12" fill="#d6453d"/><text x="130.0" y="420.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ recessive carriers</text><rect x="261.8" y="408" width="276.4" height="24" rx="12" fill="#d6453d"/><text x="400.0" y="420.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">✗ incomplete penetrance in children</text></svg>
