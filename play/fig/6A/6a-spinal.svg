<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Two ascending pathways cross at different levels</text><rect x="30" y="46" width="290" height="34" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="175.0" y="63.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Dorsal column–medial lemniscus</text><text x="175.0" y="104.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">fine touch, vibration, proprioception</text><text x="175.0" y="126.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ascends on the SAME side</text><text x="175.0" y="148.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">crosses in the medulla</text><rect x="360" y="46" width="290" height="34" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="505.0" y="63.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Spinothalamic tract</text><text x="505.0" y="104.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">pain and temperature</text><text x="505.0" y="126.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">crosses within 1–2 segments</text><text x="505.0" y="148.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ascends on the OPPOSITE side</text><ellipse cx="340" cy="270" rx="110" ry="62" fill="#f1f3f6" stroke="#1f2430" stroke-width="1.5"/><line x1="340" y1="208" x2="340" y2="332" stroke="#8a93a3" stroke-dasharray="4 3"/><rect x="348" y="210" width="100" height="120" fill="#d6453d" opacity="0.18"/><text x="285.0" y="198.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">left</text><text x="395.0" y="198.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">right</text><text x="398.0" y="275.0" font-size="12" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">lesion</text><text x="110.0" y="260.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">RIGHT side below lesion:</text><text x="110.0" y="282.0" font-size="11.5" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">loses fine touch/vibration</text><text x="575.0" y="260.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">LEFT side below lesion:</text><text x="575.0" y="282.0" font-size="11.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">loses pain/temperature</text><text x="340.0" y="362.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Right hemisection (Brown-Séquard pattern)</text></svg>
