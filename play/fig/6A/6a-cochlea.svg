<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The cochlea maps frequency to place (tonotopy)</text><path d="M60,120 L600,150 L600,190 L60,230 Z" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><path d="M60,168 L600,168" stroke="#7a4cd9" stroke-width="4"/><text x="330.0" y="108.0" font-size="11.5" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">basilar membrane (cochlea shown unrolled)</text><text x="60.0" y="255.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">BASE (near oval window)</text><text x="600.0" y="255.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">APEX</text><text x="60.0" y="276.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">narrow, stiff → HIGH frequencies (20 kHz)</text><text x="600.0" y="276.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="end" dominant-baseline="middle">wide, floppy → LOW (20 Hz)</text><text x="60.0" y="300.0" font-size="11" font-weight="400" fill="#d6453d" text-anchor="start" dominant-baseline="middle">noise damage hits here first → high-frequency loss</text><text x="600.0" y="300.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">implant electrodes follow the same map</text><rect x="170" y="40" width="340" height="46" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="340.0" y="63.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Hair cells: stereocilia bend → K⁺ enters from endolymph → depolarize</text></svg>
