<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="350.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Elaboration likelihood model (Petty &amp; Cacioppo)</text><rect x="20" y="140" width="150" height="60" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="95.0" y="162.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">persuasive</text><text x="95.0" y="177.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">message</text><rect x="220" y="130" width="170" height="80" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="305.0" y="149.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">MOTIVATION</text><text x="305.0" y="163.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(personal relevance)</text><text x="305.0" y="176.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">AND ABILITY</text><text x="305.0" y="190.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(no distraction)?</text><path d="M170,170 L218,170" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="450" y="50" width="230" height="90" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="565.0" y="73.4" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CENTRAL ROUTE</text><text x="565.0" y="87.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">weighs argument quality</text><text x="565.0" y="102.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ lasting, behavior-</text><text x="565.0" y="116.6" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">predicting attitude</text><rect x="450" y="200" width="230" height="90" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="565.0" y="223.4" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PERIPHERAL ROUTE</text><text x="565.0" y="237.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">uses cues: attractiveness,</text><text x="565.0" y="252.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">expertise, number of args</text><text x="565.0" y="266.6" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ weak, short-lived change</text><path d="M390,150 L448,100" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M390,190 L448,240" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="415.0" y="112.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">yes</text><text x="415.0" y="235.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">no</text><text x="350.0" y="320.0" font-size="10.2" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">A source cue counts as a central argument only when it is relevant to the claim (e.g., beauty for a beauty product).</text></svg>
