<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="400.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Classical conditioning (Pavlov)</text><text x="55.0" y="90.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">BEFORE</text><rect x="110" y="60" width="210" height="50" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="215.0" y="85.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">food (UCS)</text><path d="M325,85 L395,85" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="400" y="60" width="170" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="485.0" y="85.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">salivation (UCR)</text><text x="690.0" y="90.0" font-size="10.2" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">bell (NS) → no salivation</text><text x="55.0" y="170.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DURING</text><rect x="110" y="140" width="210" height="50" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="215.0" y="165.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bell (NS) + food (UCS)</text><path d="M325,165 L395,165" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="400" y="140" width="170" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="485.0" y="165.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">salivation (UCR)</text><text x="690.0" y="170.0" font-size="10.2" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">repeated pairings</text><text x="55.0" y="250.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">AFTER</text><rect x="110" y="220" width="210" height="50" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="215.0" y="245.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bell (CS)</text><path d="M325,245 L395,245" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="400" y="220" width="170" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="485.0" y="245.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">salivation (CR)</text><text x="690.0" y="250.0" font-size="10.2" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">bell alone now triggers it</text><text x="400.0" y="310.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Clinic cues before chemo → nausea and drug-setting cues → compensatory responses work the same way.</text></svg>
