<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="380.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Social mobility</text><rect x="20" y="55" width="230" height="110" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="135.0" y="95.6" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">VERTICAL vs HORIZONTAL</text><text x="135.0" y="110.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">up/down in rank</text><text x="135.0" y="124.4" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">vs same rank, new job</text><rect x="265" y="55" width="230" height="110" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="380.0" y="88.4" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">INTERGENERATIONAL vs</text><text x="380.0" y="102.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">INTRAGENERATIONAL</text><text x="380.0" y="117.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">child vs parent</text><text x="380.0" y="131.6" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">vs within one career</text><rect x="510" y="55" width="230" height="110" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="625.0" y="82.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">STRUCTURAL vs EXCHANGE</text><text x="625.0" y="96.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">economy changes the jobs</text><text x="625.0" y="110.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(farm → factory)</text><text x="625.0" y="123.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">vs equal rises and falls</text><text x="625.0" y="137.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">in a fixed structure</text><rect x="110" y="190" width="540" height="75" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="380.0" y="220.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Openness: a strong parent–child earnings correlation (high intergenerational</text><text x="380.0" y="234.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">elasticity) = LOW mobility. More unequal countries tend to show less mobility.</text><text x="380.0" y="300.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Factory worker&#x27;s child becomes a surgeon = upward, intergenerational, vertical mobility.</text></svg>
