<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="380.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Stratification: Marx vs Weber</text><rect x="20" y="55" width="340" height="190" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="190.0" y="102.8" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">MARX: class = relation to the means of production</text><text x="190.0" y="116.2" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bourgeoisie (owners) vs proletariat (workers)</text><text x="190.0" y="129.8" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="190.0" y="143.2" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">class IN itself → class FOR itself</text><text x="190.0" y="156.8" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(needs class consciousness)</text><text x="190.0" y="170.2" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">false consciousness: workers hold beliefs</text><text x="190.0" y="183.8" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">that serve owners; ideology justifies inequality</text><text x="190.0" y="197.2" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">alienation from labor, product, others, self</text><rect x="400" y="55" width="340" height="190" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="570.0" y="102.8" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">WEBER: three dimensions</text><text x="570.0" y="116.2" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CLASS (economic position)</text><text x="570.0" y="129.8" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">STATUS (prestige, honor)</text><text x="570.0" y="143.2" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PARTY / POWER (political influence)</text><text x="570.0" y="156.8" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="570.0" y="170.2" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">status inconsistency: high on one,</text><text x="570.0" y="183.8" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">low on another (clergy: high prestige,</text><text x="570.0" y="197.2" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">low income)</text><text x="380.0" y="280.0" font-size="10" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Davis–Moore (functionalist): important, hard-to-fill jobs earn more; critics note vital low-paid jobs and inherited wealth.</text></svg>
