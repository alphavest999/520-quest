<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="380.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Forms of capital (Bourdieu) and social networks</text><rect x="20" y="55" width="170" height="120" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="105.0" y="100.6" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ECONOMIC</text><text x="105.0" y="115.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">money, property,</text><text x="105.0" y="129.4" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">wealth</text><rect x="205" y="55" width="330" height="120" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="370.0" y="94.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CULTURAL</text><text x="370.0" y="108.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">embodied: tastes, accent, manners</text><text x="370.0" y="121.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">objectified: books, art, instruments</text><text x="370.0" y="135.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">institutionalized: degrees, credentials</text><rect x="550" y="55" width="190" height="120" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="645.0" y="94.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SOCIAL</text><text x="645.0" y="108.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">networks and ties</text><text x="645.0" y="121.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bonding: within group</text><text x="645.0" y="135.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bridging: across groups</text><rect x="90" y="200" width="580" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="380.0" y="228.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Social reproduction: schools reward upper-class cultural capital as &#x27;merit&#x27;,</text><text x="380.0" y="241.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">so class position passes from parents to children.</text><text x="380.0" y="300.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Strength of weak ties (Granovetter): acquaintances bridge to new circles and new job news.</text></svg>
