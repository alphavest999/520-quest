<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="370.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SES and health: which way does the arrow run?</text><rect x="40" y="90" width="200" height="70" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="140.0" y="117.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">LOW SES</text><text x="140.0" y="132.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(income, education)</text><rect x="500" y="90" width="200" height="70" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="600.0" y="125.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">POOR HEALTH</text><path d="M242,110 L498,110" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M498,145 L242,145" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="370.0" y="98.0" font-size="10.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">social causation: stress, exposures, care access</text><text x="370.0" y="168.0" font-size="10.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">health selection / drift: illness → job loss → lower income</text><rect x="110" y="200" width="520" height="60" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="370.0" y="223.2" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fundamental cause theory: money, knowledge, power and connections keep SES</text><text x="370.0" y="236.8" font-size="10.8" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">linked to death even as the specific causes of death change. Test causation by randomizing income.</text></svg>
