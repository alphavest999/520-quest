<text x="130.0" y="215.0" font-size="11.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2,3-dibromobutane (2R,3S)</text><text x="430.0" y="90.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">two stereocenters, but an internal</text><text x="430.0" y="110.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">mirror plane maps one half onto the other</text><text x="430.0" y="145.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ achiral, optically inactive</text><text x="430.0" y="170.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(2R,3S) and (2S,3R) are the SAME molecule</text><text x="430.0" y="205.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(2R,3R) and (2S,3S) are a chiral pair</text></svg>
