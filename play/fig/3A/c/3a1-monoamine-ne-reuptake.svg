<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah3a1_1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Norepinephrine is cleared mainly by reuptake (NET)</text><path d="M40,50 L40,190 Q40,220 70,220 L330,220 Q360,220 360,190 L360,50" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2.2"/><text x="200.0" y="64.0" font-size="12.5" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">presynaptic terminal</text><text x="60.0" y="92.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">tyrosine → L-DOPA → dopamine → NE</text><circle cx="120" cy="140" r="15" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.6"/><circle cx="115" cy="137" r="2.3" fill="#1f9d63"/><circle cx="124" cy="136" r="2.3" fill="#1f9d63"/><circle cx="120" cy="145" r="2.3" fill="#1f9d63"/><circle cx="126" cy="144" r="2.3" fill="#1f9d63"/><circle cx="165" cy="128" r="15" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.6"/><circle cx="160" cy="125" r="2.3" fill="#1f9d63"/><circle cx="169" cy="124" r="2.3" fill="#1f9d63"/><circle cx="165" cy="133" r="2.3" fill="#1f9d63"/><circle cx="171" cy="132" r="2.3" fill="#1f9d63"/><circle cx="210" cy="146" r="15" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.6"/><circle cx="205" cy="143" r="2.3" fill="#1f9d63"/><circle cx="214" cy="142" r="2.3" fill="#1f9d63"/><circle cx="210" cy="151" r="2.3" fill="#1f9d63"/><circle cx="216" cy="150" r="2.3" fill="#1f9d63"/><ellipse cx="285" cy="140" rx="42" ry="20" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="285.0" y="140.0" font-size="12.5" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">MAO</text><text x="285.0" y="164.8" font-size="11.5" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">on mitochondria,</text><text x="285.0" y="179.2" font-size="11.5" font-weight="400" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">inside the neuron</text><rect x="300" y="205" width="22" height="30" rx="5" fill="#138f9a" stroke="#138f9a" stroke-width="1.5"/><text x="294.0" y="248.0" font-size="11.5" font-weight="700" fill="#138f9a" text-anchor="end" dominant-baseline="middle">NET</text><path d="M318,272 Q300.5,228.1 311,182" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah3a1_1f2430)"/><text x="330.0" y="284.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">reuptake</text><circle cx="150" cy="252" r="3" fill="#1f9d63"/><circle cx="175" cy="262" r="3" fill="#1f9d63"/><circle cx="200" cy="250" r="3" fill="#1f9d63"/><circle cx="225" cy="266" r="3" fill="#1f9d63"/><circle cx="250" cy="255" r="3" fill="#1f9d63"/><circle cx="270" cy="268" r="3" fill="#1f9d63"/><circle cx="160" cy="274" r="3" fill="#1f9d63"/><circle cx="210" cy="278" r="3" fill="#1f9d63"/><text x="80.0" y="262.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">cleft</text><path d="M40,310 L360,310 L360,380 L40,380 Z" fill="#e6eefc" stroke="#2f6fdb" stroke-width="2"/><text x="200.0" y="355.0" font-size="12.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">postsynaptic neuron</text><rect x="101" y="298" width="18" height="22" rx="4" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><rect x="151" y="298" width="18" height="22" rx="4" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><rect x="201" y="298" width="18" height="22" rx="4" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><rect x="251" y="298" width="18" height="22" rx="4" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="200.0" y="396.0" font-size="11.5" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">blue = adrenergic receptors</text><text x="390.0" y="70.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">How NE signaling ends</text><text x="390.0" y="140.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Most released NE is carried back into the</text><text x="390.0" y="156.2" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">terminal, repackaged or broken down</text><text x="390.0" y="172.4" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">by MAO; some is degraded by COMT.</text></svg>
