<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The posterior pituitary is made of hypothalamic axon terminals</text><ellipse cx="350" cy="135" rx="230" ry="62" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><path d="M318,192 C322,240 326,270 322,306 L382,306 C378,270 380,240 384,192" fill="#fdf1db" stroke="#d98a00" stroke-width="1.8"/><ellipse cx="245" cy="368" rx="112" ry="72" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><ellipse cx="437" cy="362" rx="82" ry="62" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="350.0" y="90.0" font-size="13" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">HYPOTHALAMUS</text><text x="240.0" y="400.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">ANTERIOR PITUITARY</text><text x="240.0" y="416.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">(gland tissue)</text><text x="437.0" y="392.0" font-size="12.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">POSTERIOR</text><text x="437.0" y="408.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">PITUITARY (neural)</text><circle cx="430" cy="125" r="9" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><path d="M426,134 C395,190 366.0,240 372.0,290 S420,340 432.0,350" fill="none" stroke="#2f6fdb" stroke-width="3.2"/><circle cx="432.0" cy="352" r="5" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="446" cy="133" r="9" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><path d="M442,142 C411,190 374.0,240 380.0,290 S436,340 454.4,358" fill="none" stroke="#2f6fdb" stroke-width="3.2"/><circle cx="454.4" cy="360" r="5" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="505.0" y="122.0" font-size="12.5" font-weight="700" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">SON / PVN</text><text x="505.0" y="138.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">neurons</text><circle cx="255" cy="132" r="9" fill="#7a4cd9" stroke="#7a4cd9" stroke-width="1.5"/><path d="M262,139 C300,170 320,185 332,205" fill="none" stroke="#7a4cd9" stroke-width="2"/><path d="M326,212 q6,-10 12,0 t12,0 M326,220 q6,-10 12,0 t12,0" fill="none" stroke="#d6453d" stroke-width="2"/><path d="M334,224 C334,280 300,310 268,338" fill="none" stroke="#d6453d" stroke-width="2"/><path d="M346,224 C346,285 310,320 280,346" fill="none" stroke="#d6453d" stroke-width="2"/><path d="M240,350 q8,-10 16,0 t16,0 t16,0 M240,362 q8,-10 16,0 t16,0 t16,0" fill="none" stroke="#d6453d" stroke-width="2"/><text x="185.0" y="118.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="end" dominant-baseline="middle">releasing-hormone</text><text x="185.0" y="134.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="end" dominant-baseline="middle">neurons</text><text x="350.0" y="470.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Anterior lobe: its own gland cells make ACTH, TSH, LH, FSH, GH and prolactin (portal link).</text><text x="350.0" y="488.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Posterior lobe: no hormone-making cells; it releases ADH and oxytocin made in hypothalamic nuclei.</text></svg>
