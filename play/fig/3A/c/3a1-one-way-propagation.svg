<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah3a1_1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah3a1_5b6474" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker><marker id="ah3a1_7a4cd9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Why the spike moves only forward (unmyelinated axon)</text><rect x="30" y="150" width="200" height="60" rx="0" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="130.0" y="110.2" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">REFRACTORY</text><text x="130.0" y="125.8" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Na⁺ channels inactivated</text><rect x="230" y="150" width="100" height="60" rx="0" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="280.0" y="110.2" font-size="12.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">ACTIVE</text><text x="280.0" y="125.8" font-size="12.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Na⁺ rushing in</text><rect x="330" y="150" width="320" height="60" rx="0" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="490.0" y="110.2" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">RESTING, ready to fire</text><text x="490.0" y="125.8" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">(being depolarized by local current)</text><text x="30.0" y="145.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="240.0" y="162.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">+</text><text x="240.0" y="200.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">+</text><text x="258.0" y="162.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">+</text><text x="258.0" y="200.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">+</text><text x="276.0" y="162.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">+</text><text x="276.0" y="200.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">+</text><text x="294.0" y="162.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">+</text><text x="294.0" y="200.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">+</text><text x="312.0" y="162.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">+</text><text x="312.0" y="200.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">+</text><path d="M280,180 L420,180" fill="none" stroke="#1f2430" stroke-width="2.2" marker-end="url(#ah3a1_1f2430)"/><text x="400.0" y="166.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">local current</text><path d="M280,190 L160,190" fill="none" stroke="#5b6474" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah3a1_5b6474)"/><text x="160.0" y="176.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">local current</text><polyline points="110,180 130,200" fill="none" stroke="#d6453d" stroke-width="3.5"/><polyline points="110,200 130,180" fill="none" stroke="#d6453d" stroke-width="3.5"/><text x="120.0" y="232.5" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">spreads back too, but cannot</text><text x="120.0" y="247.5" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">reopen inactivated channels</text><text x="470.0" y="240.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">reaches threshold → new spike</text><path d="M250,290 L450,290" fill="none" stroke="#7a4cd9" stroke-width="3" marker-end="url(#ah3a1_7a4cd9)"/><text x="350.0" y="308.0" font-size="13" font-weight="600" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">direction of propagation: hillock → terminal</text></svg>
