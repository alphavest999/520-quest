<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah3a1_1f9d63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="ah3a1_2f6fdb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">One transmitter, two receptors, opposite effects</text><rect x="240" y="46" width="200" height="44" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="340.0" y="68.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">acetylcholine (ACh)</text><rect x="30" y="130" width="280" height="46" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="170.0" y="145.2" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">skeletal muscle: NICOTINIC receptor</text><text x="170.0" y="160.8" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(ligand-gated cation channel)</text><rect x="30" y="200" width="280" height="44" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="170.0" y="222.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Na⁺ flows in → depolarization</text><rect x="30" y="266" width="280" height="44" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="170.0" y="288.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">muscle action potential → contraction</text><rect x="370" y="130" width="280" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="510.0" y="145.2" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SA node: M2 MUSCARINIC receptor</text><text x="510.0" y="160.8" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(G-protein-coupled, Gᵢ)</text><rect x="370" y="200" width="280" height="44" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="510.0" y="222.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">K⁺ channels open → hyperpolarization</text><rect x="370" y="266" width="280" height="44" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="510.0" y="288.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">slower firing → heart rate falls</text><path d="M340.0,90 L170.0,130" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah3a1_1f9d63)"/><path d="M340.0,90 L510.0,130" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah3a1_2f6fdb)"/><path d="M170.0,176 L170.0,200" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah3a1_1f9d63)"/><path d="M170.0,244 L170.0,266" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah3a1_1f9d63)"/><path d="M510.0,176 L510.0,200" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah3a1_2f6fdb)"/><path d="M510.0,244 L510.0,266" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah3a1_2f6fdb)"/><text x="170.0" y="330.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">EXCITES</text><text x="510.0" y="330.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">INHIBITS</text><text x="340.0" y="400.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ACh is not converted to NE, AChE amount changes only duration, resting Vm is not the cause.</text></svg>
