<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah3a1_2f6fdb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ah3a1_5b6474" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Curare: competitive block of nicotinic receptors</text><path d="M60,60 L60,170 Q60,200 90,200 L250,200 Q280,200 280,170 L280,60" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2.2"/><text x="170.0" y="72.0" font-size="12.5" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">motor neuron terminal</text><circle cx="110" cy="110" r="13" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.6"/><circle cx="106" cy="107" r="2.2" fill="#1f9d63"/><circle cx="113" cy="108" r="2.2" fill="#1f9d63"/><circle cx="110" cy="114" r="2.2" fill="#1f9d63"/><circle cx="150" cy="100" r="13" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.6"/><circle cx="146" cy="97" r="2.2" fill="#1f9d63"/><circle cx="153" cy="98" r="2.2" fill="#1f9d63"/><circle cx="150" cy="104" r="2.2" fill="#1f9d63"/><circle cx="195" cy="112" r="13" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.6"/><circle cx="191" cy="109" r="2.2" fill="#1f9d63"/><circle cx="198" cy="110" r="2.2" fill="#1f9d63"/><circle cx="195" cy="116" r="2.2" fill="#1f9d63"/><circle cx="235" cy="104" r="13" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.6"/><circle cx="231" cy="101" r="2.2" fill="#1f9d63"/><circle cx="238" cy="102" r="2.2" fill="#1f9d63"/><circle cx="235" cy="108" r="2.2" fill="#1f9d63"/><circle cx="130" cy="150" r="13" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.6"/><circle cx="126" cy="147" r="2.2" fill="#1f9d63"/><circle cx="133" cy="148" r="2.2" fill="#1f9d63"/><circle cx="130" cy="154" r="2.2" fill="#1f9d63"/><circle cx="175" cy="148" r="13" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.6"/><circle cx="171" cy="145" r="2.2" fill="#1f9d63"/><circle cx="178" cy="146" r="2.2" fill="#1f9d63"/><circle cx="175" cy="152" r="2.2" fill="#1f9d63"/><circle cx="220" cy="152" r="13" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.6"/><circle cx="216" cy="149" r="2.2" fill="#1f9d63"/><circle cx="223" cy="150" r="2.2" fill="#1f9d63"/><circle cx="220" cy="156" r="2.2" fill="#1f9d63"/><path d="M152,200 Q152,182 170,182 Q188,182 188,200" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.6"/><circle cx="165" cy="207" r="2.2" fill="#1f9d63"/><circle cx="172" cy="215" r="2.2" fill="#1f9d63"/><circle cx="180" cy="210" r="2.2" fill="#1f9d63"/><circle cx="168" cy="224" r="2.2" fill="#1f9d63"/><circle cx="186" cy="226" r="2.2" fill="#1f9d63"/><circle cx="158" cy="218" r="2.2" fill="#1f9d63"/><rect x="92" y="190" width="16" height="20" rx="3" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="100.0" y="236.0" font-size="11.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Ca²⁺</text><rect x="232" y="190" width="16" height="20" rx="3" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="240.0" y="236.0" font-size="11.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Ca²⁺</text><path d="M100,222 L100,182" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah3a1_2f6fdb)"/><path d="M240,222 L240,182" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah3a1_2f6fdb)"/><text x="170.0" y="258.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">synaptic cleft (with AChE)</text><path d="M40,285 L300,285 L300,350 L40,350 Z" fill="#fbe7e5" stroke="#d6453d" stroke-width="2"/><text x="170.0" y="330.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">muscle fiber (motor end plate)</text><rect x="81" y="275" width="18" height="20" rx="4" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><rect x="121" y="275" width="18" height="20" rx="4" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><rect x="161" y="275" width="18" height="20" rx="4" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><rect x="201" y="275" width="18" height="20" rx="4" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><rect x="241" y="275" width="18" height="20" rx="4" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="330.0" y="285.0" font-size="1" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="170.0" y="366.0" font-size="11.5" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">green blocks = nicotinic ACh receptors</text><rect x="340" y="46" width="320" height="47" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.2"/><text x="352.0" y="69.5" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">1  Action potential reaches the terminal</text><path d="M500,93 L500,101" fill="none" stroke="#5b6474" stroke-width="1.4" marker-end="url(#ah3a1_5b6474)"/><rect x="340" y="101" width="320" height="47" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.2"/><text x="352.0" y="116.7" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">2  Voltage-gated Ca²⁺ channels open;</text><text x="352.0" y="132.3" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">    Ca²⁺ flows IN</text><path d="M500,148 L500,156" fill="none" stroke="#5b6474" stroke-width="1.4" marker-end="url(#ah3a1_5b6474)"/><rect x="340" y="156" width="320" height="47" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.2"/><text x="352.0" y="171.7" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">3  Ca²⁺ triggers SNARE-driven</text><text x="352.0" y="187.3" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">    vesicle fusion: ACh released</text><path d="M500,203 L500,211" fill="none" stroke="#5b6474" stroke-width="1.4" marker-end="url(#ah3a1_5b6474)"/><rect x="340" y="211" width="320" height="47" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="2.2"/><text x="352.0" y="226.7" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">4  ACh binds nicotinic receptors</text><text x="352.0" y="242.3" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">    (ligand-gated cation channels)</text><path d="M500,258 L500,266" fill="none" stroke="#5b6474" stroke-width="1.4" marker-end="url(#ah3a1_5b6474)"/><polyline points="630,224.5 650,244.5" fill="none" stroke="#d6453d" stroke-width="3.5"/><polyline points="630,244.5 650,224.5" fill="none" stroke="#d6453d" stroke-width="3.5"/><rect x="340" y="266" width="320" height="47" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.2"/><text x="352.0" y="281.7" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">5  Na⁺ in → end-plate potential →</text><text x="352.0" y="297.3" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">    muscle action potential → contraction</text><path d="M500,313 L500,321" fill="none" stroke="#5b6474" stroke-width="1.4" marker-end="url(#ah3a1_5b6474)"/><rect x="340" y="321" width="320" height="47" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.2"/><text x="352.0" y="336.7" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">6  Acetylcholinesterase splits ACh</text><text x="352.0" y="352.3" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">    in the cleft → signal ends</text><text x="650.0" y="216.0" font-size="1" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="20.0" y="410.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Curare-like drugs occupy the ACh site on nicotinic receptors without opening them.</text><text x="20.0" y="430.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">ACh is still released, but the end plate cannot depolarize enough → paralysis.</text></svg>
