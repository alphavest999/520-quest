<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah3a1_1f9d63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">How vagal acetylcholine slows the SA node</text><rect x="20" y="50" width="150" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="95.0" y="67.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">vagus nerve</text><text x="95.0" y="82.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(parasympathetic)</text><rect x="200" y="50" width="140" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="270.0" y="75.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">releases ACh</text><rect x="370" y="50" width="290" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="515.0" y="67.2" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">M2 muscarinic receptor (GPCR)</text><text x="515.0" y="82.8" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">on SA node pacemaker cells</text><rect x="370" y="125" width="290" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="515.0" y="142.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gᵢ: βγ opens K⁺ channels (GIRK);</text><text x="515.0" y="157.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">αᵢ lowers cAMP</text><rect x="370" y="200" width="290" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="515.0" y="217.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">K⁺ leaves, cell hyperpolarizes;</text><text x="515.0" y="232.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">slower pacemaker depolarization</text><rect x="370" y="275" width="290" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="515.0" y="295.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">heart rate falls</text><path d="M170,75.0 L200,75.0" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah3a1_1f9d63)"/><path d="M340,75.0 L370,75.0" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah3a1_1f9d63)"/><path d="M515.0,100 L515.0,125" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah3a1_1f9d63)"/><path d="M515.0,175 L515.0,200" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah3a1_1f9d63)"/><path d="M515.0,250 L515.0,275" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah3a1_1f9d63)"/><rect x="20" y="135" width="320" height="45" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="180.0" y="157.5" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">✗ nicotinic: ganglia and NMJ, not SA node cells</text><rect x="20" y="195" width="320" height="45" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="180.0" y="217.5" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">✗ β1-adrenergic: NE → Gs → ↑cAMP → faster</text><rect x="20" y="255" width="320" height="45" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="180.0" y="277.5" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">✗ α1-adrenergic: vessel constriction</text><text x="340.0" y="350.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Same transmitter, different receptor: at the SA node ACh acts through a G protein,</text><text x="340.0" y="370.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">so its effect starts more slowly and lasts longer than at the neuromuscular junction.</text></svg>
