<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah3a1_2f6fdb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Saltatory conduction: the spike is regenerated only at nodes</text><polyline points="40,200 640,200" fill="none" stroke="#7a4cd9" stroke-width="8"/><rect x="50" y="178" width="110" height="44" rx="18" fill="#fdf1db" stroke="#d98a00" stroke-width="2"/><rect x="178" y="178" width="110" height="44" rx="18" fill="#fdf1db" stroke="#d98a00" stroke-width="2"/><rect x="306" y="178" width="110" height="44" rx="18" fill="#fdf1db" stroke="#d98a00" stroke-width="2"/><rect x="434" y="178" width="110" height="44" rx="18" fill="#fdf1db" stroke="#d98a00" stroke-width="2"/><text x="105.0" y="200.0" font-size="12" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">myelin (internode)</text><circle cx="165" cy="192" r="2.2" fill="#2f6fdb"/><circle cx="173" cy="196" r="2.2" fill="#2f6fdb"/><circle cx="165" cy="200" r="2.2" fill="#2f6fdb"/><circle cx="173" cy="204" r="2.2" fill="#2f6fdb"/><circle cx="165" cy="208" r="2.2" fill="#2f6fdb"/><text x="169.0" y="240.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">node</text><circle cx="293" cy="192" r="2.2" fill="#2f6fdb"/><circle cx="301" cy="196" r="2.2" fill="#2f6fdb"/><circle cx="293" cy="200" r="2.2" fill="#2f6fdb"/><circle cx="301" cy="204" r="2.2" fill="#2f6fdb"/><circle cx="293" cy="208" r="2.2" fill="#2f6fdb"/><text x="297.0" y="240.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">node</text><circle cx="297" cy="200" r="15" fill="none" stroke="#d6453d" stroke-width="3"/><text x="297.0" y="130.2" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">spike firing</text><text x="297.0" y="145.8" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">here now</text><circle cx="421" cy="192" r="2.2" fill="#2f6fdb"/><circle cx="429" cy="196" r="2.2" fill="#2f6fdb"/><circle cx="421" cy="200" r="2.2" fill="#2f6fdb"/><circle cx="429" cy="204" r="2.2" fill="#2f6fdb"/><circle cx="421" cy="208" r="2.2" fill="#2f6fdb"/><text x="425.0" y="240.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">node</text><circle cx="549" cy="192" r="2.2" fill="#2f6fdb"/><circle cx="557" cy="196" r="2.2" fill="#2f6fdb"/><circle cx="549" cy="200" r="2.2" fill="#2f6fdb"/><circle cx="557" cy="204" r="2.2" fill="#2f6fdb"/><circle cx="549" cy="208" r="2.2" fill="#2f6fdb"/><text x="553.0" y="240.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">node</text><path d="M175,170 Q233.0,135.0 291,170" fill="none" stroke="#2f6fdb" stroke-width="2" marker-end="url(#ah3a1_2f6fdb)"/><path d="M303,170 Q361.0,135.0 419,170" fill="none" stroke="#2f6fdb" stroke-width="2" marker-end="url(#ah3a1_2f6fdb)"/><path d="M431,170 Q489.0,135.0 547,170" fill="none" stroke="#2f6fdb" stroke-width="2" marker-end="url(#ah3a1_2f6fdb)"/><text x="445.0" y="80.5" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">depolarizing current jumps</text><text x="445.0" y="95.5" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">fast under the myelin</text><text x="340.0" y="270.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Na⁺ channels (dots) are packed at nodes and nearly absent under myelin,</text><text x="340.0" y="290.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">so the action potential is rebuilt node to node. Between nodes, current spreads passively.</text></svg>
