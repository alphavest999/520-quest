<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah3a1_1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Electrical vs chemical synapses</text><text x="170.0" y="56.0" font-size="14" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">Electrical (gap junction)</text><rect x="30" y="80" width="130" height="150" rx="14" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><rect x="182" y="80" width="130" height="150" rx="14" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><rect x="154" y="96" width="34" height="18" rx="6" fill="#138f9a" stroke="#138f9a" stroke-width="1.5"/><path d="M120,105 L225,105" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah3a1_1f2430)" marker-start="url(#ah3a1_1f2430)"/><rect x="154" y="131" width="34" height="18" rx="6" fill="#138f9a" stroke="#138f9a" stroke-width="1.5"/><path d="M120,140 L225,140" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah3a1_1f2430)" marker-start="url(#ah3a1_1f2430)"/><rect x="154" y="166" width="34" height="18" rx="6" fill="#138f9a" stroke="#138f9a" stroke-width="1.5"/><path d="M120,175 L225,175" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah3a1_1f2430)" marker-start="url(#ah3a1_1f2430)"/><rect x="154" y="196" width="34" height="18" rx="6" fill="#138f9a" stroke="#138f9a" stroke-width="1.5"/><path d="M120,205 L225,205" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah3a1_1f2430)" marker-start="url(#ah3a1_1f2430)"/><text x="171.0" y="250.0" font-size="12" font-weight="400" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">connexon channels join the cytoplasm</text><text x="30.0" y="280.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• ions flow directly: almost no delay</text><text x="30.0" y="296.9" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• usually bidirectional</text><text x="30.0" y="313.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• no vesicles, no Ca²⁺ needed</text><text x="30.0" y="330.6" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• can pass depolarization (excitatory)</text><text x="510.0" y="56.0" font-size="14" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">Chemical</text><path d="M360,80 L360,180 Q360,200 380,200 L640,200 Q660,200 660,180 L660,80" fill="#efe8fc" stroke="#7a4cd9" stroke-width="2"/><circle cx="420" cy="150" r="12" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.5"/><circle cx="470" cy="150" r="12" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.5"/><circle cx="520" cy="150" r="12" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.5"/><circle cx="570" cy="150" r="12" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.5"/><rect x="360" y="225" width="300" height="30" rx="6" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="430" cy="213" r="3" fill="#1f9d63"/><circle cx="490" cy="213" r="3" fill="#1f9d63"/><circle cx="550" cy="213" r="3" fill="#1f9d63"/><text x="510.0" y="240.0" font-size="11.5" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">receptors on the postsynaptic cell</text><text x="360.0" y="280.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• Ca²⁺-triggered vesicle release</text><text x="360.0" y="296.9" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• synaptic delay ≈ 0.5–1 ms</text><text x="360.0" y="313.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• one-way (pre → post)</text><text x="360.0" y="330.6" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">• excitatory or inhibitory, can be modulated</text></svg>
