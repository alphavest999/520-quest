<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Protein purification: track activity per mg</text><rect x="20" y="50" width="112" height="56" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="76.0" y="70.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">crude</text><text x="76.0" y="85.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">extract</text><rect x="152" y="50" width="112" height="56" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="208.0" y="70.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(NH₄)₂SO₄</text><text x="208.0" y="85.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cut</text><path d="M132,78 L152,78" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="284" y="50" width="112" height="56" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="340.0" y="70.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ion</text><text x="340.0" y="85.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exchange</text><path d="M264,78 L284,78" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="416" y="50" width="112" height="56" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="472.0" y="70.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">affinity</text><text x="472.0" y="85.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(e.g. Ni–NTA)</text><path d="M396,78 L416,78" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="548" y="50" width="112" height="56" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="604.0" y="70.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">size</text><text x="604.0" y="85.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">exclusion</text><path d="M528,78 L548,78" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="128.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Early steps handle large volumes cheaply; size exclusion is last (small loading volume, also separates by size).</text><text x="340.0" y="148.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Salting out: high salt takes the water shell, proteins aggregate. Keep the 40–60% pellet (spin at 40%, keep supernatant).</text><text x="70.0" y="190.0" font-size="11" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">step</text><text x="178.0" y="190.0" font-size="11" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">protein (mg)</text><text x="286.0" y="190.0" font-size="11" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">activity (U)</text><text x="394.0" y="190.0" font-size="11" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">specific act. (U/mg)</text><text x="502.0" y="190.0" font-size="11" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">yield</text><text x="610.0" y="190.0" font-size="11" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">fold</text><text x="70.0" y="220.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">crude</text><text x="178.0" y="220.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">200</text><text x="286.0" y="220.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1000</text><text x="394.0" y="220.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">5</text><text x="502.0" y="220.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">100%</text><text x="610.0" y="220.0" font-size="11.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">1</text><text x="70.0" y="250.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">column</text><text x="178.0" y="250.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">10</text><text x="286.0" y="250.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">600</text><text x="394.0" y="250.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">60</text><text x="502.0" y="250.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">60%</text><text x="610.0" y="250.0" font-size="11.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">12</text><polyline points="20,198 660,198" fill="none" stroke="#8a93a3" stroke-width="1"/><text x="340.0" y="290.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">fold purification = specific activity after ÷ before = 60 ÷ 5 = 12</text><text x="340.0" y="314.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">yield = activity kept ÷ starting activity = 600 ÷ 1000 = 60%</text></svg>
