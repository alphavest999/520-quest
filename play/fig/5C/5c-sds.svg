<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SDS-PAGE separates by subunit mass; native methods keep assemblies</text><rect x="40" y="60" width="300" height="260" rx="4" fill="#eef3f8" stroke="#8a93a3" stroke-width="1.5" /><rect x="60" y="78.0" width="40" height="4" fill="#5b6474"/><text x="122.0" y="84.0" font-size="9.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">250</text><rect x="60" y="115.71428743478054" width="40" height="4" fill="#5b6474"/><text x="122.0" y="121.7" font-size="9.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">150</text><rect x="60" y="145.64980147424637" width="40" height="4" fill="#5b6474"/><text x="122.0" y="151.6" font-size="9.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">100</text><rect x="60" y="166.88938669765736" width="40" height="4" fill="#5b6474"/><text x="122.0" y="172.9" font-size="9.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">75</text><rect x="60" y="196.8249007371232" width="40" height="4" fill="#5b6474"/><text x="122.0" y="202.8" font-size="9.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">50</text><rect x="60" y="219.05550838285723" width="40" height="4" fill="#5b6474"/><text x="122.0" y="225.1" font-size="9.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">37</text><rect x="60" y="247.99999999999997" width="40" height="4" fill="#5b6474"/><text x="122.0" y="254.0" font-size="9.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">25</text><text x="190.0" y="308.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">−βME</text><rect x="165" y="113.71428743478054" width="50" height="8" fill="#2f6fdb"/><text x="280.0" y="308.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+βME</text><rect x="255" y="194.8249007371232" width="50" height="8" fill="#2f6fdb"/><rect x="255" y="245.99999999999997" width="50" height="8" fill="#2f6fdb"/><text x="235.0" y="50.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">IgG antibody, kDa</text><rect x="370" y="60" width="285" height="74" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="512.5" y="83.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SDS coats protein with negative charge</text><text x="512.5" y="97.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">in proportion to length → charge/mass</text><text x="512.5" y="110.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">is constant → separates by mass</text><rect x="370" y="146" width="285" height="66" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="512.5" y="172.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">β-mercaptoethanol breaks disulfides:</text><text x="512.5" y="185.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">150 kDa IgG → 50 (heavy) + 25 (light)</text><rect x="370" y="224" width="285" height="74" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="512.5" y="247.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Gel filtration (native) 200 kDa but</text><text x="512.5" y="261.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SDS-PAGE 50 kDa → tetramer of</text><text x="512.5" y="274.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">non-covalently bound subunits</text></svg>
