L118,148 L42,148 L25,110 Z" fill="#fdf1db" opacity="0.8"/><path d="M42,148 L118,148 L88,215 L72,215 Z" fill="#e6eefc" opacity="0.8"/><rect x="76" y="215" width="8" height="30" fill="none" stroke="#1f2430" stroke-width="2"/><rect x="68" y="226" width="24" height="7" fill="#1f2430"/><text x="80.0" y="106.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ether</text><text x="80.0" y="172.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">water</text><text x="80.0" y="60.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ether (0.71 g/mL)</text><text x="80.0" y="268.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">less dense layer on top</text><path d="M160,70 L270,70 L270,110 L223,215 L207,215 L160,110 Z" fill="none" stroke="#1f2430" stroke-width="2"/><path d="M160,84 L270,84 L270,110 L253,148 L177,148 L160,110 Z" fill="#e6eefc" opacity="0.8"/><path d="M177,148 L253,148 L223,215 L207,215 Z" fill="#efe8fc" opacity="0.8"/><rect x="211" y="215" width="8" height="30" fill="none" stroke="#1f2430" stroke-width="2"/><rect x="203" y="226" width="24" height="7" fill="#1f2430"/><text x="215.0" y="106.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">water</text><text x="215.0" y="172.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CH₂Cl₂</text><text x="215.0" y="60.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">CH₂Cl₂ (1.33 g/mL)</text><text x="215.0" y="268.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">denser layer on bottom</text><rect x="300" y="50" width="360" height="42" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="480.0" y="71.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">organic layer: RCOOH + ArOH + RNH₂ + neutral</text><rect x="300" y="112" width="360" height="42" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="480.0" y="133.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">wash NaHCO₃ (weak base) → RCOO⁻ Na⁺ into water</text><path d="M480,92 L480,112" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="300" y="174" width="360" height="42" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="480.0" y="195.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">wash NaOH (strong base) → ArO⁻ Na⁺ (phenol, pKa ≈ 10)</text><path d="M480,154 L480,174" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="300" y="236" width="360" height="42" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="480.0" y="257.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">wash HCl (acid) → RNH₃⁺ Cl⁻ into water</text><path d="M480,216 L480,236" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="300" y="298" width="360" height="42" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="480.0" y="319.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">left in organic layer: neutral compound</text><path d="M480,278 L480,298" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="360.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">A charged (ionized) form is water-soluble. Bicarbonate removes only carboxylic acids (pKa 4–5); NaOH also takes phenols.</text></svg>
