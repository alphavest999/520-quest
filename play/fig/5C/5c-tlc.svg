<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Thin-layer chromatography on silica (polar)</text><rect x="60" y="50" width="260" height="280" rx="4" fill="#f7f7f2" stroke="#8a93a3" stroke-width="1.5" /><polyline points="60,300 320,300" fill="none" stroke="#5b6474" stroke-width="1"/><polyline points="60,70 320,70" fill="none" stroke="#2f6fdb" stroke-width="1"/><text x="360.0" y="74.0" font-size="11" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">solvent front</text><text x="352.0" y="304.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">baseline</text><text x="115.0" y="322.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SM</text><ellipse cx="115" cy="242.5" rx="13" ry="7" fill="#d6453d" opacity="0.85"/><text x="190.0" y="322.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">co</text><ellipse cx="190" cy="242.5" rx="13" ry="7" fill="#d6453d" opacity="0.85"/><ellipse cx="190" cy="173.5" rx="13" ry="7" fill="#7a4cd9" opacity="0.85"/><text x="265.0" y="322.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">rxn</text><ellipse cx="265" cy="242.5" rx="13" ry="7" fill="#d6453d" opacity="0.85"/><ellipse cx="265" cy="173.5" rx="13" ry="7" fill="#7a4cd9" opacity="0.85"/><text x="38.0" y="246.5" font-size="10.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">0.25</text><text x="38.0" y="177.5" font-size="10.5" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">0.55</text><text x="530.0" y="70.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Rf = spot distance / solvent distance</text><rect x="410" y="90" width="250" height="66" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="535.0" y="115.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">less polar (ketone) → binds silica less</text><text x="535.0" y="130.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ travels farther → higher Rf</text><rect x="410" y="170" width="250" height="66" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="535.0" y="195.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">more polar (alcohol, O–H) → binds more</text><text x="535.0" y="210.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ lower Rf</text><text x="535.0" y="268.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Both spots in rxn lane: reaction incomplete.</text><text x="535.0" y="292.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Co-spot (co) and a 2nd solvent system test identity.</text><text x="535.0" y="316.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">For a column, pick eluent giving Rf ≈ 0.3.</text></svg>
