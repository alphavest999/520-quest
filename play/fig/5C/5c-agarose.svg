<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Agarose gel: DNA runs to the + electrode, small fragments fastest</text><rect x="50" y="60" width="250" height="270" rx="4" fill="#eef3f8" stroke="#8a93a3" stroke-width="1.5" /><text x="175.0" y="50.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">− (cathode)  wells</text><text x="175.0" y="350.0" font-size="11" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">+ (anode)</text><rect x="93" y="68" width="44" height="7" fill="#5b6474"/><text x="115.0" y="345.0" font-size="1" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><rect x="213" y="68" width="44" height="7" fill="#5b6474"/><text x="235.0" y="345.0" font-size="1" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><rect x="93" y="146.89700043360187" width="44" height="6" fill="#2f6fdb"/><text x="75.0" y="153.9" font-size="10" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">2000</text><rect x="93" y="177.0" width="44" height="6" fill="#2f6fdb"/><text x="75.0" y="184.0" font-size="10" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">1000</text><rect x="93" y="207.10299956639813" width="44" height="6" fill="#2f6fdb"/><text x="75.0" y="214.1" font-size="10" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">500</text><rect x="93" y="229.28787452803374" width="44" height="6" fill="#2f6fdb"/><text x="75.0" y="236.3" font-size="10" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">300</text><rect x="93" y="277.0" width="44" height="6" fill="#2f6fdb"/><text x="75.0" y="284.0" font-size="10" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">100</text><rect x="213" y="142.0" width="44" height="6" fill="#7a4cd9"/><text x="305.0" y="149.0" font-size="10.5" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">nicked circle</text><rect x="213" y="167.0" width="44" height="6" fill="#7a4cd9"/><text x="305.0" y="174.0" font-size="10.5" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">linear</text><rect x="213" y="192.0" width="44" height="6" fill="#7a4cd9"/><text x="305.0" y="199.0" font-size="10.5" font-weight="400" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">supercoiled</text><text x="115.0" y="320.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ladder</text><text x="235.0" y="320.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">plasmid</text><text x="520.0" y="80.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">distance is linear in log(size):</text><text x="520.0" y="104.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1000 bp → 4 cm, 100 bp → 8 cm</text><text x="520.0" y="128.0" font-size="11.5" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">6 cm is halfway in log → √(1000·100) ≈ 300 bp</text><rect x="390" y="160" width="260" height="70" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="520.0" y="181.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DNA backbone phosphates are negative,</text><text x="520.0" y="195.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">with the same charge per length, so</text><text x="520.0" y="208.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">separation is by size alone</text><rect x="390" y="248" width="260" height="62" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="520.0" y="272.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Same plasmid, three shapes: compact</text><text x="520.0" y="285.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">supercoiled DNA usually runs fastest</text></svg>
