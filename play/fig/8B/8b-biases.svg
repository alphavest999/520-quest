<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="380.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Attribution biases: where the cause gets placed</text><rect x="20" y="50" width="185" height="36" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="112.5" y="68.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Bias</text><rect x="215" y="50" width="150" height="36" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="290.0" y="68.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Judging…</text><rect x="375" y="50" width="180" height="36" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="465.0" y="68.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Good outcome / act</text><rect x="565" y="50" width="180" height="36" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="655.0" y="68.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Bad outcome / act</text><rect x="20" y="95" width="185" height="50" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="112.5" y="113.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fundamental attribution</text><text x="112.5" y="126.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">error</text><rect x="215" y="95" width="150" height="50" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="290.0" y="120.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">others</text><rect x="375" y="95" width="180" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="465.0" y="120.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">disposition</text><rect x="565" y="95" width="180" height="50" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="655.0" y="113.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">disposition</text><text x="655.0" y="126.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(situation ignored)</text><rect x="20" y="153" width="185" height="50" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="112.5" y="178.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Actor–observer bias</text><rect x="215" y="153" width="150" height="50" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="290.0" y="178.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">self vs others</text><rect x="375" y="153" width="370" height="50" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="560.0" y="171.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">self: situation</text><text x="560.0" y="184.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">others: disposition</text><rect x="20" y="211" width="185" height="50" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="112.5" y="236.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Self-serving bias</text><rect x="215" y="211" width="150" height="50" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="290.0" y="236.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">self</text><rect x="375" y="211" width="180" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="465.0" y="229.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">internal</text><text x="465.0" y="242.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(my skill)</text><rect x="565" y="211" width="180" height="50" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="655.0" y="229.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">external</text><text x="655.0" y="242.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(unfair test)</text><rect x="20" y="269" width="185" height="50" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="112.5" y="287.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ultimate attribution</text><text x="112.5" y="300.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">error</text><rect x="215" y="269" width="150" height="50" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="290.0" y="294.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">out-group</text><rect x="375" y="269" width="180" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="465.0" y="287.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">situation / luck</text><text x="465.0" y="300.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(&#x27;exception&#x27;)</text><rect x="565" y="269" width="180" height="50" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="655.0" y="294.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">disposition</text><text x="380.0" y="342.0" font-size="10" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Collectivist (holistic) cultures show a weaker FAE; seeing yourself from the observer&#x27;s view makes self-attributions more dispositional.</text></svg>
