<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="360.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Kelley&#x27;s covariation model</text><text x="110.0" y="62.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><rect x="20" y="50" width="165" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="102.5" y="68.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Consensus</text><text x="102.5" y="81.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(do others do it?)</text><rect x="195" y="50" width="165" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="277.5" y="68.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Distinctiveness</text><text x="277.5" y="81.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(only with this stimulus?)</text><rect x="370" y="50" width="165" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="452.5" y="68.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Consistency</text><text x="452.5" y="81.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(every time?)</text><rect x="545" y="50" width="165" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="627.5" y="75.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Attribution</text><rect x="20" y="115" width="165" height="45" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="102.5" y="137.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">HIGH</text><rect x="195" y="115" width="165" height="45" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="277.5" y="137.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">HIGH</text><rect x="370" y="115" width="165" height="45" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="452.5" y="137.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">HIGH</text><rect x="545" y="115" width="165" height="45" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="627.5" y="130.3" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SITUATIONAL</text><text x="627.5" y="144.7" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(external)</text><rect x="20" y="170" width="165" height="45" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="102.5" y="192.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">LOW</text><rect x="195" y="170" width="165" height="45" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="277.5" y="192.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">LOW</text><rect x="370" y="170" width="165" height="45" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="452.5" y="192.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">HIGH</text><rect x="545" y="170" width="165" height="45" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="627.5" y="185.3" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DISPOSITIONAL</text><text x="627.5" y="199.7" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(internal)</text><rect x="20" y="225" width="165" height="45" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="102.5" y="247.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">any</text><rect x="195" y="225" width="165" height="45" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="277.5" y="247.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">any</text><rect x="370" y="225" width="165" height="45" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="452.5" y="247.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">LOW</text><rect x="545" y="225" width="165" height="45" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="627.5" y="240.3" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">unclear / fluke</text><text x="627.5" y="254.7" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(circumstance)</text><text x="365.0" y="288.0" font-size="10.3" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Example: everyone laughs, only at this comedian, every show → the comedian is funny (situation), not the laugher.</text></svg>
