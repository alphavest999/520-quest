<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Doppler effect: a moving source</text><circle cx="330" cy="185" r="12" fill="none" stroke="#2f6fdb" stroke-width="1.6" opacity="1.00"/><circle cx="310" cy="185" r="37" fill="none" stroke="#2f6fdb" stroke-width="1.6" opacity="0.88"/><circle cx="290" cy="185" r="62" fill="none" stroke="#2f6fdb" stroke-width="1.6" opacity="0.76"/><circle cx="270" cy="185" r="87" fill="none" stroke="#2f6fdb" stroke-width="1.6" opacity="0.64"/><circle cx="250" cy="185" r="112" fill="none" stroke="#2f6fdb" stroke-width="1.6" opacity="0.52"/><circle cx="230" cy="185" r="137" fill="none" stroke="#2f6fdb" stroke-width="1.6" opacity="0.40"/><circle cx="330" cy="185" r="9" fill="#d6453d"/><path d="M330,185 L390,185" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="360.0" y="203.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">source moving</text><text x="560.0" y="177.2" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">ahead: waves bunched</text><text x="560.0" y="192.8" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">shorter λ, HIGHER pitch</text><text x="40.0" y="292.2" font-size="12.5" font-weight="600" fill="#d98a00" text-anchor="start" dominant-baseline="middle">behind: waves spread</text><text x="40.0" y="307.8" font-size="12.5" font-weight="600" fill="#d98a00" text-anchor="start" dominant-baseline="middle">longer λ, lower pitch</text><text x="500.0" y="292.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">f&#x27; = f (v ± v_observer) / (v ∓ v_source)</text><text x="500.0" y="307.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Approaching → f&#x27; &gt; f; receding → f&#x27; &lt; f</text></svg>
