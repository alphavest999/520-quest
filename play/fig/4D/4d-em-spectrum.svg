<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Electromagnetic spectrum: E = hf = hc/λ</text><rect x="30" y="80" width="110" height="50" rx="0" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5" /><text x="85.0" y="145.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">radio</text><rect x="140" y="80" width="90" height="50" rx="0" fill="#fdf1db" stroke="#8a93a3" stroke-width="1.5" /><text x="185.0" y="145.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">microwave</text><rect x="230" y="80" width="90" height="50" rx="0" fill="#fbe7e5" stroke="#8a93a3" stroke-width="1.5" /><text x="275.0" y="145.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">infrared</text><rect x="320.0" y="80" width="12.2" height="50" fill="#d6453d"/><rect x="331.7" y="80" width="12.2" height="50" fill="#e8862a"/><rect x="343.3" y="80" width="12.2" height="50" fill="#e6c619"/><rect x="355.0" y="80" width="12.2" height="50" fill="#2f9d4a"/><rect x="366.7" y="80" width="12.2" height="50" fill="#2f6fdb"/><rect x="378.3" y="80" width="12.2" height="50" fill="#5b3fc4"/><text x="355.0" y="145.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">visible</text><rect x="390" y="80" width="80" height="50" rx="0" fill="#efe8fc" stroke="#8a93a3" stroke-width="1.5" /><text x="430.0" y="145.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">UV</text><rect x="470" y="80" width="90" height="50" rx="0" fill="#e6eefc" stroke="#8a93a3" stroke-width="1.5" /><text x="515.0" y="145.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">X-ray</text><rect x="560" y="80" width="90" height="50" rx="0" fill="#e0f3f4" stroke="#8a93a3" stroke-width="1.5" /><text x="605.0" y="145.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">gamma</text><path d="M40,180 L640,180" stroke="#d6453d" stroke-width="2.5" fill="none" marker-end="url(#ared)"/><text x="340.0" y="198.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">higher frequency, shorter wavelength, MORE energy per photon →</text><text x="140.0" y="62.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">λ ~ meters</text><text x="325.0" y="62.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">red 700 nm → violet 400 nm</text><text x="590.0" y="62.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">λ &lt; 0.01 nm</text><text x="340.0" y="232.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">So UV photons carry more energy than visible, IR or microwave photons.</text></svg>
