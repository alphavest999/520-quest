<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Refraction and total internal reflection</text><rect x="40" y="170" width="270" height="130" fill="#e6eefc"/><polyline points="40,170 310,170" fill="none" stroke="#1f2430" stroke-width="1.5"/><polyline points="175,60 175,290" fill="none" stroke="#8a93a3" stroke-width="1" stroke-dasharray="6 4"/><text x="175.0" y="52.0" font-size="11.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Into a denser medium: bends TOWARD the normal</text><rect x="370" y="170" width="270" height="130" fill="#e6eefc"/><polyline points="370,170 640,170" fill="none" stroke="#1f2430" stroke-width="1.5"/><polyline points="505,60 505,290" fill="none" stroke="#8a93a3" stroke-width="1" stroke-dasharray="6 4"/><text x="505.0" y="52.0" font-size="11.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Out of glass (n = 1.52) into air</text><path d="M98.39555568810219,105.72123903134606 L175,170" stroke="#d98a00" stroke-width="2.5" fill="none" marker-end="url(#aamber)"/><path d="M175,170 L225.3976607315117,256.37173028712255" stroke="#d98a00" stroke-width="2.5" fill="none" marker-end="url(#aamber)"/><text x="80.0" y="150.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">air n = 1.00</text><text x="80.0" y="285.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">glass n = 1.52</text><text x="215.0" y="290.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">50° → 30°</text><path d="M455.0,256.6025403784439 L505,170" stroke="#2f6fdb" stroke-width="2" fill="none" marker-end="url(#ablue)"/><path d="M505,170 L581.0,105.00769276291231" stroke="#2f6fdb" stroke-width="2" fill="none" marker-end="url(#ablue)"/><path d="M439.2105263157895,245.31098958554833 L505,170" stroke="#7a4cd9" stroke-width="2" fill="none" marker-end="url(#apurple)"/><path d="M505,170 L625,170" stroke="#7a4cd9" stroke-width="2" fill="none" marker-end="url(#apurple)"/><path d="M423.0847955711008,227.3576436351046 L505,170" stroke="#d6453d" stroke-width="2" fill="none" marker-end="url(#ared)"/><path d="M505,170 L586.9152044288992,227.3576436351046" stroke="#d6453d" stroke-width="2" fill="none" marker-end="url(#ared)"/><text x="505.0" y="312.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">θc = sin⁻¹(1.00/1.52) = 41.1°: beyond it, all light reflects</text><text x="340.0" y="330.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">n₁ sin θ₁ = n₂ sin θ₂.  TIR only when going into a LOWER index.</text></svg>
