<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah3b1_2f6fdb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ah3b1_1f9d63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Conducting zone vs respiratory zone</text><rect x="20" y="44" width="410" height="250" rx="12" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><rect x="440" y="44" width="220" height="250" rx="12" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="225.0" y="64.0" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Conducting zone: moves, warms, cleans air</text><text x="550.0" y="64.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Respiratory zone: gas exchange</text><rect x="40" y="100" width="85" height="60" rx="10" fill="#fff" stroke="#2f6fdb" stroke-width="1.5"/><text x="82.5" y="130.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">trachea</text><text x="82.0" y="182.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">cartilage rings,</text><text x="82.0" y="197.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">thick wall</text><rect x="140" y="100" width="85" height="60" rx="10" fill="#fff" stroke="#2f6fdb" stroke-width="1.5"/><text x="182.5" y="122.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">primary</text><text x="182.5" y="137.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bronchi</text><text x="182.0" y="190.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">cartilage plates</text><rect x="240" y="100" width="85" height="60" rx="10" fill="#fff" stroke="#2f6fdb" stroke-width="1.5"/><text x="282.5" y="130.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bronchioles</text><text x="282.0" y="182.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">smooth muscle,</text><text x="282.0" y="197.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">no cartilage</text><rect x="335" y="100" width="85" height="60" rx="10" fill="#fff" stroke="#2f6fdb" stroke-width="1.5"/><text x="377.5" y="122.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">terminal</text><text x="377.5" y="137.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bronchioles</text><text x="377.0" y="182.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">last purely</text><text x="377.0" y="197.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">conducting</text><path d="M125,130 L140,130" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah3b1_2f6fdb)"/><path d="M225,130 L240,130" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah3b1_2f6fdb)"/><path d="M325,130 L340,130" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah3b1_2f6fdb)"/><path d="M420,130 L435,130" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah3b1_2f6fdb)"/><rect x="452" y="100" width="90" height="60" rx="10" fill="#fff" stroke="#1f9d63" stroke-width="1.5"/><text x="497.0" y="122.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">respiratory</text><text x="497.0" y="137.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bronchioles</text><path d="M542,130 L556,130" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah3b1_1f9d63)"/><circle cx="574" cy="130" r="13" fill="#fff" stroke="#1f9d63" stroke-width="2"/><circle cx="596" cy="112" r="13" fill="#fff" stroke="#1f9d63" stroke-width="2"/><circle cx="596" cy="148" r="13" fill="#fff" stroke="#1f9d63" stroke-width="2"/><circle cx="618" cy="130" r="13" fill="#fff" stroke="#1f9d63" stroke-width="2"/><circle cx="618" cy="100" r="13" fill="#fff" stroke="#1f9d63" stroke-width="2"/><circle cx="618" cy="160" r="13" fill="#fff" stroke="#1f9d63" stroke-width="2"/><circle cx="640" cy="116" r="13" fill="#fff" stroke="#1f9d63" stroke-width="2"/><circle cx="640" cy="146" r="13" fill="#fff" stroke="#1f9d63" stroke-width="2"/><text x="610.0" y="182.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">alveolar ducts</text><text x="610.0" y="197.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">and alveoli</text><text x="550.0" y="225.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">walls ≈ 0.5 μm thick,</text><text x="550.0" y="240.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">wrapped in capillaries,</text><text x="550.0" y="255.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">≈ 70 m² total area</text><text x="225.0" y="250.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">No exchange here: this ≈ 150 mL of air is the anatomic dead space</text><text x="340.0" y="372.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Gas exchange needs a very thin barrier and a huge area, which only the alveoli provide.</text></svg>
