<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah3b1_1f9d63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="ah3b1_d6453d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="ah3b1_2f6fdb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Central chemoreceptors sense CO₂ through CSF pH</text><rect x="15" y="44" width="190" height="300" rx="12" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="110.0" y="66.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Arterial blood</text><rect x="215" y="44" width="46" height="300" rx="4" fill="#d9dde5" stroke="#8a93a3" stroke-width="1.5"/><text x="238.0" y="194.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">blood–brain barrier</text><text x="0" y="0" font-size="1"></text><rect x="271" y="44" width="394" height="300" rx="12" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="468.0" y="66.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cerebrospinal fluid (medulla)</text><text x="110.0" y="120.0" font-size="16" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">CO₂</text><path d="M140,120 L330,120" fill="none" stroke="#1f9d63" stroke-width="2.5" marker-end="url(#ah3b1_1f9d63)"/><text x="238.0" y="104.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">crosses freely</text><text x="110.0" y="190.0" font-size="16" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">H⁺</text><path d="M135,190 L205,190" fill="none" stroke="#d6453d" stroke-width="2.5" marker-end="url(#ah3b1_d6453d)"/><polyline points="213,181 231,199" fill="none" stroke="#d6453d" stroke-width="3.5"/><polyline points="213,199 231,181" fill="none" stroke="#d6453d" stroke-width="3.5"/><text x="110.0" y="250.0" font-size="16" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">HCO₃⁻</text><path d="M145,250 L205,250" fill="none" stroke="#d6453d" stroke-width="2.5" marker-end="url(#ah3b1_d6453d)"/><polyline points="213,241 231,259" fill="none" stroke="#d6453d" stroke-width="3.5"/><polyline points="213,259 231,241" fill="none" stroke="#d6453d" stroke-width="3.5"/><text x="110.0" y="300.0" font-size="14" font-weight="600" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">PO₂ (low)</text><text x="110.0" y="322.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">→ carotid/aortic bodies</text><text x="465.0" y="120.0" font-size="14" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻</text><text x="465.0" y="145.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(carbonic anhydrase)</text><path d="M465,160 L465,195" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah3b1_2f6fdb)"/><rect x="330" y="200" width="270" height="50" rx="10" fill="#fff" stroke="#2f6fdb" stroke-width="1.5"/><text x="465.0" y="217.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CSF pH falls (CSF has little</text><text x="465.0" y="232.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">protein, so little buffering)</text><path d="M465,250 L465,275" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah3b1_2f6fdb)"/><rect x="330" y="280" width="270" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="465.0" y="297.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">chemoreceptor cells fire</text><text x="465.0" y="312.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ breathe deeper and faster</text><text x="340.0" y="404.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Low PO₂ is sensed peripherally; anemia leaves PaO₂ and PaCO₂ normal, so neither receptor fires.</text></svg>
