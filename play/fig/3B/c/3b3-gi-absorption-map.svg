<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah3b3_1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Where the gut absorbs what (approximate daily water flow)</text><rect x="15" y="50" width="120" height="36" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="75.0" y="68.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Stomach</text><rect x="15" y="94" width="120" height="76" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="75.0" y="117.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">almost no nutrient</text><text x="75.0" y="132.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">absorption; makes</text><text x="75.0" y="147.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">intrinsic factor</text><rect x="147" y="50" width="120" height="36" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="207.0" y="68.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Duodenum</text><rect x="147" y="94" width="120" height="76" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="207.0" y="117.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fe²⁺, Ca²⁺; mixes</text><text x="207.0" y="132.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bile + pancreatic</text><text x="207.0" y="147.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">enzymes</text><path d="M135,68 L147,68" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah3b3_1f2430)"/><rect x="279" y="50" width="120" height="36" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="339.0" y="68.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Jejunum</text><rect x="279" y="94" width="120" height="76" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="339.0" y="117.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">most sugars,</text><text x="339.0" y="132.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">amino acids, fats,</text><text x="339.0" y="147.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">vitamins</text><path d="M267,68 L279,68" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah3b3_1f2430)"/><rect x="411" y="50" width="120" height="36" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="471.0" y="68.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ileum</text><rect x="411" y="94" width="120" height="76" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="471.0" y="124.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">B₁₂ (with IF),</text><text x="471.0" y="139.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">bile salts</text><path d="M399,68 L411,68" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah3b3_1f2430)"/><rect x="543" y="50" width="120" height="36" rx="10" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="603.0" y="68.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Colon</text><rect x="543" y="94" width="120" height="76" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="603.0" y="117.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">WATER + Na⁺,</text><text x="603.0" y="132.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cl⁻, K⁺; bacteria</text><text x="603.0" y="147.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">make vitamin K</text><path d="M531,68 L543,68" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah3b3_1f2430)"/><text x="340.0" y="200.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Water handled per day (approximate)</text><text x="250.0" y="230.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="end" dominant-baseline="middle">enters gut (diet + secretions)</text><rect x="260" y="220" width="360.0" height="20" rx="4" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="630.0" y="230.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">≈ 9 L</text><text x="250.0" y="260.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="end" dominant-baseline="middle">absorbed by small intestine</text><rect x="260" y="250" width="300.0" height="20" rx="4" fill="#138f9a" stroke="#138f9a" stroke-width="1.5"/><text x="570.0" y="260.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">≈ 7.5 L</text><text x="250.0" y="290.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="end" dominant-baseline="middle">absorbed by colon</text><rect x="260" y="280" width="56.0" height="20" rx="4" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><text x="326.0" y="290.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">≈ 1.4 L</text><text x="250.0" y="320.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="end" dominant-baseline="middle">left in feces</text><rect x="260" y="310" width="4.0" height="20" rx="4" fill="#5b6474" stroke="#5b6474" stroke-width="1.5"/><text x="274.0" y="320.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">≈ 0.1 L</text></svg>
