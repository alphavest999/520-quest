hell,</text><text x="222.0" y="308.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">lipid products inside</text><path d="M148,316 L335,316" fill="none" stroke="#2f6fdb" stroke-width="2.2" marker-end="url(#ah3b3_2f6fdb)"/><text x="250.0" y="330.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">FA + MG diffuse in</text><rect x="342" y="95" width="150" height="56" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="417.0" y="114.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Smooth ER:</text><text x="417.0" y="131.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">FA + MG → TG</text><rect x="342" y="191" width="150" height="56" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="417.0" y="210.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Chylomicron</text><text x="417.0" y="227.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(TG + apoB-48)</text><path d="M417.0,151 L417.0,191" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah3b3_1f2430)"/><path d="M417.0,247 L417,300" fill="none" stroke="#7a4cd9" stroke-width="1.8" marker-end="url(#ah3b3_7a4cd9)"/><text x="417.0" y="312.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">exocytosis</text><path d="M512,220 L540,220" fill="none" stroke="#7a4cd9" stroke-width="2.2" marker-end="url(#ah3b3_7a4cd9)"/><text x="595.0" y="120.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Chylomicrons</text><text x="595.0" y="136.9" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">are too big for</text><text x="595.0" y="153.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">blood capillaries;</text><text x="595.0" y="170.6" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">they enter the</text><text x="595.0" y="187.5" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">lacteal, then the</text><text x="595.0" y="204.4" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">thoracic duct,</text><text x="595.0" y="221.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">then the blood.</text></svg>
