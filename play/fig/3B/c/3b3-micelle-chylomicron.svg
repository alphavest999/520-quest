<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah3b3_1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah3b3_2f6fdb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ah3b3_7a4cd9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lipid absorption: micelles in the lumen, chylomicrons out of the cell</text><rect x="12" y="45" width="300" height="300" rx="12" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="162.0" y="63.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Lumen (watery)</text><rect x="322" y="45" width="190" height="300" rx="12" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="417.0" y="63.0" font-size="14" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">Enterocyte</text><rect x="522" y="45" width="146" height="300" rx="12" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="595.0" y="63.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Lacteal (lymph)</text><rect x="37" y="82" width="250" height="36" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="162.0" y="100.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fat droplet (triglyceride)</text><rect x="37" y="134" width="250" height="36" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="162.0" y="152.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Bile salts emulsify it</text><path d="M162.0,118 L162.0,134" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah3b3_1f2430)"/><rect x="37" y="186" width="250" height="36" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="162.0" y="204.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lipase: TG → 2 FA + MG</text><path d="M162.0,170 L162.0,186" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah3b3_1f2430)"/><circle cx="110" cy="290" r="24" fill="#fdf1db" stroke="none"/><polyline points="132.0,290.0 144.0,290.0" fill="none" stroke="#2f6fdb" stroke-width="2"/><circle cx="144.0" cy="290.0" r="4" fill="#2f6fdb"/><polyline points="129.82131509385323,299.5454422605863 140.63294150868225,304.752047129997" fill="none" stroke="#2f6fdb" stroke-width="2"/><circle cx="140.6" cy="304.8" r="4" fill="#2f6fdb"/><polyline points="123.71677564089214,307.20029261429664 131.19865326319695,316.582270403913" fill="none" stroke="#2f6fdb" stroke-width="2"/><circle cx="131.2" cy="316.6" r="4" fill="#2f6fdb"/><polyline points="114.89546054703892,311.44841406800015 117.5657117545147,323.147549014182" fill="none" stroke="#2f6fdb" stroke-width="2"/><circle cx="117.6" cy="323.1" r="4" fill="#2f6fdb"/><polyline points="105.10453945296109,311.44841406800015 102.4342882454853,323.147549014182" fill="none" stroke="#2f6fdb" stroke-width="2"/><circle cx="102.4" cy="323.1" r="4" fill="#2f6fdb"/><polyline points="96.28322435910786,307.20029261429664 88.80134673680305,316.582270403913" fill="none" stroke="#2f6fdb" stroke-width="2"/><circle cx="88.8" cy="316.6" r="4" fill