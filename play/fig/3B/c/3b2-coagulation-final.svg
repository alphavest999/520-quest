<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Final common pathway of coagulation, and clot breakdown</text><rect x="20" y="55" width="200" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="120.0" y="69.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Tissue factor / intrinsic</text><text x="120.0" y="84.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">pathways activate factor X</text><path d="M220,77 L262,77" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="265" y="55" width="140" height="44" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="335.0" y="77.0" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Factor Xa (+ Va)</text><rect x="20" y="135" width="150" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="95.0" y="157.0" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Prothrombin (II)</text><rect x="245" y="135" width="150" height="44" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="320.0" y="157.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Thrombin (IIa)</text><path d="M170,157 L243,157" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M335,99 L220,155" fill="none" stroke="#1f2430" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="20" y="220" width="150" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="95.0" y="233.6" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fibrinogen</text><text x="95.0" y="250.4" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(soluble)</text><rect x="245" y="220" width="150" height="44" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="320.0" y="242.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fibrin (polymerizes)</text><path d="M170,242 L243,242" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M320,179 L210,240" fill="none" stroke="#1f2430" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="300.0" y="214.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">cleaves</text><text x="318.0" y="124.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">activates</text><rect x="470" y="220" width="190" height="44" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="565.0" y="233.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cross-linked fibrin mesh</text><text x="565.0" y="250.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(factor XIIIa)</text><path d="M395,242 L468,242" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="470" y="315" width="190" height="44" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="565.0" y="328.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fibrin degradation</text><text x="565.0" y="345.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">products (D-dimer)</text><path d="M565,264 L565,313" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="595.0" y="288.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">plasmin</text><rect x="430" y="130" width="230" height="60" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="545.0" y="144.4" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Heparin: activates antithrombin,</text><text x="545.0" y="160.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">which inhibits thrombin and Xa</text><text x="545.0" y="175.6" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(anticoagulant)</text></svg>
