<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Two ways to regenerate NAD⁺ without O₂ (per glucose)</text><rect x="15" y="42" width="318" height="290" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="174.0" y="58.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Yeast: alcoholic fermentation</text><rect x="347" y="42" width="318" height="290" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="506.0" y="58.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Human muscle: lactic fermentation</text><rect x="89.0" y="71.0" width="170" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="174.0" y="88.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glucose</text><rect x="89.0" y="141.0" width="170" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="174.0" y="158.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 Pyruvate (3C)</text><path d="M174.0,107.0 L174.0,139.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="182.0" y="115.8" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">glycolysis: 2 ATP net,</text><text x="182.0" y="130.2" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">2 NAD⁺ → 2 NADH</text><rect x="421.0" y="71.0" width="170" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="506.0" y="88.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glucose</text><rect x="421.0" y="141.0" width="170" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="506.0" y="158.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 Pyruvate (3C)</text><path d="M506.0,107.0 L506.0,139.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="514.0" y="115.8" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">glycolysis: 2 ATP net,</text><text x="514.0" y="130.2" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">2 NAD⁺ → 2 NADH</text><rect x="79.0" y="211.0" width="190" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="174.0" y="228.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 Acetaldehyde (2C)</text><path d="M174,177 L174.0,209.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="184.0" y="185.8" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">pyruvate decarboxylase</text><text x="184.0" y="200.2" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">(TPP)</text><path d="M94,193 L40,193" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="40.0" y="212.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="start" dominant-baseline="middle">2 CO₂</text><rect x="89.0" y="281.0" width="170" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="174.0" y="298.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 Ethanol</text><path d="M174.0,247.0 L174.0,279.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="184.0" y="263.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">alcohol dehydrogenase:</text><text x="184.0" y="278.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">2 NADH → 2 NAD⁺</text><rect x="421.0" y="246.0" width="170" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="506.0" y="263.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 Lactate (3C)</text><path d="M506,177 L506.0,244.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="516.0" y="210.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">lactate dehydrogenase:</text><text x="516.0" y="226.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">2 NADH → 2 NAD⁺</text><text x="506.0" y="305.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle" font-style="italic">no carbon lost: 3C in, 3C out</text></svg>
