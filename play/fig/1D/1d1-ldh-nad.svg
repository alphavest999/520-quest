<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Anaerobic glycolysis: LDH recycles NAD⁺</text><rect x="30" y="70" width="200" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="130.0" y="92.0" font-size="14" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glyceraldehyde-3-P</text><rect x="30" y="190" width="200" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="130.0" y="212.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1,3-BPG → … → pyruvate</text><rect x="30" y="310" width="200" height="44" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="130.0" y="332.0" font-size="14" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lactate (exported)</text><path d="M130.0,114 L130.0,190" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="90.0" y="152.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">GAPDH</text><path d="M130.0,234 L130.0,310" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="100.0" y="272.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">LDH</text><rect x="400" y="70" width="120" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="460.0" y="90.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NAD⁺</text><rect x="400" y="290" width="120" height="40" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="460.0" y="310.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NADH</text><path d="M400,100 C330,140 330,260 400,300" fill="none" stroke="#1f2430" stroke-width="2" marker-end="url(#ah)"/><path d="M520,300 C590,260 590,140 520,100" fill="none" stroke="#1f2430" stroke-width="2" marker-end="url(#ah)"/><text x="328.0" y="192.2" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">GAPDH</text><text x="328.0" y="207.8" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">uses NAD⁺</text><text x="592.0" y="192.2" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">LDH</text><text x="592.0" y="207.8" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">remakes NAD⁺</text><text x="340.0" y="402.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Net: glucose → 2 lactate + 2 ATP, with no net change in NAD⁺/NADH.</text></svg>
