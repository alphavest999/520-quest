<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Allosteric signals override or fine-tune hormonal control</text><rect x="20" y="50" width="200" height="200" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="120.0" y="72.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Muscle phosphorylase</text><text x="32.0" y="105.0" font-size="12" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">+ AMP (energy low)</text><text x="32.0" y="131.0" font-size="12" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">+ Ca²⁺ (contraction),</text><text x="32.0" y="157.0" font-size="12" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">   via phosphorylase kinase</text><text x="32.0" y="183.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="start" dominant-baseline="middle">− ATP, − glucose-6-P</text><rect x="240" y="50" width="200" height="200" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="340.0" y="72.0" font-size="13" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">Liver phosphorylase a</text><text x="252.0" y="105.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="start" dominant-baseline="middle">− glucose (binds, favors</text><text x="252.0" y="131.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="start" dominant-baseline="middle">   inactive T state and</text><text x="252.0" y="157.0" font-size="12" font-weight="600" fill="#d6453d" text-anchor="start" dominant-baseline="middle">   dephosphorylation by PP1)</text><text x="252.0" y="183.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">→ glucose sensor</text><rect x="460" y="50" width="200" height="200" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="560.0" y="72.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Glycogen synthase</text><text x="472.0" y="105.0" font-size="12" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">+ glucose-6-P</text><text x="472.0" y="131.0" font-size="12" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">   activates even the</text><text x="472.0" y="157.0" font-size="12" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">   phosphorylated b form</text><text x="472.0" y="183.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">(signal: glucose plentiful)</text><rect x="20" y="270" width="640" height="92" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="34.0" y="292.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Why muscle can break down glycogen without hormones:</text><text x="34.0" y="314.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Ca²⁺ released for contraction binds the calmodulin (δ) subunit of phosphorylase kinase,</text><text x="34.0" y="336.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">and AMP from ATP use binds phosphorylase b directly. Glucagon has little effect on muscle.</text></svg>
