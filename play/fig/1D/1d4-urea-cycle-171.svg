<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The urea cycle spans two compartments of the liver cell</text><rect x="12" y="40" width="300" height="420" rx="14" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="162.0" y="58.0" font-size="13" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">Mitochondrial matrix (hepatocyte)</text><text x="490.0" y="58.0" font-size="13" font-weight="700" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Cytosol (hepatocyte)</text><rect x="50.0" y="80.0" width="200" height="32" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="150.0" y="96.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NH₄⁺ + HCO₃⁻ + 2 ATP</text><rect x="55.0" y="180.0" width="190" height="32" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="150.0" y="196.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Carbamoyl phosphate</text><rect x="90.0" y="394.0" width="120" height="32" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="150.0" y="410.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ornithine</text><rect x="165.0" y="284.0" width="120" height="32" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="225.0" y="300.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Citrulline</text><rec