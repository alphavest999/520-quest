-baseline="middle">glutamate (NAG)</text><path d="M150.0,212.0 L215,282" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M150.0,394.0 L200,318" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="118.0" y="300.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">OTC</text><path d="M285.0,300.0 L358.0,128" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,120.0 L550.0,192" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M595.0,108.0 L595,192" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="470.0" y="168.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">argininosuccinate</text><text x="470.0" y="184.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">synthetase</text><path d="M580.0,226.0 L580,302" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="590.0" y="248.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">lyase</text><text x="590.0" y="266.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">→ fumarate</text><path d="M550,338 L460,392" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="470.0" y="352.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">arginase</text><path d="M610,338 L610,398" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><path d="M360.0,410.0 L212,410" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="330.0" y="470.0" font-size="12" font-weight="400" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">inner mitochondrial membrane (transporters move citrulline out and ornithine in)</text></svg>
