<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ketone bodies: made in liver mitochondria, used elsewhere</text><rect x="14" y="44" width="290" height="100" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="159.0" y="61.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Adipose tissue (cytosol)</text><text x="159.0" y="84.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">hormone-sensitive lipase releases</text><text x="159.0" y="101.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">fatty acids; makes no ketones</text><path d="M159,146 L159,162" fill="none" stroke="#d98a00" stroke-width="1.8" marker-end="url(#ah)"/><rect x="14" y="164" width="290" height="276" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="159.0" y="181.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Liver (hepatocyte)</text><rect x="30" y="192" width="258" height="124" rx="40" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/><text x="159.0" y="208.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle" font-style="italic">mitochondrion</text><text x="50.0" y="230.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">fatty acids → β-oxidation</text><text x="50.0" y="249.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">→ acetyl-CoA (excess)</text><text x="50.0" y="268.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">→ HMG-CoA synthase</text><text x="50.0" y="287.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">→ acetoacetate, β-hydroxybutyrate</text><text x="159.0" y="362.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">lacks succinyl-CoA:acetoacetate</text><text x="159.0" y="380.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">CoA transferase (thiophorase)</text><text x="159.0" y="398.0" font-size="12.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">→ cannot use its own ketones</text><rect x="318" y="44" width="40" height="396" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1"/><text x="338.0" y="242.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">blood</text><path d="M290,280 L322,280" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><rect x="372" y="44" width="296" height="92" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="520.0" y="61.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Brain (neurons)</text><text x="520.0" y="88.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">uses ketones in prolonged fasting</text><path d="M356,86 L372,86" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><rect x="372" y="144" width="296" height="92" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="520.0" y="161.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Heart (cardiac muscle)</text><text x="520.0" y="188.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">oxidizes ketones readily</text><path d="M356,186 L372,186" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><rect x="372" y="244" width="296" height="92" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="520.0" y="261.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Skeletal muscle</text><text x="520.0" y="288.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">oxidizes ketones (mitochondria)</text><path d="M356,286 L372,286" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><rect x="372" y="344" width="296" height="92" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="520.0" y="361.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Red blood cells</text><text x="520.0" y="388.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">no mitochondria: cannot use them</text><path d="M356,386 L372,386" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="340.0" y="462.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Users: acetoacetate + succinyl-CoA → acetoacetyl-CoA (thiophorase) → 2 acetyl-CoA → citric acid cycle</text></svg>
