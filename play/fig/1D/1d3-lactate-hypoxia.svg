<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah2-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah2-line" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker><marker id="ah2-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ah2-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="ah2-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="ah2-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ah2-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="ah2-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="ah2-sub" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker><!--ah2--></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="350.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Low O₂: pyruvate becomes lactate to regenerate NAD⁺</text><rect x="40" y="60" width="150" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="115.0" y="80.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glucose</text><rect x="40" y="190" width="150" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="115.0" y="210.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 Pyruvate</text><path d="M115,100 L115,188" fill="none" stroke="#1f2430" stroke-width="2" marker-end="url(#ah2-ink)"/><text x="126.0" y="130.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">glycolysis: 2 ATP</text><text x="126.0" y="154.0" font-size="12" font-weight="700" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">2 NAD⁺ → 2 NADH</text><rect x="320" y="100" width="170" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="405.0" y="120.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PDH → citric acid cycle</text><rect x="520" y="100" width="160" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="600.0" y="112.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ETC + oxidative</text><text x="600.0" y="127.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">phosphorylation</text><path d="M190,200 L318,126" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah2-ink)"/><path d="M490,120 L518,120" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah2-ink)"/><text x="600.0" y="160.0" font-size="12" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">needs O₂</text><line x1="494" y1="110" x2="514" y2="130" stroke="#d6453d" stroke-width="5"/><line x1="494" y1="130" x2="514" y2="110" stroke="#d6453d" stroke-width="5"/><text x="405.0" y="156.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">if O₂ is plentiful</text><rect x="320" y="260" width="170" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="405.0" y="276.9" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lactate</text><text x="405.0" y="293.1" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">dehydrogenase</text><path d="M190,216 L318,278" fill="none" stroke="#1f9d63" stroke-width="2.6" marker-end="url(#ah2-green)"/><rect x="540" y="265" width="140" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="610.0" y="285.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 Lactate → blood</text><path d="M490,285 L538,285" fill="none" stroke="#1f9d63" stroke-width="2.6" marker-end="url(#ah2-green)"/><text x="405.0" y="330.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">pyruvate + NADH → lactate + NAD⁺</text><path d="M330,312 Q200,360 110,234" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah2-blue)"/><text x="140.0" y="322.5" font-size="12" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">NAD⁺ recycled</text><text x="140.0" y="337.5" font-size="12" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">so glycolysis continues</text></svg>
