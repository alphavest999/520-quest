<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">What crosses the blood–brain barrier as fuel</text><rect x="14" y="44" width="200" height="290" rx="12" fill="#fbe7e5" stroke="#d6453d"/><text x="114.0" y="62.0" font-size="13.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Blood</text><rect x="232" y="44" width="40" height="290" fill="#fdf1db" stroke="#d98a00"/><text x="252.0" y="318.0" font-size="12.5" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">BBB</text><rect x="290" y="44" width="376" height="290" rx="12" fill="#e6eefc" stroke="#2f6fdb"/><text x="478.0" y="62.0" font-size="13.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Brain (neurons have many mitochondria)</text><rect x="39.0" y="94.0" width="150" height="32" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="114.0" y="110.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">glucose</text><path d="M190,110 L330,110" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><text x="470.0" y="100.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">GLUT1 transporter</text><text x="470.0" y="120.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">main fuel, about 120 g/day</text><rect x="39.0" y="174.0" width="150" height="32" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="114.0" y="190.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ketone bodies</text><path d="M190,190 L330,190" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><text x="470.0" y="180.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">monocarboxylate transporter</text><text x="470.0" y="200.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">used after days of fasting</text><rect x="39.0" y="254.0" width="150" height="32" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="114.0" y="270.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">fatty acids</text><path d="M190,270 L246,270" fill="none" stroke="#d6453d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="245,263 259,277" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="245,277 259,263" fill="none" stroke="#d6453d" stroke-width="3"/><text x="470.0" y="260.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">bound to albumin; cross poorly</text><text x="470.0" y="280.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">little β-oxidation in neurons</text></svg>
