<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah2-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah2-line" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker><marker id="ah2-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ah2-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="ah2-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="ah2-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ah2-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="ah2-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="ah2-sub" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker><!--ah2--></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="350.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Two ways to bring cytosolic NADH electrons into the mitochondrion</text><rect x="10" y="200" width="680" height="36" fill="#f6e7c8" stroke="#d98a00" stroke-width="1.2"/><line x1="10" y1="218.0" x2="690" y2="218.0" stroke="#d98a00" stroke-width="0.8" stroke-dasharray="3 3"/><text x="24.0" y="58.0" font-size="12" font-weight="700" fill="#5b6474" text-anchor="start" dominant-baseline="middle">CYTOSOL</text><text x="24.0" y="262.0" font-size="12" font-weight="700" fill="#5b6474" text-anchor="start" dominant-baseline="middle">MATRIX</text><text x="430.0" y="218.0" font-size="11" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">inner mitochondrial membrane</text><text x="175.0" y="80.0" font-size="14" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">Glycerol-3-phosphate shuttle</text><text x="175.0" y="100.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(skeletal muscle, brain)</text><rect x="40" y="120" width="120" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="100.0" y="137.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NADH + DHAP</text><rect x="200" y="120" width="130" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="265.0" y="137.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NAD⁺ + G3P</text><path d="M160,137 L198,137" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah2-ink)"/><text x="178.0" y="161.1" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle" font-style="italic">cytosolic</text><text x="178.0" y="174.9" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle" font-style="italic">G3P DH</text><rect x="200" y="186" width="130" height="64" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="265.0" y="210.5" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">mito G3P DH</text><text x="265.0" y="225.5" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">FAD → FADH₂</text><path d="M265,154 L265,184" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah2-ink)"/><circle cx="265" cy="290" r="20" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="265.0" y="290.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Q</text><path d="M265,252 L265,268" fill="none" stroke="#7a4cd9" stroke-width="2" marker-end="url(#ah2-purple)"/><text x="175.0" y="327.9" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">enters at Q, skips Complex I</text><text x="175.0" y="344.1" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">6 H⁺ pumped → about 1.5 ATP</text><text x="525.0" y="80.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Malate–aspartate shuttle</text><text x="525.0" y="100.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(liver, heart, kidney)</text><rect x="380" y="120" width="120" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="440.0" y="137.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NADH + OAA</text><rect x="540" y="120" width="130" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="605.0" y="137.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NAD⁺ + malate</text><path d="M500,137 L538,137" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah2-ink)"/><rect x="570" y="192" width="70" height="50" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="605.0" y="210.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">malate</text><text x="605.0" y="223.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">carrier</text><path d="M605,154 L605,190" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah2-ink)"/><rect x="540" y="262" width="130" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="605.0" y="279.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">malate → OAA</text><path d="M605,244 L605,260" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah2-ink)"/><text x="605.0" y="312.0" font-size="12" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">NAD⁺ → NADH (matrix)</text><rect x="440" y="268" width="60" height="50" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="470.0" y="293.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">I</text><path d="M540,300 L502,296" fill="none" stroke="#2f6fdb" stroke-width="2" marker-end="url(#ah2-blue)"/><text x="525.0" y="343.9" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">enters at Complex I</text><text x="525.0" y="360.1" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">10 H⁺ pumped → about 2.5 ATP</text><text x="350.0" y="498.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(aspartate/α-ketoglutarate return steps of the malate–aspartate shuttle omitted for clarity)</text></svg>
