 rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="80.0" y="185.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Malate → cytosol</text><text x="80.0" y="200.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ OAA → glucose</text><path d="M172,196 L144,194" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah2-ink)"/><text x="350.0" y="279.9" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Entry (anaplerotic)</text><text x="350.0" y="296.1" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">in green</text><text x="350.0" y="325.9" font-size="13" font-weight="700" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Exits (cataplerotic)</text><text x="350.0" y="342.1" font-size="13" font-weight="700" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">in gray boxes</text></svg>
