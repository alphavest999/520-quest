<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The non-oxidative phase runs either way</text><rect x="15" y="42" width="318" height="330" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="174.0" y="58.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Need NADPH, little ribose</text><rect x="347" y="42" width="318" height="330" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="506.0" y="58.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Need ribose, little NADPH</text><rect x="69.0" y="78.0" width="210" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="174.0" y="95.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3 Glucose-6-P (18 C)</text><rect x="69.0" y="163.0" width="210" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="174.0" y="180.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3 Ribulose-5-P (15 C)</text><path d="M174.0,114.0 L174.0,161.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="182.0" y="130.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">oxidative phase</text><text x="182.0" y="145.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">6 NADPH, 3 CO₂</text><rect x="64.0" y="258.0" width="220" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="174.0" y="275.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 Fructose-6-P + 1 G3P</text><path d="M174.0,199.0 L174.0,256.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="182.0" y="220.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">transketolase (TPP),</text><text x="182.0" y="235.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">transaldolase</text><text x="174.0" y="318.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">→ back to glycolysis, or recycled</text><text x="174.0" y="336.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">to G6P for more NADPH</text><rect x="396.0" y="78.0" width="220" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="506.0" y="95.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 Fructose-6-P + 1 G3P</text><rect x="401.0" y="183.0" width="210" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="506.0" y="200.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3 Ribose-5-P (15 C)</text><path d="M506,113 L506,181" fill="none" stroke="#1f9d63" stroke-width="2.4" marker-end="url(#ah)"/><text x="516.0" y="140.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">transketolase,</text><text x="516.0" y="156.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">transaldolase (reverse)</text><text x="506.0" y="240.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">no NADPH, no CO₂</text><text x="506.0" y="262.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">→ nucleotides for DNA synthesis</text><text x="506.0" y="300.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">oxidative phase is irreversible</text><text x="506.0" y="318.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">(CO₂ is lost), so it cannot</text><text x="506.0" y="336.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">be run backward</text><text x="340.0" y="395.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Carbon balance: 3 × 5 C = 15 C = 2 × 6 C + 1 × 3 C</text></svg>
