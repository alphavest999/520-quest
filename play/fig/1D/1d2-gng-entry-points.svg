<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Where precursors enter the path to glucose</text><rect x="120.0" y="45.0" width="160" height="34" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="200.0" y="62.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glucose</text><rect x="85.0" y="133.0" width="230" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="200.0" y="150.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DHAP ⇌ Glyceraldehyde-3-P</text><rect x="120.0" y="221.0" width="160" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="200.0" y="238.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PEP</text><rect x="120.0" y="309.0" width="160" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="200.0" y="326.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Pyruvate</text><path d="M200,131.0 L200,81.0" fill="none" stroke="#1f9d63" stroke-width="2.2" marker-end="url(#ah)"/><path d="M200,219.0 L200,169.0" fill="none" stroke="#1f9d63" stroke-width="2.2" marker-end="url(#ah)"/><path d="M280,330 L424,362" fill="none" stroke="#1f9d63" stroke-width="2.2" marker-end="url(#ah)"/><path d="M470,352 L280,245" fill="none" stroke="#1f9d63" stroke-width="2.2" marker-end="url(#ah)"/><rect x="460.0" y="133.0" width="170" height="34" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="545.0" y="150.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glycerol (from fat)</text><path d="M460,150 L317,150" fill="none" stroke="#d98a00" stroke-width="2.4" marker-end="url(#ah)"/><text x="390.0" y="132.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">glycerol kinase,</text><text x="390.0" y="170.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">G3P dehydrogenase</text><rect x="15.0" y="383.0" width="110" height="34" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="70.0" y="400.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lactate</text><path d="M90,382 L150,343" fill="none" stroke="#d98a00" stroke-width="1.8" marker-end="url(#ah)"/><text x="85.0" y="360.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">LDH</text><rect x="15.0" y="253.0" width="110" height="34" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="70.0" y="270.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Alanine</text><path d="M90,288 L150,310" fill="none" stroke="#d98a00" stroke-width="1.8" marker-end="url(#ah)"/><text x="70.0" y="300.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ALT</text><circle cx="480" cy="448" r="82" fill="none" stroke="#138f9a" stroke-width="2.4" stroke-dasharray="4 3"/><text x="480.0" y="440.5" font-size="12" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">TCA</text><text x="480.0" y="455.5" font-size="12" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">cycle</text><rect x="428.0" y="353.0" width="104" height="26" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="480.0" y="366.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Oxaloacetate</text><rect x="346.0" y="435.0" width="104" height="26" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="398.0" y="448.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Citrate</text><rect x="510.0" y="435.0" width="104" height="26" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="562.0" y="448.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Malate</text><rect x="428.0" y="517.0" width="104" height="26" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="480.0" y="530.0" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Succinyl-CoA</text><rect x="555.0" y="500.0" width="120" height="44" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="615.0" y="514.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Propionyl-CoA</text><text x="615.0" y="529.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(odd-chain FA)</text><path d="M555,524 L535,528" fill="none" stroke="#d98a00" stroke-width="2.4" marker-end="url(#ah)"/><text x="598.0" y="562.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">via methylmalonyl-CoA</text><text x="598.0" y="578.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(B₁₂)</text><rect x="130.0" y="488.0" width="230" height="34" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="245.0" y="505.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Acetyl-CoA (even-chain FA)</text><path d="M362,500 L392,464" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="245.0" y="535.0" font-size="12" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">2 C in, 2 CO₂ out each turn: no net OAA</text><text x="560.0" y="62.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Net new glucose needs</text><text x="560.0" y="80.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">net new carbon in the cycle</text><text x="560.0" y="98.0" font-size="12.5" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">or at the triose / pyruvate level</text></svg>
