<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Why medium-chain fat works when carnitine is missing</text><rect x="12" y="44" width="656" height="52" fill="#ffffff"/><text x="662.0" y="70.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">Cytosol</text><rect x="12" y="96" width="656" height="12" fill="#d98a00"/><rect x="12" y="108" width="656" height="32" fill="#f1f3f6"/><text x="662.0" y="124.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">Intermembrane space</text><rect x="12" y="140" width="656" height="12" fill="#d98a00"/><rect x="12" y="152" width="656" height="178" fill="#e0f3f4"/><text x="662.0" y="166.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">Mitochondrial matrix</text><text x="20.0" y="102.0" font-size="12.0" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">outer membrane</text><text x="20.0" y="146.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">inner membrane</text><text x="190.0" y="60.0" font-size="13.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Long-chain FA (C16, C18)</text><rect x="125.0" y="70.0" width="130" height="24" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="190.0" y="82.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">fatty acyl-CoA</text><path d="M190,95 L190,116" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="124.0" y="126.0" font-size="12" font-weight="700" fill="#d6453d" text-anchor="end" dominant-baseline="middle">CPT-I + carnitine</text><polyline points="168,99 182,113" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="168,113 182,99" fill="none" stroke="#d6453d" stroke-width="3"/><rect x="130.0" y="115.0" width="120" height="22" rx="10" fill="#ffffff" stroke="#d6453d" stroke-width="1.5"/><text x="190.0" y="126.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">acylcarnitine</text><path d="M190,138 L190,170" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="200.0" y="160.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="start" dominant-baseline="middle">translocase → CPT-II</text><rect x="135.0" y="172.0" width="110" height="24" rx="10" fill="#ffffff" stroke="#d6453d" stroke-width="1.5"/><text x="190.0" y="184.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">acyl-CoA</text><text x="190.0" y="216.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Blocked: no carnitine,</text><text x="190.0" y="232.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">so no entry</text><text x="480.0" y="60.0" font-size="13.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">Medium-chain FA (C6–C12)</text><rect x="415.0" y="70.0" width="130" height="24" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="480.0" y="82.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">free fatty acid</text><path d="M480,95 L480,172" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><text x="470.0" y="120.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="end" dominant-baseline="middle">diffuses across both</text><text x="470.0" y="135.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="end" dominant-baseline="middle">membranes, no carnitine</text><rect x="365.0" y="173.0" width="230" height="26" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="480.0" y="186.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">activated to acyl-CoA in matrix</text><path d="M480,200 L480,224" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><rect x="375.0" y="225.0" width="210" height="26" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="480.0" y="238.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">β-oxidation → acetyl-CoA</text><path d="M420,252 L330,284" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><path d="M540,252 L560,284" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><rect x="185.0" y="285.0" width="230" height="26" rx="10" fill="#ffffff" stroke="#1f9d63" stroke-width="1.5"/><text x="300.0" y="298.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ketone bodies (fuel for brain)</text><rect x="460.0" y="279.0" width="200" height="38" rx="10" fill="#ffffff" stroke="#1f9d63" stroke-width="1.5"/><text x="560.0" y="290.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ATP + acetyl-CoA drive</text><text x="560.0" y="305.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">gluconeogenesis</text></svg>
