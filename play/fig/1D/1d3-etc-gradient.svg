0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker><!--ah2--></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="350.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The proton-motive force: matrix is alkaline and negative</text><rect x="10" y="150" width="680" height="80" fill="#f6e7c8" stroke="#d98a00" stroke-width="1.2"/><line x1="10" y1="190.0" x2="690" y2="190.0" stroke="#d98a00" stroke-width="0.8" stroke-dasharray="3 3"/><text x="24.0" y="80.0" font-size="13" font-weight="600" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Intermembrane space</text><text x="24.0" y="310.0" font-size="13" font-weight="600" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Matrix</text><rect x="73.0" y="128.0" width="74" height="124" rx="14" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="110.0" y="190.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">I</text><rect x="201.0" y="179.0" width="58" height="66" rx="14" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="230.0" y="212.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">II</text><rect x="345.0" y="134.0" width="70" height="112" rx="14" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="380.0" y="190.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">III</text><rect x="495.0" y="134.0" width="70" height="112" rx="14" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="530.0" y="190.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">IV</text><rect x="600" y="144" width="60" height="92" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="630.0" y="190.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">F₀</text><circle cx="630" cy="268" r="30" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="630.0" y="268.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">F₁</text><text x="630.0" y="314.0" font-size="12" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">ADP + Pᵢ → ATP</text><path d="M630,106 L630,142" fill="none" stroke="#d6453d" stroke-width="2.2" marker-end="url(#ah2-red)"/><text x="652.0" y="116.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">H⁺</text><circle cx="300" cy="190.0" r="20" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="300.0" y="190.0" font-size="15" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Q</text><circle cx="460" cy="130" r="18" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="460.0" y="130.0" font-size="15" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">c</text><path d="M148,190.0 L278,190.0" fill="none" stroke="#7a4cd9" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah2-purple)"/><path d="M260,212.0 L284,202.0" fill="none" stroke="#7a4cd9" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah2-purple)"/><path d="M322,190.0 L344,190.0" fill="none" stroke="#7a4cd9" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah2-purple)"/><path d="M410,146 L442,128" fill="none" stroke="#7a4cd9" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah2-purple)"/><path d="M478,130 L500,148" fill="none" stroke="#7a4cd9" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah2-purple)"/><text x="110.0" y="274.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NADH → NAD⁺</text><path d="M110,262 L110,236" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah2-ink)"/><text x="230.0" y="284.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">succinate →</text><text x="230.0" y="299.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">fumarate</text><path d="M230,274 L230,252" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah2-ink)"/><text x="530.0" y="274.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">½O₂ + 2H⁺ → H₂O</text><path d="M530,236 L530,260" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah2-ink)"/><path d="M128,236 L128,104" fill="none" stroke="#d6453d" stroke-width="2.2" marker-end="url(#ah2-red)"/><text x="104.0" y="100.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">4 H⁺</text><path d="M398,236 L398,104" fill="none" stroke="#d6453d" stroke-width="2.2" marker-end="url(#ah2-red)"/><text x="374.0" y="100.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">4 H⁺</text><path d="M548,236 L548,104" fill="none" stroke="#d6453d" stroke-width="2.2" marker-end="url(#ah2-red)"/><text x="524.0" y="100.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">2 H⁺</text><rect x="170" y="46" width="380" height="46" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="360.0" y="69.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Intermembrane space: more H⁺, lower pH, + side</text><rect x="170" y="350" width="380" height="46" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="360.0" y="373.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Matrix: fewer H⁺, higher pH (≈ 0.5–0.8 unit), − side</text></svg>
