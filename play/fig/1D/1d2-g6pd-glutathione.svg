<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Red blood cells depend on G6PD for antioxidant defense</text><rect x="20" y="45" width="640" height="300" rx="30" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="340.0" y="65.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Red blood cell (no mitochondria, no nucleus)</text><rect x="35.0" y="103.0" width="130" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="100.0" y="120.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glucose-6-P</text><rect x="215.0" y="103.0" width="110" height="34" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="270.0" y="120.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NADPH</text><rect x="215.0" y="213.0" width="110" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="270.0" y="230.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NADP⁺</text><rect x="385.0" y="103.0" width="110" height="34" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="440.0" y="120.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 GSH</text><rect x="385.0" y="213.0" width="110" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="440.0" y="230.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">GSSG</text><rect x="540.0" y="103.0" width="100" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="590.0" y="120.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">H₂O₂</text><rect x="540.0" y="213.0" width="100" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="590.0" y="230.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 H₂O</text><path d="M165,120 L213,120" fill="none" stroke="#1f2430" stroke-width="2.4" marker-end="url(#ah)"/><text x="190.0" y="100.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">G6PD</text><polyline points="182,137 198,153" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="182,153 198,137" fill="none" stroke="#d6453d" stroke-width="3"/><text x="190.0" y="168.0" font-size="11.5" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">deficient</text><path d="M270,140 L270,210" fill="none" stroke="#2f6fdb" stroke-width="2.2" marker-end="url(#ah)"/><path d="M418,210 L418,140" fill="none" stroke="#1f9d63" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="270,190 418,190" fill="none" stroke="#8a93a3" stroke-width="1.8" stroke-dasharray="6 4"/><text x="344.0" y="160.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">glutathione</text><text x="344.0" y="176.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">reductase</text><path d="M462,140 L462,210" fill="none" stroke="#d6453d" stroke-width="2.2" marker-end="url(#ah)"/><path d="M590,140 L590,210" fill="none" stroke="#1f9d63" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="462,190 590,190" fill="none" stroke="#8a93a3" stroke-width="1.8" stroke-dasharray="6 4"/><text x="526.0" y="160.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">glutathione</text><text x="526.0" y="176.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">peroxidase</text><text x="340.0" y="285.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Oxidant drug, infection or fava beans → more H₂O₂</text><text x="340.0" y="310.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">Low NADPH → low GSH → oxidized hemoglobin (Heinz bodies) and membranes → hemolysis</text></svg>
