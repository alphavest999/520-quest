<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Which enzyme acts where on triacylglycerol (TAG)?</text><rect x="12" y="44" width="322" height="180" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="173.0" y="61.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Small-intestine lumen (after a meal)</text><text x="26.0" y="84.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Dietary TAG in bile-salt micelles</text><text x="26.0" y="102.8" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Pancreatic lipase → 2-monoacylglycerol</text><text x="26.0" y="121.7" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">   + 2 free fatty acids</text><text x="26.0" y="140.6" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Enterocytes re-make TAG and pack</text><text x="26.0" y="159.4" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">it into chylomicrons → lymph → blood</text><rect x="346" y="44" width="322" height="180" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="507.0" y="61.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Capillary in adipose tissue or muscle</text><rect x="360" y="132" width="294" height="16" fill="#fbe7e5" stroke="#d6453d" stroke-width="1"/><text x="507.0" y="140.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">endothelial cell surface</text><circle cx="410" cy="100" r="28" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="410.0" y="96.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">chylo-</text><text x="410.0" y="109.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">micron</text><text x="470.0" y="92.0" font-size="12.5" font-weight="700" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">apoC-II</text><polyline points="438,97 467,92" fill="none" stroke="#7a4cd9" stroke-width="1.5"/><text x="470.0" y="108.0" font-size="12" font-weight="400" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">activates LPL</text><path d="M391,132 Q400,116 409,132 z" fill="#1f9d63"/><path d="M431,132 Q440,116 449,132 z" fill="#1f9d63"/><path d="M471,132 Q480,116 489,132 z" fill="#1f9d63"/><path d="M511,132 Q520,116 529,132 z" fill="#1f9d63"/><path d="M551,132 Q560,116 569,132 z" fill="#1f9d63"/><path d="M591,132 Q600,116 609,132 z" fill="#1f9d63"/><text x="590.0" y="104.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">LPL</text><path d="M520,150 L520,176" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><text x="528.0" y="166.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">fatty acids into cells</text><path d="M334,120 L346,120" fill="none" stroke="#5b6474" stroke-width="1.8" marker-end="url(#ah)"/><rect x="12" y="236" width="322" height="192" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="173.0" y="253.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Inside the adipocyte (fasting)</text><circle cx="70" cy="300" r="30" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="70.0" y="292.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">stored</text><text x="70.0" y="307.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">TAG</text><text x="112.0" y="280.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Hormone-sensitive lipase (HSL)</text><text x="112.0" y="298.9" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">frees stored fat as fatty acids</text><text x="112.0" y="317.7" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">+ glycerol for export to blood.</text><text x="112.0" y="336.6" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Glucagon/epinephrine turn it on,</text><text x="112.0" y="355.4" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">insulin turns it off.</text><rect x="346" y="236" width="322" height="192" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="507.0" y="253.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">On HDL particles in plasma</text><circle cx="404" cy="300" r="30" fill="#ffffff" stroke="#7a4cd9" stroke-width="1.5"/><text x="404.0" y="300.0" font-size="13" font-weight="700" fill="#7a4cd9" text-anchor="middle" dominant-baseline="middle">HDL</text><text x="446.0" y="280.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">LCAT (lecithin-cholesterol</text><text x="446.0" y="298.9" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">acyltransferase) moves a fatty</text><text x="446.0" y="317.7" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">acid from lecithin to cholesterol,</text><text x="446.0" y="336.6" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">making cholesteryl ester.</text><text x="446.0" y="355.4" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">No TAG is hydrolysed.</text></svg>
