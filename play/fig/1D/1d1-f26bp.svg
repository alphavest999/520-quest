<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fructose-2,6-bisphosphate links hormones to liver PFK-1</text><rect x="30" y="50" width="180" height="44" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="120.0" y="72.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Insulin (fed)</text><rect x="470" y="50" width="180" height="44" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="560.0" y="72.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glucagon (fasting)</text><rect x="200" y="135" width="280" height="62" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="340.0" y="157.2" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Bifunctional enzyme</text><text x="340.0" y="174.8" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PFK-2  /  FBPase-2</text><path d="M120.0,94 L260,135" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><text x="85.0" y="117.5" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">dephosphorylated:</text><text x="85.0" y="132.5" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">PFK-2 active</text><path d="M560.0,94 L420,135" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="595.0" y="117.5" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">PKA phosphorylates:</text><text x="595.0" y="132.5" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">FBPase-2 active</text><rect x="240" y="235" width="200" height="46" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="340.0" y="258.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fructose-2,6-BP</text><path d="M340.0,197 L340.0,235" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40" y="330" width="250" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="165.0" y="346.6" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">PFK-1 (glycolysis)</text><text x="165.0" y="363.4" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">F6P → F-1,6-BP</text><rect x="390" y="330" width="250" height="50" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="515.0" y="346.6" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">FBPase-1 (gluconeogenesis)</text><text x="515.0" y="363.4" font-size="13.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">F-1,6-BP → F6P</text><path d="M290,281 L180,330" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><text x="140.0" y="300.0" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">+ strongest activator</text><path d="M390,281 L500,330" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="530.0" y="300.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">− inhibits</text><text x="340.0" y="405.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Not activators of PFK-1: F-1,6-BP (activates pyruvate kinase), citrate (inhibits), G6P (inhibits hexokinase).</text></svg>
