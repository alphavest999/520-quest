<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah2-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah2-line" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker><marker id="ah2-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ah2-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="ah2-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="ah2-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ah2-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="ah2-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="ah2-sub" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker><!--ah2--></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="350.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Brown fat: UCP1 lets protons back in without making ATP</text><rect x="10" y="150" width="680" height="70" fill="#f6e7c8" stroke="#d98a00" stroke-width="1.2"/><line x1="10" y1="185.0" x2="690" y2="185.0" stroke="#d98a00" stroke-width="0.8" stroke-dasharray="3 3"/><text x="24.0" y="90.0" font-size="13" font-weight="600" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Intermembrane space (high H⁺, + side)</text><text x="24.0" y="290.0" font-size="13" font-weight="600" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Matrix (low H⁺, − side)</text><rect x="60" y="136" width="110" height="98" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="115.0" y="176.9" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ETC</text><text x="115.0" y="193.1" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(I, III, IV)</text><path d="M158,254 L158,110" fill="none" stroke="#d6453d" stroke-width="2.6" marker-end="url(#ah2-red)"/><text x="176.0" y="106.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="start" dominant-baseline="middle">H⁺ pumped out</text><text x="88.0" y="246.8" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">fatty acid-derived</text><text x="88.0" y="261.2" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">NADH, FADH₂ → O₂</text><rect x="330" y="144" width="56" height="82" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="358.0" y="185.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">F₀</text><circle cx="358" cy="256" r="28" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="358.0" y="256.0" font-size="13" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">F₁</text><text x="358.0" y="302.0" font-size="12" font-weight="600" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">little ATP made</text><rect x="520" y="142" width="26" height="86" rx="8" fill="#fdf1db" stroke="#d98a00" stroke-width="2"/><rect x="572" y="142" width="26" height="86" rx="8" fill="#fdf1db" stroke="#d98a00" stroke-width="2"/><text x="559.0" y="126.0" font-size="14" font-weight="700" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">UCP1</text><path d="M559,140 L559,254" fill="none" stroke="#d6453d" stroke-width="3" marker-end="url(#ah2-red)"/><text x="559.0" y="274.0" font-size="18" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">heat</text><text x="559.0" y="298.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(gradient energy released)</text><text x="350.0" y="460.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">With the gradient dissipated, the ETC runs fast and burns fat; O₂ use rises.</text></svg>
