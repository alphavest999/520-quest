<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Where glycolysis spends and makes ATP</text><rect x="20" y="50" width="170" height="28" rx="7" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="105.0" y="64.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glucose</text><rect x="20" y="100" width="170" height="28" rx="7" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="105.0" y="114.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glucose-6-P</text><rect x="20" y="150" width="170" height="28" rx="7" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="105.0" y="164.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fructose-6-P</text><rect x="20" y="200" width="170" height="28" rx="7" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="105.0" y="214.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fructose-1,6-BP</text><rect x="20" y="250" width="170" height="28" rx="7" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="105.0" y="264.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">G3P (+ DHAP)  (×2)</text><rect x="20" y="300" width="170" height="28" rx="7" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="105.0" y="314.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">1,3-BPG  (×2)</text><rect x="20" y="350" width="170" height="28" rx="7" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="105.0" y="364.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3-Phosphoglycerate  (×2)</text><rect x="20" y="400" width="170" height="28" rx="7" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="105.0" y="414.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2-Phosphoglycerate  (×2)</text><rect x="20" y="450" width="170" height="28" rx="7" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="105.0" y="464.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Phosphoenolpyruvate  (×2)</text><rect x="20" y="500" width="170" height="28" rx="7" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="105.0" y="514.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Pyruvate  (×2)</text><path d="M105.0,79 L105.0,99" fill="none" stroke="#d6453d" stroke-width="1.6" marker-end="url(#ah)"/><text x="204.0" y="89.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="start" dominant-baseline="middle">Hexokinase  (ATP → ADP)</text><path d="M105.0,129 L105.0,149" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah)"/><text x="204.0" y="139.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Phosphoglucose isomerase</text><path d="M105.0,179 L105.0,199" fill="none" stroke="#d6453d" stroke-width="1.6" marker-end="url(#ah)"/><text x="204.0" y="189.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="start" dominant-baseline="middle">PFK-1  (ATP → ADP)</text><path d="M105.0,229 L105.0,249" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah)"/><text x="204.0" y="239.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Aldolase + TPI  (DHAP → G3P)</text><path d="M105.0,279 L105.0,299" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah)"/><text x="204.0" y="289.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">GAPDH  (NAD⁺ + Pi → NADH)</text><path d="M105.0,329 L105.0,349" fill="none" stroke="#1f9d63" stroke-width="1.6" marker-end="url(#ah)"/><text x="204.0" y="339.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">Phosphoglycerate kinase  (ADP → ATP)</text><path d="M105.0,379 L105.0,399" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah)"/><text x="204.0" y="389.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Phosphoglycerate mutase</text><path d="M105.0,429 L105.0,449" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah)"/><text x="204.0" y="439.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Enolase  (− H₂O)</text><path d="M105.0,479 L105.0,499" fill="none" stroke="#1f9d63" stroke-width="1.6" marker-end="url(#ah)"/><text x="204.0" y="489.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">Pyruvate kinase  (ADP → ATP)</text><text x="340.0" y="552.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Net per glucose: −2 + 4 = +2 ATP. Substrate-level: 1,3-BPG and PEP give their phosphate to ADP.</text></svg>
