33732" r="5" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><polyline points="125.40638502031966,197.82499968278273 102.8268039248704,192.75688359024832" fill="none" stroke="#2f6fdb" stroke-width="2.4"/><polyline points="102.8268039248704,192.75688359024832 89.77517489131293,182.39974838945668" fill="none" stroke="#2f6fdb" stroke-width="2.4"/><circle cx="89.77517489131293" cy="182.39974838945668" r="5" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><polyline points="102.8268039248704,192.75688359024832 86.60075850601011,196.54247734317016" fill="none" stroke="#2f6fdb" stroke-width="2.4"/><circle cx="86.60075850601011" cy="196.54247734317016" r="5" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><circle cx="170" cy="320" r="7" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><polyline points="510,320 510.0,215.0" fill="none" stroke="#2f6fdb" stroke-width="2.4"/><polyline points="510.0,215.0 542.883394378809,146.92619906213764" fill="none" stroke="#2f6fdb" stroke-width="2.4"/><circle cx="542.883394378809" cy="146.92619906213764" r="5" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><polyline points="510.0,215.0 477.116605621191,146.92619906213764" fill="none" stroke="#2f6fdb" stroke-width="2.4"/><circle cx="477.116605621191" cy="146.92619906213764" r="5" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.5"/><circle cx="510" cy="320" r="7" fill="#d6453d" stroke="#d6453d" stroke-width="1.5"/><text x="170.0" y="350.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glycogen-like: branch every ~8–12 residues</text><text x="170.0" y="370.0" font-size="13" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">16 nonreducing ends (green)</text><text x="510.0" y="350.0" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Amylopectin-like: branch every ~24–30</text><text x="510.0" y="370.0" font-size="13" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">2 nonreducing ends</text><text x="340.0" y="60.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Glycogen phosphorylase removes glucose (as glucose-1-P) only from nonreducing ends,</text><text x="340.0" y="78.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">so every extra end is another site working at once. Branches also raise solubility.</text><text x="340.0" y="392.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Schematic only (red dot = single reducing end).</text></svg>
