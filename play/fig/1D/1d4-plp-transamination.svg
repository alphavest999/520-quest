<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Transamination runs on pyridoxal phosphate (PLP, vitamin B₆)</text><rect x="95.0" y="56.0" width="170" height="48" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="180.0" y="71.9" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Enzyme–PLP</text><text x="180.0" y="88.1" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(aldehyde form)</text><rect x="65.0" y="226.0" width="230" height="48" rx="10" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="180.0" y="242.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Enzyme–PMP</text><text x="180.0" y="257.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(pyridoxamine, carries –NH₂)</text><path d="M140,106 Q180.0,165.0 140,224" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M220,224 Q180.0,165.0 220,106" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="30.0" y="140.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">amino acid₁</text><text x="30.0" y="156.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">(alanine) in</text><text x="30.0" y="196.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">α-keto acid₁</text><text x="30.0" y="212.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">(pyruvate) out</text><text x="262.0" y="196.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">α-keto acid₂</text><text x="262.0" y="212.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">(α-ketoglutarate) in</text><text x="262.0" y="140.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">amino acid₂</text><text x="262.0" y="156.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">(glutamate) out</text><text x="180.0" y="300.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ping-pong: the –NH₂ is parked on the cofactor between</text><text x="180.0" y="317.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">the two half-reactions; no free NH₃ is released.</text><rect x="410" y="60" width="260" height="40" fill="#e6eefc" stroke="#8a93a3" stroke-width="1"/><text x="465.0" y="80.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cofactor (vitamin)</text><text x="595.0" y="80.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Job</text><rect x="410" y="100" width="260" height="40" fill="#e3f5ec" stroke="#8a93a3" stroke-width="1"/><text x="465.0" y="120.0" font-size="12" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">PLP (B₆)</text><text x="595.0" y="120.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">transamination</text><rect x="410" y="140" width="260" height="40" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1"/><text x="465.0" y="160.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">TPP (B₁)</text><text x="595.0" y="152.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">α-keto acid</text><text x="595.0" y="167.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">decarboxylation</text><rect x="410" y="180" width="260" height="40" fill="#ffffff" stroke="#8a93a3" stroke-width="1"/><text x="465.0" y="200.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Biotin (B₇)</text><text x="595.0" y="200.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">carboxylation (+CO₂)</text><rect x="410" y="220" width="260" height="40" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1"/><text x="465.0" y="240.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">FAD (B₂)</text><text x="595.0" y="240.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">redox (2 H⁺ + 2 e⁻)</text><polyline points="520,60 520,260" fill="none" stroke="#8a93a3" stroke-width="1"/><text x="340.0" y="410.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">PLP also serves amino acid decarboxylases (e.g. dopa → dopamine) and glycogen phosphorylase.</text></svg>
