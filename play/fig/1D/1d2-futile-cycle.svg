<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Why glycolysis and gluconeogenesis are never fully on together</text><rect x="115.0" y="63.0" width="170" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="200.0" y="80.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fructose-6-P</text><rect x="110.0" y="253.0" width="180" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="200.0" y="270.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fructose-1,6-bisP</text><path d="M150,98 L150,252" fill="none" stroke="#d6453d" stroke-width="2.6" marker-end="url(#ah)"/><text x="140.0" y="160.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="end" dominant-baseline="middle">PFK-1</text><text x="140.0" y="182.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="end" dominant-baseline="middle">ATP → ADP</text><path d="M250,252 L250,98" fill="none" stroke="#1f9d63" stroke-width="2.6" marker-end="url(#ah)"/><text x="260.0" y="160.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">FBPase-1</text><text x="260.0" y="182.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">H₂O → Pi</text><rect x="380" y="70" width="280" height="150" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="395.0" y="95.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">If both ran at full speed:</text><text x="395.0" y="119.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">F6P + ATP → F1,6BP + ADP</text><text x="395.0" y="143.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">F1,6BP + H₂O → F6P + Pi</text><text x="395.0" y="167.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="start" dominant-baseline="middle">Net: ATP + H₂O → ADP + Pi</text><text x="395.0" y="191.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">only heat; no product made</text><rect x="380" y="240" width="280" height="70" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="395.0" y="262.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Reciprocal control: signals (F-2,6-BP,</text><text x="395.0" y="282.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">AMP, citrate) turn one on, the other off</text></svg>
