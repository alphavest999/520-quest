<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Breaking down glycogen: phosphorylase, then debranching</text><text x="20.0" y="62.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">1. Glycogen phosphorylase: Pi cleaves α(1→4) bonds from the chain ends</text><polyline points="110,137 292,137" fill="none" stroke="#2f6fdb" stroke-width="2"/><circle cx="110" cy="137" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="136" cy="137" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="162" cy="137" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="188" cy="137" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="214" cy="137" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="240" cy="137" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="266" cy="137" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="292" cy="137" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="84.0" y="137.0" font-size="16" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">…</text><polyline points="188,137 188,102" fill="none" stroke="#7a4cd9" stroke-width="2.6"/><polyline points="188,102 344,102" fill="none" stroke="#2f6fdb" stroke-width="2"/><circle cx="188" cy="102" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="214" cy="102" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="240" cy="102" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="266" cy="102" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="292" cy="102" r="11" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><circle cx="318" cy="102" r="11" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><circle cx="344" cy="102" r="11" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><path d="M370,102 L420,102" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><text x="428.0" y="102.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">3 glucose-1-P</text><text x="428.0" y="124.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">stops 4 residues from the branch</text><text x="176.0" y="119.0" font-size="11" font-weight="400" fill="#7a4cd9" text-anchor="end" dominant-baseline="middle">α(1→6)</text><text x="20.0" y="200.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">2. Debranching enzyme (transferase): moves 3 residues to a chain end</text><polyline points="110,275 370,275" fill="none" stroke="#2f6fdb" stroke-width="2"/><circle cx="110" cy="275" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="136" cy="275" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="162" cy="275" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="188" cy="275" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="214" cy="275" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="240" cy="275" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="266" cy="275" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="292" cy="275" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="318" cy="275" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="344" cy="275" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="370" cy="275" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="318" cy="275" r="11" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="344" cy="275" r="11" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><circle cx="370" cy="275" r="11" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="84.0" y="275.0" font-size="16" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">…</text><polyline points="188,275 188,240" fill="none" stroke="#7a4cd9" stroke-width="2.6"/><circle cx="188" cy="240" r="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><path d="M240,236 Q294.1,237.2 344,258" fill="none" stroke="#d98a00" stroke-width="1.8" marker-end="url(#ah)"/><text x="406.0" y="275.0" font-size="11.5" font-weight="400" fill="#d98a00" text-anchor="start" dominant-baseline="middle">3 residues joined α(1→4)</text><text x="206.0" y="230.0" font-size="11.5" font-weight="400" fill="#d6453d" text-anchor="start" dominant-baseline="middle">1 glucose left at the α(1→6) branch</text><text x="20.0" y="338.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">3. Debranching enzyme (α-1,6-glucosidase): hydrolyzes the branch point</text><polyline points="110,413 370,413" fill="none" stroke="#2f6fdb" stroke-width="2"/><circle cx="110" cy="413" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="136" cy="413" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="162" cy="413" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="188" cy="413" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="214" cy="413" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="240" cy="413" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="266" cy="413" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="292" cy="413" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="318" cy="413" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="344" cy="413" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="370" cy="413" r="11" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="84.0" y="413.0" font-size="16" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">…</text><circle cx="452" cy="376" r="11" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><path d="M194,400 L438,378" fill="none" stroke="#d6453d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="472.0" y="376.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="start" dominant-baseline="middle">free glucose (+ H₂O)</text><text x="340.0" y="448.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Net: about 90% of residues leave as glucose-1-P, about 10% as free glucose.</text><rect x="25.7" y="474.5" width="208.5" height="23.0" rx="11.5" fill="#5b6474"/><text x="130.0" y="486.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">phosphorylase → glucose-1-P</text><rect x="252.9" y="474.5" width="194.2" height="23.0" rx="11.5" fill="#5b6474"/><text x="350.0" y="486.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">α-1,6 step → free glucose</text></svg>
