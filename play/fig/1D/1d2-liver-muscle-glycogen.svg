"267.5" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">phosphatase (ER)</text><path d="M195,300 L320,300" fill="none" stroke="#1f9d63" stroke-width="2.6" marker-end="url(#ah)"/><text x="258.0" y="285.0" font-size="12" font-weight="400" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">GLUT2</text><text x="258.0" y="322.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">→ blood</text><polyline points="581,211 599,229" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="581,229 599,211" fill="none" stroke="#d6453d" stroke-width="3"/><text x="590.0" y="245.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">no glucose-6-</text><text x="590.0" y="261.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">phosphatase</text><path d="M537,220 L575,220" fill="none" stroke="#8a93a3" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="387.0" y="283.0" width="160" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="467.0" y="300.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glycolysis → ATP</text><path d="M467,239 L467.0,281.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="610.0" y="284.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">G6P is charged:</text><text x="610.0" y="300.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">stays inside</text><text x="170.0" y="372.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">keeps blood glucose up for the body</text><text x="506.0" y="372.0" font-size="13" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">fuels the muscle&#x27;s own contraction</text><text x="340.0" y="410.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Phosphorylase, phosphoglucomutase and hexokinase are present in both tissues.</text></svg>
