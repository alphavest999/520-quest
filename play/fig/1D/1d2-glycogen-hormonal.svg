<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Phosphorylation flips glycogen enzymes in opposite directions</text><rect x="15" y="42" width="318" height="340" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="174.0" y="58.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Epinephrine (muscle), glucagon (liver)</text><rect x="347" y="42" width="318" height="340" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="506.0" y="58.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Insulin (fed state)</text><rect x="49.0" y="68.0" width="250" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="174.0" y="85.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">receptor → Gs → adenylyl cyclase</text><rect x="49.0" y="123.0" width="250" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="174.0" y="140.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cAMP ↑</text><path d="M174,102 L174,123" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="49.0" y="178.0" width="250" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="174.0" y="195.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">protein kinase A (PKA)</text><path d="M174,157 L174,178" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M134,212 L95,252" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M214,212 L255,318" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="35.0" y="250.0" width="120" height="40" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="95.0" y="262.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">phosphorylase</text><text x="95.0" y="277.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">kinase</text><path d="M95,290 L95,318" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="30.0" y="320.0" width="130" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="95.0" y="332.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">phosphorylase</text><text x="95.0" y="347.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">–P: ACTIVE</text><rect x="195.0" y="320.0" width="120" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="255.0" y="332.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">synthase –P:</text><text x="255.0" y="347.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">INACTIVE</text><rect x="376.0" y="68.0" width="260" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="506.0" y="85.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">insulin receptor (tyrosine kinase)</text><rect x="376.0" y="123.0" width="260" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="506.0" y="140.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">signaling cascade</text><path d="M506,102 L506,123" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="376.0" y="178.0" width="260" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="506.0" y="195.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">protein phosphatase-1 (PP1)</text><path d="M506,157 L506,178" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="506.0" y="300.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">dephosphorylates</text><path d="M466,212 L427,318" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M546,212 L587,318" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="362.0" y="320.0" width="130" height="40" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="427.0" y="332.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">phosphorylase:</text><text x="427.0" y="347.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">INACTIVE</text><rect x="527.0" y="320.0" width="120" height="40" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="587.0" y="332.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">synthase:</text><text x="587.0" y="347.5" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ACTIVE</text><text x="340.0" y="404.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Rule: phosphate ON → breakdown ON, synthesis OFF.</text></svg>
