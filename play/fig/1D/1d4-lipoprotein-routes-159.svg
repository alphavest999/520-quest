<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="345.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lipoprotein routes: what each particle carries, and to where</text><text x="14.0" y="52.0" font-size="13.5" font-weight="700" fill="#d98a00" text-anchor="start" dominant-baseline="middle">Exogenous route: dietary fat</text><rect x="14.0" y="64" width="143.0" height="62" rx="10" fill="#f1f3f6" stroke="#d98a00" stroke-width="1.5"/><text x="85.5" y="87.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Small</text><text x="85.5" y="102.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">intestine</text><rect x="187.0" y="64" width="143.0" height="62" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="258.5" y="79.4" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Chylomicron</text><text x="258.5" y="95.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">apoB-48</text><text x="258.5" y="110.6" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">dietary TAG</text><path d="M160.0,95 L184.0,95" fill="none" stroke="#d98a00" stroke-width="1.8" marker-end="url(#ah)"/><rect x="360.0" y="64" width="143.0" height="62" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="431.5" y="79.4" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Chylomicron</text><text x="431.5" y="95.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">remnant</text><text x="431.5" y="110.6" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(LPL took TAG)</text><path d="M333.0,95 L357.0,95" fill="none" stroke="#d98a00" stroke-width="1.8" marker-end="url(#ah)"/><rect x="533.0" y="64" width="143.0" height="62" rx="10" fill="#f1f3f6" stroke="#d98a00" stroke-width="1.5"/><text x="604.5" y="87.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Liver</text><text x="604.5" y="102.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(remnant uptake)</text><path d="M506.0,95 L530.0,95" fill="none" stroke="#d98a00" stroke-width="1.8" marker-end="url(#ah)"/><text x="14.0" y="184.0" font-size="13.5" font-weight="700" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">Endogenous route: fat and cholesterol made by the liver</text><rect x="14.0" y="196" width="108.4" height="62" rx="10" fill="#f1f3f6" stroke="#2f6fdb" stroke-width="1.5"/><text x="68.2" y="227.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Liver</text><rect x="152.4" y="196" width="108.4" height="62" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="206.6" y="211.4" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">VLDL</text><text x="206.6" y="227.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">apoB-100</text><text x="206.6" y="242.6" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">liver-made TAG</text><path d="M125.4,227 L149.4,227" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><rect x="290.8" y="196" width="108.4" height="62" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="345.0" y="211.4" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">IDL</text><text x="345.0" y="227.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(LPL took</text><text x="345.0" y="242.6" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">most TAG)</text><path d="M263.8,227 L287.8,227" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><rect x="429.20000000000005" y="196" width="108.4" height="62" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="483.4" y="211.4" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">LDL</text><text x="483.4" y="227.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">mostly</text><text x="483.4" y="242.6" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cholesterol</text><path d="M402.20000000000005,227 L426.20000000000005,227" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><rect x="567.6" y="196" width="108.4" height="62" rx="10" fill="#f1f3f6" stroke="#2f6fdb" stroke-width="1.5"/><text x="621.8" y="211.4" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">LDL receptor</text><text x="621.8" y="227.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">on tissues:</text><text x="621.8" y="242.6" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">endocytosis</text><path d="M540.6,227 L564.6,227" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah)"/><text x="14.0" y="316.0" font-size="13.5" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">Reverse cholesterol transport</text><rect x="14.0" y="328" width="200.66666666666666" height="62" rx="10" fill="#f1f3f6" stroke="#1f9d63" stroke-width="1.5"/><text x="114.3" y="351.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Peripheral</text><text x="114.3" y="366.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">tissues</text><rect x="244.66666666666666" y="328" width="200.66666666666666" height="62" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="345.0" y="343.4" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">HDL</text><text x="345.0" y="359.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">apoA-I, LCAT</text><text x="345.0" y="374.6" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">picks up chol.</text><path d="M217.66666666666666,359 L241.66666666666666,359" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><rect x="475.3333333333333" y="328" width="200.66666666666666" height="62" rx="10" fill="#f1f3f6" stroke="#1f9d63" stroke-width="1.5"/><text x="575.7" y="351.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Liver</text><text x="575.7" y="366.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(bile, bile acids)</text><path d="M448.3333333333333,359 L472.3333333333333,359" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/></svg>
