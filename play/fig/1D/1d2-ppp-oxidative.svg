<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Oxidative pentose phosphate pathway (per glucose-6-P)</text><rect x="100.0" y="53.0" width="200" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="200.0" y="70.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Glucose-6-P (6C)</text><rect x="85.0" y="153.0" width="230" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="200.0" y="170.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">6-Phosphoglucono-δ-lactone</text><rect x="100.0" y="233.0" width="200" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="200.0" y="250.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">6-Phosphogluconate (6C)</text><rect x="100.0" y="333.0" width="200" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="200.0" y="350.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ribulose-5-P (5C)</text><rect x="100.0" y="413.0" width="200" height="34" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="200.0" y="430.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ribose-5-P (5C)</text><rect x="20" y="98" width="400" height="44" rx="8" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><path d="M200,88 L200,151" fill="none" stroke="#d6453d" stroke-width="2.6" marker-end="url(#ah)"/><text x="188.0" y="120.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="end" dominant-baseline="middle">G6PD (rate-limiting)</text><text x="212.0" y="120.0" font-size="12.5" font-weight="700" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">NADP⁺ → NADPH  #1</text><path d="M200.0,189.0 L200.0,231.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="208.0" y="210.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">lactonase (+ H₂O)</text><path d="M200,268 L200,331" fill="none" stroke="#1f2430" stroke-width="2.2" marker-end="url(#ah)"/><text x="188.0" y="300.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="end" dominant-baseline="middle">6-phosphogluconate DH</text><text x="212.0" y="292.0" font-size="12.5" font-weight="700" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">NADP⁺ → NADPH  #2</text><text x="212.0" y="310.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="start" dominant-baseline="middle">CO₂ released (C1)</text><path d="M200.0,369.0 L200.0,411.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="208.0" y="390.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">isomerase</text><text x="200.0" y="462.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">→ nucleotides (RNA, DNA, ATP, NAD, CoA)</text><rect x="440" y="60" width="220" height="120" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="452.0" y="82.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">G6PD control</text><text x="452.0" y="103.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">NADP⁺ activates (+)</text><text x="452.0" y="124.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="start" dominant-baseline="middle">NADPH inhibits (−)</text><text x="452.0" y="145.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">high NADP⁺ = NADPH used up</text><text x="452.0" y="166.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">→ make more</text><rect x="440" y="205" width="220" height="110" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="452.0" y="227.0" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">Tally per G6P</text><text x="452.0" y="248.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">2 NADPH</text><text x="452.0" y="269.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">1 CO₂ (6C → 5C)</text><text x="452.0" y="290.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">0 ATP made or used</text></svg>
