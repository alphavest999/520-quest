0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker><!--ah2--></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="350.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A cis double bond skips one FAD-linked step</text><text x="175.0" y="62.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Stearate 18:0</text><text x="525.0" y="62.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Oleate 18:1 cis-Δ⁹</text><rect x="40" y="84" width="270" height="46" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="175.0" y="99.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">rounds 1–3: normal</text><text x="175.0" y="114.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3 FADH₂ + 3 NADH</text><rect x="390" y="84" width="270" height="46" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="525.0" y="99.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">rounds 1–3: normal</text><text x="525.0" y="114.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3 FADH₂ + 3 NADH</text><rect x="40" y="160" width="270" height="64" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="175.0" y="184.2" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">round 4: acyl-CoA DH makes the</text><text x="175.0" y="199.8" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">trans-Δ² bond → FADH₂</text><rect x="390" y="150" width="270" height="84" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="525.0" y="169.5" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">round 4 starts with a cis-Δ³ bond;</text><text x="525.0" y="184.5" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">enoyl-CoA isomerase moves it to</text><text x="525.0" y="199.5" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">trans-Δ² (no FAD, no ATP)</text><text x="525.0" y="214.5" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ no FADH₂ this round</text><rect x="40" y="254" width="270" height="46" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="175.0" y="277.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">rest of round 4 and rounds 5–8: normal</text><rect x="390" y="254" width="270" height="46" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="525.0" y="277.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">rest of round 4 and rounds 5–8: normal</text><path d="M175,130 L175,158" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah2-ink)"/><path d="M175,224 L175,252" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah2-ink)"/><path d="M525,130 L525,150" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah2-ink)"/><path d="M525,234 L525,252" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah2-ink)"/><rect x="40" y="318" width="270" height="64" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="175.0" y="350.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">8 FADH₂ · 8 NADH · 9 acetyl-CoA</text><rect x="390" y="318" width="270" height="64" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="525.0" y="341.9" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">7 FADH₂ · 8 NADH · 9 acetyl-CoA</text><text x="525.0" y="358.1" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">≈ 1.5 ATP less</text></svg>
