<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah2-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah2-line" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker><marker id="ah2-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ah2-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="ah2-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="ah2-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ah2-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="ah2-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="ah2-sub" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker><!--ah2--></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="350.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The cycle depends on O₂ through NAD⁺ recycling</text><rect x="30" y="110" width="230" height="120" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="145.0" y="152.5" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Citric acid cycle</text><text x="145.0" y="170.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">dehydrogenases</text><text x="145.0" y="187.5" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(need NAD⁺ and FAD)</text><rect x="440" y="110" width="230" height="120" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="555.0" y="152.5" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Electron transport</text><text x="555.0" y="170.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">chain</text><text x="555.0" y="187.5" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(reoxidizes NADH, FADH₂)</text><path d="M260,135 L436,135" fill="none" stroke="#2f6fdb" stroke-width="2.6" marker-end="url(#ah2-blue)"/><text x="348.0" y="118.0" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">NADH, FADH₂</text><path d="M436,205 L264,205" fill="none" stroke="#1f9d63" stroke-width="2.6" marker-end="url(#ah2-green)"/><text x="348.0" y="224.0" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">NAD⁺, FAD</text><text x="555.0" y="290.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">O₂ → H₂O</text><path d="M555,232 L555,274" fill="none" stroke="#1f2430" stroke-width="1.6" marker-end="url(#ah2-ink)"/><line x1="544" y1="241" x2="566" y2="263" stroke="#d6453d" stroke-width="5"/><line x1="544" y1="263" x2="566" y2="241" stroke="#d6453d" stroke-width="5"/><text x="555.0" y="316.0" font-size="12" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">anoxia: no electron acceptor</text><rect x="30" y="260" width="410" height="60" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="235.0" y="282.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Without O₂, NADH and FADH₂ cannot unload, NAD⁺ and FAD</text><text x="235.0" y="297.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">run out, and the dehydrogenases stop within seconds.</text><text x="350.0" y="64.0" font-size="13" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">No cycle enzyme uses O₂, but every dehydrogenase needs an oxidized carrier.</text></svg>
