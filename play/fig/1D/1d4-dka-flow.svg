<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Untreated type 1 diabetes: why ketoacids pile up</text><rect x="190.0" y="45.0" width="300" height="34" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="340.0" y="62.0" font-size="13.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Insulin absent, glucagon high</text><rect x="35.0" y="108.0" width="250" height="48" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="160.0" y="124.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Adipose: hormone-sensitive</text><text x="160.0" y="139.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">lipase ON → lipolysis</text><rect x="395.0" y="108.0" width="250" height="48" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="520.0" y="124.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Liver: gluconeogenesis ON</text><text x="520.0" y="139.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(glucagon, cortisol)</text><path d="M280,80 L200,107" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M400,80 L480,107" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="35.0" y="191.0" width="250" height="62" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="160.0" y="206.4" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Flood of fatty acids → liver</text><text x="160.0" y="222.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">β-oxidation (malonyl-CoA low,</text><text x="160.0" y="237.6" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">so CPT-I is open)</text><rect x="395.0" y="191.0" width="250" height="62" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="520.0" y="206.4" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Oxaloacetate pulled out</text><text x="520.0" y="222.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">of the citric acid cycle</text><text x="520.0" y="237.6" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">into gluconeogenesis</text><path d="M160.0,156.0 L160,189" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M520.0,156.0 L520,189" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="60.0" y="291.0" width="560" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="340.0" y="308.2" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Acetyl-CoA exceeds the oxaloacetate available → HMG-CoA synthase</text><text x="340.0" y="323.8" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ acetoacetate + β-hydroxybutyrate (ketoacids) → metabolic acidosis</text><path d="M160.0,253.0 L260,289" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M520.0,253.0 L420,289" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/></svg>
