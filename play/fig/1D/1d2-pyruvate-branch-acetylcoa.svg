<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Acetyl-CoA steers pyruvate toward glucose in fasting</text><rect x="20" y="50" width="640" height="300" rx="40" fill="#e0f3f4" stroke="#138f9a" stroke-width="1.5"/><text x="340.0" y="70.0" font-size="13" font-weight="700" fill="#138f9a" text-anchor="middle" dominant-baseline="middle">Liver mitochondrial matrix (fasting)</text><rect x="470.0" y="93.0" width="140" height="34" rx="10" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/><text x="540.0" y="110.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fatty acids</text><rect x="470.0" y="183.0" width="140" height="34" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="540.0" y="200.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Acetyl-CoA</text><path d="M540.0,129.0 L540.0,181.0" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="548.0" y="155.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">β-oxidation</text><rect x="140.0" y="183.0" width="140" height="34" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="210.0" y="200.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Pyruvate</text><rect x="135.0" y="293.0" width="150" height="34" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="210.0" y="310.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Oxaloacetate</text><path d="M210,218 L210,290" fill="none" stroke="#1f9d63" stroke-width="2.6" marker-end="url(#ah)"/><text x="220.0" y="252.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">pyruvate carboxylase</text><path d="M280,200 L468,200" fill="none" stroke="#8a93a3" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="374.0" y="186.0" font-size="12.5" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">PDH</text><polyline points="366,192 382,208" fill="none" stroke="#d6453d" stroke-width="3"/><polyline points="366,208 382,192" fill="none" stroke="#d6453d" stroke-width="3"/><path d="M540,218 Q424.3,287.5 290,300" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><text x="452.0" y="300.0" font-size="12.5" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">activates (+)</text><path d="M520,182 Q456.8,156.1 390,170" fill="none" stroke="#d6453d" stroke-width="1.8" marker-end="url(#ah)"/><text x="470.0" y="150.0" font-size="12" font-weight="400" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">inhibits via PDH kinase</text><path d="M135,310 L60,310" fill="none" stroke="#1f9d63" stroke-width="1.8" marker-end="url(#ah)"/><text x="60.0" y="290.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">→ malate → PEP</text><text x="60.0" y="332.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">→ glucose</text></svg>
