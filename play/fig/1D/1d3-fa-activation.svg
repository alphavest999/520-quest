0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker><!--ah2--></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="350.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Activation spends two phosphoanhydride bonds</text><rect x="30" y="60" width="200" height="46" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="130.0" y="83.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fatty acid + CoA-SH</text><rect x="30" y="140" width="200" height="46" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="130.0" y="163.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Fatty acyl-CoA</text><path d="M130,106 L130,138" fill="none" stroke="#1f2430" stroke-width="2" marker-end="url(#ah2-ink)"/><text x="140.0" y="122.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle" font-style="italic">acyl-CoA synthetase</text><rect x="340" y="54" width="40" height="32" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="360.0" y="70.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><circle cx="410" cy="70" r="15" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="410.0" y="70.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P</text><polyline points="380,70 395,70" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="460" cy="70" r="15" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="460.0" y="70.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P</text><polyline points="425,70 445,70" fill="none" stroke="#1f2430" stroke-width="2"/><text x="435.0" y="56.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">~</text><circle cx="510" cy="70" r="15" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="510.0" y="70.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P</text><polyline points="475,70 495,70" fill="none" stroke="#1f2430" stroke-width="2"/><text x="485.0" y="56.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">~</text><text x="330.0" y="70.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">ATP</text><path d="M420,92 L420,128" fill="none" stroke="#1f2430" stroke-width="2" marker-end="url(#ah2-ink)"/><rect x="340" y="134" width="40" height="32" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="360.0" y="150.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">A</text><circle cx="410" cy="150" r="15" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="410.0" y="150.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">P</text><polyline points="380,150 395,150" fill="none" stroke="#1f2430" stroke-width="2"/><text x="330.0" y="150.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="end" dominant-baseline="middle">AMP</text><text x="520.0" y="150.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">+  PPᵢ  (P~P)</text><path d="M560,168 L560,208" fill="none" stroke="#1f2430" stroke-width="2" marker-end="url(#ah2-ink)"/><text x="572.0" y="180.8" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">pyrophosphatase</text><text x="572.0" y="195.2" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">+ H₂O</text><text x="560.0" y="226.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 Pᵢ</text><rect x="30" y="260" width="640" height="50" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="350.0" y="277.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ATP → AMP + PPᵢ breaks one ~ bond; PPᵢ → 2 Pᵢ breaks the second.</text><text x="350.0" y="292.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Cost = 2 ATP equivalents (AMP needs 2 phosphorylations to become ATP again).</text></svg>
