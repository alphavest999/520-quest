<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="350.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Hess&#x27;s law with enthalpies of formation</text><rect x="30" y="50" width="260" height="60" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="160.0" y="72.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CH₄ + 2 O₂ (reactants)</text><text x="160.0" y="87.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ΣΔH°f = −75 kJ</text><rect x="410" y="50" width="260" height="60" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="540.0" y="73.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CO₂ + 2 H₂O(l) (products)</text><text x="540.0" y="86.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ΣΔH°f = −394 + 2(−286) = −966 kJ</text><rect x="220" y="210" width="260" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="350.0" y="228.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">elements in standard states</text><text x="350.0" y="241.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(C graphite, H₂, O₂: ΔH°f = 0)</text><path d="M160,112 L260,208" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="150.0" y="165.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+75 kJ</text><path d="M440,208 L540,112" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="560.0" y="165.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">−966 kJ</text><path d="M292,80 L408,80" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="350.0" y="70.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ΔH° = −891 kJ</text><text x="350.0" y="290.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ΔH°rxn = Σ ΔH°f(products) − Σ ΔH°f(reactants). Path-independent because H is a state function.</text><text x="350.0" y="308.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Average bond energies ignore each molecule&#x27;s environment, so they give rougher estimates.</text></svg>
