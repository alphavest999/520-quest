<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The slow step sets the rate law</text><rect x="30" y="50" width="290" height="110" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="175.0" y="83.4" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Step 1 (slow): NO₂ + NO₂ → NO₃ + NO</text><text x="175.0" y="97.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Step 2 (fast): NO₃ + CO → NO₂ + CO₂</text><text x="175.0" y="112.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="175.0" y="126.6" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">rate = k[NO₂]²  (CO not in it)</text><rect x="360" y="50" width="290" height="110" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="505.0" y="83.4" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Step 1 (fast, ⇌): 2NO ⇌ N₂O₂</text><text x="505.0" y="97.8" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Step 2 (slow): N₂O₂ + O₂ → 2NO₂</text><text x="505.0" y="112.2" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="505.0" y="126.6" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">rate = k₂[N₂O₂][O₂] = k[NO]²[O₂]</text><text x="175.0" y="185.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Rate law = the slow step&#x27;s reactants.</text><text x="505.0" y="185.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Replace the intermediate N₂O₂ with</text><text x="505.0" y="205.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">[N₂O₂] = K₁[NO]² from the fast equilibrium.</text><text x="340.0" y="245.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Intermediate: made in one step, used in a later one (NO₃, N₂O₂).</text><text x="340.0" y="270.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Rate laws come from experiment or the mechanism, never from overall coefficients.</text><text x="340.0" y="300.0" font-size="11.5" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Initial rates: doubling [A] and [B] gives 8r; doubling [B] alone gives 2r → rate = k[A]²[B]</text></svg>
