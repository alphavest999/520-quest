<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Flat curve: static friction is the centripetal force</text><path d="M370,290 A230,230 0 0,0 140,60" fill="none" stroke="#8a93a3" stroke-width="34" stroke-opacity="0.35"/><circle cx="140" cy="290" r="5" fill="#5b6474"/><text x="148.0" y="306.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">center</text><rect x="284.61" y="117.39000000000001" width="36" height="20" rx="4" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5" transform="rotate(45 302.61 127.39000000000001)"/><path d="M302.61,127.39000000000001 L222.61,207.39000000000001" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="222.6" y="171.4" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">friction fₛ</text><path d="M302.61,127.39000000000001 L372.61,197.39000000000001" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="355.6" y="156.4" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">v</text><text x="240.0" y="60.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Top view</text><rect x="400" y="80" width="260" height="95" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="530.0" y="110.0" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">μₛ mg = m v²/r</text><text x="530.0" y="127.5" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">v_max = √(μₛ g r)</text><text x="530.0" y="145.0" font-size="14" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(mass cancels)</text><text x="530.0" y="212.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">r = 20 m, μₛ = 0.5: v_max = 10 m/s</text><text x="530.0" y="227.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">r = 50 m, μₛ = 0.5: v_max ≈ 16 m/s</text><text x="530.0" y="267.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Tires do not slide sideways, so</text><text x="530.0" y="282.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">the friction is STATIC.</text></svg>
