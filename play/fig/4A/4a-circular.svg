<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Uniform circular motion</text><circle cx="200" cy="185" r="110" fill="none" stroke="#8a93a3" stroke-width="2" stroke-dasharray="5 4"/><circle cx="200" cy="185" r="4" fill="#5b6474"/><circle cx="200" cy="75" r="9" fill="#2f6fdb"/><path d="M200,75 L320,75" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="270.0" y="61.0" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">v (tangent)</text><path d="M206,79 L206,160" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="246.0" y="119.5" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">a = v²/r</text><circle cx="310" cy="185" r="9" fill="#2f6fdb"/><polyline points="310,185 310,325" fill="none" stroke="#7a4cd9" stroke-width="2.2" stroke-dasharray="6 4"/><text x="322.0" y="240.6" font-size="11.5" font-weight="400" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">string snaps:</text><text x="322.0" y="255.0" font-size="11.5" font-weight="400" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">straight line</text><text x="322.0" y="269.4" font-size="11.5" font-weight="400" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">along the tangent</text><text x="530.0" y="74.4" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Speed is constant, but velocity</text><text x="530.0" y="90.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">changes direction, so a ≠ 0.</text><text x="530.0" y="105.6" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">a points to the CENTER.</text><text x="530.0" y="164.4" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Net (centripetal) force = mv²/r,</text><text x="530.0" y="180.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">supplied by tension, friction,</text><text x="530.0" y="195.6" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">gravity or a normal force.</text><text x="530.0" y="254.4" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Force ⊥ velocity → no work:</text><text x="530.0" y="270.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">a circular orbit does zero net</text><text x="530.0" y="285.6" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">work, and KE stays the same.</text></svg>
