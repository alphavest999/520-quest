<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Vertical circles: who supplies mv²/r?</text><path d="M30,300 A140,140 0 0,1 310,300" fill="none" stroke="#8a93a3" stroke-width="3"/><rect x="145" y="136" width="50" height="24" rx="4" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5" /><circle cx="170" cy="300" r="4" fill="#5b6474"/><text x="170.0" y="316.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">center</text><path d="M170,136 L170,96" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="184.0" y="116.0" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">N</text><path d="M178,160 L178,220" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="198.0" y="190.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">mg</text><text x="170.0" y="60.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Top of a hill (center below)</text><text x="170.0" y="242.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">mg − N = mv²/r</text><text x="170.0" y="257.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">N = m(g − v²/r)</text><text x="170.0" y="330.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">r = 40 m, v = 20 m/s: v²/r = 10 = g → N = 0</text><circle cx="510" cy="200" r="100" fill="none" stroke="#8a93a3" stroke-width="3"/><circle cx="510" cy="200" r="4" fill="#5b6474"/><rect x="485" y="100" width="50" height="24" rx="4" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5" /><path d="M500,124 L500,170" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="486.0" y="147.0" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">N</text><path d="M520,124 L520,180" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="540.0" y="152.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">mg</text><text x="510.0" y="60.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Top of a loop (center below the car)</text><text x="510.0" y="224.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">N + mg = mv²/r</text><text x="510.0" y="239.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">slowest: N = 0 → v = √(gr)</text><text x="510.0" y="325.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">r = 10 m: v_min = √(10·10) = 10 m/s</text></svg>
