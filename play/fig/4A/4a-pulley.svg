<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Ideal pulleys trade force for distance; work stays the same</text><polyline points="40,50 300,50" fill="none" stroke="#1f2430" stroke-width="4"/><polyline points="120,50 120,240" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="150" cy="240" r="30" fill="#f1f3f6" stroke="#8a93a3" stroke-width="2"/><circle cx="150" cy="240" r="4" fill="#1f2430"/><polyline points="180,240 180,90" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="200" cy="90" r="20" fill="#f1f3f6" stroke="#8a93a3" stroke-width="2"/><polyline points="200,50 200,70" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="220,90 220,170" fill="none" stroke="#1f2430" stroke-width="2"/><path d="M220,170 L220,220" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="268.0" y="195.0" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">effort 40 N</text><polyline points="150,240 150,280" fill="none" stroke="#1f2430" stroke-width="2"/><rect x="120" y="280" width="60" height="40" rx="4" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5" /><text x="150.0" y="300.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">80 N</text><text x="80.0" y="122.5" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">two rope</text><text x="80.0" y="136.2" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">segments</text><text x="80.0" y="150.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">hold the</text><text x="80.0" y="163.8" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">movable</text><text x="80.0" y="177.5" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">pulley</text><rect x="340" y="70" width="320" height="120" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="500.0" y="105.6" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Movable pulley: MA = 2</text><text x="500.0" y="121.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Lift 80 N by 2 m: pull 40 N over 4 m</text><text x="500.0" y="138.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Work in = 40 × 4 = 160 J</text><text x="500.0" y="154.4" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Work out = 80 × 2 = 160 J</text><text x="500.0" y="224.4" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Any ideal machine (lever, ramp, pulley)</text><text x="500.0" y="240.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">lowers the force by stretching the distance.</text><text x="500.0" y="255.6" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">The WORK done is unchanged.</text></svg>
