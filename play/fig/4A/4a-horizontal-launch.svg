,71.8 102.5,72.8125 107.0,74.05 111.5,75.5125 116.0,77.2 120.5,79.1125 125.0,81.25 129.5,83.6125 134.0,86.2 138.5,89.0125 143.0,92.05 147.5,95.3125 152.0,98.8 156.5,102.51249999999999 161.0,106.44999999999999 165.5,110.61250000000001 170.0,115.0 174.5,119.61250000000001 179.0,124.45 183.5,129.5125 188.0,134.8 192.5,140.3125 197.0,146.05 201.5,152.0125 206.0,158.2 210.5,164.6125 215.0,171.25 219.5,178.1125 224.0,185.2 228.5,192.5125 233.0,200.04999999999998 237.5,207.8125 242.0,215.79999999999998 246.5,224.01250000000002 251.0,232.45000000000002 255.5,241.11249999999998 260.0,250.0 264.5,259.11249999999995 269.0,268.45000000000005 273.5,278.01250000000005 278.0,287.8 282.5,297.8125" fill="none" stroke="#8a93a3" stroke-width="2" stroke-dasharray="6 4"/><circle cx="80" cy="70" r="7" fill="#2f6fdb"/><path d="M80,70 L120,70" stroke="#1f9d63" stroke-width="2.5" fill="none" marker-end="url(#agreen)"/><text x="68.0" y="56.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="end" dominant-baseline="middle">t = 0 s</text><text x="102.0" y="58.0" font-size="11.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">vₓ = 10</text><circle cx="170" cy="115" r="7" fill="#2f6fdb"/><path d="M170,115 L210,115" stroke="#1f9d63" stroke-width="2.5" fill="none" marker-end="url(#agreen)"/><path d="M170,115 L170,155" stroke="#d6453d" stroke-width="2.5" fill="none" marker-end="url(#ared)"/><path d="M170,115 L210,155" stroke="#2f6fdb" stroke-width="2" fill="none" marker-end="url(#ablue)"/><text x="158.0" y="101.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="end" dominant-baseline="middle">t = 1 s</text><text x="192.0" y="103.0" font-size="11.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">vₓ = 10</text><text x="162.0" y="135.0" font-size="11.5" font-weight="600" fill="#d6453d" text-anchor="end" dominant-baseline="middle">v_y = 10</text><circle cx="260" cy="250" r="7" fill="#2f6fdb"/><path d="M260,250 