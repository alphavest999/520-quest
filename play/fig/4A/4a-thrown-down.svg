<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340" y="24" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Thrown straight down: the starting speed adds to what gravity gives</text><rect x="40" y="60" width="120" height="14" fill="#c9ced8"/><text x="100" y="50" font-size="12.5" font-weight="600" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ledge</text><line x1="30" y1="290" x2="300" y2="290" stroke="#5b6474" stroke-width="3"/><text x="100" y="306" font-size="12.5" font-weight="600" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ground</text><line x1="50" y1="80" x2="50" y2="284" stroke="#5b6474" stroke-width="1.5" marker-start="url(#asub)" marker-end="url(#asub)"/><text x="62" y="182" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start" dominant-baseline="middle">h = 15 m</text><polyline points="180,90 180,272" fill="none" stroke="#8a93a3" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="180" cy="90" r="10" fill="#2f6fdb"/><line x1="196" y1="84" x2="196" y2="126" stroke="#2f6fdb" stroke-width="3" marker-end="url(#ablue)"/><text x="208" y="105" font-size="13" font-weight="600" fill="#2f6fdb" text-anchor="start" dominant-baseline="middle">v₀ = 10 m/s down</text><circle cx="180" cy="278" r="10" fill="#2f6fdb"/><line x1="196" y1="226" x2="196" y2="284" stroke="#1f9d63" stroke-width="3.5" marker-end="url(#agreen)"/><text x="208" y="252" font-size="13" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">v = ?</text><rect x="350" y="62" width="306" height="200" rx="10" fill="#f4f6fa" stroke="#d9dee7"/><text x="366" y="88" font-size="13.5" font-weight="700" fill="#1f2430" text-anchor="start" dominant-baseline="middle">No time given, so use</text><text x="366" y="114" font-size="15" font-weight="700" fill="#7a4cd9" text-anchor="start" dominant-baseline="middle">v² = v₀² + 2gh</text><text x="366" y="144" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">v² = 10² + 2 × 10 × 15</text><text x="366" y="168" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">v² = 100 + 300 = 400</text><text x="366" y="194" font-size="14.5" font-weight="700" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">v = √400 = 20 m/s</text><text x="366" y="226" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Dropped from rest instead: v = √300 ≈ 17 m/s.</text><text x="366" y="246" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">Speeds don't simply add: 10 + 17 ≠ 20.</text><text x="340" y="326" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Thrown UP at 10 m/s instead? It passes the ledge again at 10 m/s down, so it also lands at 20 m/s.</text></svg>
