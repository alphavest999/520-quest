<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The forearm is a lever: a short muscle arm needs a big force</text><rect x="90" y="163" width="442" height="24" rx="12" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5" /><circle cx="90" cy="175" r="12" fill="#f1f3f6" stroke="#1f2430" stroke-width="2"/><text x="90.0" y="207.8" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">elbow</text><text x="90.0" y="222.2" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(pivot)</text><path d="M142,163 L142,55" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="202.0" y="79.0" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">biceps F = 220 N</text><path d="M285,187 L285,245" stroke="#5b6474" stroke-width="3" fill="none" marker-end="url(#asub)"/><text x="235.0" y="220.0" font-size="12.5" font-weight="600" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">forearm 16 N</text><path d="M506,187 L506,255" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="450.0" y="225.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">2.0 kg: 20 N</text><polyline points="90,145 142,145" fill="none" stroke="#8a93a3" stroke-width="1"/><text x="146.0" y="145.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">4 cm</text><polyline points="90,134 285,134" fill="none" stroke="#8a93a3" stroke-width="1"/><text x="289.0" y="134.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">15 cm</text><polyline points="90,117 506,117" fill="none" stroke="#8a93a3" stroke-width="1"/><text x="510.0" y="117.0" font-size="11" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">32 cm</text><rect x="30" y="300" width="280" height="84" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="170.0" y="326.4" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Load torque = 16(0.15) + 20(0.32)</text><text x="170.0" y="342.0" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">= 2.4 + 6.4 = 8.8 N·m</text><text x="170.0" y="357.6" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">F = 8.8 / 0.04 = 220 N</text><text x="500.0" y="320.4" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">τ = rF sin θ. Raising the forearm 30° shrinks</text><text x="500.0" y="334.8" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">the lever arms (cos 30°), so torque falls.</text><text x="500.0" y="349.2" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Back lifts work the same way: erector spinae</text><text x="500.0" y="363.6" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">~5 cm from the disc vs a load ~40 cm away.</text></svg>
