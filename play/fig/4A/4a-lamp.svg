<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Two strings sharing a hanging weight</text><polyline points="80,50 420,50" fill="none" stroke="#1f2430" stroke-width="4"/><polyline points="180.0,50 250,170.72039999999998" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="320.0,50 250,170.72039999999998" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="250" cy="192.72039999999998" r="20" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="250.0" y="192.7" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">4 kg</text><path d="M250,170.72039999999998 L200,84.72039999999998" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="209.0" y="127.7" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">T</text><path d="M250,170.72039999999998 L300,84.72039999999998" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="291.0" y="127.7" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">T</text><path d="M250,214.72039999999998 L250,270.7204" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="292.0" y="242.7" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">mg = 40 N</text><text x="208.0" y="66.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">60°</text><text x="292.0" y="66.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">60°</text><rect x="440" y="70" width="220" height="120" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="550.0" y="105.6" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Vertical: 2T sin 60° = mg</text><text x="550.0" y="121.9" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">T = 40 / (2 × 0.866)</text><text x="550.0" y="138.1" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">≈ 23 N each</text><text x="550.0" y="154.4" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Horizontal parts cancel.</text><text x="550.0" y="225.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Flatter strings (smaller angle</text><text x="550.0" y="240.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">with the ceiling) need MORE</text><text x="550.0" y="255.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">tension for the same weight.</text></svg>
