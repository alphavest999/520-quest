<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Newton&#x27;s third law: pairs act on DIFFERENT objects</text><rect x="40" y="270" width="300" height="14" rx="4" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5" /><text x="300.0" y="298.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">table</text><rect x="140" y="225" width="100" height="45" rx="4" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5" /><text x="190.0" y="247.0" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">book</text><path d="M220,245 L220,140" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="220.0" y="130.5" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">N: table pushes book up</text><path d="M160,250 L160,330" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="150.0" y="345.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">W: Earth pulls book down</text><text x="190.0" y="67.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Both forces act on the book.</text><text x="190.0" y="82.5" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Equal here, but NOT a third-law pair.</text><rect x="370" y="60" width="290" height="110" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="515.0" y="98.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Pair 1 (gravity)</text><text x="515.0" y="115.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Earth pulls book down</text><text x="515.0" y="131.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">↔ book pulls EARTH up</text><rect x="370" y="185" width="290" height="110" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="515.0" y="223.8" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Pair 2 (contact)</text><text x="515.0" y="240.0" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">table pushes book up</text><text x="515.0" y="256.2" font-size="13" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">↔ book pushes TABLE down</text><text x="515.0" y="330.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Partners: equal size, opposite direction, same force type.</text></svg>
