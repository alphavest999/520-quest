<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Atwood machine (ideal pulley and string)</text><g transform="translate(0,22)"><circle cx="180" cy="80" r="40" fill="#f1f3f6" stroke="#8a93a3" stroke-width="2"/><circle cx="180" cy="80" r="4" fill="#1f2430"/><polyline points="150,30 210,30" fill="none" stroke="#1f2430" stroke-width="3"/><polyline points="180,30 180,80" fill="none" stroke="#8a93a3" stroke-width="2"/><polyline points="140,80 140,230" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="220,80 220,170" fill="none" stroke="#1f2430" stroke-width="2"/><rect x="110" y="230" width="60" height="50" rx="4" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5" /><text x="140.0" y="255.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">m₁</text><rect x="190" y="170" width="60" height="70" rx="4" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5" /><text x="220.0" y="205.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">m₂</text><path d="M140,228 L140,175" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="126.0" y="201.5" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">T</text><path d="M220,168 L220,120" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="234.0" y="144.0" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">T</text><path d="M140,282 L140,325" stroke="#5b6474" stroke-width="3" fill="none" marker-end="url(#asub)"/><text x="116.0" y="303.5" font-size="12.5" font-weight="600" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">m₁g</text><path d="M220,242 L220,300" stroke="#5b6474" stroke-width="3" fill="none" marker-end="url(#asub)"/><text x="246.0" y="271.0" font-size="12.5" font-weight="600" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">m₂g</text><path d="M95,270 L95,230" stroke="#2f6fdb" stroke-width="3" fill="none" marker-end="url(#ablue)"/><text x="83.0" y="250.0" font-size="12.5" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">a</text><path d="M275,200 L275,240" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="287.0" y="220.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">a</text><text x="480.0" y="90.0" font-size="12.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Heavier side (m₂ &gt; m₁) falls, the lighter rises.</text><rect x="330" y="115" width="320" height="50" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="490.0" y="140.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">a = (m₂ − m₁) g / (m₁ + m₂)</text><rect x="330" y="175" width="320" height="50" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="490.0" y="200.0" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">T = 2 m₁ m₂ g / (m₁ + m₂)</text><text x="490.0" y="254.2" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">3 kg and 5 kg: a = 2·10/8 = 2.5 m/s²</text><text x="490.0" y="269.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 kg and 6 kg: T = 2·2·6·10/8 = 30 N</text><text x="490.0" y="312.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">T lies between m₁g and m₂g.</text></g></svg>
