<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="350.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Torque and work: the angle matters</text><rect x="40" y="150" width="230" height="18" rx="4" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5" /><circle cx="45" cy="159" r="7" fill="#1f2430"/><text x="45.0" y="190.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">pivot</text><path d="M265,159 L265,75" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="305.0" y="137.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">F = 20 N</text><polyline points="45,120 265,120" fill="none" stroke="#2f6fdb" stroke-width="1.8"/><text x="155.0" y="110.0" font-size="11.5" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">r = 0.5 m</text><text x="160.0" y="225.0" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">τ = rF sin θ = 0.5 × 20 × sin 90° = 10 N·m</text><text x="160.0" y="248.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">push at 90° → sin θ = 1 (maximum torque)</text><rect x="450" y="130" width="100" height="60" rx="4" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5" /><polyline points="390,190 680,190" fill="none" stroke="#1f2430" stroke-width="1.8"/><path d="M500,130 L500,70" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="514.0" y="110.0" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">N</text><path d="M500,190 L500,250" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="518.0" y="214.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">mg</text><path d="M555,160 L640,160" stroke="#d98a00" stroke-width="3" fill="none" marker-end="url(#aamber)" stroke-dasharray="6 4"/><text x="597.5" y="148.0" font-size="12.5" font-weight="600" fill="#d98a00" text-anchor="middle" dominant-baseline="middle">d</text><text x="540.0" y="285.0" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">W = Fd cos θ: N and mg are at 90° to d, so they do zero work</text><text x="540.0" y="305.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Power = W / t (e.g., 1000 J in 4 s = 250 W)</text></svg>
