<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Free fall from rest: distance in each second goes 1 : 3 : 5 : 7</text><polyline points="160,50 160,330.0" fill="none" stroke="#8a93a3" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="160" cy="50.0" r="9" fill="#2f6fdb"/><text x="110.0" y="50.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">t = 0 s</text><text x="220.0" y="50.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">0 m fallen</text><text x="330.0" y="50.0" font-size="12" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">v = 0 m/s</text><circle cx="160" cy="80.0" r="9" fill="#2f6fdb"/><text x="110.0" y="80.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">t = 1 s</text><text x="220.0" y="80.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">5 m fallen</text><text x="330.0" y="80.0" font-size="12" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">v = 10 m/s</text><text x="470.0" y="65.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="start" dominant-baseline="middle">1st second: 5 m</text><circle cx="160" cy="170.0" r="9" fill="#2f6fdb"/><text x="110.0" y="170.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">t = 2 s</text><text x="220.0" y="170.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">20 m fallen</text><text x="330.0" y="170.0" font-size="12" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">v = 20 m/s</text><text x="470.0" y="125.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="start" dominant-baseline="middle">2nd second: 15 m</text><circle cx="160" cy="320.0" r="9" fill="#2f6fdb"/><text x="110.0" y="320.0" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">t = 3 s</text><text x="220.0" y="320.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" dominant-baseline="middle">45 m fallen</text><text x="330.0" y="320.0" font-size="12" font-weight="600" fill="#1f9d63" text-anchor="start" dominant-baseline="middle">v = 30 m/s</text><text x="470.0" y="245.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="start" dominant-baseline="middle">3rd second: 25 m</text><text x="340.0" y="360.0" font-size="12" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">d = ½gt²,  v = gt  (g = 10 m/s²).  Each second adds 10 m more than the last.</text></svg>
