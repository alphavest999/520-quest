<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Bond dipoles and lone pairs: NH₃ versus NF₃</text><text x="170.0" y="52.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NH₃: dipoles add (1.5 D)</text><circle cx="170" cy="140" r="20" fill="#e6eefc" stroke="#2f6fdb"/><text x="170.0" y="140.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">N</text><ellipse cx="170" cy="96" rx="12" ry="16" fill="#fdf1db" stroke="#d98a00"/><text x="170.0" y="96.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">••</text><polyline points="170,158 100,206" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="100" cy="220" r="15" fill="#f1f3f6" stroke="#8a93a3"/><text x="100.0" y="220.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">H</text><path d="M135.0,190 L159.5,165" stroke="#2f6fdb" stroke-width="2" fill="none" marker-end="url(#ablue)"/><polyline points="170,158 170,206" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="170" cy="220" r="15" fill="#f1f3f6" stroke="#8a93a3"/><text x="170.0" y="220.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">H</text><path d="M170.0,190 L170.0,165" stroke="#2f6fdb" stroke-width="2" fill="none" marker-end="url(#ablue)"/><polyline points="170,158 240,206" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="240" cy="220" r="15" fill="#f1f3f6" stroke="#8a93a3"/><text x="240.0" y="220.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">H</text><path d="M205.0,190 L180.5,165" stroke="#2f6fdb" stroke-width="2" fill="none" marker-end="url(#ablue)"/><path d="M215,150 L215,100" stroke="#2f6fdb" stroke-width="3" fill="none" marker-end="url(#ablue)"/><text x="237.0" y="125.0" font-size="12.5" font-weight="600" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">net</text><text x="510.0" y="52.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NF₃: dipoles cancel (0.2 D)</text><circle cx="510" cy="140" r="20" fill="#e6eefc" stroke="#2f6fdb"/><text x="510.0" y="140.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">N</text><ellipse cx="510" cy="96" rx="12" ry="16" fill="#fdf1db" stroke="#d98a00"/><text x="510.0" y="96.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">••</text><polyline points="510,158 440,206" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="440" cy="220" r="15" fill="#f1f3f6" stroke="#8a93a3"/><text x="440.0" y="220.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">F</text><path d="M499.5,168 L468.0,196" stroke="#d6453d" stroke-width="2" fill="none" marker-end="url(#ared)"/><polyline points="510,158 510,206" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="510" cy="220" r="15" fill="#f1f3f6" stroke="#8a93a3"/><text x="510.0" y="220.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">F</text><path d="M510.0,168 L510.0,196" stroke="#d6453d" stroke-width="2" fill="none" marker-end="url(#ared)"/><polyline points="510,158 580,206" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="580" cy="220" r="15" fill="#f1f3f6" stroke="#8a93a3"/><text x="580.0" y="220.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">F</text><path d="M520.5,168 L552.0,196" stroke="#d6453d" stroke-width="2" fill="none" marker-end="url(#ared)"/><path d="M555,150 L555,140" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="577.0" y="145.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">tiny</text><text x="340.0" y="270.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">In NH₃, N–H dipoles point toward N, in line with the lone pair. In NF₃, N–F dipoles point away and oppose it.</text></svg>
