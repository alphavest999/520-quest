<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Kinds of isomers (same molecular formula)</text><rect x="260" y="45" width="160" height="40" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="340.0" y="65.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">isomers</text><rect x="60" y="120" width="220" height="54" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="170.0" y="139.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">constitutional</text><text x="170.0" y="154.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">different connectivity</text><rect x="400" y="120" width="220" height="54" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="510.0" y="139.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">stereoisomers</text><text x="510.0" y="154.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">same connectivity, different 3D</text><rect x="290" y="215" width="170" height="70" rx="10" fill="#efe8fc" stroke="#7a4cd9" stroke-width="1.5"/><text x="375.0" y="235.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">enantiomers</text><text x="375.0" y="250.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">non-superimposable</text><text x="375.0" y="265.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">mirror images</text><rect x="480" y="215" width="180" height="70" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="570.0" y="235.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">diastereomers</text><text x="570.0" y="250.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">not mirror images</text><text x="570.0" y="265.0" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(incl. cis/trans)</text><path d="M340,85 L170,120" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M340,85 L510,120" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M510,174 L375,215" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M510,174 L570,215" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="170.0" y="200.0" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">butane vs isobutane</text><text x="375.0" y="293.4" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">same bp, mp, solubility;</text><text x="375.0" y="306.6" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">opposite optical rotation</text><text x="570.0" y="293.4" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">different physical properties</text><text x="570.0" y="306.6" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">→ separable</text><text x="150.0" y="255.1" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Meso: has stereocenters but an</text><text x="150.0" y="268.9" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">internal mirror plane → achiral</text></svg>
