<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="360.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Types of solids</text><rect x="20" y="55" width="220" height="150" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="130.0" y="95.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NETWORK COVALENT</text><text x="130.0" y="109.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SiO₂ (quartz), diamond</text><text x="130.0" y="123.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">giant 3-D lattice of</text><text x="130.0" y="136.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">covalent bonds</text><text x="130.0" y="150.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">melt: break bonds</text><text x="130.0" y="164.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ SiO₂ melts &gt; 1600 °C</text><rect x="250" y="55" width="220" height="150" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="360.0" y="95.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">MOLECULAR</text><text x="360.0" y="109.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">CO₂ (dry ice), I₂, ice</text><text x="360.0" y="123.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">discrete molecules held</text><text x="360.0" y="136.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">by weak IMFs</text><text x="360.0" y="150.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">melt/sublime: overcome IMFs</text><text x="360.0" y="164.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ CO₂ sublimes at −78 °C</text><rect x="480" y="55" width="220" height="150" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="590.0" y="95.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">IONIC</text><text x="590.0" y="109.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">NaCl, CsF</text><text x="590.0" y="123.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">alternating + and − ions</text><text x="590.0" y="136.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">high mp, conduct when</text><text x="590.0" y="150.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">molten or dissolved</text><text x="590.0" y="164.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">hard but BRITTLE</text><rect x="20" y="225" width="300" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="170.0" y="251.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">METALLIC</text><text x="170.0" y="265.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">cations in a sea of delocalized electrons</text><text x="170.0" y="278.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→ malleable, conducts as a solid</text><rect x="340" y="225" width="360" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="520.0" y="251.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Why ionic crystals shatter</text><text x="520.0" y="265.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+ − + −  over  − + − +   (attract)</text><text x="520.0" y="278.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">shift a layer: + − + −  over  + − + −   (repel)</text></svg>
