<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Phase diagram of water</text><polyline points="80,320 640,320" fill="none" stroke="#1f2430" stroke-width="1.5"/><polyline points="80,320 80,50" fill="none" stroke="#1f2430" stroke-width="1.5"/><text x="360.0" y="350.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">temperature →</text><text x="40.0" y="177.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">pressure</text><text x="40.0" y="192.5" font-size="12" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">→</text><path d="M80.0,314.0 Q164.0,284.0 192.028,260.0" fill="none" stroke="#7a4cd9" stroke-width="2.5"/><path d="M192.028,260.0 Q360.0,224.0 472.0,200.0 Q528.0,170.0 584.0,128.0" fill="none" stroke="#d6453d" stroke-width="2.5"/><polyline points="192.028,260.0 175.2,56.0" fill="none" stroke="#2f6fdb" stroke-width="2.5"/><circle cx="192.028" cy="260.0" r="5" fill="#1f2430"/><text x="202.0" y="276.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="start" dominant-baseline="middle">triple point</text><circle cx="584.0" cy="128.0" r="5" fill="#1f2430"/><text x="576.0" y="114.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="end" dominant-baseline="middle">critical point</text><text x="113.6" y="164.0" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">SOLID</text><text x="332.0" y="128.0" font-size="14" font-weight="700" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">LIQUID</text><text x="444.0" y="272.0" font-size="14" font-weight="700" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">GAS</text><polyline points="80,200.0 472.0,200.0" fill="none" stroke="#8a93a3" stroke-width="1" stroke-dasharray="6 4"/><text x="76.0" y="200.0" font-size="11" font-weight="400" fill="#1f2430" text-anchor="end" dominant-baseline="middle">1 atm</text><text x="560.0" y="55.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">Solid–liquid line tilts LEFT:</text><text x="560.0" y="70.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">ice is less dense than water,</text><text x="560.0" y="85.0" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">so pressure melts ice.</text><text x="600.0" y="345.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">(schematic, not to scale)</text></svg>
