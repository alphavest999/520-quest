<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ΔH from bond energies = bonds broken − bonds formed</text><polyline points="60,250.0 200,250.0" fill="none" stroke="#1f2430" stroke-width="3"/><text x="130.0" y="268.0" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">H₂ + Cl₂</text><polyline points="260,100.4 420,100.4" fill="none" stroke="#1f2430" stroke-width="3"/><text x="340.0" y="84.4" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 H + 2 Cl (atoms)</text><polyline points="480,289.6 620,289.6" fill="none" stroke="#1f2430" stroke-width="3"/><text x="550.0" y="307.6" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">2 HCl</text><path d="M200,250.0 L260,104.4" stroke="#d6453d" stroke-width="3" fill="none" marker-end="url(#ared)"/><text x="160.0" y="159.4" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">break: +440 + 240</text><text x="160.0" y="175.0" font-size="12.5" font-weight="600" fill="#d6453d" text-anchor="middle" dominant-baseline="middle">= +680 kJ</text><path d="M420,100.4 L480,285.6" stroke="#1f9d63" stroke-width="3" fill="none" marker-end="url(#agreen)"/><text x="528.0" y="185.2" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">form: 2 × 430</text><text x="528.0" y="200.8" font-size="12.5" font-weight="600" fill="#1f9d63" text-anchor="middle" dominant-baseline="middle">= −860 kJ</text><polyline points="130,250.0 620,250.0" fill="none" stroke="#8a93a3" stroke-width="1" stroke-dasharray="6 4"/><text x="550.0" y="111.9" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">ΔH = 680 − 860</text><text x="550.0" y="128.1" font-size="13" font-weight="700" fill="#2f6fdb" text-anchor="middle" dominant-baseline="middle">= −180 kJ (exothermic)</text></svg>
