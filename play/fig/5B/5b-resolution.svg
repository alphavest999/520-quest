<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="340.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Resolving a racemate with a chiral acid</text><rect x="30" y="120" width="140" height="70" rx="10" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.5"/><text x="100.0" y="147.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">racemate</text><text x="100.0" y="162.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(R)-B + (S)-B</text><rect x="230" y="120" width="150" height="70" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="305.0" y="147.2" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">+ (R)-acid</text><text x="305.0" y="162.8" font-size="12.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(one enantiomer)</text><rect x="440" y="60" width="210" height="60" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="545.0" y="82.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(R)-B·(R)-acid salt</text><text x="545.0" y="97.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">less soluble: crystallizes</text><rect x="440" y="190" width="210" height="60" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="545.0" y="212.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(S)-B·(R)-acid salt</text><text x="545.0" y="227.5" font-size="12" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">stays in solution</text><path d="M170,155 L230,155" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M380,145 L440,95" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><path d="M380,165 L440,215" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><text x="520.0" y="265.6" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">The two salts are diastereomers,</text><text x="520.0" y="280.0" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">not mirror images, so their</text><text x="520.0" y="294.4" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">solubilities differ.</text><text x="170.0" y="262.8" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">ee = observed rotation / pure rotation:</text><text x="170.0" y="277.2" font-size="11.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">+6° / +20° = 30% ee → 65% (+), 35% (−)</text></svg>
