<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="370.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Attachment styles in the Strange Situation (Ainsworth)</text><rect x="20" y="50" width="200" height="36" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="120.0" y="68.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Style</text><rect x="230" y="50" width="240" height="36" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="350.0" y="68.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Mother leaves</text><rect x="480" y="50" width="240" height="36" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="600.0" y="68.0" font-size="11.5" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Mother returns</text><rect x="20" y="95" width="200" height="44" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="120.0" y="110.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">SECURE</text><text x="120.0" y="123.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(secure base)</text><rect x="230" y="95" width="240" height="44" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="350.0" y="117.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">upset</text><rect x="480" y="95" width="240" height="44" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="600.0" y="110.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">seeks comfort, soothed,</text><text x="600.0" y="123.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">returns to play</text><rect x="20" y="145" width="200" height="44" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="120.0" y="167.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">AVOIDANT</text><rect x="230" y="145" width="240" height="44" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="350.0" y="167.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">little distress</text><rect x="480" y="145" width="240" height="44" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="600.0" y="167.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ignores / avoids her</text><rect x="20" y="195" width="200" height="44" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="120.0" y="210.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">AMBIVALENT</text><text x="120.0" y="223.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(resistant)</text><rect x="230" y="195" width="240" height="44" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="350.0" y="217.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">very upset</text><rect x="480" y="195" width="240" height="44" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="600.0" y="210.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">clings yet resists,</text><text x="600.0" y="223.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">hard to soothe</text><rect x="20" y="245" width="200" height="44" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="120.0" y="267.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">DISORGANIZED</text><rect x="230" y="245" width="240" height="44" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="350.0" y="267.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">inconsistent</text><rect x="480" y="245" width="240" height="44" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="600.0" y="260.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">confused, contradictory</text><text x="600.0" y="273.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(freezing)</text></svg>
