<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d63"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cd9"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138f9a"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="380.0" y="24.0" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Statuses and roles</text><rect x="20" y="55" width="220" height="130" rx="10" fill="#e6eefc" stroke="#2f6fdb" stroke-width="1.5"/><text x="130.0" y="78.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">STATUS</text><text x="130.0" y="92.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">a social position</text><text x="130.0" y="106.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle"></text><text x="130.0" y="120.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ascribed: given (age, royalty)</text><text x="130.0" y="133.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">achieved: earned (surgeon)</text><text x="130.0" y="147.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">master: dominates all others</text><text x="130.0" y="161.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(ex-offender)</text><path d="M242,120 L290,120" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="295" y="55" width="210" height="130" rx="10" fill="#e3f5ec" stroke="#1f9d63" stroke-width="1.5"/><text x="400.0" y="99.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ROLE SET</text><text x="400.0" y="113.1" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">all roles tied to ONE status</text><text x="400.0" y="126.9" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(professor: teach, advise,</text><text x="400.0" y="140.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">serve on committees)</text><rect x="530" y="45" width="210" height="70" rx="10" fill="#fdf1db" stroke="#d98a00" stroke-width="1.5"/><text x="635.0" y="66.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ROLE STRAIN</text><text x="635.0" y="80.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">clash WITHIN one status</text><text x="635.0" y="93.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(resident: fast vs thorough)</text><rect x="530" y="125" width="210" height="70" rx="10" fill="#fbe7e5" stroke="#d6453d" stroke-width="1.5"/><text x="635.0" y="146.2" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ROLE CONFLICT</text><text x="635.0" y="160.0" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">clash BETWEEN statuses</text><text x="635.0" y="173.8" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">(parent vs employee)</text><text x="380.0" y="222.0" font-size="10.5" font-weight="400" fill="#5b6474" text-anchor="middle" dominant-baseline="middle">Status inconsistency: statuses of very different prestige (respected physician in a stigmatized group).</text><text x="380.0" y="252.0" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">Role exit (Ebaugh):</text><rect x="60" y="268" width="140" height="55" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="130.0" y="295.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">first doubts</text><path d="M202,295 L228,295" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="230" y="268" width="140" height="55" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="300.0" y="288.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">search for</text><text x="300.0" y="302.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">alternatives</text><path d="M372,295 L398,295" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="400" y="268" width="140" height="55" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="470.0" y="295.5" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">turning point</text><path d="M542,295 L568,295" fill="none" stroke="#1f2430" stroke-width="1.8" marker-end="url(#ah)"/><rect x="570" y="268" width="140" height="55" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="640.0" y="288.6" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">create the</text><text x="640.0" y="302.4" font-size="11" font-weight="500" fill="#1f2430" text-anchor="middle" dominant-baseline="middle">ex-role</text></svg>
