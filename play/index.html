<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="520 Quest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>520 Quest</title>
<meta name="theme-color" content="#11100c">
<meta name="description" content="A free, game-style MCAT study app: swipe questions, beat bosses, fix your traps, aim for 520+.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;800&display=swap">
<style>
/* Layout: a phone-first game shell. HUD on top, one swipe feed in the middle, tab bar at the bottom. Dark arcade cabinet in the 520+ brand yellow. */
:root {
  --ink: #11100c;        /* page */
  --panel: #1c1a14;      /* cards */
  --panel-2: #29261d;    /* raised controls */
  --line: #3a352a;       /* hairlines */
  --text: #f6f1e3;
  --muted: #aaa38f;
  --volt: #facc15;       /* brand yellow */
  --volt-ink: #1a1500;   /* text on yellow */
  --good: #4ade80;
  --bad: #fb7185;
  --cool: #67e8f9;       /* xp + info */
  --heat: #fb923c;       /* streak */
  --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font: 16px/1.5 var(--body); -webkit-tap-highlight-color: transparent; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; max-width: 560px; margin: 0 auto; position: relative; }

/* HUD */
.hud { display: flex; align-items: center; gap: 12px; padding: 10px 16px 8px; border-bottom: 1px solid var(--line); background: var(--ink); }
.lvl { font: 700 13px/1 var(--display); background: var(--volt); color: var(--volt-ink); border-radius: 8px; padding: 7px 8px; min-width: 46px; text-align: center; letter-spacing: .04em; }
.xpwrap { flex: 1; min-width: 0; display: grid; gap: 4px; }
.rank { font: 600 12px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 7px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--cool); border-radius: inherit; transition: width .5s ease; }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 700 14px/1 var(--display); font-variant-numeric: tabular-nums; padding: 6px 9px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); }
.pill svg { width: 15px; height: 15px; }
.pill.streak { color: var(--heat); }
.pill.goal { color: var(--good); }
.hudpro { flex: none; display: inline-flex; align-items: center; gap: 5px; font: 700 13px/1 var(--display); letter-spacing: .06em; padding: 8px 11px; border-radius: 99px; border: 0; cursor: pointer; color: #1a0610; background: linear-gradient(135deg, #fb7185, #facc15); box-shadow: 0 0 0 0 rgba(251,113,133,.6); animation: proPulse 2.4s ease-in-out infinite; }
.hudpro svg { width: 14px; height: 14px; }
.hudpro[hidden] { display: none; }
.hudinst { flex: none; display: inline-flex; align-items: center; gap: 4px; font: 700 13px/1 var(--display); letter-spacing: .06em; padding: 7px 10px; border-radius: 99px; cursor: pointer; color: var(--volt); background: transparent; border: 2px solid var(--volt); }
.hudinst svg { width: 14px; height: 14px; }
.hudinst[hidden] { display: none; }
@media (max-width: 400px) { .hud { gap: 6px; padding-left: 10px; padding-right: 10px; } .hud .pill { padding: 6px 7px; } .hudinst { padding: 7px 8px; } .hudpro { padding: 8px 9px; } }
@keyframes proPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(251,113,133,.55); } 50% { box-shadow: 0 0 0 7px rgba(251,113,133,0); } }
.card.promo { background: radial-gradient(circle at 85% 10%, rgba(250,204,21,.28), transparent 45%), linear-gradient(160deg, rgba(251,113,133,.30), var(--panel) 70%); border-color: #fb7185; }
.card.promo .bigtext { margin: 0; }
.btn.pro { background: linear-gradient(135deg, #fb7185, #facc15); color: #1a0610; border: 0; font-weight: 800; text-decoration: none; justify-content: center; }
.probanner { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r); background: linear-gradient(135deg, rgba(251,113,133,.25), rgba(250,204,21,.18)); border: 1px solid #fb7185; }
.probanner p { margin: 0; flex: 1; font-size: 14px; }
.probanner b { font-family: var(--display); letter-spacing: .03em; }

/* Views */
.views { position: relative; min-height: 0; }
.view { position: absolute; inset: 0; overflow-y: auto; padding: 14px 16px 24px; }
.view[hidden] { display: none !important; }
#view-scroll { padding: 0; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.filters { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chipbtn { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 99px; padding: 6px 12px; font: 600 13px/1 var(--display); letter-spacing: .05em; }
.chipbtn[aria-pressed="true"] { background: var(--volt); color: var(--volt-ink); border-color: var(--volt); }
.chipbtn.focus { color: var(--cool); border-color: var(--cool); }
.feed { overflow-y: auto; scroll-snap-type: y proximity; padding: 0 16px 40px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.card { flex: none; scroll-snap-align: start; scroll-margin-top: 8px; min-height: calc(100% - 14px); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.card-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font: 600 11px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; background: var(--panel-2); color: var(--muted); }
.tag.sec { color: var(--volt); }
.tag.rev { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.tag.star { color: var(--volt); }
.diff { margin-left: auto; display: flex; gap: 3px; }
.diff i { width: 7px; height: 7px; border-radius: 2px; background: var(--panel-2); }
.diff i.on { background: var(--heat); }
.stem { font: 600 clamp(18px, 4.6vw, 21px)/1.4 var(--body); margin: 0; text-wrap: pretty; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left; padding: 12px; background: var(--panel-2); border: 1.5px solid transparent; border-radius: 12px; transition: transform .08s, border-color .15s, background .15s; }
.opt:active { transform: scale(.985); }
.opt b { font: 700 14px/30px var(--display); text-align: center; border-radius: 8px; background: var(--ink); color: var(--muted); height: 30px; }
.opt span { padding-top: 4px; min-width: 0; }
.opt small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 4px; line-height: 1.4; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--panel-2)); }
.opt.right b { background: var(--good); color: var(--ink); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel-2)); }
.opt.wrong b { background: var(--bad); color: var(--ink); }
.opt.gone { opacity: .3; pointer-events: none; }
.opt:disabled { cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 10px 14px; font: 600 14px/1.2 var(--body); }
.btn.primary { background: var(--volt); color: var(--volt-ink); border-color: var(--volt); font-weight: 800; }
.btn.ghost { background: transparent; }
.btn.small { padding: 7px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.verdict { font: 700 18px/1.2 var(--display); letter-spacing: .03em; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.note { border-left: 3px solid var(--volt); padding: 4px 0 4px 10px; color: var(--text); font-size: 14.5px; }
.dna { display: grid; gap: 8px; padding: 12px; border-radius: 12px; background: var(--ink); border: 1px dashed var(--line); }
.dna p { margin: 0; font-size: 14px; color: var(--muted); }
.dna .row .btn[aria-pressed="true"] { background: var(--volt); color: var(--volt-ink); border-color: var(--volt); }
.swipe { margin-top: auto; text-align: center; font: 600 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-top: 6px; }
.swipe svg { display: block; margin: 0 auto 6px; width: 18px; height: 18px; animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.passage { font-size: 15.5px; line-height: 1.65; display: grid; gap: 10px; }
.passage p { margin: 0; }
.pq { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.qhead { font: 700 13px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--volt); padding: 12px 0 0; border-top: 2px solid var(--volt); }
.card { position: relative; }
.pq h3 { margin: 0; font: 600 16.5px/1.4 var(--body); }
.bigtext { font: 600 clamp(20px, 5.4vw, 25px)/1.35 var(--body); margin: 0; text-wrap: pretty; }
.eyebrow { font: 700 12px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--volt); }
.card.fact { background: linear-gradient(160deg, color-mix(in srgb, var(--cool) 10%, var(--panel)), var(--panel) 60%); }
.card.fact .eyebrow { color: var(--cool); }
.card.trap { background: linear-gradient(160deg, color-mix(in srgb, var(--bad) 12%, var(--panel)), var(--panel) 60%); }
.card.trap .eyebrow { color: var(--bad); }
.card.gate { background: linear-gradient(160deg, color-mix(in srgb, var(--volt) 14%, var(--panel)), var(--panel) 65%); }
.example { background: var(--ink); border-radius: 12px; padding: 12px; font-size: 14.5px; color: var(--muted); }
.example b { color: var(--text); }
.float { position: absolute; right: 16px; top: 14px; font: 700 20px/1 var(--display); color: var(--cool); pointer-events: none; animation: rise 1.3s ease-out forwards; text-shadow: 0 2px 10px var(--ink); }
.float.crit { color: var(--volt); font-size: 24px; }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.9); } 15% { opacity: 1; transform: translateY(0) scale(1.08); } to { opacity: 0; transform: translateY(-40px); } }
.combo { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font: 700 12px/1 var(--display); letter-spacing: .12em; background: var(--heat); color: var(--ink); padding: 5px 10px; border-radius: 99px; z-index: 3; pointer-events: none; }

/* Tab bar */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--ink); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tab { background: none; border: 0; display: grid; justify-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font: 600 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; border-radius: 10px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--volt); }

/* Panels in Boss / Map / Me */
h2.title { font: 700 26px/1.1 var(--display); letter-spacing: .02em; margin: 4px 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 16px; font-size: 14.5px; }
.stack { display: grid; gap: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h3 { margin: 0; font: 700 15px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; }
.panel p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat b { display: block; font: 700 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }

.bosses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.boss { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; min-width: 0; }
.boss .face { font: 700 30px/1 var(--display); width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; color: var(--ink); }
.boss strong { font: 700 16px/1.15 var(--display); }
.boss small { color: var(--muted); font-size: 12.5px; }
.boss.done { border-color: var(--good); }
.arena { display: grid; gap: 12px; }
.hpline { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.hp { height: 14px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.hp > i { display: block; height: 100%; background: var(--bad); transition: width .45s ease; }
.hearts { display: flex; gap: 4px; }
.hearts i { width: 16px; height: 16px; background: var(--bad); clip-path: path("M8 15 L1.5 8.5 A3.6 3.6 0 0 1 8 3.4 A3.6 3.6 0 0 1 14.5 8.5 Z"); }
.hearts i.lost { background: var(--panel-2); }
.timer { font: 700 18px/1 var(--display); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.catgroup { display: grid; gap: 2px; }
.cat { display: grid; grid-template-columns: 40px 1fr 64px; gap: 10px; align-items: center; padding: 9px 4px; border: 0; background: none; text-align: left; border-bottom: 1px solid var(--line); }
.cat:last-child { border-bottom: 0; }
.cat code { font: 700 14px/1 var(--display); color: var(--volt); }
.cat .t { font-size: 14px; line-height: 1.3; min-width: 0; }
.cat .t small { display: block; color: var(--muted); font-size: 12px; }
.meter { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; }

.donut { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; }
.legend { display: grid; gap: 6px; font-size: 14px; }
.legend span { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.badge { border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; font-size: 12px; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.badge i { width: 34px; height: 34px; border-radius: 10px; background: var(--panel-2); display: grid; place-items: center; font: 700 14px/1 var(--display); font-style: normal; color: var(--muted); }
.badge.got { color: var(--text); border-color: color-mix(in srgb, var(--volt) 50%, var(--line)); }
.badge.got i { background: var(--volt); color: var(--volt-ink); }
.teaser { position: relative; border-radius: 12px; overflow: hidden; }
.blurred { filter: blur(5px); opacity: .75; pointer-events: none; user-select: none; padding: 6px; }
.teaser-cta { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; text-align: center; background: color-mix(in srgb, var(--panel) 35%, transparent); }
.locked { position: relative; }
.locked > .lockveil { position: absolute; inset: 0; background: color-mix(in srgb, var(--panel) 80%, transparent); backdrop-filter: blur(3px); border-radius: inherit; display: grid; place-items: center; text-align: center; padding: 14px; gap: 8px; align-content: center; }
input[type=text], input[type=number], select, textarea { background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; min-width: 0; }
textarea { width: 100%; min-height: 110px; font: 12.5px/1.45 ui-monospace, Menlo, monospace; resize: vertical; }
label.field { display: grid; gap: 5px; font-size: 13.5px; color: var(--muted); }
.ring { position: relative; width: 74px; height: 74px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 16px/1 var(--display); font-variant-numeric: tabular-nums; }
.links a { color: var(--volt); }
a { color: var(--volt); }

/* Sheet + toasts */
.scrim { position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) 70%, transparent); display: grid; align-items: end; z-index: 20; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 88%; overflow-y: auto; animation: up .25s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet h2 { margin: 0; font: 700 24px/1.15 var(--display); text-wrap: balance; }
.toasts { position: absolute; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 30; pointer-events: none; }
.toast { background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--volt); border-radius: 12px; padding: 10px 12px; font-size: 14px; animation: up .2s ease-out; box-shadow: 0 8px 24px rgb(0 0 0 / .35); }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 40; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="app">
  <header class="hud">
    <div class="lvl" id="hudLvl" aria-label="Level">LV 1</div>
    <div class="xpwrap">
      <div class="rank" id="hudRank">Pre-Med Rookie</div>
      <div class="bar" aria-label="XP to next level"><i id="hudXp"></i></div>
    </div>
    <span class="pill goal" id="hudGoal" title="Today's goal"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg><span id="hudGoalTxt">0/25</span></span>
    <span class="pill streak" id="hudStreak" title="Day streak"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8.6 1c.4 2.4-1.3 3.4-2.3 4.8C5.4 7 5 8 5 9.2 5 11.9 6.6 15 8 15c2.6 0 4-2.3 4-4.9 0-2-1-3.1-1.7-4-.2 1-.7 1.7-1.4 2C9.8 5.9 9.7 3 8.6 1Z"/></svg><span id="hudStreakTxt">0</span></span>
    <button class="hudinst" id="hudInstall" data-install hidden aria-label="Install app"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13.5h10"/></svg>APP</button>
    <button class="hudpro" id="hudPro" data-pro hidden><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l2.1 4.3 4.7.7-3.4 3.3.8 4.7L8 11.8 3.8 14l.8-4.7L1.2 6l4.7-.7z"/></svg>PRO</button>
  </header>

  <div class="views">
    <section class="view" id="view-scroll" aria-label="Scroll">
      <div class="filters" id="filters"></div>
      <div class="feed" id="feed" aria-live="polite"></div>
    </section>
    <section class="view" id="view-boss" hidden aria-label="Boss battles"></section>
    <section class="view" id="view-map" hidden aria-label="Skill map"></section>
    <section class="view" id="view-me" hidden aria-label="Profile"></section>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="scroll" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M12 8v6M9.5 11.5 12 14l2.5-2.5"/></svg>Scroll</button>
    <button class="tab" role="tab" data-tab="boss" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 15 9M14 4l6 6M9 9l6 6M5 15l4 4"/></svg>Boss</button>
    <button class="tab" role="tab" data-tab="map" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
    <button class="tab" role="tab" data-tab="me" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
  </nav>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="sheetHost"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
</div>

<script>
/* ===== CONTENT: original questions written for 520 Quest. Not AAMC material. ===== */
const SECTIONS = {
  CP: { name: "Chem/Phys", long: "Chemical & Physical Foundations" },

  if (correct) { S.totalCorrect++; S.today.correct++; }
  const rv = S.revenge[q.id];
  if (!correct) S.revenge[q.id] = { box: 0, due: Date.now() + 20 * 3600000 };
  else if (rv) {
    rv.box++;
    if (rv.box >= 3) { delete S.revenge[q.id]; S.retired++; toast("Revenge complete. That one is <b>mastered</b>."); }
    else rv.due = Date.now() + [1, 3, 7][rv.box] * DAY;
  }
  let gain = 0, crit = false;
  if (correct) {
    S.combo++; S.bestCombo = Math.max(S.bestCombo, S.combo);
    gain = (10 + 5 * q.d) * comboMult(S.combo);
    if (secs < 60) gain += 3;
    const r = Math.random();
    if (r < .02) { gain += 50; crit = "JACKPOT"; } else if (r < .14) { gain *= 2; crit = "CRIT"; }
    S.chest++; if (S.chest >= 8) { S.chest = 0; setTimeout(openChest, 700); }
  } else { S.combo = 0; gain = 2; }
  addXP(gain);
  if (S.today.answered >= S.goal && !S.today.goalShown) { S.today.goalShown = true; goalHit(); setTimeout(showDone, 900); }
  checkBadges(); save(); renderHUD();
  return { gain: Math.round(gain), crit };
}

/* ---------- feed engine ---------- */
const feed = $("#feed");
let cardN = 0, sessionSeen = new Set(), factI = 0, trapI = 0, passI = 0, gateShown = false;
const FILTERS = [["ALL", "All"], ["CP", "C/P"], ["CARS", "CARS"], ["BB", "B/B"], ["PS", "P/S"]];
function renderFilters() {
  $("#filters").innerHTML = FILTERS.map(([k, n]) => `<button class="chipbtn" data-f="${k}" aria-pressed="${S.filter === k && !S.focus}">${n}</button>`).join("") +
    (S.focus ? `<button class="chipbtn focus" data-f="clear" aria-pressed="false">Drilling ${esc(S.focus)} ✕</button>` : "");
}
$("#filters").addEventListener("click", e => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  if (b.dataset.f === "clear") S.focus = null; else { S.filter = b.dataset.f; S.focus = null; }
  save(); resetFeed();
});
function mastery(code) { const c = S.cat[code] || { a: 0, c: 0 }; return (c.c + 1) / (c.a + 2); }
function pickQuestion() {
  const sec = S.focus ? CAT[S.focus].s : S.filter;
  let pool = QUESTIONS.filter(q => (sec === "ALL" || q.s === sec) && (!S.focus || q.c === S.focus));
  const now = Date.now();
  const due = pool.filter(q => S.revenge[q.id] && S.revenge[q.id].due <= now && !sessionSeen.has(q.id));
  if (due.length) return [due[0], true];
  let fresh = pool.filter(q => !sessionSeen.has(q.id));
  if (!fresh.length) { pool.forEach(q => sessionSeen.delete(q.id)); fresh = pool; }
  const w = fresh.map(q => { const st = S.stats[q.id]; let x = !st ? 3 : st.c === st.a ? .5 : 1.5; return x * (1 + (1 - mastery(q.c)) * 2); });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < fresh.length; i++) { r -= w[i]; if (r <= 0) return [fresh[i], false]; }
  return [fresh[fresh.length - 1], false];
}
function overFree() { return !S.pro && S.today.answered >= CONFIG.freeDailyQuestions; }
function nextCard() {
  if (overFree()) { if (gateShown) return null; gateShown = true; return gateCard(); }
  cardN++;
  const sec = S.focus ? CAT[S.focus].s : S.filter;
  if (sec === "CARS") return passageCard(PASSAGES[passI++ % PASSAGES.length]);
  if (!S.focus && sec === "ALL" && cardN % 9 === 0) return passageCard(PASSAGES[passI++ % PASSAGES.length]);
  if (cardN === 4 && !installed()) return installCard();
  if (!S.pro && cardN % 12 === 0) return promoCard();
  if (!S.focus && cardN % 5 === 0) return (cardN / 5) % 2 ? factCard() : trapCard();
  const [q, rev] = pickQuestion(); sessionSeen.add(q.id);
  return questionCard(q, rev);
}
function fill(n = 3) { for (let i = 0; i < n; i++) { const c = nextCard(); if (!c) break; feed.appendChild(c); io.observe(c); } watchEnd(); }
function resetFeed() { feed.innerHTML = ""; cardN = 0; gateShown = false; sessionSeen = new Set(); renderFilters(); fill(4); feed.scrollTop = 0; }

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && !e.target._shown) e.target._shown = Date.now(); }), { threshold: .55 });
const endObs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) fill(3); }, { root: feed, threshold: .1 });
function watchEnd() { endObs.disconnect(); const k = feed.children; if (k.length > 1) endObs.observe(k[k.length - 2]); }

const SWIPE = `<div class="swipe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 14l6-6 6 6"/></svg>Swipe up</div>`;
const diffDots = d => `<span class="diff" title="Difficulty ${d} of 3">${[1, 2, 3].map(i => `<i class="${i <= d ? "on" : ""}"></i>`).join("")}</span>`;
function scrollToEl(t) { feed.scrollTo({ top: feed.scrollTop + t.getBoundingClientRect().top - feed.getBoundingClientRect().top - 8, behavior: reduce ? "auto" : "smooth" }); }
function shuf(q) {
  const order = q.o.map((_, i) => i).sort(() => Math.random() - .5);
  return Object.assign({}, q, { o: order.map(i => q.o[i]), a: order.indexOf(q.a) });
}
function optsHTML(q) { return q.o.map((o, i) => `<button class="opt" data-i="${i}"><b>${"ABCD"[i]}</b><span>${o[0]}</span></button>`).join(""); }

function questionCard(q, rev) {
  q = shuf(q);
  const el = document.createElement("article"); el.className = "card q"; el.dataset.id = q.id;
  const cat = CAT[q.c];
  el.innerHTML = `<div class="card-top"><span class="tag sec">${SECTIONS[q.s].name}</span><span class="tag">${q.c}${cat.hy ? " ★" : ""}</span>${rev ? '<span class="tag rev">Revenge</span>' : ""}${diffDots(q.d)}</div>
    <h2 class="stem">${q.q}</h2><div class="opts">${optsHTML(q)}</div>
    <div class="row tools"><button class="btn small ghost" data-hint ${S.hints ? "" : "disabled"}>Hint (${S.hints})</button><span class="muted small">${esc(cat.title)}</span></div>
    <div class="reveal stack" hidden></div>${SWIPE}`;
  wireQuestion(el, q, el);
  return el;
}
function wireQuestion(scope, q, card) {
  const optsBox = $(".opts", scope);
  optsBox.addEventListener("click", e => {
    const b = e.target.closest(".opt"); if (!b || optsBox.dataset.done) return;
    optsBox.dataset.done = 1;
    const i = +b.dataset.i, ok = i === q.a, secs = ((Date.now() - (card._shown || card._made || Date.now())) / 1000);
    $$(".opt", optsBox).forEach((o, j) => {
      o.disabled = true;
      if (j === q.a) o.classList.add("right"); else if (j === i) o.classList.add("wrong");
      o.querySelector("span").insertAdjacentHTML("beforeend", `<small>${q.o[j][1]}</small>`);
    });
    const { gain, crit } = record(q, ok, secs);
    beep(ok ? "good" : "bad"); if (!ok && !reduce) { card.classList.add("shake"); setTimeout(() => card.classList.remove("shake"), 400); }
    const f = document.createElement("div"); f.className = "float" + (crit ? " crit" : "");
    f.textContent = (crit ? crit + " " : "") + "+" + gain + " XP" + (ok && comboMult(S.combo) > 1 ? " ×" + comboMult(S.combo) : "");
    card.appendChild(f); setTimeout(() => f.remove(), 1400);
    if (ok && S.combo >= 3) { const c = document.createElement("div"); c.className = "combo"; c.textContent = S.combo + " COMBO"; card.appendChild(c); setTimeout(() => c.remove(), 1400); }
    const rv = $(".reveal", scope); rv.hidden = false;
    rv.innerHTML = `<div class="verdict ${ok ? "ok" : "no"}">${ok ? "Correct" : "Not quite. Answer: " + "ABCD"[q.a]}</div>` +
      (q.note ? `<div class="note">${q.note}</div>` : "") + (ok ? "" : dnaHTML(secs)) + `<div class="row"><button class="btn small" data-next>Next card</button></div>`;
    const sib = scope !== card && scope.nextElementSibling && scope.nextElementSibling.classList.contains("pq") ? scope.nextElementSibling : null;
    const nb = $("[data-next]", rv); if (sib) nb.textContent = "Next question";
    nb.addEventListener("click", () => { const n = sib || card.nextElementSibling; if (n) scrollToEl(n); });
    if (!ok) wireDNA(rv, q, secs);
    const h = $("[data-hint]", scope); if (h) h.disabled = true;
  });
  const hint = $("[data-hint]", scope);
  if (hint) hint.addEventListener("click", () => {
    if (!S.hints || optsBox.dataset.done) return;
    S.hints--; save();
    const wrong = q.o.map((_, j) => j).filter(j => j !== q.a).sort(() => Math.random() - .5).slice(0, 2);
    wrong.forEach(j => $$(".opt", optsBox)[j].classList.add("gone"));
    hint.disabled = true; hint.textContent = "Hint used";
  });
}
function dnaHTML(secs) {
  const slow = secs > 95;
  return `<div class="dna"><p><b>Error DNA:</b> why did you miss it?${slow ? " You took " + Math.round(secs) + " s, so Time is pre-selected." : ""}</p>
    <div class="row"><button class="btn small" data-dna="Content">Content: didn't know it</button><button class="btn small" data-dna="Trap">Trap: got tricked</button><button class="btn small" data-dna="Time" ${slow ? 'aria-pressed="true"' : ""}>Time: too slow</button></div></div>`;
}
function wireDNA(rv, q, secs) {
  const box = $(".dna", rv);
  const log = type => {
    const prev = S.errors.find(e => e.id === q.id && e.date === todayKey());
    if (prev) prev.type = type; else { S.errors.push({ id: q.id, s: q.s, type, date: todayKey() }); addXP(2); }
    $$("[data-dna]", box).forEach(b => b.setAttribute("aria-pressed", b.dataset.dna === type));
    save();

  box.addEventListener("click", e => { const b = e.target.closest("[data-dna]"); if (b) { log(b.dataset.dna); toast(`Logged as <b>${b.dataset.dna}</b>. It comes back in your Revenge queue tomorrow.`); } });
  if (secs > 95) log("Time");
}

function passageCard(p) {

    <div class="hpline"><span class="face" style="font:700 22px/1 var(--display);color:${B.boss.col}">${B.boss.face}</span><div class="hp"><i style="width:${B.hp / 70 * 100}%"></i></div><span class="small muted">${esc(B.boss.name)}</span></div>
    <div class="row" style="justify-content:space-between"><div class="hearts">${[0, 1, 2, 3].map(i => `<i class="${i < B.hearts ? "" : "lost"}"></i>`).join("")}</div><span class="small muted">Question ${B.i + 1} of 10</span></div>
    <article class="card" id="bcard" style="min-height:0"><div class="card-top"><span class="tag sec">${SECTIONS[q.s].name}</span><span class="tag">${q.c}</span>${diffDots(q.d)}</div><h2 class="stem">${q.q}</h2><div class="opts">${optsHTML(q)}</div><div class="reveal stack" hidden></div></article></div>`;
  const card = $("#bcard"); card._shown = Date.now();
  const box = $(".opts", card);
  const finish = (i) => {
    if (box.dataset.done) return; box.dataset.done = 1; clearInterval(B.tick);
    const secs = (Date.now() - B.start) / 1000, ok = i === q.a;
    $$(".opt", box).forEach((o, j) => { o.disabled = true; if (j === q.a) o.classList.add("right"); else if (j === i) o.classList.add("wrong"); o.querySelector("span").insertAdjacentHTML("beforeend", `<small>${q.o[j][1]}</small>`); });
    const r = record(q, ok, secs); B.xp += r.gain;
    if (ok) { B.right++; const dmg = 10 + (secs < 45 ? 2 : 0); B.hp = Math.max(0, B.hp - dmg); beep("good"); }
    else { B.hearts--; beep("bad"); if (!reduce) { card.classList.add("shake"); } }
    $(".hp i").style.width = B.hp / 70 * 100 + "%";
    $$(".hearts i").forEach((h, k) => h.classList.toggle("lost", k >= B.hearts));
    const rv = $(".reveal", card); rv.hidden = false;
    rv.innerHTML = `<div class="verdict ${ok ? "ok" : "no"}">${i < 0 ? "Time's up" : ok ? "Hit! −" + (10 + (secs < 45 ? 2 : 0)) + " HP" : "Ouch. Answer: " + "ABCD"[q.a]}</div>${q.note ? `<div class="note">${q.note}</div>` : ""}<div class="row"><button class="btn primary" id="bnext">${B.hp <= 0 || B.hearts <= 0 || B.i >= 9 ? "See result" : "Next question"}</button></div>`;
    if (!ok) { S.errors.push({ id: q.id, s: q.s, type: i < 0 || secs > 95 ? "Time" : "Trap", date: todayKey() }); save(); }
    $("#bnext").addEventListener("click", () => { B.i++; bossTurn(); });
  };
  box.addEventListener("click", e => { const b = e.target.closest(".opt"); if (b) finish(+b.dataset.i); });
  B.tick = setInterval(() => {
    const left = Math.max(0, 95 - Math.floor((Date.now() - B.start) / 1000)), t = $("#bt");
    if (!t) return clearInterval(B.tick);
    t.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0"); t.classList.toggle("low", left <= 15);
    if (left <= 0) finish(-1);
  }, 250);
}
function bossEnd() {
  const won = B.hp <= 0;
  if (won) { S.bossWins[B.boss.id] = (S.bossWins[B.boss.id] || 0) + 1; addXP(100); confetti(); beep("level"); }
  checkBadges(); save();
  $("#view-boss").innerHTML = `<div class="stack"><div class="eyebrow">${won ? "Victory" : "Defeated"}</div><h2 class="title">${won ? esc(B.boss.name) + " falls." : esc(B.boss.name) + " survives this time."}</h2>
    <div class="grid2"><div class="panel stat"><b>${B.right}/${B.i}</b><span>correct</span></div><div class="panel stat"><b>+${B.xp + (won ? 100 : 0)}</b><span>XP earned${won ? " incl. 100 victory bonus" : ""}</span></div></div>
    <p class="muted">${won ? "Your misses were added to the Revenge queue." : "Every miss is now in your Revenge queue. Clear those, then rematch."}</p>
    <div class="row"><button class="btn primary" data-lobby>Back to bosses</button></div></div>`;
  B = null;
}

/* ---------- map ---------- */
function renderMap() {
  const groups = ["CP", "CARS", "BB", "PS"];
  $("#view-map").innerHTML = `<h2 class="title">Skill map</h2><p class="sub">The 31 official AAMC content categories plus CARS and research skills. ★ marks our high-yield picks. Tap one to drill it in Scroll.</p>${S.pro ? "" : `<div class="probanner" style="margin-bottom:14px"><p><b>PRO</b> See your section score estimate and track every full-length.</p><button class="btn small pro" data-pro>Get Pro</button></div>`}
  <div class="stack">${groups.map(g => `<div class="panel"><h3>${SECTIONS[g].long}</h3><div class="catgroup">${CATS.filter(c => c[2] === g).map(([code, title, s, hy]) => {
    const c = S.cat[code] || { a: 0, c: 0 }, m = c.a ? c.c / c.a : 0, col = !c.a ? "var(--line)" : m >= .8 ? "var(--good)" : m >= .6 ? "var(--volt)" : "var(--bad)";
    const drill = s !== "CARS" && QUESTIONS.some(q => q.c === code);
    return `<button class="cat" ${drill ? `data-drill="${code}"` : "disabled"}><code>${code}</code><span class="t">${esc(title)}${hy ? ' <span style="color:var(--volt)">★</span>' : ""}<small>${c.a ? Math.round(m * 100) + "% of " + c.a : "Not tried yet"}</small></span><span class="meter"><i style="width:${c.a ? Math.max(6, m * 100) : 0}%;background:${col}"></i></span></button>`;
  }).join("")}</div></div>`).join("")}</div>`;
}
$("#view-map").addEventListener("click", e => {
  const b = e.target.closest("[data-drill]"); if (!b) return;
  S.focus = b.dataset.drill; save(); go("scroll"); resetFeed(); toast(`Drilling <b>${S.focus}</b>. Clear the chip to go back to the mix.`);
});

/* ---------- me ---------- */
function estimate(sec) {
  const r = S.recent[sec]; if (r.length < 15) return null;
  let w = 0, s = 0; r.forEach(([c, d]) => { const k = d === 3 ? 1.5 : d === 1 ? .8 : 1; w += k; s += c * k; });
  return Math.round(118 + 14 * Math.min(1, Math.max(0, (s / w - .3) / .65)));
}
function donut(counts) {
  const tot = counts.reduce((a, b) => a + b[1], 0); if (!tot) return `<p class="muted small">Miss a question and tag why. Your breakdown shows up here.</p>`;
  let a = 0; const R = 46, C = 2 * Math.PI * R;
  const arcs = counts.map(([n, v, col]) => { const len = v / tot * C, s = `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${col}" stroke-width="18" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-a}"/>`; a += len; return s; }).join("");
  const top = counts.slice().sort((x, y) => y[1] - x[1])[0][0];
  const tip = { Content: "Mostly content gaps. Drill the red rows on the Map, starting with starred categories.", Trap: "Mostly traps. You know the material; slow down on answer choices and review the Trap Alert cards.", Time: "Mostly time. Run boss battles to train the 95-second pace, and flag anything past 2 minutes." }[top];
  return `<div class="donut"><svg viewBox="0 0 120 120" width="120" height="120" style="transform:rotate(-90deg)" role="img" aria-label="Error breakdown">${arcs}</svg>
    <div class="legend">${counts.map(([n, v, col]) => `<div><span style="background:${col}"></span>${n}: <b>${v}</b> (${Math.round(v / tot * 100)}%)</div>`).join("")}</div></div><p class="small">${tip}</p>`;
}
function flChart(fl = S.fl) {
  if (!fl.length) return `<p class="muted small">Add your first full-length score to start the line.</p>`;
  const W = 320, H = 150, pad = 30, lo = Math.min(495, ...fl.map(f => f.score)), hi = 528;
  const x = i => pad + (fl.length === 1 ? (W - pad * 2) / 2 : i * (W - pad * 2) / (fl.length - 1)), y = v => H - 20 - (v - lo) / (hi - lo) * (H - 34);
  const pts = fl.map((f, i) => `${x(i)},${y(f.score)}`).join(" ");
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W * 1.4}px" role="img" aria-label="Full-length scores">
    ${[lo, 510, 520, 528].filter((v, i, a) => a.indexOf(v) === i && v >= lo).map(v => `<line x1="${pad}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 520 ? "var(--volt)" : "var(--line)"}" ${v === 520 ? 'stroke-dasharray="5 4"' : ""}/><text x="2" y="${y(v) + 4}" font-size="10" fill="${v === 520 ? "var(--volt)" : "var(--muted)"}">${v}</text>`).join("")}
    <polyline points="${pts}" fill="none" stroke="var(--cool)" stroke-width="2.5"/>
    ${fl.map((f, i) => `<circle cx="${x(i)}" cy="${y(f.score)}" r="${i === fl.length - 1 ? 5 : 3.5}" fill="var(--cool)"/><text x="${x(i)}" y="${H - 4}" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(f.label)}</text>`).join("")}
  </svg></div>`;
}
function proPanel(title, pitch, real, teaser) {
  if (S.pro) return `<div class="panel"><h3>${title}</h3>${real}</div>`;
  return `<div class="panel"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h3>${title}</h3><span class="tag sec">Pro</span></div><p class="small">${pitch}</p>
    <div class="teaser"><div class="blurred" aria-hidden="true" inert>${teaser}</div><div class="teaser-cta"><span class="small muted">Preview with sample numbers</span><button class="btn primary small" data-pro>Unlock, ${esc(CONFIG.price)}</button></div></div></div>`;
}
const SAMPLE_FL = [{ label: "FL 1", score: 506 }, { label: "FL 2", score: 510 }, { label: "FL 3", score: 513 }, { label: "FL 4", score: 517 }, { label: "FL 5", score: 521 }];
function renderMe() {
  const L = levelOf(S.xp), acc = S.total ? Math.round(S.totalCorrect / S.total * 100) : 0;
  const ests = ["CP", "CARS", "BB", "PS"].map(s => [s, estimate(s)]);
  const tot = ests.every(e => e[1]) ? ests.reduce((a, e) => a + e[1], 0) : null;
  const dnaCounts = ["Content", "Trap", "Time"].map((t, i) => [t, S.errors.filter(e => e.type === t).length, ["var(--cool)", "var(--bad)", "var(--heat)"][i]]);
  const revN = Object.keys(S.revenge).length, dueN = Object.values(S.revenge).filter(r => r.due <= Date.now()).length;
  const C = 2 * Math.PI * 31, pct = Math.min(1, S.today.answered / S.goal);
  $("#view-me").innerHTML = `<h2 class="title">${esc(rankOf(L))}</h2><p class="sub">Level ${L} · ${S.xp.toLocaleString()} XP · ${S.total} answered at ${acc}%${S.pro ? " · Pro" : ""}</p>
  <div class="stack">
    <div class="panel"><div class="row" style="gap:14px;flex-wrap:nowrap"><div class="ring"><svg viewBox="0 0 74 74" width="74" height="74"><circle cx="37" cy="37" r="31" fill="none" stroke="var(--panel-2)" stroke-width="8"/><circle cx="37" cy="37" r="31" fill="none" stroke="var(--good)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C * pct} ${C}"/></svg><b>${Math.round(pct * 100)}%</b></div>
      <div style="min-width:0"><h3>Today</h3><p class="small muted">${S.today.answered} of ${S.goal} questions. ${streakAlive()}-day streak, ${S.freezes} freeze${S.freezes === 1 ? "" : "s"}, ${S.hints} hint${S.hints === 1 ? "" : "s"}.</p><p class="small">Revenge queue: <b>${revN}</b> waiting, <b>${dueN}</b> due now.</p></div></div></div>
    <div class="panel"><h3>Error DNA</h3>${donut(dnaCounts)}</div>
    ${proPanel("Score estimate", "See your estimated score for each section, based on your recent answers.",
      `<p class="small muted">A rough practice estimate from your last 60 answers per section. It is not an AAMC prediction; your full-lengths are the real test.</p>
      <div class="grid2">${ests.map(([s, v]) => `<div class="stat"><b>${v || "–"}</b><span>${SECTIONS[s].name}${v ? "" : ": answer " + (15 - S.recent[s].length) + " more"}</span></div>`).join("")}</div>
      <p><b style="font:700 22px var(--display);color:var(--volt)">${tot || "–"}</b> <span class="muted small">${tot ? "estimated total (472–528)" : "total appears once every section has 15 answers"}</span></p>`,
      `<div class="grid2">${[["CP", 129], ["CARS", 128], ["BB", 131], ["PS", 130]].map(([s, v]) => `<div class="stat"><b>${v}</b><span>${SECTIONS[s].name}</span></div>`).join("")}</div><p><b style="font:700 22px var(--display);color:var(--volt)">518</b> <span class="muted small">estimated total</span></p>`)}
    ${proPanel("Full-length tracker", "Log every practice exam and watch your line climb toward the 520 mark.",
      `${flChart()}<div class="row"><input type="text" id="flLabel" placeholder="FL ${S.fl.length + 1}" style="width:90px"><input type="number" id="flScore" min="472" max="528" placeholder="Score" style="width:100px"><button class="btn" data-addfl>Add</button>${S.fl.length ? '<button class="btn ghost small" data-popfl>Remove last</button>' : ""}</div>`,
      flChart(SAMPLE_FL))}
    ${proPanel("Export misses to Anki", "Turn every question you missed into a flashcard deck in one tap. Works with Anki and Quizlet.",
      `<p class="small muted">Only your missed questions, one card each. In Anki: File, Import, choose Tab as the separator, allow HTML.</p>
      <div class="row"><button class="btn" data-anki>Build my deck (${new Set(S.errors.map(e => e.id)).size} cards)</button></div><div id="ankiOut"></div>`,
      `<div class="example" style="font:12px/1.6 ui-monospace,Menlo,monospace">Which enzyme relieves supercoiling…  →  Topoisomerase  ·  MCAT520::BB::Trap<br>Fe²⁺ configuration…  →  [Ar] 3d⁶  ·  MCAT520::CP::Content<br>Aspirin removes headache…  →  Negative reinforcement  ·  MCAT520::PS::Trap</div>`)}
    <div class="panel"><h3>Badges</h3><div class="badges">${BADGES.map(([id, ic, name]) => `<div class="badge ${S.badges[id] ? "got" : ""}"><i>${ic}</i>${esc(name)}</div>`).join("")}</div></div>
    <div class="panel"><h3>Settings</h3>
      <label class="field" for="goalSel">Daily goal<select id="goalSel">${[15, 25, 40, 60].map(n => `<option value="${n}" ${S.goal === n ? "selected" : ""}>${n} questions</option>`).join("")}</select></label>
      <label class="row small" for="soundChk"><input type="checkbox" id="soundChk" ${S.sound ? "checked" : ""}> Sound and vibration</label>
      <div class="row"><button class="btn small" data-share>Share my streak</button><button class="btn small" data-backup>Backup or move device</button><a class="btn small" href="../guide/" target="_blank" rel="noopener">How to use</a>${installed() ? "" : '<button class="btn small" data-install>Install app</button>'}${S.pro ? "" : '<button class="btn small pro" data-pro>Get Pro</button>'}</div><div id="backupOut"></div></div>
    ${CONFIG.resources.length ? `<div class="panel links"><h3>Resources</h3>${CONFIG.resources.map(r => `<p class="small"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a><br><span class="muted">${esc(r.note || "")}</span></p>`).join("")}</div>` : ""}
    <p class="small muted">520 Quest questions are original practice items, not official AAMC content. MCAT is a registered trademark of the AAMC, which does not endorse this app. Progress is saved on this device only.</p>
  </div>`;
}
$("#view-me").addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-pro]")) return showPro();
  if (t.closest("[data-share]")) return share();
  if (t.closest("[data-addfl]")) {
    const sc = +$("#flScore").value; if (!(sc >= 472 && sc <= 528)) return toast("Enter a total score from 472 to 528.");
    S.fl.push({ label: ($("#flLabel").value.trim() || "FL " + (S.fl.length + 1)).slice(0, 8), score: sc }); save(); return renderMe();
  }
  if (t.closest("[data-popfl]")) { S.fl.pop(); save(); return renderMe(); }
  if (t.closest("[data-anki]")) {
    const ids = [...new Set(S.errors.map(e => e.id))].map(anyQ).filter(Boolean);
    if (!ids.length) return toast("No misses logged yet. That is a good problem to have.");
    const typeOf = id => (S.errors.filter(e => e.id === id).pop() || {}).type || "Content";
    const txt = ids.map(q => `${q.q}<br>${q.o.map((o, i) => "ABCD"[i] + ") " + o[0]).join("<br>")}\t${"ABCD"[q.a]}) ${q.o[q.a][0]}<br>${q.o[q.a][1]}${q.note ? "<br><i>" + q.note + "</i>" : ""}\tMCAT520::${q.s}::${typeOf(q.id)}`.replace(/\n/g, " ")).join("\n");
    $("#ankiOut").innerHTML = `<textarea id="ankiTxt" readonly aria-label="Anki deck text"></textarea><div class="row"><button class="btn small primary" data-copyanki>Copy deck</button></div>`;
    $("#ankiTxt").value = txt; return;
  }
  if (t.closest("[data-copyanki]")) return copy($("#ankiTxt").value, () => toast("Deck copied. Paste into a .txt file and import into Anki."), $("#ankiTxt"));
  if (t.closest("[data-backup]")) {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    $("#backupOut").innerHTML = `<p class="small muted">Copy this code to keep a backup. On a new device, paste a code here and press Restore.</p><textarea id="bk" aria-label="Backup code"></textarea><div class="row"><button class="btn small" data-copybk>Copy code</button><button class="btn small" data-restore>Restore from pasted code</button></div>`;
    $("#bk").value = code; return;
  }
  if (t.closest("[data-copybk]")) return copy($("#bk").value, () => toast("Backup code copied."), $("#bk"));
  if (t.closest("[data-restore]")) {
    try { const o = JSON.parse(decodeURIComponent(escape(atob($("#bk").value.trim())))); if (o.v !== 1) throw 0; S = Object.assign(fresh(), o); save(); renderAll(); toast("Progress restored."); }
    catch (err) { toast("That code isn't a valid 520 Quest backup. Paste the whole code and try again."); }
  }
});
$("#view-me").addEventListener("change", e => {
  if (e.target.id === "goalSel") { S.goal = +e.target.value; S.today.goalShown = S.today.answered >= S.goal; save(); renderHUD(); renderMe(); }
  if (e.target.id === "soundChk") { S.sound = e.target.checked; save(); }
});

/* ---------- tabs ---------- */
function go(tab) {
  $$(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === tab));
  ["scroll", "boss", "map", "me"].forEach(v => $("#view-" + v).hidden = v !== tab);
  if (tab === "boss" && !B) renderBossLobby();
  if (tab === "map") renderMap();
  if (tab === "me") renderMe();
  if (tab !== "boss" && B) { clearInterval(B.tick); B = null; }
  const h = { scroll: "", boss: "boss", map: "map", me: "me" }[tab]; try { history.replaceState(null, "", h ? "#" + h : location.pathname); } catch (e) {}
}
$(".tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) go(t.dataset.tab); });
document.addEventListener("keydown", e => {
  if ($("#view-scroll").hidden || /input|textarea|select/i.test(e.target.tagName)) return;
  if (["1", "2", "3", "4"].includes(e.key)) {
    const card = [...feed.children].find(c => { const r = c.getBoundingClientRect(); return r.top >= -40 && r.top < innerHeight / 2; });
    const box = card && [...card.querySelectorAll(".opts")].find(b => !b.dataset.done);
    if (box) box.querySelectorAll(".opt")[+e.key - 1].click();
  }
  if (e.key === "j" || e.key === "ArrowDown") { feed.scrollBy({ top: feed.clientHeight * .9, behavior: reduce ? "auto" : "smooth" }); e.preventDefault(); }
  if (e.key === "k" || e.key === "ArrowUp") { feed.scrollBy({ top: -feed.clientHeight * .9, behavior: reduce ? "auto" : "smooth" }); e.preventDefault(); }
});

function renderAll() { renderHUD(); resetFeed(); if (!$("#view-me").hidden) renderMe(); if (!$("#view-map").hidden) renderMap(); }
renderAll();
const startTab = (location.hash || "").slice(1); if (["boss", "map", "me"].includes(startTab)) go(startTab);
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude\.ai|claudeusercontent/.test(location.hostname)) { navigator.serviceWorker.register("sw.js").catch(() => {}); }

</script>
