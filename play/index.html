/* White / navy / pink refinements */
.adjgoal, #goalPanel > h3 + p + .row { }
.adjgoal { background: #f472b6; color: #fff; border: 2px solid #1e3a8a; font-weight: 800; }
.musicrow { padding: 10px 12px; border-radius: 12px; background: linear-gradient(135deg, #f472b6, #93c5fd); color: #1e3a8a; font-weight: 800; }
.musicrow select { background: #fff; color: #1e3a8a; border-radius: 8px; border: 2px solid #1e3a8a; font-weight: 700; }
.panel, .card { box-shadow: 0 1px 2px rgba(15,23,42,.06); }
.crsbtn { width: 100%; min-height: 64px; border-radius: 16px; padding: 12px 14px; font: 800 17px/1.25 var(--body); text-align: center; cursor: pointer; display: grid; gap: 4px; justify-items: center; }
.crsbtn small { font: 600 12px var(--body); opacity: .9; }
.crs-sheets { background: #fbcfe8; border: 2px solid #f472b6; color: #1e3a8a; }
.crs-check { background: #93c5fd; border: 2px solid #1e3a8a; color: #1e3a8a; }
.crs-vault { background: #1e3a8a; border: 4px solid #f472b6; color: #fff; }
.crs-mini { background: #f472b6; border: 2px solid #1e3a8a; color: #fff; }
.crs-fl { background: #93c5fd; border: 2px solid #f472b6; color: #1e3a8a; }
.btn.pinkback { background: #f472b6; color: #fff; border-color: #f472b6; font-weight: 800; }
.xcard .btn.primary { background: #1e3a8a; color: #fff; border: 2px solid #f472b6; }
.xcard { background: #fff; border: 2px solid #f472b6; border-left: 4px solid #1e3a8a; color: #0f172a; }
.formula, .sv-doc pre, .sv-doc code.f, .sv-doc .formula { background: #f8fafc; border: 1px solid #e2e8f0; color: #0f172a; font-family: "STIX Two Math", Inter, serif; overflow: visible; }
</style>

<body>
<title>520 Quest</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="A free, game-style MCAT study app: swipe questions, beat bosses, fix your traps, aim for 520+.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;800&display=swap">
<style>
/* Layout: a phone-first game shell. HUD on top, one swipe feed in the middle, tab bar at the bottom. Dark arcade cabinet in the 520+ brand yellow. */
:root {
  /* White / navy / pink theme. Legacy names (--ink, --panel, --volt ...) are remapped so existing rules pick it up. */
  --bg:#ffffff; --bg-card:#ffffff; --bg-soft:#f8fafc; --bg-muted:#f1f5f9;
  --text-primary:#0f172a; --text-secondary:#475569; --text-muted:#94a3b8;
  --navy:#1e3a8a; --navy-dark:#1e293b; --navy-light:#1e40af;
  --light-blue:#93c5fd; --light-blue-soft:#dbeafe;
  --turquoise:#2dd4bf; --turquoise-soft:#ccfbf1;
  --pink:#f472b6; --pink-light:#fbcfe8; --pink-soft:#fce7f3;
  --green:#22c55e; --green-soft:#dcfce7; --peach:#FFCBA4;
  --border:#e2e8f0; --border-strong:#cbd5e1;
  --formula-bg:#f8fafc; --formula-border:#e2e8f0; --formula-text:#0f172a;
  --ink: #ffffff;        /* page */
  --panel: #ffffff;      /* cards */
  --panel-2: #f1f5f9;    /* raised controls */
  --line: #e2e8f0;       /* hairlines */
  --text: #0f172a;
  --muted: #475569;
  --volt: #1e3a8a;       /* brand navy */
  --volt-ink: #ffffff;   /* text on navy */
  --good: #16a34a;
  --bad: #e11d48;
  --cool: #2dd4bf;       /* xp + info */
  --heat: #f472b6;       /* streak */
  --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font: 16px/1.5 var(--body); -webkit-tap-highlight-color: transparent; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; max-width: 560px; margin: 0 auto; position: relative; }

/* HUD */
.hud { display: flex; align-items: center; gap: 12px; padding: 10px 16px 8px; border-bottom: 1px solid var(--line); background: var(--ink); }
.lvl { font: 700 13px/1 var(--display); background: var(--volt); color: var(--volt-ink); border-radius: 8px; padding: 7px 8px; min-width: 46px; text-align: center; letter-spacing: .04em; }
.xpwrap { flex: 1; min-width: 0; display: grid; gap: 4px; }
@media (max-width: 430px) { .rk-tier { display: none; } }
.rank { font: 600 12px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 7px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--cool); border-radius: inherit; transition: width .5s ease; }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 700 14px/1 var(--display); font-variant-numeric: tabular-nums; padding: 6px 9px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); }
.pill svg { width: 15px; height: 15px; }
.pill.streak { color: var(--heat); }
.pill.goal { color: var(--good); }
.hudpro { flex: none; display: inline-flex; align-items: center; gap: 5px; font: 700 13px/1 var(--display); letter-spacing: .06em; padding: 8px 11px; border-radius: 99px; border: 0; cursor: pointer; color: #fff; background: #f472b6; box-shadow: 0 0 0 0 rgba(244,114,182,.6); animation: proPulse 2.4s ease-in-out infinite; }
.hudpro svg { width: 14px; height: 14px; }
.hudpro[hidden] { display: none; }
.hudinst { flex: none; display: inline-flex; align-items: center; gap: 4px; font: 700 13px/1 var(--display); letter-spacing: .06em; padding: 7px 10px; border-radius: 99px; cursor: pointer; color: var(--volt); background: transparent; border: 2px solid var(--volt); }
.hudinst svg { width: 14px; height: 14px; }
.hudinst[hidden] { display: none; }
@media (max-width: 400px) { .hud { gap: 6px; padding-left: 10px; padding-right: 10px; } .hud .pill { padding: 6px 7px; } .hudinst { padding: 7px 8px; } .hudpro { padding: 8px 9px; } }
@keyframes proPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(244,114,182,.55); } 50% { box-shadow: 0 0 0 7px rgba(244,114,182,0); } }
.card.promo { background: radial-gradient(circle at 85% 10%, rgba(244,114,182,.28), transparent 45%), linear-gradient(160deg, rgba(244,114,182,.30), var(--panel) 70%); border-color: #f472b6; }
.card.promo .bigtext { margin: 0; }
.btn.pro { background: #f472b6; color: #fff; border: 0; font-weight: 800; text-decoration: none; justify-content: center; }
.probanner { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r); background: linear-gradient(135deg, rgba(244,114,182,.25), rgba(244,114,182,.18)); border: 1px solid #fb7185; }
.probanner p { margin: 0; flex: 1; font-size: 14px; }
.probanner b { font-family: var(--display); letter-spacing: .03em; }

/* Views */
.views { position: relative; min-height: 0; }
.view { position: absolute; inset: 0; overflow-y: auto; padding: 14px 16px 24px; }
.view[hidden] { display: none !important; }
#view-scroll { padding: 0; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.filters { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chipbtn { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 99px; padding: 6px 12px; font: 600 13px/1 var(--display); letter-spacing: .05em; }
.chipbtn[aria-pressed="true"] { background: var(--volt); color: var(--volt-ink); border-color: var(--volt); }
.chipbtn.focus { color: var(--cool); border-color: var(--cool); }
.feed { overflow-y: auto; scroll-snap-type: y proximity; padding: 0 16px 40px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.card { flex: none; scroll-snap-align: start; scroll-margin-top: 8px; min-height: calc(100% - 14px); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.card-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font: 600 11px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; background: var(--panel-2); color: var(--muted); }
.tag.sec { color: var(--volt); }
.tag.rev { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.tag.star { color: var(--volt); }
.diff { margin-left: auto; display: flex; gap: 3px; }
.diff i { width: 7px; height: 7px; border-radius: 2px; background: var(--panel-2); }
.diff i.on { background: var(--heat); }
.stem { font: 600 clamp(18px, 4.6vw, 21px)/1.4 var(--body); margin: 0; text-wrap: pretty; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left; padding: 12px; background: var(--panel-2); border: 1.5px solid transparent; border-radius: 12px; transition: transform .08s, border-color .15s, background .15s; }
.opt:active { transform: scale(.985); }
.opt b { font: 700 14px/30px var(--display); text-align: center; border-radius: 8px; background: var(--ink); color: var(--muted); height: 30px; }
.opt span { padding-top: 4px; min-width: 0; }
.opt small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 4px; line-height: 1.4; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--panel-2)); }
.opt.right b { background: var(--good); color: var(--ink); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel-2)); }
.opt.wrong b { background: var(--bad); color: var(--ink); }
.opt.gone { opacity: .3; pointer-events: none; }
.opt:disabled { cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid #1e3a8a; background: #1e3a8a; color: #fff; border-radius: 12px; padding: 10px 14px; font: 600 14px/1.2 var(--body); }
.btn.primary { background: var(--volt); color: var(--volt-ink); border-color: var(--volt); font-weight: 800; }
.btn.ghost { background: #fff; color: #1e3a8a; border-color: #1e3a8a; }
.btn.small { padding: 7px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.verdict { font: 700 18px/1.2 var(--display); letter-spacing: .03em; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.explain { display: grid; gap: 6px; padding: 14px; border-radius: 12px; background: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--good); }
.explain h4 { margin: 0; font: 700 15px/1.3 var(--display); letter-spacing: .02em; color: var(--good); }
.explain h4.miss { color: var(--bad); margin-top: 6px; }
.explain p { margin: 0; font-size: 15px; line-height: 1.5; }
/* Mastery Sheets viewer */
.sheets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 10px; }
.shbtn { text-align: left; border: 1px solid var(--line); background: var(--ink); color: var(--text); border-radius: 12px; padding: 10px; font: 600 13px/1.3 var(--body); display: grid; gap: 4px; cursor: pointer; }
.shbtn code { font: 700 13px/1 var(--display); color: var(--volt); }
.shbtn.locked { opacity: .6; }
.shbtn small { color: var(--muted); font-weight: 400; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#sheetView { position: fixed; inset: 0; z-index: 60; background: var(--ink); display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#sheetView[hidden] { display: none; }
.sv-top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sv-top h2 { margin: 0; font: 700 16px/1.25 var(--display); flex: 1; min-width: 0; }
.svclose { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 10px 18px; border: 0; border-radius: 99px; cursor: pointer; font: 800 16px/1 var(--display); letter-spacing: .02em; color: var(--volt-ink); background: var(--volt); box-shadow: 0 0 0 3px rgba(244,114,182,.35), 0 4px 16px rgba(244,114,182,.45); }
.svclose:hover, .svclose:focus-visible { filter: brightness(1.08); outline: none; box-shadow: 0 0 0 4px rgba(244,114,182,.6), 0 4px 18px rgba(244,114,182,.6); }
.svclose span { font-size: 18px; }
.sv-body { flex: 1; overflow-y: auto; padding: 16px 16px 60px; position: relative; }
.sv-doc { max-width: 760px; margin: 0 auto; position: relative; font-size: 15px; line-height: 1.55; }
.sv-doc h3 { font: 700 18px/1.3 var(--display); color: var(--volt); margin: 26px 0 8px; }
.sv-doc h4 { font: 700 15px/1.3 var(--display); margin: 18px 0 6px; }
.sv-doc p, .sv-doc ul, .sv-doc ol { margin: 8px 0; }
.sv-doc ul, .sv-doc ol { padding-left: 22px; }
.sv-doc li { margin: 4px 0; }
.sv-doc blockquote { margin: 0 0 10px; padding: 10px 12px; border-left: 3px solid var(--line); color: var(--muted); font-size: 13px; }
.sv-doc blockquote p { margin: 0; }
.sv-doc code { font: 600 13px ui-monospace, monospace; }
.sv-doc .formula { margin: 14px 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); text-align: center; font: 700 17px/1.4 var(--display); }
.sv-doc .formula span { display: inline-block; margin: 0 10px; }
.sv-doc sub, .sv-doc sup { font-size: .72em; line-height: 0; }
.sv-doc .tw { overflow-x: auto; margin: 10px 0; }
.sv-doc table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.sv-doc th, .sv-doc td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.sv-doc th { background: var(--panel); }
.sv-doc .flow { overflow-x: auto; margin: 12px 0; padding: 6px; border-radius: 12px; background: var(--panel); }
.sv-doc .flow svg { display: block; max-width: 100%; height: auto; }
.sv-doc .flow.light { background: #fff; }
.sv-doc .flow .nb { fill: var(--ink); stroke: var(--line); stroke-width: 1.5; }
.sv-doc .flow .nt { fill: var(--text); font: 600 14px var(--body); text-anchor: middle; }
.sv-doc .flow .el { fill: var(--muted); font: 12px var(--body); text-anchor: middle; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
.sv-doc .flow .arw { stroke: #94a3b8; stroke-width: 1.6; }
.sv-doc .flow .inh { stroke: var(--bad); stroke-width: 2; stroke-dasharray: 5 4; }
.sv-doc .qref { border: 0; background: none; padding: 0; color: var(--volt); font: inherit; text-decoration: underline; cursor: pointer; }
.sv-doc .wmline { font-weight: 700; color: var(--text); }
.sv-wm { position: absolute; inset: 0; pointer-events: none; opacity: .07; background-repeat: repeat; z-index: 1; }
@media print { #sheetView { display: none !important; } }
/* Course tab, gold Mastery Sheets button, Mnemonics Vault */
.tabs.five { grid-template-columns: repeat(5, 1fr); }
.tab .tbadge { position: absolute; top: 0; left: 50%; margin-left: 6px; font: 700 9px/1 var(--display); background: #f472b6; color: #fff; border-radius: 99px; padding: 2px 4px; letter-spacing: 0; }
.goldbtn { width: 100%; min-height: 56px; border: 0; border-radius: 16px; padding: 10px 14px; background: #f472b6; color: #fff; font: 800 16px/1.25 var(--body); display: grid; gap: 4px; justify-items: center; text-align: center; cursor: pointer; animation: goldglow 2s ease-in-out infinite; }
.goldbtn small { font: 700 11px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; background: rgba(255,255,255,.25); border-radius: 99px; padding: 4px 8px; }
@keyframes goldglow { 0%, 100% { box-shadow: 0 0 0 0 rgba(244, 114, 182, .55); } 50% { box-shadow: 0 0 22px 4px rgba(244, 114, 182, .55); } }
.backsheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; max-width: calc(100% - 32px); padding: 10px 18px; border: 0; border-radius: 99px; cursor: pointer; font: 800 15px/1.1 var(--display); color: var(--volt-ink); background: var(--volt); box-shadow: 0 0 0 3px rgba(244,114,182,.3), 0 6px 20px rgb(0 0 0 / .45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.has-back .toasts { bottom: calc(136px + env(safe-area-inset-bottom, 0px)); }
.sv-doc .qref.flash { animation: qflash 2s ease-out; border-radius: 4px; }
@keyframes qflash { 0%, 50% { background: rgba(244,114,182,.35); box-shadow: 0 0 0 4px rgba(244,114,182,.35); } 100% { background: none; box-shadow: none; } }
#goalPanel.flash { animation: goalflash 1.6s ease-out; }
@keyframes goalflash { 0%, 40% { box-shadow: 0 0 0 3px var(--volt); } 100% { box-shadow: 0 0 0 0 transparent; } }
.card.goldcard { display: grid; gap: 10px; align-content: center; }
.sheetlink { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; margin-top: 6px; padding: 10px 12px; border-radius: 12px; border: 1px solid #f472b6; background: #fce7f3; color: var(--text); font: 600 14px/1.3 var(--body); cursor: pointer; }
.sheetlink b { color: #1e3a8a; }
.lockcta { margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px dashed #f472b6; text-align: center; font-weight: 700; }
.mn-search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--ink); color: var(--text); font: 15px var(--body); }
.mn-cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mn-cat { border: 1px solid var(--line); background: var(--ink); color: var(--text); border-radius: 14px; padding: 14px; text-align: left; display: grid; gap: 4px; font: 700 15px/1.2 var(--display); cursor: pointer; }
.mn-cat small { color: var(--muted); font: 600 12px var(--body); }
.mn-item { border: 1px solid var(--line); background: var(--ink); color: var(--text); border-radius: 12px; padding: 12px; text-align: left; display: grid; gap: 4px; width: 100%; cursor: pointer; font: 15px/1.35 var(--body); }
.mn-item b { font-family: var(--display); }
.mn-item .mt { color: var(--muted); font-size: 13px; }
.mn-item.locked { opacity: .6; }
.mn-list { display: grid; gap: 8px; }
.mn-big { font: 800 22px/1.3 var(--body); margin: 0; }
.mn-funny { border-radius: 12px; padding: 12px; background: color-mix(in srgb, var(--heat) 14%, var(--panel)); }
.pill.funny { font: 700 10px/1 var(--display); letter-spacing: .06em; background: var(--heat); color: var(--ink); border-radius: 99px; padding: 3px 6px; }
.explain h5 { margin: 8px 0 0; font: 700 13px/1.3 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.exfig { margin: 6px 0; display: grid; gap: 4px; }
.exfig img { width: 100%; height: auto; display: block; background: #fff; border-radius: 10px; }
.exfig figcaption { font-size: 12px; line-height: 1.4; color: var(--muted); }
.exfig .credit { opacity: .8; }
.exmore summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
.exmore p { margin-top: 6px; }
.explain .fx { display: grid; gap: 2px; padding: 8px 10px; border-radius: 8px; background: var(--panel); }
.explain .fx code { font: 600 15px/1.4 ui-monospace, monospace; }
.explain .fx span { font-size: 13px; color: var(--muted); }
.explain .steps, .explain .refs { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.5; }
.explain .trapline { border-left: 3px solid var(--bad); padding-left: 8px; }
.btn.added { border-color: var(--good); color: var(--good); }
.note { border-left: 3px solid var(--volt); padding: 4px 0 4px 10px; color: var(--text); font-size: 14.5px; }
.dna { display: grid; gap: 8px; padding: 12px; border-radius: 12px; background: var(--ink); border: 1px dashed var(--line); }
.dna p { margin: 0; font-size: 14px; color: var(--muted); }
.dna .row .btn[aria-pressed="true"] { background: var(--volt); color: var(--volt-ink); border-color: var(--volt); }
.swipe { margin-top: auto; text-align: center; font: 600 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-top: 6px; }
.swipe svg { display: block; margin: 0 auto 6px; width: 18px; height: 18px; animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.passage { font-size: 15.5px; line-height: 1.65; display: grid; gap: 10px; }
.passage p { margin: 0; }
.pq { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }

<script>
/* ===== CONTENT: original questions written for 520 Quest. Not AAMC material. ===== */
const SECTIONS = {
  CP: { name: "Chem/Phys", long: "Chemical & Physical Foundations" },
  CARS: { name: "CARS", long: "Critical Analysis & Reasoning Skills" },
  BB: { name: "Bio/Biochem", long: "Biological & Biochemical Foundations" },
  PS: { name: "Psych/Soc", long: "Psychological, Social & Biological Foundations" }
};

/* The 31 official AAMC content categories (1A-10A), plus skill buckets. hy = our high-yield pick. */
const CATS = [
  ["1A","Structure and function of proteins and their constituent amino acids","BB",1],
  ["1B","Transmission of genetic information from the gene to the protein","BB",0],
  ["1C","Transmission of heritable information and processes that increase genetic diversity","BB",0],
  ["1D","Principles of bioenergetics and fuel molecule metabolism","BB",1],
  ["2A","Assemblies of molecules, cells, and groups of cells","BB",0],
  ["2B","Structure, growth, physiology, and genetics of prokaryotes and viruses","BB",0],
  ["2C","Processes of cell division, differentiation, and specialization","BB",0],
  ["3A","Nervous and endocrine systems and how they coordinate organ systems","BB",1],
  ["3B","Structure and integrative functions of the main organ systems","BB",1],
  ["4A","Translational motion, forces, work, energy, and equilibrium in living systems","CP",1],
  ["4B","Fluids in circulation of blood, gas movement, and gas exchange","CP",0],
  ["4C","Electrochemistry and electrical circuits and their elements","CP",0],
  ["4D","How light and sound interact with matter","CP",0],
  ["4E","Atoms, nuclear decay, electronic structure, and atomic chemical behavior","CP",0],
  ["5A","Unique nature of water and its solutions","CP",1],
  ["5B","Nature of molecules and intermolecular interactions","CP",0],
  ["5C","Separation and purification methods","CP",0],
  ["5D","Structure, function, and reactivity of biologically relevant molecules","CP",1],
  ["5E","Principles of chemical thermodynamics and kinetics","CP",1],
  ["6A","Sensing the environment","PS",0],
  ["6B","Making sense of the environment","PS",1],
  ["6C","Responding to the world","PS",0],
  ["7A","Individual influences on behavior","PS",1],
  ["7B","Social processes that influence human behavior","PS",0],
  ["7C","Attitude and behavior change","PS",1],
  ["8A","Self-identity","PS",0],
  ["8B","Social thinking","PS",1],
  ["8C","Social interactions","PS",0],
  ["9A","Understanding social structure","PS",1],
  ["9B","Demographic characteristics and processes","PS",0],
  ["10A","Social inequality","PS",0],
  ["SK","Research design and data reasoning (all science sections)","PS",1],
  ["CF","Foundations of comprehension","CARS",1],
  ["CW","Reasoning within the text","CARS",1],
  ["CB","Reasoning beyond the text","CARS",1]
];

const QUESTIONS = [];
let _qn = 0;
function Q(s, c, d, q, o, a, note) { QUESTIONS.push({ id: "q" + (++_qn), s, c, d, q, o, a, note: note || "" }); }

/* ---------- BIO / BIOCHEM ---------- */
Q("BB","1A",2,"At pH 7.4, what is the net charge of free aspartate (side-chain pKa ≈ 3.9)?",[
 ["+1","Only the α-amino group is positive; two carboxylates outweigh it."],
 ["0","Ignores the deprotonated side-chain carboxylate."],
 ["−1","α-NH₃⁺ (+1), α-COO⁻ (−1), side-chain COO⁻ (−1): net −1."],
 ["−2","The α-amino group (pKa ≈ 9.6) is still protonated at 7.4."]],2,"Compare each group's pKa to the pH: below pKa means protonated.");
Q("BB","1A",2,"A competitive inhibitor is added to an enzyme assay. What happens to the apparent Km and Vmax?",[
 ["Km increases; Vmax unchanged","Enough substrate outcompetes the inhibitor, so Vmax is still reachable, but more substrate is needed for half of it."],
 ["Km unchanged; Vmax decreases","That is pure noncompetitive inhibition."],
 ["Both Km and Vmax decrease","That is uncompetitive inhibition."],
 ["Km decreases; Vmax unchanged","Apparent affinity would rise, the opposite of what an inhibitor does."]],0);
Q("BB","1A",3,"On a Lineweaver–Burk plot, an inhibitor produces a line parallel to the uninhibited line. Which inhibition type is this?",[
 ["Competitive","Competitive lines cross on the y-axis (same 1/Vmax)."],
 ["Pure noncompetitive","Noncompetitive lines cross on the x-axis (same −1/Km)."],
 ["Uncompetitive","Km and Vmax drop by the same factor, so the slope Km/Vmax is unchanged: parallel lines."],
 ["Mixed","Mixed inhibition lines cross off both axes."]],2);
Q("BB","1A",1,"Why is proline often called an α-helix breaker?",[
 ["Its ring locks the backbone angle and its nitrogen has no H to donate for helix H-bonds","Correct: rigid ring plus no amide N–H."],
 ["It forms disulfide bonds that kink the chain","Disulfides come from cysteine."],
 ["Its side chain carries a full positive charge","Proline's side chain is nonpolar."],
 ["It can only exist in β-sheets","Proline disrupts β-sheets too; it is common in turns."]],0);
Q("BB","1A",1,"Which amino acid can form covalent cross-links that stabilize tertiary structure through oxidation?",[
 ["Methionine","Its sulfur is a thioether and cannot form disulfides."],
 ["Cysteine","Two cysteine thiols oxidize to form a disulfide bond."],
 ["Serine","Serine has an –OH, not an –SH."],
 ["Tyrosine","Tyrosine is aromatic with a phenol group; no disulfides."]],1);
Q("BB","1A",2,"Total enzyme concentration is doubled while everything else is held constant. What happens?",[
 ["Vmax doubles; Km unchanged","Vmax = kcat[E]total, while Km is a property of the enzyme–substrate pair."],
 ["Km halves","Km does not depend on how much enzyme is present."],
 ["Both Vmax and Km double","Km stays the same."],
 ["Nothing changes","More enzyme means more catalytic sites, so Vmax rises."]],0,"Trap: Km is intrinsic. It never changes with enzyme amount.");
Q("BB","1B",1,"In which direction does DNA polymerase synthesize a new strand?",[
 ["3′→5′, adding to the 5′ end","No replicative polymerase builds this way."],
 ["5′→3′, adding nucleotides to the 3′-OH","Correct. It reads the template 3′→5′."],
 ["Either direction on the leading strand","Both strands are built 5′→3′; that is why Okazaki fragments exist."],
 ["5′→3′ with no primer needed","DNA polymerase needs an RNA primer with a free 3′-OH."]],1);
Q("BB","1B",2,"Which enzyme relieves the positive supercoiling that builds ahead of a replication fork?",[
 ["Helicase","Helicase unwinds the strands and causes the supercoiling; it does not relieve it."],
 ["Topoisomerase","Correct: it cuts and rejoins DNA to release torsional strain."],
 ["DNA ligase","Ligase seals nicks between Okazaki fragments."],
 ["Primase","Primase lays down RNA primers."]],1,"Trap: helicase is the cause, topoisomerase is the fix.");
Q("BB","1B",1,"A mutation changes a codon from UAC (Tyr) to UAG. What type of mutation is this?",[
 ["Silent","A silent mutation keeps the same amino acid."],
 ["Missense","Missense swaps in a different amino acid."],
 ["Nonsense","UAG is a stop codon, so the protein is truncated."],

 { id:"p1", title:"The Restorer's Brush", text:[
  "When a museum cleans a centuries-old painting, visitors are told they are finally seeing it as the artist intended. The claim is comforting and almost always unprovable. Varnish yellows, pigments shift, and earlier restorers have already repainted what they believed was there. Every cleaning is a guess layered on guesses.",
  "This does not mean restoration should stop. A painting left under grime is no more authentic than one brightened by solvents; it is simply a record of different accidents. What restorers owe the public is candor. A label reading 'restored to its original state' should read 'restored to our best current reading of it.'",
  "Some curators object that such honesty will make visitors trust museums less. I suspect the opposite. People forgive uncertainty far more readily than they forgive being told a story that later collapses."],

  "Walk across almost any campus lawn and you will find a dirt track cutting the corner the architects left square. Planners call these desire paths. For decades the standard response was a fence or a sign. A few designers took the opposite approach: they waited a year after opening a site, watched where the grass died, and paved those lines.",

function flChart(fl = S.fl) {

  const W = 320, H = 150, pad = 30, lo = Math.min(495, ...fl.map(f => f.score)), hi = 528;
  const x = i => pad + (fl.length === 1 ? (W - pad * 2) / 2 : i * (W - pad * 2) / (fl.length - 1)), y = v => H - 20 - (v - lo) / (hi - lo) * (H - 34);
  const pts = fl.map((f, i) => `${x(i)},${y(f.score)}`).join(" ");
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W * 1.4}px" role="img" aria-label="Full-length scores">
    ${[lo, 510, 520, 528].filter((v, i, a) => a.indexOf(v) === i && v >= lo).map(v => `<line x1="${pad}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 520 ? "var(--volt)" : "var(--line)"}" ${v === 520 ? 'stroke-dasharray="5 4"' : ""}/><text x="2" y="${y(v) + 4}" font-size="10" fill="${v === 520 ? "var(--volt)" : "var(--muted)"}">${v}</text>`).join("")}
    <polyline points="${pts}" fill="none" stroke="var(--cool)" stroke-width="2.5"/>
    ${fl.map((f, i) => `<circle cx="${x(i)}" cy="${y(f.score)}" r="${i === fl.length - 1 ? 5 : 3.5}" fill="var(--cool)"/><text x="${x(i)}" y="${H - 4}" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(f.label)}</text>`).join("")}
  </svg></div>`;
}
function proPanel(title, pitch, real, teaser) {
  if (S.pro) return `<div class="panel"><h3>${title}</h3>${real}</div>`;
  return `<div class="panel"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h3>${title}</h3><span class="tag sec">Plans</span></div><p class="small">${pitch}</p>
    <div class="teaser"><div class="blurred" aria-hidden="true" inert>${teaser}</div><div class="teaser-cta"><span class="small muted">Preview with sample numbers</span><button class="btn primary small" data-pro>See plans</button></div></div></div>`;
}
const SAMPLE_FL = [{ label: "FL 1", score: 506 }, { label: "FL 2", score: 510 }, { label: "FL 3", score: 513 }, { label: "FL 4", score: 517 }, { label: "FL 5", score: 521 }];
/* ---------- analytics: performance assessment, accuracy and pace by section, trends ---------- */
function analyticsHTML() {
  if (S.total < 5) return `<div class="panel"><h3>Performance</h3><p class="small muted">Answer 5 questions and your performance report starts here: accuracy and pace by section, your weakest areas, and 14-day trends.</p></div>`;
  const secs = ["CP", "CARS", "BB", "PS"].map(sec => {
    const cs = CATS.filter(c => c[2] === sec).map(c => S.cat[c[0]] || {}), a = cs.reduce((x, c) => x + (c.a || 0), 0), cc = cs.reduce((x, c) => x + (c.c || 0), 0), t = cs.reduce((x, c) => x + (c.t || 0), 0);
    return { sec, a, acc: a ? Math.round(cc / a * 100) : null, avg: a && t ? Math.round(t / a) : null };
  });
  const tried = CATS.filter(c => (S.cat[c[0]] || {}).a >= 4).map(c => [c, S.cat[c[0]].c / S.cat[c[0]].a]);
  const best = tried.slice().sort((a, b) => b[1] - a[1])[0], weak = weakAreas();
  const keys = Object.keys(S.tlog).sort(), last7 = keys.slice(-7).map(k => S.tlog[k]), n7 = last7.reduce((a, b) => a + b.n, 0);
  const pace7 = n7 ? Math.round(last7.reduce((a, b) => a + b.s, 0) / n7) : null, acc7 = n7 ? Math.round(last7.reduce((a, b) => a + b.c, 0) / n7 * 100) : null;
  const evals = S.lv.evals.slice(-1)[0];
  const lines = [];
  if (acc7 !== null) lines.push(`Last 7 study days: <b>${acc7}%</b> accuracy over ${n7} questions at <b>${pace7} s</b> a question${pace7 > 95 ? ", slower than the 95 s exam pace. Boss battles train speed." : ", inside exam pace."}`);
  if (best) lines.push(`Strongest area: <b>${best[0][0]}</b> ${esc(best[0][1])} at ${Math.round(best[1] * 100)}%.`);
  lines.push(weak.length ? `Weakest areas: ${weak.map(c => `<b>${c}</b> (${Math.round(S.cat[c].c / S.cat[c].a * 100)}%)`).join(", ")}. The adaptive engine is serving about half your new questions from these until they climb past 75%.`
    : "No weak areas flagged yet. Areas need at least 4 answers before the adaptive engine judges them.");
  if (evals) lines.push(`Last level evaluation: <b>${evals.pct}%</b> weighted accuracy on ${evals.date}.`);
  const days = 14, ks = Array.from({ length: days }, (_, i) => todayKey(Date.now() - (days - 1 - i) * DAY));
  const W = 320, H = 90, bw = (W - 20) / days;
  const accBars = ks.map((k, i) => { const t = S.tlog[k]; if (!t || !t.n) return ""; const v = t.c / t.n, h = Math.max(3, v * (H - 24)); return `<rect x="${10 + i * bw + 2}" y="${H - 16 - h}" width="${bw - 4}" height="${h}" rx="3" fill="${v >= .76 ? "var(--good)" : v >= .61 ? "var(--volt)" : "var(--bad)"}"><title>${k}: ${Math.round(v * 100)}% of ${t.n}</title></rect>`; }).join("");
  return `<div class="panel"><h3>Performance</h3><div class="assess">${lines.map(l => `<p>${l}</p>`).join("")}</div>
    <div class="stack" style="gap:6px">${secs.map(r => `<div class="secrow"><span>${SECTIONS[r.sec].name}</span><span class="meter"><i style="width:${r.acc || 0}%;background:${r.acc === null ? "var(--line)" : r.acc >= 76 ? "var(--good)" : r.acc >= 61 ? "var(--volt)" : "var(--bad)"}"></i></span><b>${r.acc === null ? "–" : r.acc + "%"}</b><span class="muted">${r.avg ? r.avg + " s" : ""}</span></div>`).join("")}</div>
    <p class="small muted" style="margin-top:4px">Accuracy by day, last 14 days</p>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily accuracy, last 14 days">${accBars}<line x1="10" x2="${W - 10}" y1="${H - 16}" y2="${H - 16}" stroke="var(--line)"/><text x="10" y="${H - 3}" font-size="10" fill="var(--muted)">${new Date(ks[0] + "T12:00").toLocaleDateString(undefined, { month: "short", day: "numeric" })}</text><text x="${W - 10}" y="${H - 3}" font-size="10" text-anchor="end" fill="var(--muted)">Today</text></svg>
    <p class="small muted" style="margin-top:4px">Seconds per question, last 14 days</p>${timeTrendSVG()}</div>`;
}

  const tot = ests.every(e => e[1]) ? ests.reduce((a, e) => a + e[1], 0) : null;
  const dnaCounts = ["Content", "Trap", "Time"].map((t, i) => [t, S.errors.filter(e => e.type === t).length, ["var(--cool)", "var(--bad)", "var(--heat)"][i]]);
  const revN = Object.keys(S.revenge).length, dueN = Object.values(S.revenge).filter(r => r.due <= Date.now()).length;

  $("#view-me").innerHTML = `${todaySummaryHTML()}<h2 class="title">Level ${S.lv.level}: ${esc(tierName(S.lv.level))}</h2><p class="sub">${S.xp.toLocaleString()} XP (${esc(rankOf(L))}) · ${S.total} answered at ${acc}%${S.pro ? " · Subscriber" : ""}</p>
  <div class="stack">
    <div class="panel">${levelBarHTML()}<div class="row" style="margin-top:10px"><button class="btn pinkback" data-meqbank>← Back to Qbank</button></div></div>
    <div class="panel" id="goalPanel"><h3>Adjust goals for the day</h3><p class="small muted" style="margin:0 0 8px">How many questions do you want to do each day?</p><div class="row">${[15, 25, 40, 60].map(n => `<button class="btn small ${S.goal === n ? "primary" : ""}" data-setgoal="${n}">${n} questions</button>`).join("")}</div></div>
    ${analyticsHTML()}
    <div class="panel"><div class="row" style="gap:14px;flex-wrap:nowrap"><div class="ring"><svg viewBox="0 0 74 74" width="74" height="74"><circle cx="37" cy="37" r="31" fill="none" stroke="var(--panel-2)" stroke-width="8"/><circle cx="37" cy="37" r="31" fill="none" stroke="var(--good)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C * pct} ${C}"/></svg><b>${Math.round(pct * 100)}%</b></div>
      <div style="min-width:0"><h3>Today</h3><p class="small muted">${S.today.answered} of ${S.goal} questions. ${streakAlive()}-day streak, ${S.freezes} freeze${S.freezes === 1 ? "" : "s"}, ${S.hints} hint${S.hints === 1 ? "" : "s"}.</p><p class="small">Revenge queue: <b>${revN}</b> waiting, <b>${dueN}</b> due now.</p></div></div></div>
    <div class="panel"><h3>Error DNA</h3>${donut(dnaCounts)}</div>
    ${proPanel("Score estimate", "See your estimated score for each section, based on your recent answers.",
      `<p class="small muted">A rough practice estimate from your last 60 answers per section. It is not an AAMC prediction; your full-lengths are the real test.</p>
      <div class="grid2">${ests.map(([s, v]) => `<div class="stat"><b>${v || "–"}</b><span>${SECTIONS[s].name}${v ? "" : ": answer " + (15 - S.recent[s].length) + " more"}</span></div>`).join("")}</div>
      <p><b style="font:700 22px var(--display);color:var(--volt)">${tot || "–"}</b> <span class="muted small">${tot ? "estimated total (472–528)" : "total appears once every section has 15 answers"}</span></p>`,
      `<div class="grid2">${[["CP", 129], ["CARS", 128], ["BB", 131], ["PS", 130]].map(([s, v]) => `<div class="stat"><b>${v}</b><span>${SECTIONS[s].name}</span></div>`).join("")}</div><p><b style="font:700 22px var(--display);color:var(--volt)">518</b> <span class="muted small">estimated total</span></p>`)}
    ${proPanel("Full-length tracker", "Log every practice exam and watch your line climb toward the 520 mark.",
      `${flChart()}<div class="row"><input type="text" id="flLabel" placeholder="FL ${S.fl.length + 1}" style="width:90px"><input type="number" id="flScore" min="472" max="528" placeholder="Score" style="width:100px"><button class="btn" data-addfl>Add</button>${S.fl.length ? '<button class="btn ghost small" data-popfl>Remove last</button>' : ""}</div>`,
      flChart(SAMPLE_FL))}
    <div class="panel"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h3>Anki queue</h3>${S.pro ? "" : '<span class="tag sec">Plans</span>'}</div>
      <p class="small">Tap <b>+ Add to Anki</b> after any miss to save it here, then export the batch as a deck after your session. Each card has the question, the answer and the full explanation.</p>
      <p><b style="font:700 22px var(--display);color:var(--volt)">${S.anki.length}</b> <span class="muted small">card${S.anki.length === 1 ? "" : "s"} waiting</span></p>
      <div class="row"><button class="btn primary" data-exportanki ${S.anki.length ? "" : "disabled"}>Export to Anki</button><button class="btn small" data-ankiall>Add all my misses</button>${S.anki.length ? '<button class="btn small ghost" data-ankiclear>Clear queue</button>' : ""}</div></div>
    <div class="panel"><h3>Badges</h3><div class="badges">${BADGES.map(([id, ic, name]) => `<div class="badge ${S.badges[id] ? "got" : ""}"><i>${ic}</i>${esc(name)}</div>`).join("")}</div></div>
    <div class="panel"><h3>Settings</h3>
      <label class="row small" for="soundChk"><input type="checkbox" id="soundChk" ${S.sound ? "checked" : ""}> Sound and vibration</label>
      <label class="row small" for="fanChk"><input type="checkbox" id="fanChk" ${S.fanfare ? "checked" : ""}> Level-up fanfare</label>
      <label class="row small musicrow" for="musicSel">🎵 Music <select id="musicSel">${[["boss", "Boss battles only"], ["on", "Always on"], ["off", "Off"]].map(([v, n]) => `<option value="${v}" ${S.music === v ? "selected" : ""}>${n}</option>`).join("")}</select></label>
      <div class="row"><button class="btn small" data-share>Share my streak</button><button class="btn small" data-backup>Backup or move device</button><a class="btn small" href="../guide/" target="_blank" rel="noopener">How to use</a>${installed() ? "" : '<button class="btn small" data-install>Install app</button>'}${S.pro ? "" : '<button class="btn small pro" data-pro>See plans</button>'}</div><div id="backupOut"></div></div>
    ${window.acctPanelHTML ? acctPanelHTML() : ""}
    ${CONFIG.resources.length ? `<div class="panel links"><h3>Resources</h3>${CONFIG.resources.map(r => `<p class="small"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a><br><span class="muted">${esc(r.note || "")}</span></p>`).join("")}</div>` : ""}
    <div class="panel"><h3>Help</h3>
      <p class="small">Questions about 520 Quest or your purchase? We reply within 24 to 48 hours.</p>
      <div class="row"><a class="btn small primary" href="mailto:${esc(CONFIG.supportEmail)}?subject=520%20Quest%20support">Contact Support</a><a class="btn small" href="${esc(CONFIG.supportUrl)}" target="_blank" rel="noopener">FAQ</a><a class="btn small" href="mailto:${esc(CONFIG.supportEmail)}?subject=520%20Quest%20feedback">Send feedback</a></div>
      <p class="text-sm" style="font-size:13px;color:#6b7280;margin:8px 0 0">Contact support: ${esc(CONFIG.supportEmail)}</p>
      <p style="font-size:12px;color:#6b7280;margin:4px 0 0"><button class="linkbtn" data-cancelsub style="font-size:12px;color:#6b7280">Cancel subscription</button></p></div>
    <div class="panel"><h3>Privacy</h3><p class="small"><b>We help you get into medical school without selling your data.</b> Your progress stays on this device unless you sign in; then it's saved to your 520 Quest account so it follows you to your other devices. No ads, no trackers.</p></div>
    <p class="small muted">520 Quest questions are original practice items, not official AAMC content. MCAT is a registered trademark of the AAMC, which does not endorse this app.</p>
  </div>`;
}
$("#view-me").addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-cancelsub]")) { location.href = "mailto:" + CONFIG.supportEmail + "?subject=" + encodeURIComponent("Cancel my 520 Quest subscription"); return; }
  if (t.closest("[data-meqbank]")) { go("scroll"); return; }
  const sg = t.closest("[data-setgoal]"); if (sg) { setGoal(+sg.dataset.setgoal); const y = $("#view-me").scrollTop; renderMe(); $("#view-me").scrollTop = y; return toast(`Daily goal: <b>${S.goal} questions</b>.`); }
  if (t.closest("[data-pro]")) return showPro();
  if (t.closest("[data-share]")) return share();
  if (t.closest("[data-addfl]")) {
    const sc = +$("#flScore").value; if (!(sc >= 472 && sc <= 528)) return toast("Enter a total score from 472 to 528.");
    S.fl.push({ label: ($("#flLabel").value.trim() || "FL " + (S.fl.length + 1)).slice(0, 8), score: sc }); save(); return renderMe();
  }
  if (t.closest("[data-popfl]")) { S.fl.pop(); save(); return renderMe(); }
  if (t.closest("[data-ankiall]")) {
    const before = S.anki.length;
    [...new Set(S.errors.map(e => e.id))].forEach(id => { if (!inAnki(id) && anyQ(id)) S.anki.push(id); });
    save(); renderMe(); return toast(S.anki.length > before ? `Added <b>${S.anki.length - before}</b> missed question${S.anki.length - before === 1 ? "" : "s"}.` : "Every logged miss is already in your queue.");
  }
  if (t.closest("[data-ankiclear]")) { S.anki = []; save(); renderMe(); return toast("Anki queue cleared."); }
  if (t.closest("[data-backup]")) {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    $("#backupOut").innerHTML = `<p class="small muted">Copy this code to keep a backup. On a new device, paste a code here and press Restore.</p><textarea id="bk" aria-label="Backup code"></textarea><div class="row"><button class="btn small" data-copybk>Copy code</button><button class="btn small" data-restore>Restore from pasted code</button></div>`;
    $("#bk").value = code; return;
  }
  if (t.closest("[data-copybk]")) return copy($("#bk").value, () => toast("Backup code copied."), $("#bk"));
  if (t.closest("[data-restore]")) {
    try { const o = JSON.parse(decodeURIComponent(escape(atob($("#bk").value.trim())))); if (o.v !== 1) throw 0; S = Object.assign(fresh(), o); save(); renderAll(); toast("Progress restored."); }
    catch (err) { toast("That code isn't a valid 520 Quest backup. Paste the whole code and try again."); }
  }
});
$("#view-me").addEventListener("change", e => {
  if (e.target.id === "soundChk") { S.sound = e.target.checked; save(); syncMusic(); }
  if (e.target.id === "fanChk") { S.fanfare = e.target.checked; save(); if (S.fanfare && S.sound && window.MUSIC) MUSIC.fanfare(); }
  if (e.target.id === "musicSel") { S.music = e.target.value; save(); syncMusic(true); }
});

/* ---------- tabs ---------- */
function go(tab) {
  if (tab !== "scroll") { sheetReturn = null; dropBackPill(); }
  $$(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === tab));
  ["scroll", "boss", "course", "map", "exam", "me", "results"].forEach(v => $("#view-" + v).hidden = v !== tab);
  if (tab !== "results") { S.lastTab = tab; save(); }
  if (tab === "boss" && !B) renderBossLobby();
  if (tab === "map") renderMap();
  if (tab === "course") renderCourse();
  if (tab === "me") renderMe();
  if (tab === "exam" && window.renderExam) renderExam();
  document.body.classList.remove("examing");
  if (tab !== "boss" && B) { clearInterval(B.tick); B = null; syncMusic(); }
  const h = { scroll: "", boss: "boss", course: "course", map: "map", exam: "exam", me: "me", results: "" }[tab]; try { history.replaceState(null, "", h ? "#" + h : location.pathname); } catch (e) {}
}
$(".tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  // Opening Scroll after the day's goal asks first; every other tab opens directly.
  const goalDone = S.today.doneDay || S.today.answered >= S.goal;
  if (t.dataset.tab === "scroll" && goalDone && !extraRound && !S.review && $("#view-scroll").hidden) return morePrompt(!$("#view-me").hidden);
  go(t.dataset.tab);
});
document.addEventListener("keydown", e => {
  if ($("#view-scroll").hidden || /input|textarea|select/i.test(e.target.tagName)) return;
  if (["1", "2", "3", "4"].includes(e.key)) {
    const card = [...feed.children].find(c => { const r = c.getBoundingClientRect(); return r.top >= -40 && r.top < innerHeight / 2; });
    const box = card && [...card.querySelectorAll(".opts")].find(b => !b.dataset.done);
    if (box) box.querySelectorAll(".opt")[+e.key - 1].click();
  }
  if (e.key === "j" || e.key === "ArrowDown") { feed.scrollBy({ top: feed.clientHeight * .9, behavior: reduce ? "auto" : "smooth" }); e.preventDefault(); }
  if (e.key === "k" || e.key === "ArrowUp") { feed.scrollBy({ top: -feed.clientHeight * .9, behavior: reduce ? "auto" : "smooth" }); e.preventDefault(); }
});

document.addEventListener("pointerdown", () => syncMusic(), { once: true });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-musictoggle]"); if (!b) return;
  S.music = S.sound && S.music !== "off" ? "off" : "boss"; if (S.music !== "off") S.sound = true; save(); syncMusic(true);
  b.textContent = S.music !== "off" ? "♪ Music on" : "♪ Music off";
  if (S.music !== "off" && window.MUSIC) { MUSIC.play("battle"); setTimeout(() => { if (!B) syncMusic(); }, 4000); } // short preview from the lobby
});
function renderAll() { renderHUD(); resetFeed(); if (!$("#view-me").hidden) renderMe(); if (!$("#view-map").hidden) renderMap(); }
renderAll();
// Reopening: Course or Map reopen where you were; otherwise Me after Done for the Day, else Scroll at your last question.
const startTab = ["course", "map"].includes(S.lastTab) ? S.lastTab : S.today.doneDay ? "me" : "scroll"; if (startTab !== "scroll") go(startTab);
bankReady.finally(() => welcomeBack());
/* Owner-only unlock: ?admin=<pass> is checked (as a SHA-256) against play/admin-private.json, which is git-ignored and never deployed. Without that file this does nothing. ?admin=off turns it off.
   Sealed sheets and mnemonics are AES-encrypted; a paid account fetches the key from the server. For the owner the same base64 key can go in admin-private.json as "content_key". */
(async () => {
  const q = new URLSearchParams(location.search).get("admin");
  if (q === null && !S.admin) return;
  if (q !== null) { try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {} }
  const sha = async t => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2, "0")).join("");
  try {
    if (q === "off") { S.admin = false; if (S.proBy === "admin") { S.pro = false; delete S.proBy; } CONFIG.freeQuestions = 100; try { localStorage.removeItem("quest520.ck"); } catch (e) {} save(); return renderAll(); }
    const r = await fetch("admin-private.json", { cache: "no-store" }); if (!r.ok) return;
    const j = await r.json();
    if (q !== null) {
      const want = j.sha256 || (j.admin_code ? await sha(String(j.admin_code)) : "");
      if (!want || await sha(q) !== want) return;
      S.admin = true; S.pro = true; S.proBy = "admin"; CONFIG.freeQuestions = 99999; save(); renderAll(); toast("Admin unlocked.");
    }
    if (S.admin && j.content_key && typeof useKey === "function") { try { localStorage.setItem("quest520.ck", String(j.content_key)); } catch (e) {} await useKey(String(j.content_key)); }
    if (S.admin && !$("#view-course").hidden) renderCourse();
  } catch (e) {}
})();

if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude\.ai|claudeusercontent/.test(location.hostname)) { 
  navigator.serviceWorker.register("sw.js").then(reg => document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); })).catch(() => {});
  // A new release took over while this page was open: reload into it now if just opened, else the next time the app comes back to the front.
  let swReload = false; const hadSW = !!navigator.serviceWorker.controller, t0 = Date.now();
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadSW || swReload) return; swReload = true; if (Date.now() - t0 < 8000) location.reload(); });
  document.addEventListener("visibilitychange", () => { if (swReload && !document.hidden && !B) location.reload(); });
}
