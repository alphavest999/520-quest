<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>520 Quest · Memorization Checklist</title>
<script>
// Terms of Use must be accepted before any use. Not accepted yet: go to the app's accept card, which sends you back here.
// Keep this version in step with TERMS_V in index.html.
(function () { var v = null; try { v = (JSON.parse(localStorage.getItem("quest520.v1")) || {}).terms; } catch (e) {}
  if (!v || v.v !== "2026-11-08") location.replace("./?then=checklist"); })();
</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;800&display=swap">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script src="checklist-data.js"></script>
<style>
:root {
  --navy:#1e3a8a; --pink:#f472b6; --pink-soft:#fdf2f8; --line:#e2e8f0; --text:#0f172a; --muted:#475569; --soft:#f8fafc;
  --good:#16a34a; --bad:#e11d48; --amber:#b45309;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif; --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: var(--text); font: 16px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
.wrap { max-width: 860px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top,0px)) 14px calc(30px + env(safe-area-inset-bottom,0px)); }
.back { display: inline-block; margin-top: 18px; background: var(--pink); color: #fff; border: 0; padding: 10px 16px; border-radius: 99px; font: 800 14px/1.2 var(--body); text-decoration: none; box-shadow: 0 4px 14px rgba(244,114,182,.45); }
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.top a.backtop { background: var(--pink); color: #fff; text-decoration: none; padding: 7px 13px; border-radius: 99px; font: 800 13px/1.2 var(--body); }
h1 { font: 700 clamp(22px,5.5vw,30px)/1.15 var(--display); letter-spacing: .02em; color: var(--navy); margin: 10px 0 2px; }
.sub { color: var(--muted); margin: 0 0 12px; font-size: 15px; }
.prog { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--soft); }
.prog .bar { flex: 1; height: 10px; border-radius: 99px; background: #e2e8f0; overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--navy)); border-radius: 99px; transition: width .3s; }
.prog b { font: 700 16px/1 var(--display); color: var(--navy); white-space: nowrap; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.tools input { flex: 1 1 220px; min-width: 0; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; font: 500 15px var(--body); }
.tools input:focus { outline: none; border-color: var(--navy); }
.btn { border: 1px solid var(--navy); background: #fff; color: var(--navy); border-radius: 12px; padding: 9px 12px; font: 700 13px/1.2 var(--body); cursor: pointer; }
.btn.solid { background: var(--navy); color: #fff; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 6px; scrollbar-width: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: #fff; color: var(--muted); border-radius: 99px; padding: 7px 12px; font: 700 13px/1 var(--body); cursor: pointer; }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.sec { font: 700 14px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--pink); margin: 22px 2px 8px; }
.card { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.05); overflow: hidden; }
.card.done { border-color: #86efac; }
.head { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; cursor: pointer; }
.head input { width: 22px; height: 22px; accent-color: var(--good); margin: 0; cursor: pointer; }
.head .code { display: block; font: 600 11px/1.2 var(--display); letter-spacing: .08em; color: var(--muted); }
.head .ttl { display: block; font: 700 16.5px/1.3 var(--body); color: var(--text); }
.card.done .ttl { color: #166534; }
.head .chev { font-size: 18px; color: var(--muted); transition: transform .2s; }
.card.open .chev { transform: rotate(90deg); }
.body { display: none; padding: 2px 16px 16px; border-top: 1px solid var(--line); }
.card.open .body { display: block; }
.hook { font-style: italic; color: var(--navy); margin: 12px 0 4px; font-weight: 600; }
.body h4 { margin: 16px 0 6px; font: 700 14px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--navy); }
/* Arrow bullets instead of dashes, so a bullet is never mistaken for a minus sign. Sub-bullets get a double arrow. */
ul.ar { list-style: none; margin: 0; padding: 0; }
ul.ar > li { position: relative; padding-left: 26px; margin: 6px 0; }
ul.ar > li::before { content: "→"; position: absolute; left: 2px; top: 0; color: var(--pink); font-weight: 800; }
ul.ar ul.ar > li { padding-left: 34px; margin: 4px 0; }
ul.ar ul.ar > li::before { content: "→→"; color: var(--navy); font-weight: 700; letter-spacing: -2px; }
.fm li { display: grid; gap: 2px; }
.fm .kx { display: block; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; overflow-x: auto; font-size: 1.08em; }
.fm .kx .katex-display { margin: 0; text-align: left; }
.fm .kx .katex-display > .katex { text-align: left; }
.fm .say { color: var(--muted); font-size: 14px; }
.vars { display: grid; gap: 6px; }
.var { display: grid; grid-template-columns: minmax(64px, auto) 1fr; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 10px; background: var(--soft); }
.var .s { font-size: 1.05em; }
.var .n b { color: var(--text); } .var .n { font-size: 14.5px; color: var(--muted); }
.var .u { font: 600 12px var(--body); color: var(--navy); background: #dbeafe; border-radius: 6px; padding: 1px 6px; margin-left: 4px; white-space: nowrap; }
.eli5 { background: var(--pink-soft); border-radius: 12px; padding: 10px 14px; margin-top: 14px; }
.eli5 h4 { margin-top: 2px; color: #be185d; }
.eli5 p { margin: 0; }
figure { margin: 14px 0 0; }
figure img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
figcaption { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
.trap { background: #fff1f2; border-left: 4px solid var(--bad); border-radius: 10px; padding: 8px 12px; margin-top: 14px; }
.trap h4 { color: var(--bad); margin-top: 4px; }
.mem { background: #f0fdf4; border-left: 4px solid var(--good); border-radius: 10px; padding: 8px 12px; margin-top: 12px; }
.mem h4 { color: var(--good); margin-top: 4px; }
.markrow { display: flex; justify-content: flex-end; margin-top: 14px; }
.empty { text-align: center; color: var(--muted); padding: 30px 0; }
.toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 700; display: none; z-index: 70; }
.katex { font-size: 1.05em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="backtop" href="index.html#course">← Back</a></div>
  <h1>Memorization Checklist</h1>
  <p class="sub">Only the high-yield must-knows. Open a card, learn it the simple way, then tick it off.</p>
  <div class="prog"><div class="bar"><i id="pbar" style="width:0"></i></div><b id="ptxt">0 / 0</b></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search: Km, Ohm, SN2, PCR…" aria-label="Search the checklist">
    <button class="btn" id="expand">Open all</button>
    <button class="btn" id="anki">Export to Anki</button>
    <button class="btn" id="reset">Reset</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <a class="back" href="index.html#course">← BACK</a>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
  const D = window.CHECKLIST, KEY = "520quest.checklist.v6", OLD = "520quest.mastered.checklist.v5";
  // Old checklist (v5) stored an array of numeric card ids in a key the Mastery Sheets also use (as an object).
  // Carry those ticks over by code, then give the key back to the sheets.
  const OLD_IDS = { 1:"CPAS-01",2:"CPAS-02",3:"CPAS-03",4:"CPAS-04",5:"CPAS-05",6:"CPAS-06",7:"CPAS-07",8:"CPAS-08",9:"BBFL-01",10:"BBFL-02",11:"BBFL-03",12:"BBFL-04",13:"BBFL-05",14:"BBFL-06",15:"BBFL-07",16:"OChem-01",17:"OChem-02",18:"OChem-03",19:"OChem-04",20:"OChem-05",21:"Lab-01",22:"Lab-02",23:"Lab-03",24:"Lab-04",25:"CPAS-09",26:"CPAS-10",27:"CPAS-11",28:"BBFL-08",29:"BBFL-09",30:"BBFL-10",31:"OChem-06",32:"Lab-05" };
  function load() {
    try { const v = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(v)) return new Set(v); } catch (e) {}
    const s = new Set();
    try { const o = JSON.parse(localStorage.getItem(OLD)); if (Array.isArray(o)) { o.forEach(id => OLD_IDS[id] && s.add(OLD_IDS[id])); localStorage.removeItem(OLD); } } catch (e) {}
    localStorage.setItem(KEY, JSON.stringify([...s])); return s;
  }
  let done = load(), sec = "ALL", query = "", allOpen = false;
  const open = new Set();
  const save = () => localStorage.setItem(KEY, JSON.stringify([...done]));
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // Inline markup: $tex$ → KaTeX, **bold** → <b>.
  function md(s) {
    const math = [];
    const t = esc(String(s).replace(/\$([^$]+)\$/g, (_, m) => "\u0000" + (math.push(m) - 1) + "\u0000"));
    return t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/\u0000(\d+)\u0000/g, (_, i) => `<span class="m" data-tex="${esc(math[i])}">${esc(math[i])}</span>`);
  }
  const tex = (t, display) => `<span class="${display ? "kx" : "m"}" data-tex="${esc(t)}"${display ? ' data-d="1"' : ""}>${esc(t)}</span>`;
  function typeset(root) {
    if (!window.katex) return;
    root.querySelectorAll("[data-tex]:not(.done)").forEach(n => {
      try { n.innerHTML = katex.renderToString(n.dataset.tex, { throwOnError: false, strict: "ignore", displayMode: !!n.dataset.d }); n.classList.add("done"); } catch (e) {}
    });
  }
  const li = p => typeof p === "string" ? `<li>${md(p)}</li>` : `<li>${md(p.t)}<ul class="ar">${p.sub.map(x => `<li>${md(x)}</li>`).join("")}</ul></li>`;
  // Locked cards (paid plans) are stubs until the content key on this device unseals checklist.enc.json.
  const LOCKED = () => D.cards.filter(c => c.locked).length;
  function lockedBody(c) {
    return `<div class="eli5"><h4>🔒 Included with every plan</h4><p>Free players get the ${D.cards.length - LOCKED()} cards that match the free Mastery Sheets. Any plan unlocks all ${D.cards.length} cards, every Mastery Sheet and all 5,904 questions.</p><p><a class="btn solid" href="../pro/">See plans</a></p></div>`;
  }
  function body(c) {
    if (c.locked) return lockedBody(c);
    let h = `<p class="hook">${md(c.hook)}</p>`;
    if (c.formulas.length) h += `<h4>Formulas to memorize</h4><ul class="ar fm">${c.formulas.map(f => `<li>${tex(f.tex, true)}${f.say ? `<span class="say">${md(f.say)}</span>` : ""}</li>`).join("")}</ul>`;
    if (c.vars.length) h += `<h4>What each symbol means</h4><div class="vars">${c.vars.map(v => `<div class="var"><span class="s">${tex(v.tex)}</span><span class="n"><b>${md(v.name)}</b>${v.unit ? `<span class="u">${esc(v.unit)}</span>` : ""}${v.eli5 ? ` · ${md(v.eli5)}` : ""}</span></div>`).join("")}</div>`;
    h += `<div class="eli5"><h4>Simple Breakdown</h4><p>${md(c.eli5)}</p></div>`;
    if (c.fig) h += `<figure><img loading="lazy" src="fig/chk/${esc(c.fig)}" alt="${esc(c.figcap.replace(/\$/g, ""))}"><figcaption>${md(c.figcap)}</figcaption></figure>`;
    h += `<h4>Must know</h4><ul class="ar">${c.points.map(li).join("")}</ul>`;
    if (c.traps.length) h += `<div class="trap"><h4>AAMC traps</h4><ul class="ar">${c.traps.map(li).join("")}</ul></div>`;
    if (c.mnemonics.length) h += `<div class="mem"><h4>Memory tricks</h4><ul class="ar">${c.mnemonics.map(li).join("")}</ul></div>`;
    h += `<div class="markrow"><button class="btn ${done.has(c.code) ? "" : "solid"}" data-mark="${esc(c.code)}">${done.has(c.code) ? "✓ Mastered (undo)" : "Mark as mastered"}</button></div>`;
    return h;
  }
  const plain = c => c.locked ? (c.code + " " + c.title).toLowerCase() : [c.code, c.title, c.hook, c.eli5, ...c.formulas.map(f => f.tex + " " + f.say), ...c.vars.map(v => v.tex + " " + v.name), ...c.points.map(p => typeof p === "string" ? p : p.t + " " + p.sub.join(" ")), ...c.traps, ...c.mnemonics].join(" ").toLowerCase();
  let IDX = D.cards.map(plain);
  function render() {
    const n = D.cards.length, k = D.cards.filter(c => done.has(c.code)).length;
    $("#pbar").style.width = (100 * k / n) + "%"; $("#ptxt").textContent = `${k} / ${n} mastered`;
    $("#chips").innerHTML = [{ key: "ALL", label: "All" }, ...D.sections].map(s => `<button class="chip ${sec === s.key ? "on" : ""}" data-sec="${s.key}">${esc(s.label)} <small>${s.key === "ALL" ? n : D.cards.filter(c => c.cat === s.key).length}</small></button>`).join("");
    const q = query.trim().toLowerCase();
    let html = "";
    for (const s of D.sections) {
      if (sec !== "ALL" && sec !== s.key) continue;
      const cs = D.cards.filter((c, i) => c.cat === s.key && (!q || IDX[i].includes(q)));
      if (!cs.length) continue;
      html += `<div class="sec">${esc(s.label)}</div>` + cs.map(c => {
        const isOpen = open.has(c.code) || (q && cs.length <= 3);
        return `<div class="card ${done.has(c.code) ? "done" : ""} ${isOpen ? "open" : ""}" data-code="${esc(c.code)}">
          <div class="head" data-toggle="${esc(c.code)}"><input type="checkbox" data-chk="${esc(c.code)}" ${done.has(c.code) ? "checked" : ""}${c.locked ? " disabled" : ""} aria-label="Mastered"><span><span class="code">${esc(c.code)}</span><span class="ttl">${md(c.title)}${c.locked ? " 🔒" : ""}</span></span><span class="chev">›</span></div>
          <div class="body">${isOpen ? body(c) : ""}</div></div>`;
      }).join("");
    }
    $("#list").innerHTML = html || `<p class="empty">Nothing matches "${esc(query)}".</p>`;
    typeset($("#list"));
  }
  function toast(t) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 1800); }
  function setDone(code, on) { on ? done.add(code) : done.delete(code); save(); render(); }
  document.addEventListener("click", e => {
    const t = e.target;
    const chk = t.closest("[data-chk]"); if (chk) { e.stopPropagation(); return setDone(chk.dataset.chk, chk.checked); }
    const mk = t.closest("[data-mark]"); if (mk) { const c = mk.dataset.mark; setDone(c, !done.has(c)); if (done.has(c)) toast("Nice! Marked as mastered"); return; }
    const sc = t.closest("[data-sec]"); if (sc) { sec = sc.dataset.sec; return render(); }
    const tg = t.closest("[data-toggle]"); if (tg) { const c = tg.dataset.toggle; open.has(c) ? open.delete(c) : open.add(c); return render(); }
  });
  $("#q").addEventListener("input", e => { query = e.target.value; render(); });
  $("#expand").addEventListener("click", () => { allOpen = !allOpen; open.clear(); if (allOpen) D.cards.forEach(c => open.add(c.code)); $("#expand").textContent = allOpen ? "Close all" : "Open all"; render(); });
  $("#reset").addEventListener("click", () => { if (!done.size) return toast("Nothing to reset yet"); if (confirm("Clear all your checkmarks?")) { done.clear(); save(); render(); toast("Fresh start"); } });
  $("#anki").addEventListener("click", () => {
    const strip = s => String(s).replace(/\*\*/g, "").replace(/\$/g, "");
    const q = s => '"' + String(s).replace(/"/g, '""') + '"';
    const rows = D.cards.filter(c => !c.locked).map(c => [c.code + ": " + c.title,
      [...c.formulas.map(f => f.tex + (f.say ? " (" + strip(f.say) + ")" : "")), "", strip(c.eli5), "", ...c.points.map(p => "→ " + strip(typeof p === "string" ? p : p.t + " " + p.sub.join(" "))),
       ...c.traps.map(t => "TRAP: " + strip(t)), ...c.mnemonics.map(m => "TRICK: " + strip(m))].join("<br>")].map(q).join(","));
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rows.join("\n")], { type: "text/csv" })); a.download = "520_quest_checklist_anki.csv"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  // Your plan on the Me page links straight to cards: checklist.html#BBFL-05,BBFL-09 opens those cards and scrolls to the first.
  const want = decodeURIComponent(location.hash.slice(1)).split(",").filter(c => D.cards.some(x => x.code === c));
  want.forEach(c => open.add(c));
  render();
  // A plan's content key (saved by the app on this device after sign-in) unlocks the sealed cards.
  (async () => {
    let k = null; try { k = localStorage.getItem("quest520.ck"); } catch (e) {}
    if (!k || !LOCKED() || !window.crypto || !crypto.subtle) return;
    try {
      const b = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
      const key = await crypto.subtle.importKey("raw", b(String(k)), "AES-GCM", false, ["decrypt"]);
      const box = await (await fetch("checklist.enc.json")).json();
      const full = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(box.iv) }, key, b(box.ct))));
      const by = Object.fromEntries(full.map(c => [c.code, c]));
      D.cards = D.cards.map(c => by[c.code] || c); IDX = D.cards.map(plain); render();
    } catch (e) {}
  })();
  if (want.length) { const el = document.querySelector(`.card[data-code="${CSS.escape(want[0])}"]`); if (el) setTimeout(() => el.scrollIntoView({ block: "start" }), 50); }
  window.addEventListener("load", () => typeset(document));
})();
</script>
</body>
</html>
