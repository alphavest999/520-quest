,plain:"Throw a ball up. You start fast (v₀), gravity slows you 10 m/s each second (a = -10). At the top you stop for an instant (v=0) but gravity is STILL pulling. Drop from rest? v₀=0, so Δx = ½ a t². Simple.",trap:"If up is positive, gravity is -10, not +10. At the peak v=0 but a is still -10, never 0. MCAT says “round g=10” unless answers are within 0.1 — then use 9.8. Textbook says kinematic equations only for constant a — MCAT always constant unless it explicitly says otherwise.",mnemonic:"Trig sin30=cos60=0.5, sin45≈0.7, sin60≈0.85. Clock trick: 30 min = half (0.5), 45 min = almost 3/4 (0.7), 60 min = almost full (0.85). Use S: 30→0.5, 45→0.7, 60→0.85."},{id:"2",code:"CPAS-02",cat:"CPAS",catLabel:"CPAS (Physics/Chem)",title:"Torque, Energy & Work",formula:"ΣF = m·a  |  τ = r·F·sinθ  |  W = F·d·cosθ = P·ΔV  |  KE = ½·m·v²  |  PE = m·g·h",vars:[{sym:"ΣF",meaning:"net force",unit:"N = kg·m/s²",plain:"sum of all pushes/pulls"},{sym:"τ",meaning:"torque",unit:"N·m",plain:"twisting force, like wrench turning bolt"},{sym:"r",meaning:"lever arm",unit:"m",plain:"distance from pivot to where you push"},{sym:"θ",meaning:"angle",unit:"degrees",plain:"sin90=1 max perpendicular, sin0=0 no twist"},{sym:"W",meaning:"work",unit:"J",plain:"energy transferred — needs movement!"},{sym:"KE",meaning:"kinetic energy",unit:"J",plain:"moving energy — v² means double speed = 4x KE"},{sym:"PE",meaning:"potential energy",unit:"J",plain:"stored height energy"}],plain:"Work needs movement in force direction. Holding 100lb overhead sweating — you feel work but physics says W=0 because d=0. Torque is like a wrench: longer handle = bigger twist. Double speed? Quadruple KE because v².",trap:"No displacement or force perpendicular to movement → Zero Work. Holding stationary = 0 work even if tired. KE depends on v² — MCAT loves “what happens to KE if speed doubles?” → 4x.",mnemonic:"W = F·d·cosθ — Work When Force Does Displacement. cosθ: 0°=1 max, 90°=0 zero (holding), 180°=-1 negative (friction)."},{id:"3",code:"CPAS-03",cat:"CPAS",catLabel:"CPAS (Physics/Chem)",title:"Fluids: Continuity, Bernoulli & Archimedes Density Rules",formula:"P = P₀ + ρ·g·h  |  F_B = ρ_fluid·V_sub·g  |  A₁·v₁ = A₂·v₂  |  P₁+½ρv₁²+ρgh₁ = P₂+½ρv₂²+ρgh₂",vars:[{sym:"P",meaning:"pressure at depth",unit:"Pa, atm, mmHg",plain:"more depth = more pressure"},{sym:"P₀",meaning:"surface pressure",unit:"Pa",plain:"1 atm = 101325 Pa at surface"},{sym:"ρ",meaning:"fluid density",unit:"kg/m³",plain:"water=1000=1 g/mL=1 g/cm³"},{sym:"F_B",meaning:"buoyant force up",unit:"N",plain:"uses ρ_fluid NOT ρ_object — major trap!"},{sym:"V_sub",meaning:"volume displaced",unit:"m³",plain:"only part under water if floating"},{sym:"A",meaning:"cross-section area",unit:"m² = πr²",plain:"halve radius → quarter area"},{sym:"v",meaning:"fluid velocity",unit:"m/s",plain:"same flow: smaller hole = faster"}],plain:"Thumb over hose: same water squeezed through smaller hole = faster (A₁v₁=A₂v₂). Faster fluid = lower pressure = airplane wing lift. Ice floats 90% under because ρ_ice 0.9 / ρ_water 1.0 → fraction submerged = ρ_object/ρ_fluid.",trap:"1 g/cm³ = 1000 kg/m³ must convert! A ∝ r² — halving diameter quadruples velocity. F_B uses V_sub not total V if partially floating. ρ_fluid not ρ_object for buoyant — 90% of students use wrong density.",mnemonic:"Archimedes Avocado floats 90%: Ice/Water 0.9. Density rule: Fraction Submerged = ρ_object / ρ_fluid. If object denser than fluid → sinks.",hasVisual:"bernoulli"},{id:"4",code:"CPAS-04",cat:"CPAS",catLabel:"CPAS (Physics/Chem)",title:"Electrostatics & Circuits — The Inversion Trap",formula:"V=I·R | P=I·V=I²R=V²/R | R=ρ·L/A | Q=C·V C=ε₀A/d | F_E=k|q₁q₂|/r² | F_C=q·v·B·sinθ",vars:[{sym:"V",meaning:"voltage",unit:"V",plain:"push, like water pressure"},{sym:"I",meaning:"current",unit:"A",plain:"flow: charge per second"},{sym:"R",meaning:"resistance",unit:"Ω",plain:"opposition: narrow pipe"},{sym:"Q",meaning:"charge",unit:"C",plain:"amount of electricity"},{sym:"C",meaning:"capacitance",unit:"F",plain:"bucket size storing charge"},{sym:"k",meaning:"Coulomb constant",unit:"9e9 N·m²/C²",plain:"big number for electrostatic force"}],plain:"Voltage = pressure, current = flow, resistance = narrow pipe. Two same resistors parallel = half resistance because path splits easier. Capacitor stores charge like bucket: bigger plates or closer plates = bigger bucket.",trap:"INVERSION TRAP: Resistors Series add R₁+R₂ Parallel 1/R. Capacitors OPPOSITE: Series 1/C like parallel resistors, Parallel C₁+C₂ like series resistors. C after R alphabet so rules flip after! Textbook says R=ρL/A — longer thinner = higher resistance.",mnemonic:"Inversion Trap — R→C flipped. Resistors Series Simple Add. Capacitors Contrary. Mnemonic: C Comes After R alphabet so rules flip after."},{id:"5",code:"CPAS-05",cat:"CPAS",catLabel:"CPAS (Physics/Chem)",title:"Optics — UV-IR Sign Conventions",formula:"1/f = 1/do + 1/di  |  m = -di/do  |  n=c/v  |  n₁sinθ₁=n₂sinθ₂  |  E=h·f=h·c/λ",vars:[{sym:"f",meaning:"focal length",unit:"m",plain:"positive converging concave mirror/converging lens, negative diverging"},{sym:"do",meaning:"object distance",unit:"m",plain:"positive always real object"},{sym:"di",meaning:"image distance",unit:"m",plain:"di>0 Real Inverted on same side, di<0 Virtual Upright"},{sym:"m",meaning:"magnification",unit:"unitless",plain:"|m|>1 enlarged |m|<1 reduced, negative inverted positive upright"},{sym:"n",meaning:"refractive index",unit:"unitless",plain:"c=3e8 m/s, h=6.63e-34 J·s"}],plain:"Magnifying glass converging positive f makes image bigger behind lens. Spoon reflection concave inverted. Virtual upright you can’t project on screen; real inverted you can project.",trap:"UV-IR: Upright=Virtual, Inverted=Real — U=V, I=R. If image upright must be virtual, if real image must be inverted. Mirrors real is in front, virtual behind. Don’t mix lens vs mirror signs.",mnemonic:"UV-IR — U=Upright=V=Virtual I=Inverted=R=Real. Think UV light invisible virtual, IR heat real."},{id:"6",code:"CPAS-06",cat:"CPAS",catLabel:"CPAS (Physics/Chem)",title:"Gas Laws — Always Kelvin!",formula:"P·V = n·R·T  |  (P + a·n²/V²)(V - n·b) = n·R·T  |  KE_avg = 3/2 kT  |  v_rms = √(3RT/M)",vars:[{sym:"P",meaning:"pressure",unit:"atm, Pa",plain:"push of gas on walls"},{sym:"V",meaning:"volume",unit:"L, m³",plain:"space gas fills"},{sym:"n",meaning:"moles",unit:"mol",plain:"amount"},{sym:"R",meaning:"gas constant",unit:"0.0821 L·atm / 8.314 J",plain:"must match P,V units!"},{sym:"T",meaning:"temperature",unit:"K = °C+273",plain:"ALWAYS Kelvin trap!"},{sym:"M",meaning:"molar mass",unit:"kg/mol",plain:"lighter = faster vrms"}],plain:"Balloons — squeeze volume pressure up, heat up molecules move faster pressure up. Absolute zero -273°C molecules stop. Real gases deviate high pressure low temp.",trap:"Always Kelvin T = °C+273. If give °C convert FIRST. R units must match P V units — 0.0821 for L·atm, 8.314 for J. VRMS depends 1/√M lighter faster.",mnemonic:"Good Riddance 0.0821 L·atm vs 8.314 J — L·atm smaller like liter, Joules bigger like energy."},{id:"7",code:"CPAS-07",cat:"CPAS",catLabel:"CPAS (Physics/Chem)",title:"Thermodynamics — The Unit Trap (kJ vs J)",formula:"ΔG = ΔH - T·ΔS  |  ΔG° = -R·T·lnKeq  |  q = m·c·ΔT  |  ΔS = q_rev / T",vars:[{sym:"ΔG",meaning:"Gibbs free energy",unit:"kJ/mol",plain:"negative = spontaneous downhill"},{sym:"ΔH",meaning:"enthalpy",unit:"kJ/mol",plain:"negative exothermic gives off heat"},{sym:"ΔS",meaning:"entropy",unit:"J/mol·K",plain:"positive = more disorder messy"},{sym:"Keq",meaning:"equilibrium constant",unit:"unitless",plain:">1 products favored"},{sym:"q",meaning:"heat",unit:"J",plain:"m·c·ΔT"}],plain:"Enthalpy is heat content — burning wood releases heat negative. Entropy disorder — messy room higher entropy. Gibbs combines — spontaneous if overall downhill even if one uphill. Ice melting ΔH positive needs heat ΔS positive disorder but at low T TΔS small non-spontaneous, at high T spontaneous.",trap:"UNIT TRAP: ΔH kJ vs ΔS J/K — Divide ΔS by 1000! Example ΔH -100 kJ ΔS 200 J/K T 300K → ΔG = -100 -300*(0.2)= -100-60=-160 kJ NOT -100-60000. AAMC loves this trap 90% miss.",mnemonic:"Goldfish Grandma Hates To Swim — G=ΔG H=ΔH T=To S=Swim → ΔG=ΔH-TΔS Negative ΔH + Positive ΔS = Always Spontaneous. Hates=minus T, To=times. Units: Hates Kilo, Swims J must convert."},{id:"8",code:"CPAS-08",cat:"CPAS",catLabel:"CPAS (Physics/Chem)",title:"pH, Buffers & Log Tricks",formula:"pH = -log[H+]  |  pH+pOH=14  |  pKa=-logKa  |  Henderson: pH = pKa + log([A-]/[HA])",vars:[{sym:"pH",meaning:"acidity",unit:"pH units",plain:"-log[H+] log scale Richter"},{sym:"[H+]",meaning:"hydrogen conc",unit:"M",plain:"3.2×10^-5 M → pH≈5-0.32=4.68 quick math"},{sym:"Ka",meaning:"acid dissociation",unit:"unitless",plain:"bigger Ka stronger acid"},{sym:"pKa",meaning:"-log Ka",unit:"pH units",plain:"lower pKa stronger acid"},{sym:"[A-]/[HA]",meaning:"base/acid ratio",unit:"unitless",plain:"10:1 → pH=pKa+1"}],plain:"pH log scale — pH 3 ten times more acidic than pH 4 like Richter. 3.2×10^-5 M H+ → pH≈5-0.32=4.68 quick math m×10^-n → pH≈n-0.m. Buffer best when pH=pKa±1 like shock absorber.",trap:"Log trick m×10^-n pH≈n-log m. If ratio 10:1 log=1 pH=pKa+1. If [A-]=[HA] pH=pKa perfect buffer best. Buffer range pKa±1.",mnemonic:"Henderson Hasselbalch — Has Acid? pH=pKa+log Base/Acid — Base on top numerator like base is more. Buffer best pH=pKa like best balance equal."},{id:"9",code:"BBFL-01",cat:"BBFL",catLabel:"BBFL (Bio/Biochem)",title:"Enzyme Kinetics — Km is Hybrid Binding AND Speed",formula:"v₀ = Vmax·[S]/(Km+[S])  |  Kcat = Vmax/[E]T  |  Efficiency = Kcat/Km  |  Km = (k₋₁+kcat)/k₁",vars:[{sym:"v₀",meaning:"initial rate",unit:"M/s",plain:"how fast at start before product builds"},{sym:"Vmax",meaning:"max velocity",unit:"M/s",plain:"when all enzymes saturated like highway full"},{sym:"[S]",meaning:"substrate conc",unit:"M",plain:"how much food for enzyme"},{sym:"Km",meaning:"Michaelis constant",unit:"M",plain:"[S] needed for ½ Vmax — hybrid binding+speed, NOT just affinity"},{sym:"Kcat",meaning:"turnover number",unit:"s⁻¹",plain:"reactions per enzyme per second"},{sym:"k₁, k₋₁, kcat",meaning:"rate constants",unit:"s⁻¹",plain:"on-rate, off-rate, catalytic rate"}],plain:"Km NOT just binding. Imagine enzyme hand grabbing ball. Low Km super sticky grabs easy needs little substrate. High Km clumsy needs flood. But Km also includes speed — if enzyme super fast catalyzing, it breaks ES before measuring, raises Km. So Km = (how fast falls off + how fast reacts)/how fast grabs. Hybrid apparent affinity.",trap:"Textbook says Km=affinity — half truth. MCAT tests nuance: Km includes kcat so mutant faster kcat increases Km even if binding same. Low Km = high affinity = high efficiency needs little substrate. High Km = low affinity = low efficiency = flood needed. Competitive inhibitor makes less sticky Km UP.",mnemonic:"Km = Keep More — Low Km Keep More substrate bound needs less. High Km Keep More substrate in solution needs flood. Hybrid: (k₋₁ + kcat)/k₁ — off + cat over on."},{id:"10",code:"BBFL-02",cat:"BBFL",catLabel:"BBFL (Bio/Biochem)",title:"MM Direct vs Lineweaver-Burk Reciprocal Paradox",formula:"MM direct: v vs [S]  |  LB: 1/v = (Km/Vmax)(1/[S]) + 1/Vmax  |  x-int = -1/Km  y-int = 1/Vmax",vars:[{sym:"v",meaning:"velocity direct",unit:"mol/s",plain:"physical readable mM"},{sym:"[S]",meaning:"substrate direct",unit:"M",plain:"mM real life"},{sym:"1/v",meaning:"reciprocal velocity",unit:"s/mol",plain:"flipped math trick indirect"},{sym:"1/[S]",meaning:"reciprocal substrate",unit:"1/M",plain:"must flip back to understand"},{sym:"-1/Km",meaning:"x-intercept",unit:"1/M",plain:"more negative = smaller Km stickier"}],plain:"MM is real life — how fast vs how much substrate you add — direct mM readable. LB is math trick — flip both axes to make straight line easier to read intercepts but now numbers are 1/something indirect must flip back. Like looking in mirror left-right reversed.",trap:"UNCOMPETITIVE PARADOX — Visual reality vs reciprocal number line differ! In MM v vs [S] ALL inhibitions RIGHT/DOWN need MORE substrate for same absolute velocity because plateau lower. But in LB 1/v vs 1/[S] uncompetitive x-intercept goes LEFT more negative (-1/0.9=-1.11 left of -0.5) even though in MM it needed MORE substrate — paradox! Because -1/Km smaller Km 0.9 → -1.11 more negative LEFT. Students see LEFT think needs less — wrong! MM tells truth for absolute velocity, LB tells reciprocal math.",mnemonic:"MM RIGHT/DOWN need MORE substrate for same speed — think need flood because plateau lower. LB LEFT is MORE negative = smaller Km = stickier but cannot be overcome. Visual: MM tells absolute reality, LB tells reciprocal math — LEFT in LB does not mean less substrate in MM for uncompetitive!",hasVisual:"lb"},{id:"11",code:"BBFL-03",cat:"BBFL",catLabel:"BBFL (Bio/Biochem)",title:"Inhibitors Deep Dive — Competitive, Noncompetitive, Uncompetitive",formula:"Competitive: Km_app=Km(1+[I]/Ki) Vmax same  |  Noncomp: Vmax_app=Vmax/(1+[I]/Ki) Km same  |  Uncomp: Both down",vars:[{sym:"[I]",meaning:"inhibitor conc",unit:"M",plain:"how much blocker"},{sym:"Ki",meaning:"inhibitor dissociation",unit:"M",plain:"lower tighter binding"},{sym:"Km_app",meaning:"apparent Km",unit:"M",plain:"what it looks like with inhibitor"},{sym:"Vmax_app",meaning:"apparent Vmax",unit:"M/s",plain:"lower when inhibitor present"}],plain:"Competitive — fake substrate sits in active site blocks — can flood with real substrate to overcome — Vmax same plateau but needs more substrate right shift. Noncompetitive — binds elsewhere allosteric equal to E and ES — cannot overcome reduces active enzyme Vmax down same Km. Uncompetitive — only binds ES after substrate bound — needs substrate first then locks — reduces both Vmax down and Km down stickier apparent because pulls ES→ESI.",trap:"Competitive Vmax unchanged Km up Yes overcome. Noncompetitive Vmax down Km unchanged No. Uncompetitive both down No. Overcome only competitive. Textbook says uncompetitive Km down means higher affinity — true but Vmax also down so absolute rate lower at any [S] vs normal — needs more substrate for same absolute rate paradox.",mnemonic:"Competitive Competes Active site. Noncompetitive No preference binds E or ES equal. Uncompetitive Unusually needs ES first — Only ES. Overcome Only Competitive flood works."},{id:"12",code:"BBFL-04",cat:"BBFL",catLabel:"BBFL (Bio/Biochem)",title:"Isoelectric Points — pI Calculation",formula:"pI neutral = (pKa1+pKa2)/2  |  pI acidic = (pKa1 + pKa_side)/2  |  pI basic = (pKa2 + pKa_side)/2",vars:[{sym:"pI",meaning:"isoelectric point",unit:"pH",plain:"pH net charge zero"},{sym:"pKa1",meaning:"COOH ~2",unit:"pH",plain:"acid group first deprot"},{sym:"pKa2",meaning:"NH3+ ~9",unit:"pH",plain:"amino group second"},{sym:"pKa_side",meaning:"side chain",unit:"pH",plain:"D 3.9 E 4.3 H 6.0 K 10.5 R 12.5"}],plain:"pI like neutral point seesaw. Below pI positive protonated extra H+. Above pI negative deprotonated lost H+. Anion exchange column binds negative so need pH > pI to make protein negative. Cation binds positive need pH < pI.",trap:"pI calculation pick correct two pKas that bracket neutral form — not always pKa1+pKa2! Acidic amino acid use pKa1 + side, basic use pKa2 + side. Rule pH<pI positive pH>pI negative — MCAT asks which column binds at pH 7.",mnemonic:"pI = average of two pKas surrounding neutral species. Neutral AA like Alanine (2+9)/2≈5.5. Acidic Asp (2+3.9)/2≈3.0. Basic Lys (9+10.5)/2≈9.75."},{id:"13",code:"BBFL-05",cat:"BBFL",catLabel:"BBFL (Bio/Biochem)",title:"Hardy-Weinberg Genetics",formula:"p + q = 1  |  p² + 2pq + q² = 1  |  recessive phenotype = q²",vars:[{sym:"p",meaning:"dominant allele frequency",unit:"0-1",plain:"proportion A"},{sym:"q",meaning:"recessive allele frequency",unit:"0-1",plain:"proportion a"},{sym:"p²",meaning:"homo dominant frequency",unit:"0-1",plain:"AA proportion"},{sym:"2pq",meaning:"heterozygous carrier",unit: ulls electrons leaves C needy"},{sym:"steric",meaning:"bulk blocks attack",unit:"size",plain:"ketone 2 alkyl groups block vs aldehyde 1 H small"},{sym:"resonance donation",meaning:"lone pair stabilizes",unit:"effect",plain:"amide N donates stabilizes less reactive"}],plain:"Carbonyl C is hungry positive O pulls. Aldehyde small H one side easy attack. Ketone two bulky alkyl block harder. Acid derivatives: chloride poor resonance great leaving group most reactive, amide N donates lone pair resonance super stable least reactive like calm.",trap:"Aldehyde more reactive than ketone (less steric more electrophilic). Acid chloride most reactive amide least. Hydride reduction aldehyde→primary alcohol ketone→secondary. Grignard attacks aldehyde/ketone not acid at low temp? Actually attacks acid too but 2 equiv.",mnemonic:"Acid derivatives: Chloride Anhydride Ester Amide — CAEA? Think Can Alligators Eat Ants? Most to least reactive: chloride most hungry, amide least stable calm."},{id:"32",code:"Lab-05",cat:"OChem",catLabel:"OChem & Lab Techniques",title:"Spectrophotometry — Beer-Lambert Law",formula:"A = ε·l·c = -log(T) = -log(I/I₀) | A 0-1 ideal linearity | T = I/I₀ transmittance 0-1 | λmax max absorbance",vars:[{sym:"A",meaning:"absorbance",unit:"unitless 0-2",plain:"how much light absorbed proportional concentration"},{sym:"ε",meaning:"molar absorptivity extinction coefficient",unit:"M⁻¹cm⁻¹",plain:"how strongly molecule absorbs at λ"},{sym:"l",meaning:"path length",unit:"cm",plain:"cuvette width usually 1 cm"},{sym:"c",meaning:"concentration",unit:"M",plain:"more molecules more absorbance linear"},{sym:"λmax",meaning:"wavelength max absorbance",unit:"nm",plain:"choose for measurement"}],plain:"Light through colored solution: more concentrated darker less light passes higher absorbance. Beer-Lambert A = ε·l·c linear at low concentration like more sunglasses darker. λmax best wavelength where absorbs most.",trap:"Absorbance proportional concentration linear only low A <1 high concentration deviates non-linear intermolecular interactions. Path length usually 1 cm cuvette. T=10^-A. Blank needed to zero instrument. Proteins 280nm due to W Y F aromatic.",mnemonic:"Beer-Lambert Beer with Lambert? A = ε·l·c — Absorbance = extinction × length × concentration. More molecules longer path stronger absorber = higher A. T = I/I₀ transmitted over incident."},{id:"33",code:"CPAS-12",cat:"CPAS",catLabel:"CPAS (Physics/Chem)",title:"Gravity: g and F fall off as 1/r² (r = 3R)",formula:"F = G·M·m / r²  |  g = G·M / r²  |  g₀ = G·M / R² at the surface  |  U = −G·M·m / r",vars:[{sym:"G",meaning:"gravitational constant",unit:"N·m²/kg²",plain:"a fixed number, never changes"},{sym:"M",meaning:"mass of the big body (Earth)",unit:"kg",plain:"the thing doing the pulling"},{sym:"m",meaning:"mass of the small object",unit:"kg",plain:"the thing being pulled"},{sym:"r",meaning:"distance from the CENTER of Earth",unit:"m",plain:"not height above the ground!"},{sym:"R",meaning:"radius of Earth",unit:"m",plain:"r = R at the surface"},{sym:"U",meaning:"gravitational potential energy",unit:"J",plain:"always negative; closer to Earth = more negative"}],plain:"Step: Formula g = GM/r². Variables: at the surface r = R so g₀ = GM/R². Substitution: at r = 3R, g = GM/(3R)² = GM/(9R²) = g₀/9. Answer: gravity is 9 times weaker. Same idea for force: F = GMm/(3R)² = GMm/(9R²) = F₀/9. Potential energy only drops by a factor of 3: U = −GMm/(3R) = U₀/3 (U₀ = −GMm/R). Trick: triple the distance → divide by 3 twice (3×3 = 9) for force, once for potential.",trap:"r is measured from Earth's CENTER. r = 3R means only 2R above the surface, not 3R above. Force and g go as 1/r² (÷9), but potential energy goes as 1/r (÷3). Doubling mass of the small object does not change g.",mnemonic:"Triple the distance, ninth the pull: r × 3 → g ÷ 9. Potential ÷ 3. “Squared pulls, plain potentials.”"}];var HBK_HTML="<div style=\"margin-top:16px;padding:14px;border-radius:12px;background:#fff;border:2px s
